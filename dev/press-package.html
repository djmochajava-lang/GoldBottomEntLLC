<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Press Package Review &mdash; Gold Bottom Ent. LLC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0d1117', panel: '#161b22', edge: '#30363d',
            gold: '#d4a017', goldlight: '#e8b53a',
            good: '#2ea16b', warn: '#d29922', loss: '#e5534b'
          },
          fontFamily: {
            display: ['Montserrat', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { background: #0d1117; overscroll-behavior-y: none; }
    /* Reviewed items recede; pending stays prominent. */
    .art-card { transition: opacity .25s, background .25s; }
    .art-reviewed { opacity: .72; }
    .accent-pending { box-shadow: inset 3px 0 0 #d4a017; }
    .accent-approved { box-shadow: inset 3px 0 0 #2ea16b; }
    .accent-sentback { box-shadow: inset 3px 0 0 #d29922; }
    /* Thumb-sized decision buttons — never below 44px (UX 2a). */
    .decide-btn { min-height: 44px; min-width: 44px; }
    /* Custom media player — mirrors the band page .custom-audio-player shape:
       play/pause, a click-to-scrub bar, current + total time. No native bar,
       no download control. */
    .mp-bar { height: 8px; border-radius: 9999px; background: #30363d; cursor: pointer; }
    .mp-fill { height: 100%; border-radius: 9999px; background: #d4a017; width: 0%; }
    .mp-play { width: 48px; height: 48px; border-radius: 9999px; }
    /* Zoom lightbox for photos (judgment needs full size). */
    #zoom { background: rgba(0,0,0,.92); }
    .swatch-white { background: #ffffff; }
    .swatch-black { background: #000000; }
    input, textarea { font-size: 16px; } /* no iOS zoom-on-focus */
  </style>
</head>

<body class="font-body text-gray-200 min-h-screen">

  <!-- ══ Gate: checking / sign in / not allowed — same skeleton as the estimator ══ -->
  <div id="gate" class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-sm bg-panel border border-edge rounded-2xl p-8 text-center shadow-2xl">
      <p class="font-display text-gold tracking-widest text-xs uppercase mb-2">Gold Bottom Ent.</p>
      <h1 class="font-display text-xl font-bold text-white mb-4">Press Package Review</h1>
      <div id="gate-body">
        <p class="text-sm text-gray-400">Checking your sign-in&hellip;</p>
      </div>
    </div>
  </div>

  <!-- ══ The review surface ══ -->
  <main id="app" class="hidden max-w-md mx-auto pb-24">

    <!-- Sticky progress header (UX 1a/1d): X of Y reviewed + approved/sent-back
         split + a single jump-to-next-unreviewed button. -->
    <div id="sticky" class="sticky top-0 z-30 bg-ink/95 backdrop-blur border-b border-edge px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="font-display text-[10px] uppercase tracking-widest text-gold">Gold Bottom Ent.</p>
          <p id="progress-count" class="font-display text-base font-bold text-white leading-tight">0 of 0 reviewed</p>
          <p id="progress-split" class="text-[11px] text-gray-400"></p>
        </div>
        <button id="jump-next" class="hidden shrink-0 bg-gold text-ink font-display font-bold rounded-xl px-3 py-2 text-xs active:bg-goldlight">
          Jump to next &darr;
        </button>
      </div>
      <div class="mt-2 h-1.5 rounded-full bg-edge overflow-hidden">
        <div id="progress-bar" class="h-full bg-good" style="width:0%"></div>
      </div>
    </div>

    <header class="px-4 pt-4 pb-1 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 id="pkg-title" class="font-display text-lg font-bold text-white leading-tight">Press Package</h1>
        <p id="pkg-sub" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button id="sign-out" class="text-xs text-gray-500 underline underline-offset-2 py-2 pl-3 shrink-0">sign out</button>
    </header>

    <!-- Artist review view: brand groups render here. -->
    <div id="brand-groups" class="px-3"></div>

    <!-- Band-manager full view: at-a-glance decision table + export. -->
    <div id="bm-view" class="hidden px-3"></div>

    <p class="mx-6 mt-8 text-center text-[11px] leading-relaxed text-gray-600">
      Pre-release materials &mdash; for review by the artist and the band manager only.
    </p>
  </main>

  <!-- ══ Photo zoom lightbox ══ -->
  <div id="zoom" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3" onclick="this.classList.add('hidden')">
    <img id="zoom-img" alt="" class="max-w-full max-h-full rounded-lg">
  </div>

  <script>
  (function () {
    'use strict';

    // Client-safe pair only (publishable/anon). NEVER service_role. Same values
    // the site already ships in js/config.js / band media.
    var SUPABASE_URL = 'https://rklvvuzedmadydmohouu.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_oIOHXXN_pwkeoeAfcQkNbg_rJkDFNZK';
    // Edge-function host (phase 2). The three press edge functions run
    // service_role SERVER-SIDE and re-check auth.uid()/role or the share token
    // before doing anything — the client holds only the publishable key + the
    // signed-in user's JWT (never service_role). Same host as encrypt-pii.
    var FN_BASE = 'https://rklvvuzedmadydmohouu.functions.supabase.co';
    // Menu/view selection is a CONVENIENCE only. Every read is RLS-scoped and
    // every write re-checks the caller inside the RPC — the client decides
    // nothing about authorization.
    var ALLOWED = ['artist', 'band_manager', 'admin'];
    var BM_ROLES = ['band_manager', 'admin'];

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function qp(name) { return new URLSearchParams(location.search).get(name); }

    // ── Brand presentation (Amendment 1). Soul Society is an unregistered mark:
    //    ™ ONLY, never ®. Band name rendered verbatim. ──
    var BRANDS = {
      'phyllis-hyman-tribute': { name: "L.A. Young’s Phyllis Hyman Tribute", order: 0 },
      'soul-society':          { name: 'L.A. Young &amp; Soul Society™',      order: 1 }
    };
    function brandName(b) { return (BRANDS[b] && BRANDS[b].name) || 'Not yet assigned to a brand'; }
    function brandOrder(b) { return BRANDS[b] ? BRANDS[b].order : 99; }

    // Section buckets, fixed order (UX 1b): Photos -> Logos -> Copy -> Documents
    // -> Audio/Video. `document` (phase 2, plan §A/§B) is always a PDF, viewed
    // in-browser via a native <iframe> of the short-lived signed URL.
    var SECTIONS = [
      { key: 'photo', title: 'Photos', types: ['photo'] },
      { key: 'logo',  title: 'Logos',  types: ['logo'] },
      { key: 'copy',  title: 'Copy',   types: ['copy'] },
      { key: 'doc',   title: 'Documents', types: ['document'] },
      { key: 'av',    title: 'Audio &amp; Video', types: ['audio', 'video'] }
    ];

    // Plain language ONLY — raw schema enum strings never reach the screen (UX 6).
    function reviewStatus(a) {
      if (a.state === 'approved') return { key: 'approved', label: 'Approved', reviewed: true, approved: true };
      // A pending row past v1 is the fresh placeholder left after a send-back —
      // she has reviewed it (sent it back); the replacement is what is pending.
      if (a.state === 'pending' && Number(a.version) > 1) {
        return { key: 'sentback', label: 'Sent back — a new version is on the way', reviewed: true, sentBack: true };
      }
      return { key: 'pending', label: 'Needs your review', reviewed: false };
    }
    // Package-level status in plain words. Raw schema enum strings never reach the
    // screen (UX 6): anything unrecognised falls back to a neutral label.
    function pkgStatusPlain(s) {
      var m = {
        'draft': 'Draft', 'in_review': 'In review', 'in review': 'In review',
        'review': 'In review', 'ready': 'Ready to send', 'approved': 'Approved',
        'exported': 'Sent', 'sent': 'Sent', 'complete': 'Complete', 'completed': 'Complete'
      };
      return m[String(s == null ? '' : s).toLowerCase()] || 'In progress';
    }
    function blockerPlain(reason) {
      switch (reason) {
        case 'pending': return 'is still waiting for the artist to review it';
        case 'replace': return 'was sent back by the artist — a new version is needed';
        case 'photo-missing-rights': return 'is missing its usage rights or photo credit';
        case 'brand-unassigned': return 'has not been assigned to a brand yet';
        default: return 'is not ready';
      }
    }

    // ── Supabase client (estimator auth pattern) ──
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { flowType: 'pkce', persistSession: true }
    });
    var press = null; // sb.schema('press') once we know the client supports it
    function pressApi() { press = press || sb.schema('press'); return press; }

    // Current signed-in user's Supabase JWT — sent to the edge functions so they
    // can re-derive auth.uid() server-side. Falls back to null (edge fn then
    // denies); we never let the client assert identity.
    function accessToken() {
      return sb.auth.getSession().then(function (r) {
        return (r && r.data && r.data.session && r.data.session.access_token) || null;
      }).catch(function () { return null; });
    }
    // Standard headers for an authenticated edge-function call. Bearer is the
    // USER JWT (not service_role); apikey is the publishable key.
    function fnHeaders(jwt, json) {
      var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (jwt || SUPABASE_KEY) };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }
    // Accept filter for the "upload new version" picker, by artifact type.
    function acceptFor(t) {
      if (t === 'photo' || t === 'logo') return 'image/*';
      if (t === 'document') return 'application/pdf';
      if (t === 'audio') return 'audio/*';
      if (t === 'video') return 'video/*';
      return '';
    }

    // ── Local render/test harness (guarded so it can NEVER run in production).
    //    Supplies representative fake DATA to the same render path; it grants no
    //    access to any real data and is dead code on the live host. ──
    function isLocalHost() {
      var h = location.hostname;
      return location.protocol === 'file:' || h === '' || h === 'localhost' ||
        h === '127.0.0.1' || h.indexOf('192.168.') === 0 || h.indexOf('10.') === 0 ||
        /\.local$/.test(h);
    }
    var mockRole = qp('mock');
    var MOCK = (mockRole === 'artist' || mockRole === 'bm') && isLocalHost();

    // ══════════════════════════════════════════════════════════════════════
    // DATA ACCESS — real RPCs, or the guarded mock.
    // ══════════════════════════════════════════════════════════════════════
    function loadArtistPackage(token) {
      if (MOCK) return Promise.resolve(mockArtist());
      return pressApi().rpc('artist_get_package', { p_pkg_token: token }).then(function (r) {
        if (r.error) throw r.error;
        var d = r.data || {};
        var pk = d.package || {};
        return {
          role: 'artist',
          pkg: { token: pk.pkgToken, title: pk.title, venue: pk.venue, eventDate: pk.eventDate, status: pk.status },
          artifacts: (d.artifacts || []).map(function (a) {
            return {
              id: a.artifactId, type: a.artifactType, label: a.label, placement: a.placement,
              destinationVenue: a.destinationVenue || null, brand: a.brand, version: a.version,
              state: a.state, rejectionReason: a.rejectionReason, copyText: a.copyText,
              contentType: a.contentType || a.content_type || null,
              usageRights: a.usageRights, photoCredit: a.photoCredit, hasMedia: !!a.hasMedia,
              // priorReason/priorDate: not projected by artist_get_package today
              // (see the contract note in the build report). Rendered when present.
              priorReason: a.priorReason || null, priorDate: a.priorDate || null
            };
          })
        };
      });
    }

    function loadBmPackage(token) {
      if (MOCK) return Promise.resolve(mockBm());
      // Phase 2: BM/admin read goes through the SECURITY DEFINER bm_get_package
      // RPC (re-checks BM/admin role + status='approved' inside the function),
      // replacing the phase-1 direct table SELECT. Projection is column-explicit
      // server-side; internal integer ids / personnel columns are never returned.
      // Mapping is defensive (camelCase or snake_case) so it survives the
      // contract being finalised at deploy.
      return pressApi().rpc('bm_get_package', { p_pkg_token: token }).then(function (r) {
        if (r.error) throw r.error;
        var d = r.data || {};
        var pk = d.package || {};
        return {
          role: 'bm',
          pkg: {
            token: pk.pkgToken || pk.pkg_token || token, title: pk.title,
            venue: pk.venue || null, eventDate: pk.eventDate || pk.event_date || null,
            status: pk.status, kind: pk.kind || pk.packageKind || pk.package_kind || null
          },
          artifacts: (d.artifacts || []).map(function (a) {
            return {
              id: a.artifactId || a.id, type: a.artifactType || a.artifact_type, label: a.label,
              placement: a.placement, destinationVenue: a.destinationVenue || a.destination_venue || null,
              brand: a.brand, version: a.version, phase: a.phase, state: a.state,
              rejectionReason: a.rejectionReason || a.rejection_reason,
              copyText: a.copyText || a.copy_text,
              contentType: a.contentType || a.content_type || null,
              usageRights: a.usageRights || a.usage_rights,
              photoCredit: a.photoCredit || a.photo_credit,
              hasMedia: a.hasMedia != null ? !!a.hasMedia : (a.has_media != null ? !!a.has_media : true)
            };
          })
        };
      });
    }

    // BM/admin list: which packages may this manager open? RLS on press_packages
    // already returns only the rows this signed-in user is allowed to read — the
    // client just renders what comes back. Column-explicit; no internal integer id.
    function loadPackageList() {
      if (MOCK) return Promise.resolve(mockPackageList());
      return pressApi().from('press_packages')
        .select('pkg_token,title,status')
        .then(function (r) { if (r.error) throw r.error; return r.data || []; });
    }

    function approveArtifact(token, id) {
      if (MOCK) return Promise.resolve({ ok: true });
      return pressApi().rpc('artist_approve_artifact', { p_pkg_token: token, p_artifact_id: id })
        .then(function (r) { if (r.error) throw r.error; return r.data; });
    }
    function replaceArtifact(token, id, reason) {
      if (MOCK) return Promise.resolve({ ok: true });
      return pressApi().rpc('artist_replace_artifact', { p_pkg_token: token, p_artifact_id: id, p_reason: reason })
        .then(function (r) { if (r.error) throw r.error; return r.data; });
    }
    function exportPackage(token) {
      if (MOCK) return Promise.resolve(mockExportBlockers());
      return pressApi().rpc('bm_export_package', { p_pkg_token: token })
        .then(function (r) { if (r.error) throw r.error; return r.data; });
    }
    // Phase 2 (plan §F): media URLs are minted by the `press-sign` EDGE FUNCTION
    // (service_role, server-side) which re-checks that the caller owns/approves
    // the package before Storage.createSignedUrl (TTL <=300s). This REPLACES the
    // retired mint_signed_media_url SQL-HMAC RPC. Contract:
    //   POST {FN_BASE}/press-sign  Bearer <user JWT>
    //   body { pkgToken, artifactId }  ->  { signedUrl }
    function mintMediaUrl(token, id) {
      if (MOCK) return Promise.resolve({ signedUrl: '' });
      return accessToken().then(function (jwt) {
        return fetch(FN_BASE + '/press-sign', {
          method: 'POST', headers: fnHeaders(jwt, true),
          body: JSON.stringify({ pkgToken: token, artifactId: id })
        });
      }).then(function (res) {
        if (!res.ok) throw new Error('sign failed');
        return res.json();
      });
    }

    // ── Phase 2 BM authoring RPCs (all SECURITY DEFINER, re-check BM/admin
    //    role+status inside the function; artist_uid resolved server-side). ──
    // bm_create_package(p_title, p_brand, p_kind) -> { pkgToken }
    function createPackage(title, brand) {
      if (MOCK) return Promise.resolve({ pkgToken: 'demo-new' });
      return pressApi().rpc('bm_create_package', { p_title: title, p_brand: brand, p_kind: 'venue_neutral' })
        .then(function (r) { if (r.error) throw r.error; return r.data || {}; });
    }
    // bm_add_artifact_to_kit — creates the artifact METADATA row (venue-neutral;
    // the RPC refuses booking kinds). The binary is attached afterward via
    // press-upload. Chosen shape (documented for reconciliation):
    //   bm_add_artifact_to_kit(p_pkg_token, p_artifact_type, p_label, p_brand,
    //                          p_placement, p_copy_text, p_content_type) -> { artifactId }
    function addArtifact(token, meta) {
      if (MOCK) return Promise.resolve({ artifactId: 'pa_new_' + Date.now() });
      return pressApi().rpc('bm_add_artifact_to_kit', {
        p_pkg_token: token,
        p_artifact_type: meta.type,
        p_label: meta.label,
        p_brand: meta.brand,
        p_placement: meta.placement || null,
        p_copy_text: meta.copyText || null,
        p_content_type: meta.contentType || null
      }).then(function (r) { if (r.error) throw r.error; return r.data || {}; });
    }
    // bm_create_share(p_pkg_token, p_label, p_expires_days) -> { shareToken, label, expiresAt }
    function createShare(token, label, days) {
      if (MOCK) return Promise.resolve({ shareToken: 'shr_' + Date.now(), label: label || null, expiresAt: null });
      return pressApi().rpc('bm_create_share', { p_pkg_token: token, p_label: label || null, p_expires_days: days || 30 })
        .then(function (r) { if (r.error) throw r.error; return r.data || {}; });
    }
    // bm_list_shares(p_pkg_token) -> [ { shareToken, label, expiresAt, revokedAt } ]
    function listShares(token) {
      if (MOCK) return Promise.resolve(mockShares());
      return pressApi().rpc('bm_list_shares', { p_pkg_token: token })
        .then(function (r) { if (r.error) throw r.error; return (r.data || []).map(function (s) {
          return {
            shareToken: s.shareToken || s.share_token, label: s.label,
            expiresAt: s.expiresAt || s.expires_at || null,
            revokedAt: s.revokedAt || s.revoked_at || null
          };
        }); });
    }
    // bm_revoke_share(p_share_token) -> { ok }
    function revokeShare(shareToken) {
      if (MOCK) return Promise.resolve({ ok: true });
      return pressApi().rpc('bm_revoke_share', { p_share_token: shareToken })
        .then(function (r) { if (r.error) throw r.error; return r.data || {}; });
    }

    // press-upload EDGE FUNCTION — writes the object to Storage then calls
    // bm_new_version. File path: multipart/form-data (never JSON base64, keeps
    // phone memory low). Copy path: JSON. Contract (documented):
    //   POST {FN_BASE}/press-upload  Bearer <user JWT>
    //   file:  FormData{ pkg_token, artifact_id, intent:'new_version', file }
    //   copy:  JSON   { pkg_token, artifact_id, intent:'new_version', copy_text }
    //   -> { ok, artifact }
    function uploadFileVersion(token, artifactId, file) {
      if (MOCK) return Promise.resolve({ ok: true });
      return accessToken().then(function (jwt) {
        var fd = new FormData();
        fd.append('pkg_token', token);
        fd.append('artifact_id', artifactId);
        fd.append('intent', 'new_version');
        fd.append('file', file);
        // NOTE: no Content-Type header — the browser sets the multipart boundary.
        return fetch(FN_BASE + '/press-upload', { method: 'POST', headers: fnHeaders(jwt, false), body: fd });
      }).then(function (res) { if (!res.ok) throw new Error('upload failed'); return res.json(); });
    }
    function uploadCopyVersion(token, artifactId, copyText) {
      if (MOCK) return Promise.resolve({ ok: true });
      return accessToken().then(function (jwt) {
        return fetch(FN_BASE + '/press-upload', {
          method: 'POST', headers: fnHeaders(jwt, true),
          body: JSON.stringify({ pkg_token: token, artifact_id: artifactId, intent: 'new_version', copy_text: copyText })
        });
      }).then(function (res) { if (!res.ok) throw new Error('save failed'); return res.json(); });
    }

    // press-deliver EDGE FUNCTION — "Download all" ZIP (copy rendered to branded
    // PDF server-side). BM path authorises by JWT+pkgToken; venue path (press-kit
    // page) authorises by share token, anon. Returns a ZIP blob.
    function deliverZip(opts) {
      return accessToken().then(function (jwt) {
        return fetch(FN_BASE + '/press-deliver', {
          method: 'POST', headers: fnHeaders(jwt, true),
          body: JSON.stringify({ pkgToken: opts.pkgToken })
        });
      }).then(function (res) { if (!res.ok) throw new Error('download failed'); return res.blob(); });
    }
    // Shareable venue URL for a share token: same /dev/ folder, press-kit.html.
    function venueShareUrl(shareToken) {
      var base = location.origin + location.pathname.replace(/press-package\.html.*$/, 'press-kit.html');
      return base + '?share=' + encodeURIComponent(shareToken);
    }

    // ══════════════════════════════════════════════════════════════════════
    // MEDIA — custom player (no native controls, no download link). Signed URL
    // is minted lazily on first play.
    // ══════════════════════════════════════════════════════════════════════
    function fmtTime(s) {
      s = Math.max(0, Math.floor(s || 0));
      var m = Math.floor(s / 60), r = s % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function buildPlayer(a) {
      var wrap = document.createElement('div');
      wrap.className = 'mt-2 bg-ink border border-edge rounded-xl p-3';
      var isVideo = a.type === 'video';
      var media = document.createElement(isVideo ? 'video' : 'audio');
      media.preload = 'none';
      media.setAttribute('controlslist', 'nodownload noplaybackrate');
      media.disablePictureInPicture = true;
      media.oncontextmenu = function () { return false; };
      if (isVideo) { media.className = 'w-full rounded-lg mb-2 bg-black'; media.playsInline = true; wrap.appendChild(media); }

      var row = document.createElement('div');
      row.className = 'flex items-center gap-3';
      row.innerHTML =
        '<button class="mp-play bg-gold text-ink font-bold text-lg flex items-center justify-center shrink-0 active:bg-goldlight" aria-label="play">&#9658;</button>' +
        '<div class="flex-1 min-w-0">' +
          '<div class="mp-bar"><div class="mp-fill"></div></div>' +
          '<div class="flex justify-between text-[11px] text-gray-500 mt-1"><span class="mp-cur">0:00</span><span class="mp-dur">0:00</span></div>' +
        '</div>';
      wrap.appendChild(row);

      var playBtn = row.querySelector('.mp-play');
      var bar = row.querySelector('.mp-bar');
      var fill = row.querySelector('.mp-fill');
      var cur = row.querySelector('.mp-cur');
      var dur = row.querySelector('.mp-dur');
      var loaded = false;

      function ensureSrc() {
        if (loaded) return Promise.resolve();
        return mintMediaUrl(CURRENT.pkg.token, a.id).then(function (m) {
          var u = m && m.signedUrl ? m.signedUrl : '';
          if (u && u.charAt(0) === '/') u = SUPABASE_URL + u; // absolute
          media.src = u;
          loaded = true;
        });
      }
      playBtn.addEventListener('click', function () {
        ensureSrc().then(function () {
          if (media.paused) { media.play(); playBtn.innerHTML = '&#10073;&#10073;'; }
          else { media.pause(); playBtn.innerHTML = '&#9658;'; }
        }).catch(function () { cur.textContent = 'unavailable'; });
      });
      media.addEventListener('timeupdate', function () {
        if (media.duration) { fill.style.width = (media.currentTime / media.duration * 100) + '%'; }
        cur.textContent = fmtTime(media.currentTime);
      });
      media.addEventListener('loadedmetadata', function () { dur.textContent = fmtTime(media.duration); });
      media.addEventListener('ended', function () { playBtn.innerHTML = '&#9658;'; fill.style.width = '0%'; });
      bar.addEventListener('click', function (e) {
        if (!media.duration) return;
        var rect = bar.getBoundingClientRect();
        media.currentTime = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) * media.duration;
      });
      return wrap;
    }

    // ══════════════════════════════════════════════════════════════════════
    // RENDER — artist review view
    // ══════════════════════════════════════════════════════════════════════
    var CURRENT = null;
    var pendingEls = []; // for jump-to-next

    function useLine(a) {
      if (a.placement || a.destinationVenue) {
        var parts = [];
        if (a.destinationVenue) parts.push(esc(a.destinationVenue));
        if (a.placement) parts.push(esc(a.placement));
        return 'For: ' + parts.join(' — ');
      }
      return 'General press use — no venue assigned yet';
    }

    function renderArtistView(data) {
      CURRENT = data;
      pendingEls = [];
      $('brand-groups').classList.remove('hidden');
      $('bm-view').classList.add('hidden');

      // Group by brand (top level), then by section within brand.
      var byBrand = {};
      data.artifacts.forEach(function (a) {
        (byBrand[a.brand || '__none'] = byBrand[a.brand || '__none'] || []).push(a);
      });
      var brandKeys = Object.keys(byBrand).sort(function (x, y) {
        return brandOrder(x === '__none' ? null : x) - brandOrder(y === '__none' ? null : y);
      });

      var host = $('brand-groups');
      host.innerHTML = '';
      var approved = 0, sentBack = 0, total = data.artifacts.length;

      brandKeys.forEach(function (bk) {
        var brand = bk === '__none' ? null : bk;
        var group = document.createElement('section');
        group.className = 'mt-4';
        group.innerHTML = '<h2 class="font-display text-sm font-bold text-gold uppercase tracking-wider px-1 mb-1">' +
          brandName(brand) + '</h2>';

        SECTIONS.forEach(function (sec) {
          var items = byBrand[bk].filter(function (a) { return sec.types.indexOf(a.type) !== -1; });
          if (!items.length) return;
          var revd = items.filter(function (a) { return reviewStatus(a).reviewed; }).length;
          var secEl = document.createElement('div');
          secEl.className = 'mt-3';
          secEl.innerHTML = '<div class="flex items-baseline justify-between px-1 mb-1">' +
            '<h3 class="text-xs font-semibold text-gray-300 uppercase tracking-wide">' + sec.title + '</h3>' +
            '<span class="text-[11px] text-gray-500">' + revd + ' of ' + items.length + ' reviewed</span></div>';

          // Pending first, then reviewed (UX 1c prioritization).
          items.sort(function (a, b) { return (reviewStatus(a).reviewed ? 1 : 0) - (reviewStatus(b).reviewed ? 1 : 0); });

          if (sec.key === 'logo') {
            secEl.appendChild(renderLogoPairs(items));
          } else {
            items.forEach(function (a) { secEl.appendChild(renderArtifactCard(a)); });
          }
          group.appendChild(secEl);
        });
        host.appendChild(group);
      });

      data.artifacts.forEach(function (a) {
        var st = reviewStatus(a);
        if (st.approved) approved++;
        if (st.sentBack) sentBack++;
      });
      updateProgress(approved, sentBack, total);
    }

    // Logo light/dark pairing (UX 3b). No explicit pair link in the schema, so
    // variants are paired by base label (text before a "(on white/black)" tag).
    function baseLabel(l) { return String(l || '').replace(/\s*\((on\s*)?(white|black|light|dark)\)\s*$/i, '').trim(); }
    function isDark(l) { return /(black|dark)/i.test(l || ''); }
    function renderLogoPairs(items) {
      var frag = document.createDocumentFragment();
      var groups = {};
      items.forEach(function (a) { (groups[baseLabel(a.label)] = groups[baseLabel(a.label)] || []).push(a); });
      Object.keys(groups).forEach(function (base) {
        var pair = groups[base];
        var light = pair.filter(function (a) { return !isDark(a.label); });
        var dark = pair.filter(function (a) { return isDark(a.label); });
        if (light.length && dark.length) {
          var card = document.createElement('div');
          card.className = 'art-card bg-panel border border-edge rounded-2xl p-3 mb-3';
          card.innerHTML = '<p class="text-sm font-semibold text-white mb-2">' + esc(base) + '</p>' +
            '<div class="grid grid-cols-2 gap-2"></div>';
          var grid = card.querySelector('.grid');
          [{ v: light[0], lbl: 'On white', cls: 'swatch-white' }, { v: dark[0], lbl: 'On black', cls: 'swatch-black' }].forEach(function (o) {
            var cell = document.createElement('div');
            var frame = document.createElement('div');
            frame.className = o.cls + ' rounded-lg h-24 flex items-center justify-center overflow-hidden mb-1 cursor-zoom-in';
            var limg = document.createElement('img');
            limg.alt = esc(o.v.label);
            limg.className = 'max-h-20 w-auto max-w-full';
            limg.setAttribute('data-logo', '1');
            frame.appendChild(limg);
            frame.addEventListener('click', function () {
              if (limg.src) { $('zoom-img').src = limg.src; $('zoom').classList.remove('hidden'); }
            });
            cell.appendChild(frame);
            var cap = document.createElement('p');
            cap.className = 'text-[11px] text-gray-400 text-center';
            cap.textContent = o.lbl;
            cell.appendChild(cap);
            grid.appendChild(cell);
            if (o.v.hasMedia || MOCK) loadPhoto(o.v, limg);
          });
          // Each variant keeps its own decision controls.
          pair.forEach(function (a) { card.appendChild(renderDecisionBlock(a, true)); });
          frag.appendChild(card);
        } else {
          pair.forEach(function (a) { frag.appendChild(renderArtifactCard(a)); });
        }
      });
      return frag;
    }

    function renderArtifactCard(a, readOnly) {
      var st = reviewStatus(a);
      var card = document.createElement('div');
      card.className = 'art-card bg-panel border border-edge rounded-2xl p-3 mb-3 ' +
        (st.approved ? 'art-reviewed accent-approved' : st.sentBack ? 'art-reviewed accent-sentback' : 'accent-pending');
      if (!st.reviewed) { card.setAttribute('data-pending', '1'); pendingEls.push(card); }

      var head = '<div class="flex items-start justify-between gap-2">' +
        '<p class="text-sm font-semibold text-white">' + esc(a.label) + '</p>';
      if (!st.reviewed) {
        head += '<span class="shrink-0 text-[10px] font-bold uppercase tracking-wide text-ink bg-gold rounded px-1.5 py-0.5">' + (readOnly ? 'Awaiting artist' : 'Needs your review') + '</span>';
      } else {
        head += '<span class="shrink-0 text-[10px] font-semibold ' + (st.approved ? 'text-good' : 'text-warn') + '">' + esc(st.label) + '</span>';
      }
      head += '</div>';
      head += '<p class="text-[11px] text-gray-500 mt-0.5">' + useLine(a) + '</p>';
      card.innerHTML = head;

      // Versioning note (UX 4b) — shown when the projection carries the prior note.
      if (a.priorReason) {
        var vn = document.createElement('p');
        vn.className = 'text-[11px] text-warn mt-1';
        vn.textContent = 'Replaces the version you sent back' +
          (a.priorDate ? ' on ' + a.priorDate : '') + ' — your note: “' + a.priorReason + '”';
        card.appendChild(vn);
      }

      // Type-specific body.
      if (a.type === 'photo') {
        var img = document.createElement('img');
        img.alt = esc(a.label);
        img.className = 'w-full rounded-lg mt-2 bg-ink cursor-zoom-in';
        img.setAttribute('data-photo', '1');
        img.addEventListener('click', function () {
          if (img.src) { $('zoom-img').src = img.src; $('zoom').classList.remove('hidden'); }
        });
        card.appendChild(img);
        if (a.hasMedia) loadPhoto(a, img);
        if (a.photoCredit) {
          var pc = document.createElement('p');
          pc.className = 'text-[11px] text-gray-500 mt-1'; pc.textContent = 'Photo: ' + a.photoCredit;
          card.appendChild(pc);
        }
      } else if (a.type === 'logo') {
        // Same signed-URL image flow as a photo, but framed on the background the
        // logo is meant for (white vs charcoal) so an on-white logo isn't invisible.
        var onDark = isDark(a.label);
        var frame = document.createElement('div');
        frame.className = (onDark ? 'swatch-black' : 'swatch-white') +
          ' rounded-lg mt-2 p-4 flex items-center justify-center overflow-hidden';
        var logoImg = document.createElement('img');
        logoImg.alt = esc(a.label);
        logoImg.className = 'max-h-40 w-auto max-w-full cursor-zoom-in';
        logoImg.setAttribute('data-logo', '1');
        logoImg.addEventListener('click', function () {
          if (logoImg.src) { $('zoom-img').src = logoImg.src; $('zoom').classList.remove('hidden'); }
        });
        frame.appendChild(logoImg);
        card.appendChild(frame);
        if (a.hasMedia || MOCK) loadPhoto(a, logoImg);
      } else if (a.type === 'copy') {
        var copy = document.createElement('p');
        copy.className = 'text-sm text-gray-200 leading-relaxed mt-2 whitespace-pre-wrap';
        copy.textContent = a.copyText || '';
        card.appendChild(copy);
      } else if (a.type === 'document') {
        // In-browser PDF view (plan §B) via a native <iframe> of the short-lived
        // signed URL — viewable, no explicit download control — plus an "open
        // full screen" fallback link.
        var docWrap = document.createElement('div');
        docWrap.className = 'mt-2';
        var frame = document.createElement('iframe');
        frame.className = 'w-full rounded-lg bg-white border border-edge';
        frame.style.height = '420px';
        frame.setAttribute('title', esc(a.label));
        docWrap.appendChild(frame);
        var openRow = document.createElement('p');
        openRow.className = 'text-[11px] text-gray-500 mt-1';
        openRow.innerHTML = 'PDF preview &mdash; <a data-docopen target="_blank" rel="noopener" class="underline text-gold">open full screen</a>';
        docWrap.appendChild(openRow);
        card.appendChild(docWrap);
        if (a.hasMedia || MOCK) loadDoc(a, frame, openRow.querySelector('[data-docopen]'));
      } else if (a.type === 'audio' || a.type === 'video') {
        if (a.hasMedia || MOCK) card.appendChild(buildPlayer(a));
        else { var na = document.createElement('p'); na.className = 'text-[11px] text-gray-500 mt-2'; na.textContent = 'Media is being prepared.'; card.appendChild(na); }
      }

      if (!readOnly) {
        card.appendChild(renderDecisionBlock(a, false));
      } else {
        if (a.rejectionReason) {
          var rn = document.createElement('p');
          rn.className = 'text-[11px] text-warn mt-2';
          rn.textContent = 'Sent back — note: “' + a.rejectionReason + '”';
          card.appendChild(rn);
        }
        // BM/admin "Upload new version" — only on the current version of an
        // artifact, never a superseded row. Authorization is re-checked inside
        // press-upload; this control is convenience-only.
        if (CURRENT && CURRENT.role === 'bm' && a.phase !== 'superseded') {
          card.appendChild(renderUploadControl(a));
        }
      }
      return card;
    }

    // Load a signed PDF URL into the document iframe + the open-fallback link.
    function loadDoc(a, frame, openLink) {
      if (MOCK) {
        if (a.mockSrc) { frame.src = a.mockSrc; if (openLink) openLink.href = a.mockSrc; }
        return;
      }
      mintMediaUrl(CURRENT.pkg.token, a.id).then(function (m) {
        var u = m && m.signedUrl ? m.signedUrl : '';
        if (u && u.charAt(0) === '/') u = SUPABASE_URL + u;
        if (u) {
          // #toolbar=0 asks the native viewer to hide its download/print chrome
          // (view-only intent; not a security control — the edge fn is).
          frame.src = u + '#toolbar=0&navpanes=0';
          if (openLink) openLink.href = u;
        }
      }).catch(function () {});
    }

    // BM/admin "Upload new version" control (plan §D). File types open a native
    // picker → press-upload (multipart). Copy artifacts edit inline → press-upload
    // (JSON copy_text). On success the BM view reloads to show the new version.
    function renderUploadControl(a) {
      var wrap = document.createElement('div');
      wrap.className = 'mt-3 border-t border-edge pt-3';
      if (a.type === 'copy') {
        wrap.innerHTML =
          '<button data-act="edit" class="decide-btn w-full bg-panel border border-gold text-gold font-semibold rounded-xl px-3 text-sm">Upload new version (edit copy)</button>' +
          '<div data-box class="hidden mt-2">' +
            '<textarea data-copy rows="4" class="w-full bg-ink border border-edge rounded-lg p-2 text-sm text-white"></textarea>' +
            '<div class="flex gap-2 mt-2">' +
              '<button data-act="save" class="decide-btn flex-1 bg-gold text-ink font-semibold rounded-xl px-3 text-sm">Save new version</button>' +
              '<button data-act="cancel" class="decide-btn px-4 bg-panel border border-edge text-gray-300 rounded-xl text-sm">Cancel</button>' +
            '</div>' +
          '</div>' +
          '<p data-status class="text-[11px] text-gray-500 mt-1"></p>';
      } else {
        wrap.innerHTML =
          '<label class="block cursor-pointer">' +
            '<span class="decide-btn flex items-center justify-center bg-panel border border-gold text-gold font-semibold rounded-xl px-3 text-sm">Upload new version</span>' +
            '<input data-file type="file" class="hidden" accept="' + acceptFor(a.type) + '">' +
          '</label>' +
          '<p data-status class="text-[11px] text-gray-500 mt-1"></p>';
      }
      var status = wrap.querySelector('[data-status]');
      var fileInput = wrap.querySelector('[data-file]');
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          var f = fileInput.files && fileInput.files[0]; if (!f) return;
          status.textContent = 'Uploading “' + f.name + '”…';
          uploadFileVersion(CURRENT.pkg.token, a.id, f)
            .then(function () { status.textContent = 'Uploaded — refreshing…'; reloadBm(); })
            .catch(function (e) { status.textContent = friendlyErr(e); });
        });
      }
      wrap.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]'); if (!btn) return;
        var act = btn.getAttribute('data-act');
        var box = wrap.querySelector('[data-box]');
        if (act === 'edit') { box.classList.remove('hidden'); wrap.querySelector('[data-copy]').value = a.copyText || ''; btn.classList.add('hidden'); }
        else if (act === 'cancel') { box.classList.add('hidden'); wrap.querySelector('[data-act="edit"]').classList.remove('hidden'); }
        else if (act === 'save') {
          var t = wrap.querySelector('[data-copy]').value.trim(); if (!t) return;
          status.textContent = 'Saving…';
          uploadCopyVersion(CURRENT.pkg.token, a.id, t)
            .then(function () { status.textContent = 'Saved — refreshing…'; reloadBm(); })
            .catch(function (er) { status.textContent = friendlyErr(er); });
        }
      });
      return wrap;
    }

    // Re-fetch and re-render the BM view after an authoring action.
    function reloadBm() {
      busy(true);
      loadBmPackage(CURRENT.pkg.token)
        .then(function (data) { renderBmView(data); })
        .catch(function (e) { alert(friendlyErr(e)); })
        .then(function () { busy(false); });
    }

    function loadPhoto(a, img) {
      if (MOCK) { img.src = a.mockSrc || ''; return; }
      mintMediaUrl(CURRENT.pkg.token, a.id).then(function (m) {
        var u = m && m.signedUrl ? m.signedUrl : '';
        if (u && u.charAt(0) === '/') u = SUPABASE_URL + u;
        img.src = u;
      }).catch(function () {});
    }

    // Approve / send-back controls + inline reason field (UX 2).
    function renderDecisionBlock(a, compact) {
      var st = reviewStatus(a);
      var block = document.createElement('div');
      block.className = 'mt-3';

      if (st.approved) {
        block.innerHTML = '<p class="text-xs text-good font-medium">✓ You approved this. ' +
          '<button class="underline text-gray-400" data-act="undo">change</button></p>';
      } else if (st.sentBack) {
        var reason = a.rejectionReason ? '<span class="block text-gray-400 mt-0.5">Your note: “' + esc(a.rejectionReason) + '”</span>' : '';
        block.innerHTML = '<p class="text-xs text-warn font-medium">You sent this back — a new version is on the way.' + reason + '</p>';
      } else {
        block.innerHTML =
          '<div class="flex gap-2">' +
          '<button data-act="approve" class="decide-btn flex-1 bg-good text-white font-semibold rounded-xl px-3 active:opacity-80">Looks good</button>' +
          '<button data-act="sendback" class="decide-btn flex-1 bg-panel border border-loss text-loss font-semibold rounded-xl px-3 active:bg-loss/10">Send back</button>' +
          '</div>' +
          '<div data-reasonbox class="hidden mt-2">' +
            '<label class="block text-xs text-gray-400 mb-1">What needs to change? (she sees this note)</label>' +
            '<textarea data-reason rows="3" class="w-full bg-ink border border-edge rounded-lg p-2 text-sm text-white" placeholder="Tell the band manager what to fix…"></textarea>' +
            '<div class="flex gap-2 mt-2">' +
              '<button data-act="confirm" disabled class="decide-btn flex-1 bg-loss text-white font-semibold rounded-xl px-3 opacity-50">Confirm send-back</button>' +
              '<button data-act="cancel" class="decide-btn px-4 bg-panel border border-edge text-gray-300 rounded-xl">Cancel</button>' +
            '</div>' +
          '</div>';
      }

      block.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]'); if (!btn) return;
        var act = btn.getAttribute('data-act');
        if (act === 'approve') doApprove(a);
        else if (act === 'sendback') { block.querySelector('[data-reasonbox]').classList.remove('hidden'); btn.parentElement.classList.add('hidden'); block.querySelector('[data-reason]').focus(); }
        else if (act === 'cancel') { block.querySelector('[data-reasonbox]').classList.add('hidden'); block.querySelector('.flex.gap-2').classList.remove('hidden'); }
        else if (act === 'confirm') { var t = block.querySelector('[data-reason]').value.trim(); if (t) doReplace(a, t); }
        else if (act === 'undo') { /* re-open: send back path with the artifact visible */ }
      });
      // Confirm enables only on non-empty reason.
      var ta = block.querySelector('[data-reason]');
      if (ta) ta.addEventListener('input', function () {
        var c = block.querySelector('[data-act="confirm"]');
        var on = ta.value.trim().length > 0;
        c.disabled = !on; c.classList.toggle('opacity-50', !on);
      });
      return block;
    }

    function busy(on) { document.body.style.pointerEvents = on ? 'none' : ''; }
    function doApprove(a) {
      busy(true);
      approveArtifact(CURRENT.pkg.token, a.id).then(function () {
        a.state = 'approved'; renderArtistView(CURRENT);
      }).catch(function (e) { alert(friendlyErr(e)); }).then(function () { busy(false); });
    }
    function doReplace(a, reason) {
      busy(true);
      replaceArtifact(CURRENT.pkg.token, a.id, reason).then(function () {
        // Reflect the two-step: this row becomes the sent-back placeholder.
        a.state = 'pending'; a.version = Number(a.version) + 1; a.rejectionReason = reason;
        renderArtistView(CURRENT);
      }).catch(function (e) { alert(friendlyErr(e)); }).then(function () { busy(false); });
    }
    function friendlyErr(e) {
      var m = (e && (e.message || e.error_description || e.hint)) || 'Something went wrong.';
      // Surface the gate refusal text (it names the artifact) but nothing internal.
      return m.replace(/using errcode.*$/i, '').trim();
    }

    function updateProgress(approved, sentBack, total) {
      var reviewed = approved + sentBack;
      $('progress-count').textContent = reviewed + ' of ' + total + ' reviewed';
      $('progress-split').textContent = approved + ' approved · ' + sentBack + ' sent back';
      $('progress-bar').style.width = (total ? (reviewed / total * 100) : 0) + '%';
      $('jump-next').classList.toggle('hidden', pendingEls.length === 0);
    }

    $('jump-next').addEventListener('click', function () {
      var next = pendingEls[0];
      if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // ══════════════════════════════════════════════════════════════════════
    // RENDER — band-manager full view (UX 4c): every decision/reason/version
    // at a glance + export.
    // ══════════════════════════════════════════════════════════════════════
    function bmStatePlain(a) {
      if (a.phase === 'superseded') return { t: 'Replaced', c: 'text-gray-500' };
      if (a.state === 'approved') return { t: 'Approved', c: 'text-good' };
      if (a.state === 'pending' && Number(a.version) > 1) return { t: 'Sent back — needs new version', c: 'text-warn' };
      if (a.state === 'replace') return { t: 'Sent back', c: 'text-warn' };
      return { t: 'Awaiting artist review', c: 'text-gray-300' };
    }
    function renderBmView(data) {
      CURRENT = data;
      $('brand-groups').classList.add('hidden');
      var host = $('bm-view'); host.classList.remove('hidden'); host.innerHTML = '';

      var exportWrap = document.createElement('div');
      exportWrap.className = 'mt-3 bg-panel border border-edge rounded-2xl p-4';
      exportWrap.innerHTML =
        '<div class="flex items-center justify-between gap-3">' +
        '<div><p class="font-display text-sm font-bold text-white">Export package</p>' +
        '<p class="text-[11px] text-gray-500">Runs the checklist before it can go out.</p></div>' +
        '<button id="btn-export" class="decide-btn bg-gold text-ink font-display font-bold rounded-xl px-4 active:bg-goldlight">Export</button></div>' +
        '<div id="export-result" class="mt-3"></div>';
      host.appendChild(exportWrap);
      $('btn-export').addEventListener('click', doExport);

      // Add-artifact panel (venue-neutral kits only; the RPC refuses booking
      // kinds). Lets the BM grow the kit from the phone.
      host.appendChild(renderAddArtifactPanel(data));

      // Share / deliver panel (plan §C). Create a 30-day venue link, list/revoke
      // existing shares, and "Download all (ZIP)". bm_create_share refuses on a
      // package that is not export-clean — the server owns that gate.
      host.appendChild(renderSharePanel(data));

      var byBrand = {};
      data.artifacts.forEach(function (a) { (byBrand[a.brand || '__none'] = byBrand[a.brand || '__none'] || []).push(a); });
      Object.keys(byBrand).sort(function (x, y) {
        return brandOrder(x === '__none' ? null : x) - brandOrder(y === '__none' ? null : y);
      }).forEach(function (bk) {
        var sec = document.createElement('section');
        sec.className = 'mt-4';
        sec.innerHTML = '<h2 class="font-display text-sm font-bold text-gold uppercase tracking-wider px-1 mb-2">' +
          brandName(bk === '__none' ? null : bk) + '</h2>';
        byBrand[bk].sort(function (a, b) { return (a.type + a.label).localeCompare(b.type + b.label) || a.version - b.version; });
        byBrand[bk].forEach(function (a) { sec.appendChild(renderArtifactCard(a, true)); });
        host.appendChild(sec);
      });
    }
    function secTitleForType(t) {
      for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].types.indexOf(t) !== -1) return SECTIONS[i].title.replace('&amp;', '&');
      return t;
    }
    function doExport() {
      busy(true);
      var box = $('export-result'); box.innerHTML = '<p class="text-xs text-gray-400">Checking…</p>';
      exportPackage(CURRENT.pkg.token).then(function (res) {
        if (res && res.ok) {
          box.innerHTML = '<p class="text-sm text-good font-semibold">✓ Package is clean and marked exported.</p>';
        } else {
          var b = (res && res.blockers) || [];
          var lines = b.map(function (x) {

          '<button data-act="zip" class="decide-btn w-full bg-panel border border-edge text-gray-200 font-semibold rounded-xl px-3 text-sm">Download all (ZIP)</button>' +

      var zipStatus = wrap.querySelector('[data-zipstatus]');

      function copyText(text, btn) {
        function done() { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {});
        } else {
          var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
          ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(ta);
        }
      }
      function shareRow(s) {
        var url = venueShareUrl(s.shareToken);
        var revoked = !!s.revokedAt;
        var row = document.createElement('div');
        row.className = 'bg-ink border border-edge rounded-xl p-3';
        row.innerHTML =
          '<div class="flex items-center justify-between gap-2">' +
            '<p class="text-xs font-semibold ' + (revoked ? 'text-gray-500 line-through' : 'text-white') + ' truncate">' +
              esc(s.label || 'Venue link') + '</p>' +
            (revoked ? '<span class="text-[10px] text-gray-500">revoked</span>'
                     : '<button data-revoke class="text-[11px] text-loss underline shrink-0">revoke</button>') +
          '</div>' +
          (revoked ? '' :
            '<div class="mt-1 flex items-center gap-2">' +
              '<input readonly value="' + esc(url) + '" class="flex-1 min-w-0 bg-panel border border-edge rounded-lg p-1.5 text-[11px] text-gray-300">' +
              '<button data-copy class="text-[11px] bg-gold text-ink font-semibold rounded-lg px-2 py-1 shrink-0">Copy</button>' +
            '</div>') +
          (s.expiresAt && !revoked ? '<p class="text-[10px] text-gray-500 mt-1">Expires ' + esc(String(s.expiresAt).slice(0, 10)) + '</p>' : '');
        var copyBtn = row.querySelector('[data-copy]');
        if (copyBtn) copyBtn.addEventListener('click', function () { copyText(url, copyBtn); });
        var revBtn = row.querySelector('[data-revoke]');
        if (revBtn) revBtn.addEventListener('click', function () {
          revBtn.textContent = 'revoking…';
          revokeShare(s.shareToken).then(refreshShares).catch(function (e) { revBtn.textContent = friendlyErr(e); });
        });
        return row;
      }
      function refreshShares() {
        listShares(CURRENT.pkg.token).then(function (list) {
          sharesBox.innerHTML = '';
          if (!list.length) { sharesBox.innerHTML = '<p class="text-[11px] text-gray-500">No links yet.</p>'; return; }
          list.forEach(function (s) { sharesBox.appendChild(shareRow(s)); });
        }).catch(function () { sharesBox.innerHTML = '<p class="text-[11px] text-gray-500">Links couldn’t be loaded.</p>'; });
      }

      wrap.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]'); if (!btn) return;

          newBox.innerHTML = '<p class="text-[11px] text-gray-500">Creating…</p>';

            var token = s.shareToken || s.share_token;

            newBox.innerHTML =
              '<div class="bg-ink border border-good rounded-xl p-3">' +
                '<p class="text-xs text-good font-semibold mb-1">New venue link ready</p>' +
                '<div class="flex items-center gap-2">' +
                  '<input readonly value="' + esc(url) + '" class="flex-1 min-w-0 bg-panel border border-edge rounded-lg p-1.5 text-[11px] text-gray-300">' +
                  '<button data-copynew class="text-[11px] bg-gold text-ink font-semibold rounded-lg px-2 py-1 shrink-0">Copy</button>' +
                '</div></div>';
            newBox.querySelector('[data-copynew]').addEventListener('click', function () { copyText(url, this); });
            refreshShares();
          }).catch(function (err) { newBox.innerHTML = '<p class="text-xs text-loss">' + esc(friendlyErr(err)) + '</p>'; });
        } else if (act === 'zip') {
          zipStatus.textContent = 'Preparing ZIP…';
          if (MOCK) { zipStatus.textContent = 'Render-test mode — ZIP would download here.'; return; }
          deliverZip({ pkgToken: CURRENT.pkg.token }).then(function (blob) {
            triggerBlobDownload(blob, 'press-kit.zip'); zipStatus.textContent = 'Downloaded.';
          }).catch(function (err) { zipStatus.textContent = friendlyErr(err); });
        }
      });
      refreshShares();

      document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

    function showApp(data) {
      $('gate').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('pkg-title').textContent = data.pkg.title || 'Press Package';
      var sub = [];
      if (data.pkg.venue) sub.push(data.pkg.venue);

      $('pkg-sub').textContent = sub.join(' · ');

      else renderArtistView(data);

    function gateMsg(html) { $('gate-body').innerHTML = html; }
    function wireSignOut() {
      $('sign-out').addEventListener('click', function () { sb.auth.signOut().then(function () { location.reload(); }); });
    }

    function loadForRole(role, token) {
      var isBm = BM_ROLES.indexOf(role) !== -1;
      (isBm ? loadBmPackage(token) : loadArtistPackage(token))
        .then(function (data) { showApp(data); wireSignOut(); })
        .catch(function (e) {
          gateMsg('<p class="text-sm text-gray-400">This package isn’t available to you, or the link is wrong.</p>');
        });
    }

    function noTokenArtistMsg() {
      gateMsg('<p class="text-sm text-gray-400">Open the review link the band manager sent you — it includes the package it should show.</p>');
    }

    function start() {
      var token = qp('pkg');

      if (MOCK) {
        // BM with no token → the list; otherwise the single-package view.
        if (!token && mockRole === 'bm') {
          renderPackageList(mockPackageList());
          $('sign-out').addEventListener('click', function () { location.reload(); });
          return;
        }
        var data = mockRole === 'bm' ? mockBm() : mockArtist();
        showApp(data);
        $('sign-out').addEventListener('click', function () { location.reload(); });
        return;
      }

      sb.auth.getSession().then(function (res) {
        var session = res && res.data ? res.data.session : null;
        if (!session || !session.user) {
          // Auth gate stays intact. With a token, sign in to review it; without
          // one, an unauthenticated visitor is treated as the artist default
          // (a manager reaches this page already signed in, via the dashboard).
          if (token) showSignIn(token); else noTokenArtistMsg();
          return;
        }
        sb.from('users').select('role, status').eq('id', session.user.id).maybeSingle()
          .then(function (q) {
            var row = q && q.data ? q.data : null;
            if (!row || (row.status && row.status !== 'approved')) { showDenied(); return; }
            if (ALLOWED.indexOf(row.role) === -1) { showDenied(); return; }
            if (token) { loadForRole(row.role, token); return; }
            // No token: managers/admins get their list; artists keep the message.
            if (BM_ROLES.indexOf(row.role) !== -1) {
              loadPackageList()
                .then(function (list) { renderPackageList(list); wireSignOut(); })
                .catch(function () {
                  gateMsg('<p class="text-sm text-gray-400">Your packages couldn’t be loaded right now. Please try again.</p>');
                });
            } else {
              noTokenArtistMsg();
            }
          })
          .catch(function () { showDenied(); });
      }).catch(function () { if (token) showSignIn(token); else noTokenArtistMsg(); });
    }

    function showSignIn(token) {
      gateMsg(
        '<p class="text-sm text-gray-400 mb-5">Sign in with the same account you use for the GBE dashboard to review this package.</p>' +
        '<button id="btn-google" class="w-full bg-gold text-ink font-display font-bold rounded-xl py-3.5 text-base active:bg-goldlight">Continue with Google</button>'
      );
      $('btn-google').addEventListener('click', function () {
        sb.auth.signInWithOAuth({
          provider: 'google',

          options: { redirectTo: window.location.href.split('#')[0] }
        });
      });
    }

      gateMsg(
        '<p class="text-sm text-gray-400 mb-4">This page isn’t part of your dashboard.</p>' +
        '<button id="btn-out" class="text-xs text-gray-500 underline underline-offset-2 py-2">sign out</button>'
      );
      $('btn-out').addEventListener('click', function () { sb.auth.signOut().then(function () { location.reload(); }); });
    }
