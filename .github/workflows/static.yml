# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ────────────────────────────────────────────────────────────────────
      # G-6 / CEO Directive 02, item 2.1 — PUBLICATION IS OPT-IN.
      #
      # This workflow used to upload `path: '.'`, i.e. the entire repository.
      # Publication was opt-OUT, so every file ever committed to the repo root
      # became a live URL on https://goldbottoment-llc.com and the exposure
      # grew with every commit. Verified live on 2026-08-02, all HTTP 200:
      #   /.claude/settings.local.json  /BIO_B_UI_REPORT.md
      #   /BIO_B_DOC_INTAKE_UI_REPORT.md  /docs/login-perf-handoff.md
      #   /docs/v2-menu-design.md  /tools/GBEServerManager/Program.cs  /.gitignore
      #
      # Nothing reaches the production domain unless it is named below.
      # Adding a file to the repo does NOT publish it. Adding a NEW top-level
      # site asset means adding it to PUBLISH_FILES / PUBLISH_DIRS here.
      # ────────────────────────────────────────────────────────────────────
      - name: Build publish directory (explicit allowlist)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Top-level files the live site serves.
          PUBLISH_FILES=(
            CNAME            # GitHub Pages custom domain — required
            index.html       # SPA shell
            robots.txt
            sitemap.xml
            sw.js            # service worker (must be at origin root for full scope)
          )

          # Directories the live site loads from. Verified against index.html,
          # sw.js PRECACHE_ASSETS, sitemap.xml and the page fragments.
          PUBLISH_DIRS=(
            css              # 8 stylesheets + band-player-v2.css
            dashboard        # dashboard fragments fetched by PageLoader
            images           # logo, hero, talent, merch
            js               # all modules incl. js/vendor + js/band-player-v2
            pages            # public page fragments (root / entertainment / enterprise)
          )

          for f in "${PUBLISH_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::allowlisted file is missing from the checkout: $f"
              exit 1
            fi
            cp -p "$f" _site/
          done

          for d in "${PUBLISH_DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::allowlisted directory is missing from the checkout: $d"
              exit 1
            fi
            cp -a "$d" _site/
          done

          # PUBLICATION IS AN ALLOWLIST ALL THE WAY DOWN.
          #
          # This used to scrub by extension DENYLIST, and a denylist inside an
          # allowlist is just a denylist. InfoSec measured the consequence on
          # 2026-08-03: seven non-site files were live HTTP 200 in production —
          # images/merch/merch-set-index.csv, images/merch/pipeline/merch-delivery-manifest.csv,
          # images/merch/rename-map-20260308.csv, pages/gallery.html.bak,
          # pages/music.html.bak, pages/The_Music_Money_Myth.docx,
          # pages/LAYoungMusicPlayer.tpl — plus 156 *.download files from a saved-page
          # dump. The .md in images/merch/pipeline/ was scrubbed; the .csv sitting
          # beside it was not, because nobody had thought of .csv.
          #
          # So the rule is inverted: inside a published directory, a file survives
          # only if its extension is one the web actually serves. A future
          # roster-contacts.csv, notes.txt, keys.json or backup.sql is dropped by
          # default rather than by having been predicted.
          #
          # PUBLISH_EXT is consumed by BOTH this scrub and the verify step below.
          # One list, two consumers, deliberately — a scrub and a verifier that
          # drift apart is how the .csv survived a gate that claimed to catch it.
          PUBLISH_EXT='html|htm|css|js|mjs|json|map|jpg|jpeg|png|gif|svg|webp|avif|ico|bmp|woff|woff2|ttf|otf|eot|mp3|m4a|aac|wav|ogg|oga|opus|flac|mp4|webm|mov|vtt|srt|pdf|txt|xml|webmanifest'

          # Case-insensitive: README.MD and DEPLOY.PS1 must not survive on a
          # technicality. Extensionless files are dropped too — nothing the sites
          # serve lacks an extension.
          # SCOPED TO THE COPIED DIRECTORIES ONLY. PUBLISH_FILES above is already an
          # explicit per-file allowlist, so re-filtering it by extension buys nothing
          # and costs everything: CNAME has no extension, and a dry-run of the naive
          # version dropped it — which would have taken the custom domain off both
          # sites. The directories are what need the filter, because their CONTENTS
          # are not individually named.
          for d in "${PUBLISH_DIRS[@]}"; do
            [ -d "_site/$d" ] || continue
            find "_site/$d" -type f
          done | while IFS= read -r f; do
            base=${f##*/}
            case "$base" in
              *.*) ext=${base##*.} ;;
              *)   ext='' ;;
            esac
            lower=$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')
            if ! printf '%s' "$lower" | grep -qxE "$PUBLISH_EXT"; then
              echo "scrubbed (not a published file type): $f"
              rm -f "$f"
            fi
          done
          find _site -type d -empty -delete || true

      - name: Verify no internal file reached the artifact
        run: |
          set -euo pipefail
          # Same allowlist the scrub used. If these two ever disagree, the gate is
          # decorative — that is precisely how the .csv shipped past a step named
          # "verify no internal file reached the artifact".
          PUBLISH_EXT='html|htm|css|js|mjs|json|map|jpg|jpeg|png|gif|svg|webp|avif|ico|bmp|woff|woff2|ttf|otf|eot|mp3|m4a|aac|wav|ogg|oga|opus|flac|mp4|webm|mov|vtt|srt|pdf|txt|xml|webmanifest'
          # Re-derive the directory list from the artifact itself so this step cannot
          # drift from the build step's PUBLISH_DIRS.
          PUBLISH_DIRS=()
          while IFS= read -r d; do PUBLISH_DIRS+=("$(basename "$d")"); done < <(find _site -maxdepth 1 -mindepth 1 -type d)
          fail=0
          while IFS= read -r p; do
            base=${p##*/}
            case "$base" in
              *.*) ext=${base##*.} ;;
              *)   ext='' ;;
            esac
            lower=$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')
            if ! printf '%s' "$lower" | grep -qxE "$PUBLISH_EXT"; then
              echo "::error::file type not publishable: $p"; fail=1
            fi
            case "$p" in
              _site/.claude/*|_site/.github/*|_site/server/*|_site/docs/*|_site/tools/*)
                echo "::error::forbidden path in publish artifact: $p"; fail=1 ;;
            esac
          done < <(for d in "${PUBLISH_DIRS[@]}"; do [ -d "_site/$d" ] && find "_site/$d" -type f; done)
          # Root files are verified by name, not by extension — CNAME legitimately has none.
          while IFS= read -r p; do
            case "$p" in
              _site/.claude/*|_site/.github/*|_site/server/*|_site/docs/*|_site/tools/*)
                echo "::error::forbidden path in publish artifact: $p"; fail=1 ;;
            esac
          done < <(find _site -maxdepth 1 -type f)
          if [ "$fail" -ne 0 ]; then
            echo "::error::publish artifact rejected — fix the allowlist above"
            exit 1
          fi
          echo "publish artifact OK — $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Allowlisted publish directory ONLY — never the repository root.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
