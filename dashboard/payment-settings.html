<!-- dashboard/payment-settings.html — Payment Settings (self-service) -->
<div class="dashboard-page" id="dash-payment-settings" style="max-width:700px;margin:0 auto;padding:var(--space-xl);">
  <div id="payment-settings-content"></div>
</div>

<script>
(function() {
  if(typeof Auth==='undefined'||!Auth.isAuthenticated()||(!Auth.isBandMember()&&!Auth.isSinger()&&!Auth.isInternalStaff())){document.getElementById('dash-payment-settings').innerHTML='<p style="padding:var(--space-xl);color:var(--color-danger);">Access Denied — Insufficient permissions.</p>';return;}

  function doInit() {
    // BP2 modules are lazy-loaded (off the critical path). Trigger the load and
    // wait until BP2Auth/BP2Core are available, otherwise this page's Screen 2
    // (payment/agreement form) would silently not render on a cold direct-load.
    if (typeof window.__loadBP2 === 'function') window.__loadBP2();
    if (typeof BP2Auth === 'undefined' || typeof BP2Core === 'undefined') { setTimeout(doInit, 150); return; }
    // Set container override so Screen 2 renders into this page
    var target = document.getElementById('payment-settings-content');
    if (target) BP2Auth.setContainer(target);
    // Ensure BP2Core has Firebase refs from Auth
    if (!BP2Core.getDb() && Auth._db) {
      BP2Core.init({ db: Auth._db, storage: Auth.getStorage ? Auth.getStorage() : null, user: Auth.getCurrentUser(), role: Auth.getRole ? Auth.getRole() : 'member' });
    }
    BP2Auth.showScreen2('view');
  }

  // Wait for Firestore to be ready before initializing
  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { doInit(); });
  } else {
    (function tryInit(n) {
      if (typeof BP2Auth !== 'undefined' && typeof Auth !== 'undefined' && Auth._db) { doInit(); }
      else if (n < 20) { setTimeout(function() { tryInit(n + 1); }, 500); }
    })(0);
  }
})();
</script>
