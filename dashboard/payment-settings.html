<!-- dashboard/payment-settings.html — Payment Settings (self-service) -->
<div class="dashboard-page" id="dash-payment-settings" style="max-width:700px;margin:0 auto;padding:var(--space-xl);">
  <div id="payment-settings-content"></div>
</div>

<script>
(function() {
  if(typeof Auth==='undefined'||!Auth.isAuthenticated()||(!Auth.isBandMember()&&!Auth.isSinger()&&!Auth.isInternalStaff())){document.getElementById('dash-payment-settings').innerHTML='<p style="padding:var(--space-xl);color:var(--color-danger);">Access Denied — Insufficient permissions.</p>';return;}

  function doInit() {
    if (typeof BandPlayer === 'undefined') {
      document.getElementById('payment-settings-content').innerHTML =
        '<p style="padding:var(--space-xl);color:var(--color-text-muted);text-align:center;">' +
        '<i class="fa-solid fa-spinner fa-spin"></i> Loading payment settings...</p>';
      // Retry — BandPlayer script may still be loading
      setTimeout(doInit, 500);
      return;
    }
    // Ensure BandPlayer has Firestore/Storage from Auth
    if (!BandPlayer._db && Auth._db) BandPlayer._db = Auth._db;
    if (!BandPlayer._storage && Auth.getStorage) BandPlayer._storage = Auth.getStorage();
    // Initialize BandPlayer if it hasn't been yet
    if (!BandPlayer.initialized && BandPlayer._db) {
      BandPlayer.initialized = true; // Prevent full init (which shows Screen 1)
    }
    // Override container lookup for this page
    var origGet = BandPlayer._getContainer;
    BandPlayer._getContainer = function() {
      return document.getElementById('payment-settings-content') || origGet.call(BandPlayer);
    };
    BandPlayer._showScreen2('edit');
    // Restore original after render completes (async Firestore prefill)
    setTimeout(function() { BandPlayer._getContainer = origGet; }, 5000);
  }

  // Wait for Firestore to be ready before initializing
  if (typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { doInit(); });
  } else {
    // Fallback polling if whenReady not available
    (function tryInit(n) {
      if (typeof Auth !== 'undefined' && Auth._db) { doInit(); }
      else if (n < 20) { setTimeout(function() { tryInit(n + 1); }, 500); }
    })(0);
  }
})();
</script>
