<!-- dashboard/band-readiness.html — Band Readiness + Compliance Overview -->
<div class="dashboard-page">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-sm);margin-bottom:var(--space-lg);">
    <div>
      <h1>Band Readiness</h1>
      <p class="text-muted">Track musician readiness, compliance, and onboarding status.</p>
    </div>
  </div>

  <!-- Tab Bar -->
  <div id="br-tabs" style="display:flex;gap:0;margin-bottom:var(--space-lg);border-bottom:2px solid var(--color-border);">
    <button class="br-tab active" data-tab="gigs" style="padding:var(--space-sm) var(--space-lg);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text);border-bottom:2px solid var(--color-gold);margin-bottom:-2px;">
      <i class="fa-solid fa-guitar"></i> Session Readiness
    </button>
    <button class="br-tab" data-tab="compliance" style="padding:var(--space-sm) var(--space-lg);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;">
      <i class="fa-solid fa-clipboard-check"></i> Compliance
    </button>
  </div>

  <!-- TAB: Session Readiness (original content) -->
  <div id="br-tab-gigs">
    <!-- Summary stats -->
    <div id="br-stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-md);margin-bottom:var(--space-lg);"></div>

    <!-- Gig sections -->
    <div id="br-gigs-container">
      <div style="text-align:center;padding:48px;color:var(--color-text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading readiness data...</div>
    </div>
  </div>

  <!-- TAB: Compliance -->
  <div id="br-tab-compliance" style="display:none;">
    <!-- Compliance stats -->
    <div id="comp-stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--space-md);margin-bottom:var(--space-lg);"></div>

    <!-- Compliance table -->
    <div style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">
      <div id="comp-table-container">
        <div style="text-align:center;padding:48px;color:var(--color-text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading compliance data...</div>
      </div>
    </div>
  </div>
</div>

<style>
  .br-stat-card {
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    text-align: center;
  }
  .br-stat-value { font-size: 1.8rem; font-weight: 700; }
  .br-stat-label { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .br-gig-card {
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    margin-bottom: var(--space-lg);
  }
  .br-musician-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px 80px 80px 60px 100px;
    gap: var(--space-sm);
    padding: var(--space-sm) 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    align-items: center;
    font-size: var(--text-sm);
  }
  .br-musician-row.header {
    font-weight: 600;
    color: var(--color-text-muted);
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--color-border);
  }
  .br-check { text-align: center; }
  .br-check .ready { color: #3fb950; }
  .br-check .not-ready { color: #8b949e; }
  .br-remind-btn {
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(210,153,34,0.3);
    background: rgba(210,153,34,0.1);
    color: #d29922;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }
  .br-remind-btn:hover { background: rgba(210,153,34,0.2); }
  .comp-row { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr 1fr; gap:var(--space-sm); padding:var(--space-sm) var(--space-xs); border-bottom:1px solid rgba(255,255,255,0.04); align-items:center; font-size:var(--text-sm); }
  .comp-row.header { font-weight:600; color:var(--color-text-muted); font-size:var(--text-xs); text-transform:uppercase; letter-spacing:0.5px; border-bottom:2px solid var(--color-border); }
  .comp-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--radius-full); font-size:11px; font-weight:600; }
  .comp-badge.ok { background:rgba(63,185,80,0.12); color:#3fb950; }
  .comp-badge.missing { background:rgba(248,81,73,0.12); color:#f85149; }
  .comp-badge.pending { background:rgba(210,153,34,0.12); color:#d29922; }
  @media (max-width: 768px) {
    .br-musician-row { grid-template-columns: 1fr 60px 60px 60px; }
    .br-musician-row .br-tracks, .br-musician-row .br-rating, .br-musician-row .br-actions { display: none; }
    .br-musician-row.header .br-tracks, .br-musician-row.header .br-rating, .br-musician-row.header .br-actions { display: none; }
    .comp-row { grid-template-columns: 1fr 1fr 1fr; }
    .comp-row .comp-col-w9, .comp-row .comp-col-payment { display: none; }
  }
</style>

<script>
(function() {
  'use strict';

  var fdb = null;
  var musicianNames = {};

  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  async function init() {
    if (typeof Auth === 'undefined' || !Auth._db) {
      document.getElementById('br-gigs-container').innerHTML = '<p class="text-muted">Firestore not available.</p>';
      return;
    }
    fdb = Auth._db;

    // Load musician names from server if local, or from Firestore users
    try {
      var isLocal = Auth.isLocalDashboard && Auth.isLocalDashboard();
      if (isLocal) {
        var resp = await Utils.apiFetch('/api/v1/gigs/musicians');
        var data = await resp.json();
        (data.musicians || []).forEach(function(m) { musicianNames[m.id] = m.name; });
      }
      // Also try Firestore users
      var usersSnap = await fdb.collection('users').get();
      usersSnap.forEach(function(doc) {
        var u = doc.data();
        if (u.displayName) musicianNames[doc.id] = u.displayName;
      });
    } catch (e) { /* non-fatal */ }

    loadReadiness();
  }

  async function loadReadiness() {
    var container = document.getElementById('br-gigs-container');
    var statsEl = document.getElementById('br-stats');

    try {
      var gigsSnap = await fdb.collection('gigs').where('status', '==', 'upcoming').orderBy('date', 'asc').get();

      if (gigsSnap.empty) {
        container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);"><i class="fa-solid fa-guitar" style="font-size:2rem;margin-bottom:12px;display:block;opacity:0.3;"></i>No upcoming gigs.</div>';
        statsEl.innerHTML = '';
        return;
      }

      var gigs = [];
      gigsSnap.forEach(function(doc) { gigs.push(Object.assign({ id: doc.id }, doc.data())); });

      // Load all checkpoints and playback events
      var cpSnap = await fdb.collection('rehearsal-checkpoints').get();
      var pbSnap = await fdb.collection('playback-events').where('eventType', '==', 'complete').get();

      var checkpoints = {};
      cpSnap.forEach(function(doc) {
        var d = doc.data();
        var key = (d.gigId || '') + '_' + d.musicianId;
        checkpoints[key] = d;
      });

      var practiceByUser = {};
      pbSnap.forEach(function(doc) {
        var d = doc.data();
        if (!practiceByUser[d.userId]) practiceByUser[d.userId] = new Set();
        practiceByUser[d.userId].add(d.trackId);
      });

      // Calculate stats
      var totalMusicians = 0;
      var totalReady = 0;
      var totalCheckpoints = 0;

      gigs.forEach(function(g) {
        (g.assignedMusicians || []).forEach(function(uid) {
          totalMusicians++;
          var cp = checkpoints[g.id + '_' + uid];
          if (cp) {
            totalCheckpoints++;
            if (cp.setlistReady && cp.gearReady && cp.travelReady) totalReady++;
          }
        });
      });

      // Render stats
      var readyPct = totalMusicians > 0 ? Math.round((totalReady / totalMusicians) * 100) : 0;
      statsEl.innerHTML =
        '<div class="br-stat-card"><div class="br-stat-value">' + gigs.length + '</div><div class="br-stat-label">Upcoming Gigs</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value">' + totalMusicians + '</div><div class="br-stat-label">Assigned Musicians</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value" style="color:' + (readyPct >= 80 ? '#3fb950' : readyPct >= 50 ? '#d29922' : '#f85149') + ';">' + readyPct + '%</div><div class="br-stat-label">Ready</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value">' + totalCheckpoints + '/' + totalMusicians + '</div><div class="br-stat-label">Checked In</div></div>';

      // Render gig sections
      var html = '';
      gigs.forEach(function(g) {
        var gigDate = g.date && g.date.toDate ? g.date.toDate() : new Date(g.date);
        var dateStr = gigDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        var timeStr = gigDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        var musicians = g.assignedMusicians || [];

        html += '<div class="br-gig-card">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md);">';
        html += '<div><h2 style="margin:0;font-size:1.1rem;">' + esc(g.title || 'Gig') + '</h2>';
        html += '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">' + dateStr + (timeStr !== '12:00 AM' ? ' at ' + timeStr : '') + (g.venue ? ' · ' + esc(g.venue) : '') + '</div></div>';
        html += '</div>';

        if (musicians.length === 0) {
          html += '<p class="text-muted">No musicians assigned to this gig.</p>';
        } else {
          html += '<div class="br-musician-row header"><div>Musician</div><div class="br-check">Setlist</div><div class="br-check">Gear</div><div class="br-check">Travel</div><div class="br-tracks">Tracks</div><div class="br-rating">Rating</div><div class="br-actions"></div></div>';

          musicians.forEach(function(uid) {
            var name = musicianNames[uid] || uid.slice(0, 12) + '...';
            var cp = checkpoints[g.id + '_' + uid];
            var tracks = practiceByUser[uid] ? practiceByUser[uid].size : 0;
            var allReady = cp && cp.setlistReady && cp.gearReady && cp.travelReady;

            html += '<div class="br-musician-row" style="' + (allReady ? 'background:rgba(63,185,80,0.04);' : '') + '">';
            html += '<div><strong>' + esc(name) + '</strong></div>';
            html += '<div class="br-check"><i class="fa-solid ' + (cp && cp.setlistReady ? 'fa-circle-check ready' : 'fa-circle not-ready') + '"></i></div>';
            html += '<div class="br-check"><i class="fa-solid ' + (cp && cp.gearReady ? 'fa-circle-check ready' : 'fa-circle not-ready') + '"></i></div>';
            html += '<div class="br-check"><i class="fa-solid ' + (cp && cp.travelReady ? 'fa-circle-check ready' : 'fa-circle not-ready') + '"></i></div>';
            html += '<div class="br-tracks" style="color:var(--color-text-muted);">' + tracks + '</div>';
            html += '<div class="br-rating">' + (cp && cp.selfRating ? '<span style="color:#d4a017;">' + cp.selfRating + '/5</span>' : '<span style="color:var(--color-text-muted);">—</span>') + '</div>';
            html += '<div class="br-actions">';
            if (!allReady) {
              html += '<button class="br-remind-btn" onclick="window._sendReminder(\'' + esc(uid) + '\',\'' + esc(g.title || 'Gig') + '\')"><i class="fa-solid fa-bell"></i> Remind</button>';
            } else {
              html += '<span style="font-size:11px;color:#3fb950;"><i class="fa-solid fa-check"></i> Ready</span>';
            }
            html += '</div></div>';
          });
        }
        html += '</div>';
      });

      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = '<div style="text-align:center;padding:48px;color:#f85149;">Failed to load readiness data: ' + esc(e.message) + '</div>';
    }
  }

  // Send reminder (uses server email endpoint if local, otherwise toast-only)
  window._sendReminder = async function(musicianId, gigTitle) {
    var isLocal = typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard();
    if (!isLocal) {
      if (typeof Toast !== 'undefined') Toast.info('Email reminders require the local server.');
      return;
    }

    try {
      // Look up musician email
      var resp = await Utils.apiFetch('/api/v1/gigs/musicians');
      var data = await resp.json();
      var musician = (data.musicians || []).find(function(m) { return m.id === musicianId; });

      if (!musician || !musician.email) {
        if (typeof Toast !== 'undefined') Toast.error('Could not find musician email.');
        return;
      }

      // Send reminder via email endpoint
      await Utils.apiFetch('/api/v1/email/send', {
        method: 'POST',
        body: JSON.stringify({
          to: musician.email,
          subject: 'Readiness Reminder — ' + gigTitle,
          account: 'band_manager',
          text: 'Hi ' + musician.name + ',\n\nThis is a reminder to confirm your readiness for: ' + gigTitle + '.\n\nPlease log into the dashboard and confirm your setlist, gear, and travel status.\n\nThank you,\nGold Bottom Ent. LLC',
          html: '<p>Hi ' + musician.name + ',</p><p>This is a reminder to confirm your readiness for: <strong>' + gigTitle + '</strong>.</p><p>Please log into the dashboard and confirm your setlist, gear, and travel status.</p><p>Thank you,<br/>Gold Bottom Ent. LLC</p>'
        })
      });

      if (typeof Toast !== 'undefined') Toast.success('Reminder sent to ' + musician.name);
    } catch (e) {
      if (typeof Toast !== 'undefined') Toast.error('Failed to send reminder: ' + e.message);
    }
  };

  // ═══ TAB SWITCHING ═══
  var tabs = document.querySelectorAll('.br-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.classList.remove('active');
        t.style.color = 'var(--color-text-muted)';
        t.style.borderBottomColor = 'transparent';
      });
      this.classList.add('active');
      this.style.color = 'var(--color-text)';
      this.style.borderBottomColor = 'var(--color-gold)';
      var target = this.getAttribute('data-tab');
      document.getElementById('br-tab-gigs').style.display = target === 'gigs' ? 'block' : 'none';
      document.getElementById('br-tab-compliance').style.display = target === 'compliance' ? 'block' : 'none';
      if (target === 'compliance' && !compLoaded) loadCompliance();
    });
  });

  // ═══ COMPLIANCE TAB ═══
  var compLoaded = false;

  async function loadCompliance() {
    compLoaded = true;
    if (!fdb) { document.getElementById('comp-table-container').innerHTML = '<p class="text-muted">Firestore not available.</p>'; return; }

    try {
      // Get all band members (role = band_member, artist, or band_manager)
      var snap = await fdb.collection('users').where('status', '==', 'approved').get();
      var bandRoles = ['band_member', 'artist', 'band_manager'];
      var members = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        if (bandRoles.indexOf(d.role) >= 0) {
          members.push({ uid: doc.id, name: d.displayName || d.email || doc.id, role: d.role, data: d });
        }
      });

      // Stats — 3 compliance columns: Confidentiality, Freelance Agreement, Payment
      var totalMembers = members.length;
      var confCount = members.filter(function(m) { return !!(m.data.confidentialityAcceptedAt || m.data.ndaAcceptedAt); }).length;
      var agreementCount = members.filter(function(m) { return !!(m.data.freelanceAgreementAcceptedAt || m.data.houseBandAgreedAt); }).length;
      var paymentCount = members.filter(function(m) { return !!(m.data.paymentSetupAt || m.data.payment_method_enc); }).length;
      var fullyCompliant = members.filter(function(m) {
        var d = m.data;
        return (d.confidentialityAcceptedAt || d.ndaAcceptedAt) && (d.freelanceAgreementAcceptedAt || d.houseBandAgreedAt) && (d.paymentSetupAt || d.payment_method_enc);
      }).length;

      document.getElementById('comp-stats').innerHTML =
        '<div class="br-stat-card"><div class="br-stat-value">' + totalMembers + '</div><div class="br-stat-label">Freelance Artists</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value" style="color:' + (confCount === totalMembers ? '#3fb950' : '#d29922') + ';">' + confCount + '/' + totalMembers + '</div><div class="br-stat-label">Confidentiality</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value" style="color:' + (agreementCount === totalMembers ? '#3fb950' : '#d29922') + ';">' + agreementCount + '/' + totalMembers + '</div><div class="br-stat-label">Freelance Agreement</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value" style="color:' + (paymentCount === totalMembers ? '#3fb950' : '#d29922') + ';">' + paymentCount + '/' + totalMembers + '</div><div class="br-stat-label">Payment Setup</div></div>' +
        '<div class="br-stat-card"><div class="br-stat-value" style="color:' + (fullyCompliant === totalMembers ? '#3fb950' : '#f85149') + ';">' + fullyCompliant + '/' + totalMembers + '</div><div class="br-stat-label">Fully Compliant</div></div>';

      // Table — 3 compliance columns
      var html = '<div class="comp-row header">' +
        '<div>Freelance Artist</div>' +
        '<div>Confidentiality</div>' +
        '<div>Freelance Agreement</div>' +
        '<div class="comp-col-payment">Payment</div>' +
        '<div>Status</div>' +
      '</div>';

      members.sort(function(a, b) {
        var ad = a.data, bd = b.data;
        var aOk = (ad.confidentialityAcceptedAt || ad.ndaAcceptedAt) && (ad.freelanceAgreementAcceptedAt || ad.houseBandAgreedAt) && (ad.paymentSetupAt || ad.payment_method_enc) ? 1 : 0;
        var bOk = (bd.confidentialityAcceptedAt || bd.ndaAcceptedAt) && (bd.freelanceAgreementAcceptedAt || bd.houseBandAgreedAt) && (bd.paymentSetupAt || bd.payment_method_enc) ? 1 : 0;
        return aOk - bOk || (a.name || '').localeCompare(b.name || '');
      });

      members.forEach(function(m) {
        var d = m.data;
        var conf = !!(d.confidentialityAcceptedAt || d.ndaAcceptedAt);
        var agreement = !!(d.freelanceAgreementAcceptedAt || d.houseBandAgreedAt);
        var payment = !!(d.paymentSetupAt || d.payment_method_enc);
        var full = conf && agreement && payment;

        var confDate = '';
        var confField = d.confidentialityAcceptedAt || d.ndaAcceptedAt;
        if (conf && confField && confField.toDate) {
          confDate = confField.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        var roleLabel = { band_member: 'Artist', artist: 'Artist', band_manager: 'Manager' }[m.role] || m.role;

        html += '<div class="comp-row">' +
          '<div><strong>' + esc(m.name) + '</strong><br><span style="font-size:11px;color:var(--color-text-muted);">' + roleLabel + '</span></div>' +
          '<div>' + (conf
            ? '<span class="comp-badge ok"><i class="fa-solid fa-circle-check"></i> ' + confDate + '</span>'
            : '<span class="comp-badge missing"><i class="fa-solid fa-circle-xmark"></i> Not signed</span>') + '</div>' +
          '<div>' + (agreement
            ? '<span class="comp-badge ok"><i class="fa-solid fa-circle-check"></i> Signed</span>'
            : '<span class="comp-badge missing"><i class="fa-solid fa-circle-xmark"></i> Not signed</span>') + '</div>' +
          '<div class="comp-col-payment">' + (payment
            ? '<span class="comp-badge ok"><i class="fa-solid fa-circle-check"></i> Set up</span>'
            : '<span class="comp-badge missing"><i class="fa-solid fa-circle-xmark"></i> Not set</span>') + '</div>' +
          '<div>' + (full
            ? '<span class="comp-badge ok"><i class="fa-solid fa-shield-check"></i> Compliant</span>'
            : '<span class="comp-badge missing"><i class="fa-solid fa-shield-xmark"></i> Incomplete</span>') + '</div>' +
        '</div>';
      });

      if (members.length === 0) {
        html = '<p style="text-align:center;color:var(--color-text-muted);padding:var(--space-xl);">No band members found. Invite musicians from the Team page.</p>';
      }

      document.getElementById('comp-table-container').innerHTML = html;

    } catch (err) {
      console.error('[Compliance] Load failed:', err);
      document.getElementById('comp-table-container').innerHTML = '<p style="color:#f85149;">Failed to load compliance data: ' + esc(err.message) + '</p>';
    }
  }

  // Wait for Firestore to be ready
  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { init(); });
  } else {
    init();
  }
})();
</script>
