<!-- dashboard/band-roster.html — Band Roster (Firestore-sourced freelance artists) -->
<div class="dashboard-page" id="dash-band-roster">

  <!-- Page Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-sm);margin-bottom:var(--space-lg);">
    <div>
      <h1 style="display:flex;align-items:center;gap:var(--space-sm);">
        <i class="fa-solid fa-users" style="color:var(--color-gold);"></i>
        Band Roster
        <span id="br-count-badge" style="background:var(--color-bg-tertiary);color:var(--color-text-muted);border-radius:var(--radius-full);padding:2px 10px;font-size:var(--text-sm);margin-left:var(--space-xs);">0</span>
      </h1>
      <p class="text-muted" style="margin:0;font-size:var(--text-sm);">Freelance artists who have completed onboarding.</p>
    </div>
  </div>

  <!-- Tier Tabs -->
  <div id="br-tabs" style="display:flex;gap:0;margin-bottom:var(--space-lg);border-bottom:2px solid var(--color-border);overflow-x:auto;-webkit-overflow-scrolling:touch;">
    <button class="br-tab" data-filter="pending" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;display:none;">
      <i class="fa-solid fa-bell" style="color:#d29922;margin-right:4px;"></i>Pending
      <span id="br-pending-badge" style="display:none;background:#d29922;color:#0d1117;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:4px;">0</span>
    </button>
    <button class="br-tab active" data-filter="active" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text);border-bottom:2px solid var(--color-gold);margin-bottom:-2px;white-space:nowrap;">
      Active
    </button>
    <button class="br-tab" data-filter="on_call" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      On Call
    </button>
    <button class="br-tab" data-filter="alumni" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Alumni
    </button>
  </div>

  <!-- Card Container -->
  <div id="br-cards" style="display:grid;grid-template-columns:1fr;gap:var(--space-md);">
    <div style="text-align:center;padding:48px;color:var(--color-text-muted);">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading roster...
    </div>
  </div>

</div>

<style>
  .br-tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .br-tier-core { background: rgba(212,160,23,0.15); color: #d4a017; }
  .br-tier-on_call { background: rgba(88,166,255,0.12); color: #58a6ff; }
  .br-tier-alumni { background: rgba(139,148,158,0.12); color: #8b949e; }
  .br-activity-active { background: rgba(63,185,80,0.12); color: #3fb950; }
  .br-activity-inactive { background: rgba(210,153,34,0.12); color: #d29922; }

  .br-card {
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
  }
  .br-card-header {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    min-height: 48px;
  }
  .br-card-avatar {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-full);
    background: rgba(212,160,23,0.18);
    color: var(--color-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--fw-bold);
    font-size: var(--text-sm);
    flex-shrink: 0;
  }
  .br-card-info { flex: 1; min-width: 0; }
  .br-card-name {
    font-size: 15px;
    font-weight: var(--fw-semibold);
    color: var(--color-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .br-card-detail {
    font-size: 13px;
    color: var(--color-text-muted);
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    flex-wrap: wrap;
  }

  @media (min-width: 768px) {
    #br-cards { grid-template-columns: 1fr 1fr; }
  }

  /* ── Edit bio on behalf (Flow B) ── */
  .br-editbio-btn { width:100%;background:rgba(212,160,23,0.10);color:var(--color-gold);border:1px solid rgba(212,160,23,0.3);border-radius:var(--radius-md);padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:44px; }
  .br-editbio-btn:hover { background:rgba(212,160,23,0.16); }
  .brb-field { margin-bottom:var(--space-md); }
  .brb-flabel { display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-sm);font-size:13px;font-weight:600;margin-bottom:4px; }
  .brb-counter { font-size:12px;color:var(--color-text-muted);font-variant-numeric:tabular-nums;white-space:nowrap; }
  .brb-counter.over { color:#f85149;font-weight:700; }
  .brb-input, .brb-textarea { width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 12px;color:var(--color-text);font-size:16px;font-family:inherit; }
  .brb-input:focus, .brb-textarea:focus { outline:none;border-color:var(--color-gold); }
  .brb-textarea { resize:vertical;min-height:60px;line-height:1.5; }
  .brb-input.over, .brb-textarea.over { border-color:#f85149; }
  .brb-helper { font-size:12px;color:var(--color-text-muted);margin-top:3px; }
  .brb-btn-primary { background:var(--color-gold);color:#0d1117;border:none;border-radius:var(--radius-md);padding:12px 20px;cursor:pointer;font-size:var(--text-sm);font-weight:700;min-height:48px; }
  .brb-btn-primary:disabled { opacity:0.45;cursor:not-allowed; }
  .brb-btn-secondary { background:var(--color-bg-tertiary);color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 18px;cursor:pointer;font-size:var(--text-sm);font-weight:600;min-height:48px; }
  .brb-preview-card { background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-md);margin:var(--space-sm) 0; }
  .brb-preview-avatar { width:56px;height:56px;border-radius:var(--radius-full);background:rgba(212,160,23,0.15);color:var(--color-gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0; }
  .brb-notice { background:rgba(210,153,34,0.10);border:1px solid rgba(210,153,34,0.3);border-radius:var(--radius-md);padding:12px 14px;font-size:13px;color:var(--color-text-secondary);line-height:1.5; }
  .brb-link-box { background:var(--color-bg-tertiary);border:1px dashed var(--color-border);border-radius:var(--radius-md);padding:12px 14px;font-size:13px;color:var(--color-text-secondary);line-height:1.5;margin-top:var(--space-md); }
</style>

<script>
(function() {
  'use strict';

  var fdb = null;
  var _roster = [];
  var _pending = [];
  var _pendingUnsub = null;
  var _filter = 'active'; // default tab: show active artists
  // Flow B (bio on-behalf) uses Utils.apiFetch → LAN-only. Gate its UI behind
  // isLocalDashboard so the button never appears on the remote (public) surface
  // where apiFetch rejects by design.
  function isLocal(){ return !!(typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard()); }
  var BIO_FIELDS = [
    { key:'stage_name',  label:'Stage name',      max:40,   ph:'e.g. L.A. Young',          helper:'The name fans should see.' },
    { key:'role_line',   label:'Role',            max:30,   ph:'e.g. Background vocalist',  helper:'What they do in the band.' },
    { key:'credit_line', label:'Notable credits', max:80,   ph:'e.g. Toured with …',   helper:'Verified before publication.' },
    { key:'short_bio',   label:'Short bio',       max:280,  ph:'One or two sentences.',     helper:'The one that matters most.', multiline:true },
    { key:'long_bio',    label:'Longer bio',      max:1200, ph:'The fuller story …',   helper:'Optional.', multiline:true }
  ];

  var TIER_LABELS = { core: 'Core', on_call: 'On Call', alumni: 'Alumni' };
  var ACTIVITY_LABELS = { active: 'Active', inactive: 'Inactive' };

  function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function initials(name) {
    if (!name) return '?';
    var p = String(name).trim().split(/\s+/);
    return (p.length >= 2 ? p[0][0] + p[p.length - 1][0] : (p[0][0] || '?')).toUpperCase();
  }

  async function loadRoster() {
    var container = document.getElementById('br-cards');
    if (!fdb) {
      container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);"><i class="fa-solid fa-database" style="font-size:2rem;margin-bottom:12px;display:block;opacity:0.3;"></i>Firestore not available.</div>';
      return;
    }

    try {
      // Read from curated /roster cache (server publishes; Firestore /users is approval pipeline only).
      var snap = await fdb.collection('roster').where('roster_tier', 'in', ['core', 'on_call', 'alumni']).get();
      _roster = [];
      snap.forEach(function(doc) {
        var d = doc.data() || {};
        // Adapt /roster field shape to what this page renders.
        // rosterId = the SoR roster row id (publish-engine sets cache doc id =
        // roster.id); this is the :rosterId the LAN bio route expects. uid =
        // the linked auth account (firebaseUid), a SEPARATE identity.
        _roster.push({
          rosterId: doc.id,
          uid: d.firebaseUid || doc.id,
          displayName: d.name || '',
          roster_tier: d.roster_tier,
          activity: d.activity || 'inactive',
          confidentialityAcceptedAt: d.confidentialityAcceptedAt || d.approvedAt || null,
          offboarded_at: d.offboardedAt || null,
          offboard_reason: d.offboardReason || ''
        });
      });

      updateCountBadge();
      renderCards();
    } catch (e) {
      console.error('[Band Roster] Load failed:', e);
      container.innerHTML = '<div style="text-align:center;padding:48px;color:#f85149;"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load: ' + esc(e.message) + '</div>';
    }
  }

  function updateCountBadge() {
    var badge = document.getElementById('br-count-badge');
    if (badge) badge.textContent = (_filter === 'pending') ? _pending.length : getFiltered().length;
  }

  function getFiltered() {
    if (_filter === 'pending') return _pending;
    if (_filter === 'active') {
      // Active tab: core (always active) + on_call with activity=active
      return _roster.filter(function(m) {
        return (m.roster_tier === 'core') || (m.roster_tier === 'on_call' && m.activity === 'active');
      });
    } else if (_filter === 'on_call') {
      // On Call tab: on_call tier only (active and inactive)
      return _roster.filter(function(m) { return m.roster_tier === 'on_call'; });
    } else if (_filter === 'alumni') {
      return _roster.filter(function(m) { return m.roster_tier === 'alumni'; });
    }
    return _roster;
  }

  function renderCards() {
    if (_filter === 'pending') { renderPendingCards(); return; }

    var container = document.getElementById('br-cards');
    var list = getFiltered();

    if (!list.length) {
      var msgs = {
        active: 'No active freelance artists yet.',
        on_call: 'No on-call freelance artists.',
        alumni: 'No alumni.'
      };
      container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);grid-column:1/-1;"><i class="fa-solid fa-users" style="font-size:2.5rem;display:block;margin-bottom:var(--space-sm);opacity:0.2;"></i>' + esc(msgs[_filter] || 'No results.') + '</div>';
      return;
    }

    var html = '';
    list.forEach(function(m) {
      var displayName = m.displayName || m.email || 'Unknown';
      var tierClass = 'br-tier-' + (m.roster_tier || 'on_call');
      var tierLabel = TIER_LABELS[m.roster_tier] || m.roster_tier || 'On Call';
      var activityClass = 'br-activity-' + (m.activity || 'active');
      var activityLabel = ACTIVITY_LABELS[m.activity] || m.activity || 'Active';

      html += '<div class="br-card" data-uid="' + esc(m.uid) + '">';
      html += '<div class="br-card-header">';
      html += '<div class="br-card-avatar">' + initials(displayName) + '</div>';
      html += '<div class="br-card-info">';
      html += '<div class="br-card-name">' + esc(displayName) + '</div>';
      html += '<div class="br-card-detail">';
      html += '<span class="br-tier-badge ' + tierClass + '">' + esc(tierLabel) + '</span>';
      if (m.roster_tier !== 'alumni') {
        html += '<span class="br-tier-badge ' + activityClass + '">' + esc(activityLabel) + '</span>';
      }
      html += '</div>';
      html += '</div>';

      // Off-board button (admin/band_manager only, not for alumni)
      if (m.roster_tier !== 'alumni') {
        html += '<button class="br-offboard-btn" onclick="window._brOffboard(\'' + esc(m.uid) + '\')" title="Off-board" style="background:none;border:1px solid rgba(248,81,73,0.3);border-radius:var(--radius-md);padding:8px 12px;cursor:pointer;color:#f85149;font-size:13px;min-height:44px;"><i class="fa-solid fa-user-minus"></i></button>';
      } else {
        html += '<button onclick="window._brReinstate(\'' + esc(m.uid) + '\')" title="Reinstate" style="background:none;border:1px solid rgba(63,185,80,0.3);border-radius:var(--radius-md);padding:8px 12px;cursor:pointer;color:#3fb950;font-size:13px;min-height:44px;"><i class="fa-solid fa-user-plus"></i></button>';
      }

      html += '</div>';

      // Details row
      if (m.confidentialityAcceptedAt || m.offboarded_at) {
        html += '<div style="margin-top:var(--space-sm);padding-top:var(--space-sm);border-top:1px solid var(--color-border);font-size:12px;color:var(--color-text-muted);">';
        if (m.confidentialityAcceptedAt) {
          var date = m.confidentialityAcceptedAt.toDate ? m.confidentialityAcceptedAt.toDate() : new Date(m.confidentialityAcceptedAt);
          html += 'Onboarded: ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        if (m.offboarded_at) {
          var offDate = m.offboarded_at.toDate ? m.offboarded_at.toDate() : new Date(m.offboarded_at);
          html += ' &middot; Off-boarded: ' + offDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          if (m.offboard_reason) html += ' (' + esc(m.offboard_reason) + ')';
        }
        html += '</div>';
      }

      // Edit bio on behalf (Flow B) — LAN/BM only (apiFetch is LAN-only).
      // Pass ONLY the rosterId (safe charset) to the inline handler; the name
      // is looked up inside the handler to avoid quote-injection from names.
      if (isLocal() && m.rosterId) {
        html += '<div style="margin-top:var(--space-sm);"><button class="br-editbio-btn" onclick="window._brEditBio(\'' + esc(m.rosterId) + '\')"><i class="fa-solid fa-address-card"></i> Edit bio on behalf</button></div>';
      }

      html += '</div>';
    });

    container.innerHTML = html;
    updateCountBadge();
  }

  // ═══ OFF-BOARDING ═══

  window._brOffboard = function(uid) {
    if (!fdb) return;
    // Show reason modal
    var reasons = ['Not a fit', 'Scheduling conflicts', 'Moved away', 'Personal reasons', 'Other'];
    var modalHtml = '<div style="padding:var(--space-lg);max-width:400px;">';
    modalHtml += '<h3 style="margin:0 0 var(--space-md);font-size:var(--text-lg);">Off-board Freelance Artist</h3>';
    modalHtml += '<label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Reason</label>';
    modalHtml += '<select id="br-offboard-reason" style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;margin-bottom:var(--space-md);">';
    reasons.forEach(function(r) { modalHtml += '<option value="' + r + '">' + r + '</option>'; });
    modalHtml += '</select>';
    modalHtml += '<label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Notes (optional)</label>';
    modalHtml += '<textarea id="br-offboard-notes" rows="2" style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;resize:vertical;margin-bottom:var(--space-lg);"></textarea>';
    modalHtml += '<div style="display:flex;gap:var(--space-sm);justify-content:flex-end;">';
    modalHtml += '<button onclick="Modal.close()" style="background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 20px;cursor:pointer;color:var(--color-text-secondary);font-size:var(--text-sm);min-height:44px;">Cancel</button>';
    modalHtml += '<button id="br-offboard-confirm" style="background:#f85149;color:#fff;border:none;border-radius:var(--radius-md);padding:12px 20px;cursor:pointer;font-size:var(--text-sm);font-weight:var(--fw-semibold);min-height:44px;">Off-board</button>';
    modalHtml += '</div></div>';

    if (typeof Modal !== 'undefined') {
      Modal.open(modalHtml);
      document.getElementById('br-offboard-confirm').addEventListener('click', async function() {
        var reason = document.getElementById('br-offboard-reason').value;
        var notes = document.getElementById('br-offboard-notes').value.trim();
        try {
          await fdb.collection('users').doc(uid).update({
            roster_tier: 'alumni',
            activity: 'inactive',
            offboarded_at: Auth._serverTimestamp(),
            offboard_reason: reason,
            offboard_notes: notes || ''
          });
          // Optimistic UI: /roster cache republishes on next server sync (~5 min).
          var idx = _roster.findIndex(function(m){ return m.uid === uid; });
          if (idx !== -1) {
            _roster[idx].roster_tier = 'alumni';
            _roster[idx].activity = 'inactive';
            _roster[idx].offboarded_at = new Date();
            _roster[idx].offboard_reason = reason;
          }
          Modal.close();
          if (typeof Toast !== 'undefined') Toast.success('Freelance artist off-boarded.');
          renderCards();
        } catch (e) {
          if (typeof Toast !== 'undefined') Toast.error('Off-board failed: ' + e.message);
        }
      });
    }
  };

  // ═══ PENDING REQUESTS ═══

  function renderPendingCards() {
    var container = document.getElementById('br-cards');
    if (!_pending.length) {
      container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);grid-column:1/-1;"><i class="fa-solid fa-circle-check" style="font-size:2.5rem;display:block;margin-bottom:var(--space-sm);opacity:0.2;color:#3fb950;"></i>No pending band-member requests.</div>';
      return;
    }

    var html = '';
    _pending.forEach(function(u) {
      var displayName = u.displayName || u.email || 'Unknown';
      var registered = u.registeredAt
        ? (u.registeredAt.toDate ? u.registeredAt.toDate() : new Date(u.registeredAt))
        : null;
      var registeredStr = registered ? registered.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

      html += '<div class="br-card" data-uid="' + esc(u.uid) + '" style="border-left:3px solid #d29922;">';
      html += '<div class="br-card-header">';
      html += '<div class="br-card-avatar">' + initials(displayName) + '</div>';
      html += '<div class="br-card-info">';
      html += '<div class="br-card-name">' + esc(displayName) + '</div>';
      html += '<div class="br-card-detail">';
      html += '<span class="br-tier-badge" style="background:rgba(210,153,34,0.15);color:#d29922;"><i class="fa-solid fa-clock" style="font-size:11px;"></i> Awaiting approval</span>';
      if (u.email) html += '<span style="font-size:12px;color:var(--color-text-muted);">' + esc(u.email) + '</span>';
      html += '</div>';
      html += '</div>';
      html += '</div>';

      if (registeredStr) {
        html += '<div style="margin-top:var(--space-sm);padding-top:var(--space-sm);border-top:1px solid var(--color-border);font-size:12px;color:var(--color-text-muted);">Registered: ' + registeredStr + '</div>';
      }

      html += '<div style="margin-top:var(--space-sm);display:flex;gap:8px;">';
      html += '<button onclick="window._brApprove(\'' + esc(u.uid) + '\')" style="flex:1;background:rgba(63,185,80,0.15);color:#3fb950;border:1px solid rgba(63,185,80,0.3);border-radius:var(--radius-md);padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:44px;"><i class="fa-solid fa-check"></i> Approve</button>';
      html += '<button onclick="window._brDeny(\'' + esc(u.uid) + '\')" style="background:none;border:1px solid rgba(248,81,73,0.3);border-radius:var(--radius-md);padding:10px 14px;font-size:13px;color:#f85149;cursor:pointer;min-height:44px;"><i class="fa-solid fa-xmark"></i></button>';
      html += '</div>';

      html += '</div>';
    });

    container.innerHTML = html;
    updateCountBadge();
  }

  function subscribePending() {
    if (!fdb) return;
    if (_pendingUnsub) { try { _pendingUnsub(); } catch (e) {} _pendingUnsub = null; }

    _pendingUnsub = fdb.collection('users')
      .where('status', '==', 'pending')
      .where('requestedRole', '==', 'band_member')
      .onSnapshot(function(snap) {
        _pending = [];
        snap.forEach(function(doc) {
          var d = doc.data();
          d.uid = doc.id;
          _pending.push(d);
        });
        updatePendingTabVisibility();
        if (_filter === 'pending') renderPendingCards();
      }, function(err) {
        console.warn('[Band Roster] Pending listener error:', err.message);
      });
  }

  function updatePendingTabVisibility() {
    var tab = document.querySelector('.br-tab[data-filter="pending"]');
    var badge = document.getElementById('br-pending-badge');
    if (!tab) return;
    if (_pending.length > 0) {
      tab.style.display = '';
      if (badge) {
        badge.textContent = _pending.length > 99 ? '99+' : String(_pending.length);
        badge.style.display = '';
      }
    } else {
      // Keep tab visible if currently selected; otherwise hide
      if (_filter !== 'pending') tab.style.display = 'none';
      if (badge) badge.style.display = 'none';
    }
  }

  // Update Musicians Log entry to 'onboarded' if a matching email exists
  async function syncLogToOnboarded(email) {
    if (!fdb || !email) return;
    try {
      var emailLower = email.toLowerCase().trim();
      var snap = await fdb.collection('musicians-log')
        .where('email_lower', '==', emailLower)
        .limit(1).get();
      if (snap.empty) return;
      var doc = snap.docs[0];
      var data = doc.data();
      if (data.status === 'onboarded') return;
      await doc.ref.update({
        status: 'onboarded',
        onboarded_at: Auth._serverTimestamp()
      });
    } catch (e) {
      console.warn('[Band Roster] Could not sync musicians-log:', e.message);
    }
  }

  window._brApprove = function(uid) {
    if (!fdb) return;
    var rec = _pending.find(function(u){ return u.uid === uid; }) || {};
    var name = rec.displayName || rec.email || 'this musician';
    var msg = 'Approve <strong>' + esc(name) + '</strong> as a band member? They will be added to On Call (inactive) and receive a welcome email.';

    var doApprove = async function() {
      try {
        await fdb.collection('users').doc(uid).update({
          status: 'approved',
          role: 'band_member',
          roster_tier: 'on_call',
          activity: 'inactive',
          needsWelcomeEmail: true,
          approvedAt: Auth._serverTimestamp()
        });
        if (rec.email) syncLogToOnboarded(rec.email);
        // Optimistic UI: /roster cache will include this member after next server sync (~5 min).
        if (!_roster.some(function(m){ return m.uid === uid; })) {
          _roster.push({
            uid: uid,
            displayName: rec.displayName || rec.email || 'Unknown',
            roster_tier: 'on_call',
            activity: 'inactive',
            confidentialityAcceptedAt: new Date(),
            offboarded_at: null,
            offboard_reason: ''
          });
        }
        if (typeof Toast !== 'undefined') Toast.success(name + ' approved — welcome email queued.');
        renderCards();
      } catch (e) {
        console.error('[Band Roster] Approve failed:', e);
        if (typeof Toast !== 'undefined') Toast.error('Approve failed: ' + e.message);
      }
    };

    if (typeof Modal !== 'undefined' && Modal.confirm) {
      Modal.confirm(msg, doApprove);
    } else {
      doApprove();
    }
  };

  window._brDeny = function(uid) {
    if (!fdb) return;
    var rec = _pending.find(function(u){ return u.uid === uid; }) || {};
    var name = rec.displayName || rec.email || 'this musician';
    var msg = 'Deny access for <strong>' + esc(name) + '</strong>? They will not be added to the band.';

    var doDeny = async function() {
      try {
        await fdb.collection('users').doc(uid).update({ status: 'denied' });
        if (typeof Toast !== 'undefined') Toast.success('Request denied.');
      } catch (e) {
        console.error('[Band Roster] Deny failed:', e);
        if (typeof Toast !== 'undefined') Toast.error('Deny failed: ' + e.message);
      }
    };

    if (typeof Modal !== 'undefined' && Modal.confirm) {
      Modal.confirm(msg, doDeny);
    } else {
      doDeny();
    }
  };

  // ═══ REINSTATEMENT ═══

  window._brReinstate = async function(uid) {
    if (!fdb) return;
    try {
      await fdb.collection('users').doc(uid).update({
        roster_tier: 'on_call',
        activity: 'inactive',
        reinstated_at: Auth._serverTimestamp(),
        offboarded_at: null,
        offboard_reason: null,
        offboard_notes: null
      });
      // Optimistic UI: /roster cache republishes on next server sync (~5 min).
      var idx = _roster.findIndex(function(m){ return m.uid === uid; });
      if (idx !== -1) {
        _roster[idx].roster_tier = 'on_call';
        _roster[idx].activity = 'inactive';
        _roster[idx].offboarded_at = null;
        _roster[idx].offboard_reason = '';
      }
      if (typeof Toast !== 'undefined') Toast.success('Freelance artist reinstated as On Call (inactive).');
      renderCards();
    } catch (e) {
      if (typeof Toast !== 'undefined') Toast.error('Reinstate failed: ' + e.message);
    }
  };

  // ═══ EDIT BIO ON BEHALF (Flow B — draft-only, LAN via Utils.apiFetch) ═══
  // BM writes a bioProfile DRAFT on a member's behalf. HARD RULE (AC-G2): this
  // screen never publishes — publication is gated on the member's own consent
  // (story-bio-c). No approve/publish control appears here.

  var _brb = null; // active on-behalf editor state

  window._brEditBio = function(rosterId) {
    var member = _roster.find(function(m){ return m.rosterId === rosterId; }) || {};
    var name = member.displayName || 'this member';
    if (typeof Utils === 'undefined' || !Utils.apiFetch) { if (typeof Toast!=='undefined') Toast.error('Bio editor is only available on the home network.'); return; }
    Utils.apiFetch('/api/v1/bio/' + encodeURIComponent(rosterId)).then(function(r){
      return r.json().then(function(body){ return { ok:r.ok, status:r.status, body:body }; });
    }).then(function(res){
      if (!res.ok) {
        var msg = (res.body && res.body.message) ? res.body.message : ('Could not load bio (' + res.status + ').');
        if (typeof Toast!=='undefined') Toast.error(msg);
        return;
      }
      openBioEditor(rosterId, name, res.body);
    }).catch(function(e){
      if (typeof Toast!=='undefined') Toast.error('Could not reach the server: ' + (e && e.message ? e.message : 'offline'));
    });
  };

  function openBioEditor(rosterId, name, data) {
    var bp = (data && data.bioProfile) || {};
    _brb = {
      rosterId: rosterId, name: name,
      hasLinked: data ? !!data.hasLinkedAccount : false,
      preview: false, saving: false,
      data: {
        stage_name: bp.stage_name || '', role_line: bp.role_line || '', credit_line: bp.credit_line || '',
        short_bio: bp.short_bio || '', long_bio: bp.long_bio || ''
      }
    };
    if (typeof Modal === 'undefined') return;
    Modal.open({ title: 'Edit bio — ' + name, content: brbContent(), size: 'lg', showFooter: false });
    brbWire();
  }

  function brbFieldHtml(f) {
    var val = _brb.data[f.key] || '';
    var over = val.length > f.max;
    var input = f.multiline
      ? '<textarea class="brb-textarea' + (over?' over':'') + '" id="brb-in-' + f.key + '" rows="' + (f.key==='long_bio'?5:3) + '" placeholder="' + esc(f.ph) + '">' + esc(val) + '</textarea>'
      : '<input type="text" class="brb-input' + (over?' over':'') + '" id="brb-in-' + f.key + '" placeholder="' + esc(f.ph) + '" value="' + esc(val) + '" />';
    return '<div class="brb-field">' +
      '<div class="brb-flabel"><span>' + esc(f.label) + '</span><span class="brb-counter' + (over?' over':'') + '" id="brb-ct-' + f.key + '">' + val.length + '/' + f.max + '</span></div>' +
      input + '<div class="brb-helper">' + esc(f.helper) + '</div></div>';
  }

  // AC-A2: rendered approval preview — the bio card as it will look, not raw fields.
  function brbPreviewCard() {
    var d = _brb.data;
    var initial = (d.stage_name || _brb.name || '?').charAt(0).toUpperCase();
    var credit = (d.credit_line||'').trim() ? '<div style="font-size:12px;color:var(--color-gold);margin-top:4px;"><i class="fa-solid fa-star" style="font-size:10px;"></i> ' + esc(d.credit_line) + '</div>' : '';
    var longb = (d.long_bio||'').trim() ? '<div style="font-size:13px;color:var(--color-text-secondary);line-height:1.55;margin-top:var(--space-sm);">' + esc(d.long_bio) + '</div>' : '';
    return '<div class="brb-preview-card">' +
      '<div style="display:flex;gap:var(--space-md);align-items:center;margin-bottom:var(--space-sm);">' +
        '<div class="brb-preview-avatar">' + esc(initial) + '</div>' +
        '<div><div style="font-weight:700;font-size:16px;">' + esc(d.stage_name||'(no stage name)') + '</div>' +
        '<div style="font-size:13px;color:var(--color-text-muted);">' + esc(d.role_line||'') + '</div>' + credit + '</div>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--color-text);line-height:1.55;">' + esc(d.short_bio||'(no short bio)') + '</div>' + longb +
    '</div>';
  }

  // Link-profile-to-account: explicit, separate, confirmed — never automatic.
  function brbLinkBox() {
    if (_brb.hasLinked) return '';
    return '<div class="brb-link-box">' +
      '<div style="font-weight:600;color:var(--color-text);margin-bottom:4px;"><i class="fa-solid fa-link-slash" style="color:#d29922;"></i> Not linked to a member account</div>' +
      'This bio isn’t tied to a signed-in member yet. Linking is a deliberate, separate step — it is never done automatically by name match. ' +
      '<div style="margin-top:var(--space-sm);"><button class="brb-btn-secondary" id="brb-link" style="min-height:40px;padding:8px 14px;font-size:13px;">Link to an account…</button></div>' +
    '</div>';
  }

  function brbContent() {
    var fields = BIO_FIELDS.map(brbFieldHtml).join('');
    return '<div>' +
      '<div class="brb-notice" style="margin-bottom:var(--space-md);"><i class="fa-solid fa-circle-info"></i> You’re editing this bio <strong>on behalf of ' + esc(_brb.name) + '</strong>. This saves a <strong>draft only</strong> — ' + esc(_brb.name) + ' must confirm it before it can be used publicly.</div>' +
      '<div id="brb-preview-wrap">' + (_brb.preview ? brbPreviewCard() : '') + '</div>' +
      fields +
      brbLinkBox() +
      '<div id="brb-saved-msg" style="display:none;margin-top:var(--space-sm);"></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:var(--space-sm);margin-top:var(--space-md);">' +
        '<button class="brb-btn-secondary" id="brb-preview-toggle"><i class="fa-solid fa-eye"></i> ' + (_brb.preview?'Hide preview':'Preview') + '</button>' +
        '<button class="brb-btn-primary" id="brb-save"><i class="fa-solid fa-floppy-disk"></i> Save as draft</button>' +
        '<button class="brb-btn-secondary" id="brb-close">Close</button>' +
      '</div>' +
    '</div>';
  }

  function brbAnyOver() {
    for (var i=0;i<BIO_FIELDS.length;i++){ var f=BIO_FIELDS[i]; if ((_brb.data[f.key]||'').length > f.max) return true; }
    return false;
  }
  function brbUpdateSaveBtn() {
    var b = document.getElementById('brb-save'); if (!b) return;
    b.disabled = brbAnyOver() || _brb.saving;
  }

  function brbWire() {
    BIO_FIELDS.forEach(function(f){
      var inp = document.getElementById('brb-in-' + f.key);
      if (!inp) return;
      inp.addEventListener('input', function(){
        _brb.data[f.key] = inp.value;
        var over = inp.value.length > f.max;
        var ct = document.getElementById('brb-ct-' + f.key);
        if (ct){ ct.textContent = inp.value.length + '/' + f.max; ct.classList.toggle('over', over); }
        inp.classList.toggle('over', over);
        brbUpdateSaveBtn();
      });
    });
    var pv = document.getElementById('brb-preview-toggle');
    if (pv) pv.addEventListener('click', function(){
      _brb.preview = !_brb.preview;
      var wrap = document.getElementById('brb-preview-wrap');
      if (wrap) wrap.innerHTML = _brb.preview ? brbPreviewCard() : '';
      pv.innerHTML = '<i class="fa-solid fa-eye"></i> ' + (_brb.preview?'Hide preview':'Preview');
    });
    var save = document.getElementById('brb-save');
    if (save) save.addEventListener('click', brbSave);
    var close = document.getElementById('brb-close');
    if (close) close.addEventListener('click', function(){ Modal.close(); });
    var link = document.getElementById('brb-link');
    if (link) link.addEventListener('click', brbLinkToAccount);
    brbUpdateSaveBtn();
  }

  function brbSave() {
    if (brbAnyOver() || _brb.saving) return;
    _brb.saving = true;
    var btn = document.getElementById('brb-save');
    if (btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…'; }
    var body = {
      stage_name: _brb.data.stage_name || '', role_line: _brb.data.role_line || '', credit_line: _brb.data.credit_line || '',
      short_bio: _brb.data.short_bio || '', long_bio: _brb.data.long_bio || ''
    };
    Utils.apiFetch('/api/v1/bio/' + encodeURIComponent(_brb.rosterId), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(j){ return { ok:r.ok, status:r.status, body:j }; });
    }).then(function(res){
      _brb.saving = false;
      if (btn){ btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save as draft'; }
      brbUpdateSaveBtn();
      if (!res.ok){
        var msg = (res.body && res.body.message) ? res.body.message : ('Save failed (' + res.status + ').');
        if (typeof Toast!=='undefined') Toast.error(msg);
        return;
      }
      var saved = document.getElementById('brb-saved-msg');
      if (saved){
        saved.style.display = '';
        saved.innerHTML = '<div class="brb-notice" style="background:rgba(63,185,80,0.10);border-color:rgba(63,185,80,0.3);"><i class="fa-solid fa-circle-check" style="color:#3fb950;"></i> Saved as draft. <strong>' + esc(_brb.name) + '</strong> must confirm before it’s used publicly.</div>';
      }
      if (typeof Toast!=='undefined') Toast.success('Draft saved.');
    }).catch(function(e){
      _brb.saving = false;
      if (btn){ btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save as draft'; }
      brbUpdateSaveBtn();
      if (typeof Toast!=='undefined') Toast.error('Save failed: ' + (e && e.message ? e.message : 'offline'));
    });
  }

  function brbLinkToAccount() {
    // No auto-link ever happens here. Surface the explicit, separate path.
    var box = document.querySelector('.brb-link-box');
    if (box){
      box.innerHTML =
        '<div style="font-weight:600;color:var(--color-text);margin-bottom:4px;"><i class="fa-solid fa-circle-info" style="color:#d29922;"></i> Linking is a separate, explicit step</div>' +
        'Account links are created deliberately when a member registers and is approved (identity service) — never automatically by name match. ' +
        'To link ' + esc(_brb.name) + ' to an existing account, use the approval / identity tools, not this bio editor. Saving a bio here never links or publishes anything.';
    }
    if (typeof Toast !== 'undefined') Toast.info('Linking happens in the identity tools — never automatically.');
  }

  // ═══ TAB SWITCHING ═══

  var tabs = document.querySelectorAll('.br-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.classList.remove('active');
        t.style.color = 'var(--color-text-muted)';
        t.style.borderBottomColor = 'transparent';
      });
      this.classList.add('active');
      this.style.color = 'var(--color-text)';
      this.style.borderBottomColor = 'var(--color-gold)';
      _filter = this.getAttribute('data-filter');
      renderCards();
    });
  });

  // ═══ INIT ═══

  function init() {
    if (typeof Auth === 'undefined' || !Auth._db) {
      document.getElementById('br-cards').innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);">Firestore not available.</div>';
      return;
    }
    fdb = Auth._db;
    loadRoster();
    subscribePending();
  }

  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { init(); });
  } else {
    init();
  }
})();
</script>
