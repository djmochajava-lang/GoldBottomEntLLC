<!-- dashboard/manager.html — Band Manager Dashboard (operations) -->
<div class="dashboard-page" id="dash-manager">

  <style>
    /* Triage skeleton shimmer — reserves height so the surface never jumps (no CLS). */
    #dash-manager .bm-skel{position:relative;overflow:hidden;background:var(--color-bg-tertiary);}
    #dash-manager .bm-skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);animation:bmSkelShimmer 1.2s infinite;}
    @keyframes bmSkelShimmer{100%{transform:translateX(100%);}}
    @media (prefers-reduced-motion: reduce){#dash-manager .bm-skel::after{animation:none;}}
    #dash-manager a.metric-card:hover{border-color:var(--color-gold)!important;}
  </style>

  <!-- Triage CTA — a newly-received quote request is the FIRST, most-prominent action on the
       surface (story-bm-dashboard-quote-triage AC-1). Hidden until the triage load resolves;
       skeleton reserves a stable slot so the header never jumps (no CLS). -->
  <div id="bm-triage-cta" style="margin-bottom:var(--space-lg);"></div>

  <!-- Quote Verification Holds — gate-quarantined quote requests awaiting a one-tap
       BM release (story-buyer-gate-quarantine-release-public B2, EO AC-1/AC-2).
       FULL COLLAPSE when empty: renders nothing, reserves no height or margin. -->
  <div id="bm-quarantine-holds" style="margin-bottom:0;"></div>

  <div class="dashboard-page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--space-sm);">
    <div>
      <h1>Dashboard</h1>
      <p class="text-muted">Band Manager · Day-to-Day Operations</p>
    </div>
    <button id="mgr-invite-btn" style="padding:8px 20px;border-radius:var(--radius-full);background:var(--color-gold);color:#000;border:none;font-weight:var(--fw-semibold);font-size:var(--text-sm);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;">
      <i class="fa-solid fa-user-plus"></i> Invite to Band Page
    </button>
  </div>

  <!-- Ops metrics -->
  <div id="bm-metrics" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-lg);"></div>

  <!-- Pending Access Requests -->
  <div class="card" id="bm-pending-access" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);">
    <h3 style="margin-bottom:var(--space-md);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <i class="fa-solid fa-user-clock" style="color:#d29922;"></i>
      <span>Pending Access Requests</span>
      <span id="bm-pending-access-badge" style="display:none;font-size:var(--text-xs);padding:2px 10px;border-radius:var(--radius-full);background:#f85149;color:#fff;font-weight:700;"></span>
    </h3>
    <div id="bm-pending-access-list">
      <p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
    </div>
  </div>

  <!-- Pipeline + Quick Actions -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:var(--space-lg);margin-top:var(--space-lg);">
    <div class="card" id="bm-pipeline" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);"></div>
    <div class="card" id="bm-qa-wrap" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">
      <h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt text-gold"></i> Quick Actions</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,90px),1fr));gap:var(--space-sm);" id="bm-qa-grid"></div>
    </div>
  </div>

  <!-- Pending Agreements -->
  <div class="card" id="bm-pending-agreements" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);">
    <h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-file-signature" style="color:#d29922;"></i> Pending Agreements</h3>
    <p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
  </div>

  <!-- Upcoming shows -->
  <div class="card" id="bm-upcoming" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);">
    <h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days text-gold"></i> Upcoming Shows & Events</h3>
    <p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
  </div>

  <!-- Band Readiness -->
  <div class="card" id="bm-band-readiness" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);">
    <h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-users-viewfinder" style="color:#3fb950;"></i> Band Readiness</h3>
    <p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</p>
  </div>

</div>

<script>
(function(){
  if (typeof DataStore === 'undefined') return;

  var isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());

  /* ── Helpers ── */
  function hexToRGB(hex) { hex = hex.replace('#',''); return parseInt(hex.substring(0,2),16)+','+parseInt(hex.substring(2,4),16)+','+parseInt(hex.substring(4,6),16); }
  function _isZeroValue(v) { if (v===0||v==='0') return true; if (typeof v==='string'&&/^\$?0(\.00)?$/.test(v.trim())) return true; return false; }

  /* metricCard — a metric is now a whole-card DRILL-THROUGH link to its filtered list
     (story-bm-dashboard-quote-triage AC-2: "New Leads: 3" → those 3). `href` is a hash
     route; `urgent` (optional) lifts a non-zero call-to-action card (e.g. New Requests). */
  function metricCard(icon, color, value, label, href, urgent) {
    var emptyHint = _isZeroValue(value) ? '<div style="font-size:var(--text-xs);color:var(--color-text-muted);opacity:0.7;margin-top:2px;font-style:italic;">No data yet</div>' : '';
    var isUrgent  = urgent && !_isZeroValue(value);
    var border    = isUrgent ? '1px solid rgba('+hexToRGB(color)+',0.55)' : '1px solid var(--color-border)';
    var bg        = isUrgent ? 'rgba('+hexToRGB(color)+',0.08)' : 'var(--color-bg-secondary)';
    var inner =
      '<div style="width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-xl);flex-shrink:0;background:rgba('+hexToRGB(color)+',0.15);color:'+color+';">'+
      '<i class="fa-solid '+icon+'"></i></div>'+
      '<div style="flex:1;min-width:0;"><div style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:var(--color-text);">'+value+'</div>'+
      '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+label+'</div>'+emptyHint+'</div>'+
      '<i class="fa-solid fa-chevron-right" style="color:var(--color-text-muted);opacity:0.5;font-size:var(--text-sm);flex-shrink:0;"></i>';
    var baseCss = 'display:flex;align-items:center;gap:var(--space-md);min-height:44px;padding:var(--space-lg);background:'+bg+';border:'+border+';border-radius:var(--radius-lg);';
    if (href) {
      return '<a href="'+href+'" class="metric-card glass-card" aria-label="'+Utils.escapeHtml(label+': '+value)+'" style="'+baseCss+'text-decoration:none;color:inherit;cursor:pointer;transition:border-color 150ms ease;">'+inner+'</a>';
    }
    return '<div class="metric-card glass-card" style="'+baseCss+'">'+inner+'</div>';
  }

  function qaBtn(href, icon, color, label) {
    return '<a href="'+href+'" class="quick-action-btn glass-card" style="display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid '+icon+'" style="font-size:var(--text-lg);color:'+color+';"></i><span>'+label+'</span></a>';
  }

  var m        = DataStore.getMetrics();
  var bookings = DataStore.getBookings ? DataStore.getBookings() : [];
  var contracts= DataStore.getContracts ? DataStore.getContracts() : [];
  var now      = new Date();
  var todayStr = now.toISOString().slice(0,10);

  var actionStages = ['proposed','negotiating','confirmed'];

  /* Derive the action-needed pipeline list from a bookings array. */
  function _derivePipelineItems(arr) {
    return (arr||[]).filter(function(b){ return actionStages.indexOf(b.stage) !== -1; })
      .sort(function(a,b){ var p = {negotiating:0,proposed:1,confirmed:2}; return (p[a.stage]||9) - (p[b.stage]||9); });
  }
  /* Stale follow-ups: proposed bookings untouched ≥3 days. */
  function _deriveStaleFollowups(arr) {
    return (arr||[]).filter(function(b){
      if (b.stage !== 'proposed') return false;
      var ts = b.updatedAt || b.updated_at || b.createdAt || b.created_at || 0;
      var ms = (ts && ts.toMillis) ? ts.toMillis() : new Date(ts||0).getTime();
      var diff = (Date.now() - ms) / 86400000;
      return diff >= 3;
    });
  }

  var pendingContracts = contracts.filter(function(c){
    var s = (c.status||'').toLowerCase();
    return s==='pending'||s==='pending-signature'||s==='sent'||s==='draft';
  });

  /* ── Ops metrics renderer ── */
  /* opts: { pipelineCount, activeContracts, pendingSignatures, upcomingShows, followupsDue, roster } */
  function _renderMetrics(opts) {
    var bmm = document.getElementById('bm-metrics');
    if (!bmm) return;
    var newReq = opts.newRequests != null ? opts.newRequests : 0;
    /* New Requests leads the row and is styled urgent when >0 — it drills to the Booking
       inquiries where new quote requests land (AC-1/AC-2). */
    var bmHtml =
      metricCard('fa-envelope-open-text','#d4a017', newReq,               'New Requests',      '#dashboard-booking',   true) +
      metricCard('fa-filter',           '#f0883e', opts.pipelineCount,    'Pipeline Actions',  '#dashboard-booking') +
      metricCard('fa-file-signature',   '#3fb950', opts.activeContracts,  'Active Contracts',  '#dashboard-contracts') +
      metricCard('fa-pen-nib',          '#d29922', opts.pendingSignatures,'Pending Signatures','#dashboard-agreements') +
      metricCard('fa-calendar-days',    '#d29922', opts.upcomingShows,    'Upcoming Shows',    '#dashboard-calendar') +
      metricCard('fa-clock-rotate-left','#c778d9', opts.followupsDue,     'Follow-ups Due',    '#dashboard-booking') +
      metricCard('fa-users',            '#d4a017', opts.roster,           'Roster',            '#dashboard-roster');
    if (isLocal) {
      bmHtml += metricCard('fa-chart-line','#3fb950', Utils.formatCurrency(m.revenueYTD), 'Revenue YTD', '#dashboard-finances');
    }
    bmm.innerHTML = bmHtml;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     TRIAGE — "Pipeline · Needs Action" (story-bm-dashboard-quote-triage)
     A LIVE, unified action list drawn from four sources, each row showing
     WHAT + how old + ONE next action (AC-3). New quote requests always sort
     first (they're the revenue). Teaching zero-state, skeleton (no CLS),
     whole-row ≥44px tap targets, 10+ overflow handled. All reads are capped
     and fail-safe: a source that errors simply contributes nothing.
     ═══════════════════════════════════════════════════════════════════════ */
  var TRIAGE_KINDS = {
    quote_request: { order:0, color:'#d4a017', icon:'fa-envelope-open-text', action:'Respond',        href:'#dashboard-booking'    },
    quote_send:    { order:1, color:'#58a6ff', icon:'fa-paper-plane',        action:'Send quote',     href:'#dashboard-quotes'     },
    agreement:     { order:2, color:'#d29922', icon:'fa-file-signature',     action:'Follow up',      href:'#dashboard-agreements' },
    deposit:       { order:3, color:'#bc8cff', icon:'fa-sack-dollar',        action:'Request deposit',href:'#dashboard-booking'    }
  };
  var TRIAGE_MAX = 8; // rows shown before the "+N more" overflow row

  function _triageAge(ts) {
    if (!ts) return '';
    var ms = (ts && ts.toMillis) ? ts.toMillis() : (ts && ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime());
    if (isNaN(ms)) return '';
    return Utils.timeAgo(new Date(ms).toISOString());
  }
  function _triageMs(ts) {
    if (!ts) return 0;
    var ms = (ts && ts.toMillis) ? ts.toMillis() : (ts && ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime());
    return isNaN(ms) ? 0 : ms;
  }

  /* Skeleton — shimmer rows that reserve the card's height so nothing jumps. */
  function _renderTriageSkeleton() {
    var bmp = document.getElementById('bm-pipeline');
    if (!bmp) return;
    var row = '<div style="display:flex;align-items:center;gap:var(--space-md);min-height:44px;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
      '<div class="bm-skel" style="width:32px;height:32px;border-radius:var(--radius-md);flex-shrink:0;"></div>'+
      '<div style="flex:1;"><div class="bm-skel" style="width:60%;height:12px;border-radius:4px;margin-bottom:6px;"></div><div class="bm-skel" style="width:35%;height:10px;border-radius:4px;"></div></div></div>';
    bmp.innerHTML =
      '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-list-check" style="color:#f0883e;"></i> Pipeline · Needs Action</h3>'+
      '<div style="display:flex;flex-direction:column;gap:var(--space-sm);" aria-busy="true">'+row+row+row+'</div>';
  }

  /* Top-of-surface CTA for new quote requests (AC-1). Empty/loading → collapses
     to nothing (no reserved gap) so it never competes when there's no request. */
  function _renderTriageCta(newReqItems) {
    var el = document.getElementById('bm-triage-cta');
    if (!el) return;
    var n = (newReqItems || []).length;
    if (!n) { el.innerHTML = ''; el.style.marginBottom = '0'; return; }
    el.style.marginBottom = 'var(--space-lg)';
    var lead = newReqItems[0];
    var who  = Utils.escapeHtml(lead._who || 'A new client');
    var age  = lead._age ? ' · ' + Utils.escapeHtml(lead._age) : '';
    var head = n === 1 ? '1 new quote request' : n + ' new quote requests';
    var sub  = n === 1 ? (who + age + ' — respond to lock the booking') : ('Latest: ' + who + age);
    el.innerHTML =
      '<a href="#dashboard-booking" aria-label="'+Utils.escapeHtml(head)+' — respond" style="display:flex;align-items:center;gap:var(--space-md);min-height:44px;padding:var(--space-lg);border-radius:var(--radius-lg);background:linear-gradient(135deg,rgba(212,160,23,0.18),rgba(212,160,23,0.06));border:1px solid rgba(212,160,23,0.55);text-decoration:none;color:inherit;">'+
        '<div style="width:44px;height:44px;border-radius:50%;background:rgba(212,160,23,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-envelope-open-text" style="color:#d4a017;font-size:var(--text-lg);"></i></div>'+
        '<div style="flex:1;min-width:0;"><div style="font-weight:var(--fw-bold);color:var(--color-text);font-size:var(--text-lg);">'+head+'</div>'+
        '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+sub+'</div></div>'+
        '<span style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-full);background:var(--color-gold);color:#000;font-weight:var(--fw-semibold);font-size:var(--text-sm);">Respond <i class="fa-solid fa-arrow-right"></i></span>'+
      '</a>';
  }

  /* ═══════════════════════════════════════════════════════════════════════
     QUOTE VERIFICATION HOLDS (story-buyer-gate-quarantine-release-public B2)
     Gate-quarantined quote requests partitioned from the SAME
     booking_inquiry_readmodel read the triage loader already makes
     (hold_state==='quarantine' — the server stamps it ONLY on gate-only
     holds, never security quarantines: EO AC-8). One-tap release rides the
     established BM-authenticated booking_actions relay (action_type
     'release_quarantine', pipeline derived server-side) with the same
     result-stamp poll booking.html uses — read stays the readmodel cache,
     write stays the relay, no HomeOffice call, no secret beyond the BM's
     own session (InfoSec C9).
     DISPLAY CONTRACT (EO AC-4/5/6 + InfoSec out-of-lane flag): first name /
     relative age / event type+date if the row carries them / humanized
     3-bucket hold reason / amber chip. NEVER from_addr and NEVER the raw
     subject (the server-generated subject can embed the submitter email as
     a fallback). Nothing renders as undefined/null/blank.
     ═══════════════════════════════════════════════════════════════════════ */
  var QH_HOLD_REASONS = {
    absent:  'No verification code entered',
    invalid: 'Verification code didn’t match or expired',
    error:   'Verification couldn’t complete (technical issue)'
  };
  var _qhRows = [];        // held rows in render order (button data-idx indexes this)
  var _qhInFlight = 0;     // releases mid-flight — refresh must not clobber their DOM

  function _qhFirstName(row) {
    var n = (row && row.from_name != null) ? String(row.from_name).trim() : '';
    return n ? n.split(/\s+/)[0] : 'New request';
  }
  /* Event type + date IF the readmodel row carries them — today's projection
     does not, so this gracefully renders nothing (AC-5: never undefined/null/blank). */
  function _qhEventLine(row) {
    var type = null, date = null;
    ['event_type', 'eventType'].forEach(function(k){ if (!type && row && row[k] != null && String(row[k]).trim() !== '') type = String(row[k]).trim(); });
    ['event_date', 'eventDate'].forEach(function(k){ if (!date && row && row[k] != null && String(row[k]).trim() !== '') date = String(row[k]).trim(); });
    if (!type && !date) return '';
    var txt = (type && date) ? (type + ' — ' + date) : (type || date);
    return '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">' + Utils.escapeHtml(txt) + '</div>';
  }
  function _qhCollapse(el) { el.innerHTML = ''; el.style.marginBottom = '0'; }

  function _renderQuarantineHolds(rows) {
    var el = document.getElementById('bm-quarantine-holds');
    if (!el) return;
    if (_qhInFlight > 0) return;                              // keep in-flight release states on screen
    if (!_bmCanApproveAccess()) { _qhCollapse(el); return; }  // AC-7 role gate
    _qhRows = rows || [];
    if (!_qhRows.length) { _qhCollapse(el); return; }         // AC-2 full collapse
    el.style.marginBottom = 'var(--space-lg)';
    var html =
      '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-left:3px solid #d29922;border-radius:var(--radius-lg);padding:var(--space-lg);">' +
        '<h3 style="margin-bottom:var(--space-md);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<i class="fa-solid fa-shield-halved" style="color:#d29922;"></i>' +
          '<span>Quote Verification Holds</span>' +
          '<span id="bm-qh-badge" style="font-size:var(--text-xs);padding:2px 10px;border-radius:var(--radius-full);background:#f85149;color:#fff;font-weight:700;">' + _qhRows.length + '</span>' +
        '</h3>' +
        '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
    _qhRows.forEach(function(r, idx) {
      var first  = _qhFirstName(r);
      var age    = _triageAge(r && r.received_at);
      var reason = QH_HOLD_REASONS[r && r.hold_reason] || QH_HOLD_REASONS.error;  // AC-6 fixed buckets only
      html +=
        '<div id="bm-qh-row-' + idx + '" style="display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid #d29922;">' +
          '<div style="display:flex;align-items:center;gap:var(--space-sm);">' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-weight:600;color:var(--color-text);">' + Utils.escapeHtml(first) + '</div>' +
              (age ? '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">' + Utils.escapeHtml(age) + '</div>' : '') +
              _qhEventLine(r) +
            '</div>' +
            '<span style="flex-shrink:0;font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);background:rgba(210,153,34,0.15);color:#d29922;font-weight:600;white-space:nowrap;">Verification Hold</span>' +
          '</div>' +
          '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);">' + reason + '</div>' +
          '<div id="bm-qh-msg-' + idx + '"></div>' +
          '<button class="bm-qh-release" data-idx="' + idx + '" style="width:100%;min-height:44px;padding:10px 16px;border-radius:var(--radius-md);background:rgba(63,185,80,0.15);color:#3fb950;border:1px solid rgba(63,185,80,0.3);font-weight:600;font-size:var(--text-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;"><i class="fa-solid fa-arrow-up-from-bracket"></i> Release to Pipeline</button>' +
        '</div>';
    });
    html += '</div></div>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.bm-qh-release'), function(btn) {
      btn.addEventListener('click', function(){ _qhRelease(btn); });
    });
  }

  /* Relay insert — the established BM booking_actions writer pattern
     (booking.html performInboxAction / swzRelayWithId): actor_id MUST equal
     the caller's own auth.uid() (RLS WITH CHECK); the role is re-resolved
     server-side by the reconciler — never trusted from this client. */
  async function _qhRelayRelease(inboxId) {
    var sb = (typeof Auth !== 'undefined' && Auth.getSupabase && Auth.getSupabase());
    if (!sb) throw new Error('Not signed in');
    var sessionRes = await sb.auth.getSession();
    var uid = sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.user && sessionRes.data.session.user.id;
    if (!uid) throw new Error('Not signed in');
    var row = { actor_id: uid, target_id: String(inboxId), action_type: 'release_quarantine', payload: {} };
    var res = await sb.from('booking_actions').insert(row).select('id').single();
    if (res.error) throw new Error(res.error.message);
    return { actionId: res.data.id };
  }

  /* Poll the own action row's result stamp (booking.html swzPollResult pattern):
     applied|noop:* → applied (noop:already_released is a SUCCESS, AC-13),
     rejected:* → rejected, silence past the budget → pending (AC-15). */
  async function _qhPollResult(actionId, budgetMs) {
    var sb = (typeof Auth !== 'undefined' && Auth.getSupabase && Auth.getSupabase());
    if (!sb) return { state: 'pending', tag: null };
    var deadline = Date.now() + (budgetMs || 120000);
    while (Date.now() < deadline) {
      await new Promise(function(r){ setTimeout(r, 2000); });
      var res = await sb.from('booking_actions').select('reconciled_at,result').eq('id', actionId).single();
      if (res.error) continue; // transient read blip — keep polling
      var row = res.data || {};
      if (row.result) {
        if (String(row.result).indexOf('rejected:') === 0) return { state: 'rejected', tag: row.result };
        return { state: 'applied', tag: row.result };
      }
      if (row.reconciled_at) return { state: 'applied', tag: 'applied' };
    }
    return { state: 'pending', tag: null };
  }

  function _qhHumanReject(tag) {
    var t = String(tag || '').replace(/^rejected:/, '');
    if (t.indexOf('role_') === 0 || t === 'no_sor_user') return 'Your account doesn’t have manager access for this';
    if (t === 'not_gate_scope') return 'This request can’t be released from here';
    if (t === 'not_found') return 'The office couldn’t find this request — refresh and try again';
    return 'The office rejected this request — refresh and try again';
  }

  async function _qhRelease(btn) {
    if (btn.disabled) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var row = _qhRows[idx];
    if (!row) return;
    var first = _qhFirstName(row);
    /* AC-10 — disable + spinner + "Releasing…" synchronously, BEFORE any await. */
    btn.disabled = true;
    btn.style.opacity = '0.7';
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Releasing…';
    _qhInFlight++;
    var msg = document.getElementById('bm-qh-msg-' + idx);
    if (msg) msg.innerHTML = '';
    try {
      var ins = await _qhRelayRelease(row.id);
      /* AC-11 — honest async copy while the reconciler applies it. */
      if (msg) msg.innerHTML = '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);"><i class="fa-solid fa-spinner fa-spin"></i> Syncing to the office… (usually under a minute)</div>';
      var result = await _qhPollResult(ins.actionId);
      if (result.state === 'applied')       { _qhSuccess(idx, row, first); }
      else if (result.state === 'rejected') { _qhFail(btn, idx, _qhHumanReject(result.tag)); }
      else                                  { _qhQueued(btn, idx); }
    } catch (err) {
      console.warn('[Manager] quarantine release failed:', err && err.message);
      var em = String((err && err.message) || '').toLowerCase();
      var human = (em.indexOf('row-level security') !== -1 || em.indexOf('policy') !== -1 || em.indexOf('signed in') !== -1)
        ? 'Your account doesn’t have manager access for this'
        : 'Couldn’t reach the office — check your connection and try again';
      _qhFail(btn, idx, human);
    }
  }

  /* AC-12/AC-13 — applied AND noop:already_released render the IDENTICAL
     green success state: border amber→green, verbatim copy, Toast, ~2s fade,
     badge decrement; full collapse when the last row leaves. */
  function _qhSuccess(idx, row, first) {
    var rowId = row && row.id;
    var rowEl = document.getElementById('bm-qh-row-' + idx);
    var msg   = document.getElementById('bm-qh-msg-' + idx);
    var btn   = rowEl && rowEl.querySelector('.bm-qh-release');
    if (rowEl) { rowEl.style.borderColor = 'rgba(63,185,80,0.5)'; rowEl.style.borderLeft = '3px solid #3fb950'; }
    if (btn) btn.style.display = 'none';
    if (msg) msg.innerHTML = '<div style="font-size:var(--text-sm);color:#3fb950;font-weight:600;">Released ✓ — now in the normal pipeline</div>';
    if (typeof Toast !== 'undefined') Toast.success('Released — ' + first + '’s quote is back in the pipeline');
    var badge = document.getElementById('bm-qh-badge');
    if (badge) badge.textContent = String(Math.max(0, _qhRows.length - 1));
    _qhInFlight = Math.max(0, _qhInFlight - 1);
    if (rowEl) { rowEl.style.transition = 'opacity 2s ease'; rowEl.style.opacity = '0'; }
    setTimeout(function() {
      _qhRows = _qhRows.filter(function(r){ return String(r && r.id) !== String(rowId); });
      if (rowEl && rowEl.parentNode) rowEl.parentNode.removeChild(rowEl);
      var b = document.getElementById('bm-qh-badge');
      if (b) b.textContent = String(_qhRows.length);
      if (!_qhRows.length && _qhInFlight === 0) _renderQuarantineHolds([]);
    }, 2100);
  }

  /* AC-14 — genuine refusal: inline red humanized message, Retry re-enabled,
     row stays visible. */
  function _qhFail(btn, idx, human) {
    var msg = document.getElementById('bm-qh-msg-' + idx);
    if (msg) msg.innerHTML = '<div style="font-size:var(--text-sm);color:#f85149;">' + human + '</div>';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Retry';
    _qhInFlight = Math.max(0, _qhInFlight - 1);
  }

  /* AC-15 — no result inside the poll budget: honest amber queued copy,
     row visible, neither success nor failure. Next reload reflects truth. */
  function _qhQueued(btn, idx) {
    var msg = document.getElementById('bm-qh-msg-' + idx);
    if (msg) msg.innerHTML = '<div style="font-size:var(--text-sm);color:#d29922;">Queued — will finish automatically when the office reconnects. Check back shortly.</div>';
    btn.innerHTML = '<i class="fa-solid fa-clock"></i> Queued';
    btn.style.opacity = '0.7';
    _qhInFlight = Math.max(0, _qhInFlight - 1);
  }

  /* The unified action list. `items` = normalized rows sorted for display. */
  function _renderActionList(items) {
    var bmp = document.getElementById('bm-pipeline');
    if (!bmp) return;
    var rows = items || [];
    var html = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-list-check" style="color:#f0883e;"></i> Pipeline · Needs Action</h3>';
    if (!rows.length) {
      /* Teaching zero-state — tells the BM what will show up and where first. */
      html += '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:var(--space-lg) var(--space-md);">'+
        '<i class="fa-solid fa-mug-hot" style="color:#3fb950;font-size:var(--text-2xl);"></i>'+
        '<div style="font-weight:600;color:var(--color-text);">You’re all caught up</div>'+
        '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">New quote requests appear here first — then quotes to send, agreements to sign, and deposits to collect.</div>'+
      '</div>';
      bmp.innerHTML = html;
      return;
    }
    html += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
    rows.slice(0, TRIAGE_MAX).forEach(function(r){
      var k = TRIAGE_KINDS[r.kind] || TRIAGE_KINDS.quote_request;
      html += '<a href="'+k.href+'" aria-label="'+Utils.escapeHtml(k.action+': '+r._who)+'" style="display:flex;align-items:center;gap:var(--space-md);min-height:44px;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid '+k.color+';text-decoration:none;color:inherit;">'+
        '<div style="width:32px;height:32px;border-radius:var(--radius-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba('+hexToRGB(k.color)+',0.15);color:'+k.color+';"><i class="fa-solid '+k.icon+'"></i></div>'+
        '<div style="flex:1;min-width:0;">'+
          '<div style="font-weight:600;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+Utils.escapeHtml(r._who)+'</div>'+
          '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">'+Utils.escapeHtml(r._label)+(r._age?' · '+Utils.escapeHtml(r._age):'')+'</div>'+
        '</div>'+
        '<span style="flex-shrink:0;font-size:var(--text-xs);padding:4px 10px;border-radius:var(--radius-full);background:rgba('+hexToRGB(k.color)+',0.15);color:'+k.color+';font-weight:600;white-space:nowrap;">'+k.action+'</span>'+
      '</a>';
    });
    html += '</div>';
    if (rows.length > TRIAGE_MAX) {
      html += '<a href="#dashboard-booking" style="display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;margin-top:var(--space-sm);font-size:var(--text-sm);color:#f0883e;text-decoration:none;font-weight:600;">+'+(rows.length-TRIAGE_MAX)+' more to action <i class="fa-solid fa-arrow-right"></i></a>';
    }
    bmp.innerHTML = html;
  }

  /* ── Triage state + orchestrator ── */
  var _triage = { quote_request: [], quote_send: [], agreement: [], deposit: [] };
  /* Sources #3/#4 load once from the live Firestore reads below; a focus refresh
     re-reads only the fast client sources (#1/#2), so we must NOT clobber these
     live values back to the (often empty) DataStore baseline on refresh. */
  var _triageLive = { agreement: false, deposit: false };
  function _triageSet(kind, rows) {
    if (!TRIAGE_KINDS[kind]) return;
    _triage[kind] = rows || [];
    _triageRender();
  }
  function _triageRender() {
    var all = [];
    Object.keys(TRIAGE_KINDS).forEach(function(kind){
      (_triage[kind] || []).forEach(function(r){ all.push(r); });
    });
    all.sort(function(a, b){
      var oa = (TRIAGE_KINDS[a.kind]||{}).order || 0, ob = (TRIAGE_KINDS[b.kind]||{}).order || 0;
      if (oa !== ob) return oa - ob;       // group order: requests → send → sign → deposit
      return (a._ms || 0) - (b._ms || 0);   // within a group: oldest-waiting first (most overdue)
    });
    var newReq = _triage.quote_request || [];
    _renderTriageCta(newReq);
    _renderActionList(all);
    if (typeof _live !== 'undefined' && _live) { _live.newRequests = newReq.length; _applyLiveMetrics(); }
  }

  /* Confirmed-but-unpaid bookings → deposit rows (triage source #4). */
  function _depositRowsFromBookings(arr) {
    return (arr || []).filter(function(b){
      if (b.stage !== 'confirmed') return false;
      var paid = b.depositPaid || b.deposit_paid || (b.depositStatus === 'paid') || (String(b.deposit_status||'').toLowerCase() === 'paid');
      return !paid;
    }).map(function(b){
      var ts = b.updatedAt || b.updated_at || b.createdAt || b.created_at;
      return { kind:'deposit', _who: b.clientName || b.name || b.contactName || b.venue || 'Confirmed booking',
               _label: 'Deposit not received' + (b.venue ? ' · ' + b.venue : ''), _age: _triageAge(ts), _ms: _triageMs(ts) };
    });
  }
  /* Unanswered booking inquiries → new-quote-request rows (triage source #1, PRIMARY). */
  function _quoteRequestRows(rows) {
    return (rows || []).filter(function(r){
      return (r.classification === 'booking_inquiry' || r.classification === 'booking_followup') && !r.responded_at;
    }).map(function(r){
      var ts = r.received_at || r.submitted_at || r.created_at;
      return { kind:'quote_request', _who: r.from_name || r.from_addr || r.name || r.email || 'New client',
               _label: r.subject ? r.subject : 'New quote request', _age: _triageAge(ts), _ms: _triageMs(ts) };
    });
  }
  /* quote_pipeline drafts → quotes-to-send rows (triage source #2). */
  function _quoteSendRows(rows) {
    return (rows || []).filter(function(q){ return (q.status||'').toLowerCase() === 'draft'; })
      .map(function(q){
        var ts = q.updatedAt || q.updated_at || q.createdAt || q.created_at;
        return { kind:'quote_send', _who: q.clientName || q.client || q.contactName || q.venue || 'Draft quote',
                 _label: 'Quote drafted, not sent', _age: _triageAge(ts), _ms: _triageMs(ts) };
      });
  }

  /* ── Triage loader — fills the four sources; each read is capped and fail-safe
     (a source that errors simply contributes nothing; the others still render). ── */
  function _loadTriage() {
    /* Synchronous baseline so the card is never empty-by-default, and so local
       dashboards (no live read layer) still show agreements + deposits. Skip a
       source once the live read has populated it (don't clobber on refresh). */
    if (!_triageLive.agreement) {
      _triage.agreement = pendingContracts.map(function(c){
        var ts = c.updatedAt || c.createdAt;
        return { kind:'agreement', _who: c.party || c.title || c.name || 'Agreement', _label:'Awaiting signature', _age: _triageAge(ts), _ms: _triageMs(ts) };
      });
    }
    if (!_triageLive.deposit) {
      _triage.deposit = _depositRowsFromBookings(bookings);
    }

    /* Source #1 — new quote requests. local: Express API; remote: Supabase read-model. */
    if (isLocal) {
      Utils.apiFetch('/booking-inbox?limit=200').then(function(data){
        _triageSet('quote_request', _quoteRequestRows((data && data.data) || []));
      }).catch(function(err){ console.warn('[Manager] triage inquiries (local) failed:', err && err.message); _triageRender(); });
    } else {
      var sb = (typeof Auth !== 'undefined' && Auth.getSupabase && Auth.getSupabase());
      if (!sb) { _triageRender(); }
      else {
        sb.from('booking_inquiry_readmodel').select('*').order('created_at', { ascending:false }).limit(200)
          .then(function(res){
            if (res.error) { console.warn('[Manager] triage inquiries fetch failed:', res.error.message); _triageRender(); return; }
            /* Partition the ONE result set (CTO section 7): gate-held rows feed
               the Quote Verification Holds card (the server stamps hold_state
               ONLY on gate-only holds — AC-8); everything else feeds the live
               triage list unchanged. No extra read, no new endpoint. */
            var all = res.data || [], held = [], live = [];
            all.forEach(function(r){ (r && r.hold_state === 'quarantine' ? held : live).push(r); });
            _renderQuarantineHolds(held);
            _triageSet('quote_request', _quoteRequestRows(live));
          });
      }
    }

    /* Source #2 — quotes awaiting send (quote_pipeline drafts, via the read layer). */
    if (typeof Auth !== 'undefined' && Auth._db) {
      Auth._db.collection('quote_pipeline').limit(200).get()
        .then(function(snap){ var rows = []; snap.forEach(function(d){ rows.push(d.data()); }); _triageSet('quote_send', _quoteSendRows(rows)); })
        .catch(function(err){ console.warn('[Manager] triage quote_pipeline failed:', err && err.message); });
    }

    /* Sources #3 (agreements) & #4 (deposits) refine asynchronously via
       _onAgreementsSnap() and the live bookings Promise.all. Render the baseline now. */
    _triageRender();
  }

  /* ── Initial synchronous render from DataStore (baseline / local / fallback) ── */
  var _dsPipelineItems  = _derivePipelineItems(bookings);
  var _dsStaleFollowups = _deriveStaleFollowups(bookings);
  function _renderFromDataStore() {
    _renderMetrics({
      newRequests:       (typeof _live !== 'undefined' && _live && _live.newRequests != null) ? _live.newRequests : 0,
      pipelineCount:     _dsPipelineItems.length,
      activeContracts:   m.activeContracts,
      pendingSignatures: pendingContracts.length,
      upcomingShows:     m.upcomingEvents,
      followupsDue:      _dsStaleFollowups.length,
      roster:            m.totalRoster
    });
    /* Triage owns #bm-pipeline now — show a skeleton until _loadTriage() resolves. */
    _renderTriageSkeleton();
  }
  _renderFromDataStore();

  /* ── Quick actions ── */
  var qaGrid = document.getElementById('bm-qa-grid');
  if (qaGrid) {
    var qaItems = [
      { href:'#dashboard-booking',   icon:'fa-ticket',         color:'#f0883e', label:'New Booking' },
      { href:'#dashboard-contracts', icon:'fa-file-signature', color:'#3fb950', label:'Contracts' },
      { href:'#dashboard-roster',    icon:'fa-users',          color:'#d4a017', label:'Roster' },
      { href:'#dashboard-calendar',  icon:'fa-calendar-plus',  color:'#d29922', label:'Calendar' },
      { href:'#dashboard-leads',     icon:'fa-binoculars',     color:'#c778d9', label:'Leads' },
      { href:'#dashboard-contacts',  icon:'fa-address-book',   color:'#58a6ff', label:'Contacts' },
    ];
    if (isLocal) qaItems.push({ href:'#dashboard-finances', icon:'fa-dollar-sign', color:'#3fb950', label:'Finances' });
    qaGrid.innerHTML = qaItems.map(function(a){ return qaBtn(a.href, a.icon, a.color, a.label); }).join('');

    // Notify Band button — fans out a generic "playlist updated" email to all band members.
    // Rendered as a wide button below the grid for visibility (mobile-first).
    var qaWrap = document.getElementById('bm-qa-wrap');
    if (qaWrap) {
      var notifyBtn = document.createElement('button');
      notifyBtn.id = 'bm-notify-band-btn';
      notifyBtn.style.cssText = 'margin-top:var(--space-md);width:100%;min-height:44px;padding:12px 18px;border-radius:var(--radius-md);background:rgba(64,123,255,0.12);color:#58a6ff;border:1px solid rgba(64,123,255,0.3);font-weight:600;font-size:var(--text-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;';
      notifyBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Notify Band: Playlist Updated';
      qaWrap.appendChild(notifyBtn);
      notifyBtn.addEventListener('click', _bmNotifyBandPlaylistUpdate);
    }
  }

  /* ── Notify Band: Playlist Updated ── */
  function _bmNotifyBandPlaylistUpdate() {
    if (typeof Modal === 'undefined' || typeof Auth === 'undefined' || !Auth._db) return;
    Modal.confirm('Send a generic "playlist updated" email to all approved band members (band_member, artist, band_manager)? Delivery within ~5 min.', function() {
      var btn = document.getElementById('bm-notify-band-btn');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Queuing…'; }
      var selfUid = Auth._user ? Auth._user.uid : null;

      Auth._db.collection('users')
        .where('status', '==', 'approved')
        .where('role', 'in', ['band_member', 'singer', 'band_manager'])
        .get()
        .then(function(snap) {
          var targets = [];
          snap.forEach(function(d) { if (d.id !== selfUid) targets.push(d.ref); });
          if (!targets.length) {
            if (typeof Toast !== 'undefined') Toast.info('No band members to notify.');
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Notify Band: Playlist Updated'; }
            return;
          }
          var batch = Auth._db.batch();
          targets.forEach(function(ref) {
            batch.update(ref, {
              needsPlaylistUpdateEmail: true,
              playlistUpdateQueuedAt: Auth._serverTimestamp()
            });
          });
          return batch.commit().then(function() {
            if (typeof Toast !== 'undefined') Toast.success('Queued — ' + targets.length + ' band member(s) will receive an email within ~5 min.');
            if (btn) {
              btn.innerHTML = '<i class="fa-solid fa-check"></i> Queued (' + targets.length + ')';
              setTimeout(function() {
                btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Notify Band: Playlist Updated';
              }, 60000); // 1-min cooldown UX guard
            }
          });
        })
        .catch(function(err) {
          console.error('[Manager] Notify band failed:', err);
          if (typeof Toast !== 'undefined') Toast.error('Failed: ' + (err.message || 'unknown'));
          if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Notify Band: Playlist Updated'; }
        });
    });
  }

  /* ── Pending Access Requests (Firestore users where status=pending) ── */
  var pendAccessCard = document.getElementById('bm-pending-access');
  var pendAccessEl   = document.getElementById('bm-pending-access-list');
  var pendAccessBadge= document.getElementById('bm-pending-access-badge');

  function _bmCanApproveAccess() {
    if (typeof Auth === 'undefined') return false;
    if (Auth.isAdmin && Auth.isAdmin()) return true;
    if (Auth._role === 'band_manager') return true;
    if (Auth._linkedRoles && Auth._linkedRoles.indexOf && Auth._linkedRoles.indexOf('band_manager') !== -1) return true;
    return false;
  }

  function _bmLoadPendingAccess() {
    if (!pendAccessEl || typeof Auth === 'undefined' || !Auth._db) return;
    Auth._db.collection('users').where('status', '==', 'pending').get().then(function(snap) {
      var docs = [];
      snap.forEach(function(d) { docs.push({ uid: d.id, data: d.data() }); });
      docs.sort(function(a, b) {
        var ar = a.data.registeredAt && a.data.registeredAt.toMillis ? a.data.registeredAt.toMillis() : 0;
        var br = b.data.registeredAt && b.data.registeredAt.toMillis ? b.data.registeredAt.toMillis() : 0;
        return br - ar;
      });
      if (!docs.length) {
        pendAccessBadge.style.display = 'none';
        pendAccessEl.innerHTML = '<p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-circle-check" style="color:#3fb950;"></i> No requests pending</p>';
        return;
      }
      pendAccessBadge.style.display = 'inline-block';
      pendAccessBadge.textContent = String(docs.length);

      var html = '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
      docs.forEach(function(item) {
        var u    = item.data;
        var uid  = item.uid;
        var name = u.displayName || 'Unknown';
        var requested = u.requestedRole || u.role || 'member';
        var note = u.requestNote || '';
        var when = u.registeredAt && u.registeredAt.toDate ? u.registeredAt.toDate() : null;
        var whenStr = when ? when.toLocaleString() : '';
        var photo = u.photoURL || '';
        var avatar = photo
          ? '<img src="' + Utils.escapeHtml(photo) + '" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;">'
          : '<div style="width:44px;height:44px;border-radius:50%;background:rgba(212,160,23,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-user" style="color:#d4a017;font-size:18px;"></i></div>';

        html += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid #d29922;">';
        html += '<div style="display:flex;align-items:center;gap:var(--space-sm);">' + avatar +
                '<div style="flex:1;min-width:0;">' +
                '<div style="font-weight:600;color:var(--color-text);">' + Utils.escapeHtml(name) + '</div>' +
                (whenStr ? '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">' + Utils.escapeHtml(whenStr) + '</div>' : '') +
                '</div>' +
                '<span style="font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);background:rgba(63,185,80,0.15);color:#3fb950;font-weight:600;white-space:nowrap;">' + Utils.escapeHtml(requested) + '</span>' +
                '</div>';
        if (note) {
          html += '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);font-style:italic;">&ldquo;' + Utils.escapeHtml(note) + '&rdquo;</div>';
        }
        html += '<div style="display:flex;gap:var(--space-sm);">' +
                '<button onclick="window._bmApproveAccess(\'' + uid + '\')" style="flex:2;min-height:44px;padding:10px 16px;border-radius:var(--radius-md);background:rgba(63,185,80,0.15);color:#3fb950;border:1px solid rgba(63,185,80,0.3);font-weight:600;font-size:var(--text-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;"><i class="fa-solid fa-user-check"></i> Set Role</button>' +
                '<button onclick="window._bmDenyAccess(\'' + uid + '\')" style="flex:1;min-height:44px;padding:10px 16px;border-radius:var(--radius-md);background:rgba(248,81,73,0.15);color:#f85149;border:1px solid rgba(248,81,73,0.3);font-weight:600;font-size:var(--text-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;"><i class="fa-solid fa-xmark"></i> Block</button>' +
                '</div>';
        html += '</div>';
      });

      pendAccessEl.innerHTML = html;
    }).catch(function(err) {

      pendAccessEl.innerHTML = '<p class="text-muted">Could not load: ' + Utils.escapeHtml(err.message || 'unknown error') + '</p>';
    });

  if (pendAccessCard) {
    if (!_bmCanApproveAccess()) {
      pendAccessCard.style.display = 'none';
    } else {
      _bmLoadPendingAccess();

  }

  var _BM_ROLE_OPTIONS = [
    { value: 'band_member', label: 'Band Member', icon: 'fa-guitar',     color: '#3fb950', desc: 'Rehearsals, playlists, charts, schedule' },
    { value: 'singer',      label: 'Artist',      icon: 'fa-microphone', color: '#c778d9', desc: 'Schedule, content approval, contracts' },
    { value: 'venue_owner', label: 'Venue Owner', icon: 'fa-building',   color: '#d29922', desc: 'Their booking and contract only' },
    { value: 'promoter',    label: 'Promoter',    icon: 'fa-bullhorn',   color: '#f0883e', desc: 'Their engagement and promo materials' },
    { value: 'guest',       label: 'Guest',       icon: 'fa-user-slash', color: '#8b949e', desc: 'No dashboard access — acknowledged but blocked' }
  ];

  function _bmRoleCardHtml(opt, checked) {
    return '<label style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid ' + (checked ? opt.color : 'var(--color-border)') + ';cursor:pointer;min-height:44px;">' +
      '<input type="radio" name="bm-role-pick" value="' + opt.value + '"' + (checked ? ' checked' : '') + ' style="margin-top:3px;width:18px;height:18px;accent-color:' + opt.color + ';flex-shrink:0;">' +
      '<i class="fa-solid ' + opt.icon + '" style="color:' + opt.color + ';font-size:18px;width:22px;flex-shrink:0;margin-top:1px;"></i>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;color:var(--color-text);">' + opt.label + '</div>' +
        '<div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;">' + opt.desc + '</div>' +
      '</div>' +
      '</label>';
