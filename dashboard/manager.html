  }
  function renderSetupSteps(restarted) {
    setView('setup');
    if (restarted) body.appendChild(el('p', 'bmpay-note', 'Delete any old Gold Bottom entry in your authenticator, then add this new one.'));
    var ol = el('ol', 'bmpay-steps');

    var s1 = el('li');
    s1.appendChild(el('p', 'bmpay-step-t', 'Install an authenticator app'));
    s1.appendChild(el('p', 'bmpay-step-d', 'Google Authenticator, or the Passwords app already on your iPhone. Pick one that backs up (Google account sync or iCloud).'));
    ol.appendChild(s1);

    s2.appendChild(el('p', 'bmpay-step-t', 'Add Gold Bottom to it'));

    add.addEventListener('click', function () {

    });
    s2.appendChild(add);
    s2.appendChild(el('p', 'bmpay-step-d', 'Or copy the setup key and paste it into the app:'));
    var keyBox = el('div', 'bmpay-key', setup.key.replace(/(.{4})/g, '$1 ').trim());
    s2.appendChild(keyBox);
    var keyMsg = msgLine('');
    var copyKey = button('Copy setup key', 'bmpay-btn--block', 'fa-copy');
    copyKey.addEventListener('click', function () {
      if (!setup || !setup.key) return;
      copyText(setup.key, keyBox, function (ok) {

      });
    });

    s2.appendChild(keyMsg);
    s2.appendChild(el('p', 'bmpay-step-d', 'Keep the setup key in your password manager too.'));
    ol.appendChild(s2);

    var s3 = el('li');
    var f = codeField('Finish setup', 'Find Gold Bottom in your authenticator app.', function (code) {
      if (!setup || !setup.id) return;
      f.busy();
      verifyCode(setup.id, code).then(function (r) {
        if (!alive) return;
        if (r.ok) { wipeSetup(); justSetUp = true; pending = null; doRead(); return; }
        var k = authErrKind(r.error);
        if (k === 'session') { renderSession(MSG.sessionSetup); return; }
        f.fail(k === 'wrong' ? MSG.wrongSetup : k === 'rate' ? MSG.rate : MSG.net);
      });
    }, 'Type the 6 digits your app shows now', 'bmpay-step-t');
    s3.appendChild(f.wrap);
    ol.appendChild(s3);
    body.appendChild(ol);

    var cancel = button('Cancel setup', 'bmpay-btn--quiet bmpay-btn--block');
    cancel.addEventListener('click', function () {
      var id = setup && setup.id;
      wipeSetup();
      renderSetupIntro();
      if (id) { try { sb.auth.mfa.unenroll({ factorId: id }).catch(function () {}); } catch (e) {} }
    });
    body.appendChild(cancel);
  }
  function renderStepUp() {
    setView('stepup');
    body.appendChild(statusLine('fa-lock', 'Locked'));
    var f = codeField('Unlock', 'Open your authenticator app, find Gold Bottom, and type the 6 digits.', function (code) {
      f.busy();
      (factorId ? Promise.resolve(factorId) : aal().then(function () { return factorId; })).then(function (fid) {
        if (!fid) return { noFactor: true };

      }).then(function (r) {
        if (!alive || view !== 'stepup') return;
        if (r.noFactor) { renderSetupIntro(); return; }
        if (r.ok) { doRead(); return; }
        var k = authErrKind(r.error);
        if (k === 'session') { renderSession(MSG.session); return; }
        f.fail(k === 'wrong' ? MSG.wrong : k === 'rate' ? MSG.rate : MSG.net);
      });
    });
    body.appendChild(f.wrap);
    body.appendChild(el('p', 'bmpay-muted', 'For safety we ask for a code once every 12 hours.'));
    var notNow = button('Not now', 'bmpay-btn--quiet bmpay-btn--block');
    notNow.addEventListener('click', function () { pending = null; renderLocked(); });
    body.appendChild(notNow);
    body.appendChild(el('p', 'bmpay-muted', MSG.lost));
    try { f.input.focus({ preventScroll: true }); } catch (e) {}
  }
  function renderLoading() {
    setView('loading');

    var wrap = el('div');
    wrap.setAttribute('aria-busy', 'true');
    wrap.appendChild(el('p', 'bmpay-sr', 'Loading payment info'));
    for (var k = 0; k < 4; k++) wrap.appendChild(el('div', 'bm-skel bmpay-skel'));
    body.appendChild(wrap);
  }
  function renderProblem(text) {
    setView('problem');
    body.appendChild(statusLine('fa-circle-exclamation', text, true));
    var b = button('Try again', 'bmpay-btn--block', 'fa-rotate-right');
    b.addEventListener('click', function () {
      if (busy) return;
      setBtnBusy(b, 'Trying…');
      startRead(null);
    });
    body.appendChild(b);
  }
  function renderSession(text) {
    clearHeld();
    rows = [];
    setView('session');
    body.appendChild(statusLine('fa-circle-exclamation', text, true));
    var b = button('Sign in again', 'bmpay-btn--primary bmpay-btn--block', 'fa-right-to-bracket');
    b.addEventListener('click', function () {
      try { if (typeof Auth !== 'undefined' && Auth.showLoginModal) Auth.showLoginModal(); } catch (e) {}
    });
    body.appendChild(b);
  }
  function renderEmpty() {
    view = 'empty';
    sum.textContent = '';
    body.appendChild(el('p', 'bmpay-lead', 'No band members on your roster yet. Invite players to your Band Page and their payment info will show up here.'));
    var inv = document.getElementById('mgr-invite-btn');
    if (inv) {
      var b = button('Invite to Band Page', 'bmpay-btn--block', 'fa-user-plus');
      b.addEventListener('click', function () { inv.click(); });
      body.appendChild(b);
    }
  }
  function renderRoster() {
    setView('roster');
    var total = rows.length;
    if (!total) { renderEmpty(); return; }
    var ready = rows.filter(function (r) { return r.state === 'ok' || r.state === 'on_file_office'; }).length;
    sum.textContent = (ready === total) ? ('All ' + total + ' ready') : (ready + ' of ' + total + ' ready');
    if (justSetUp) { body.appendChild(msgLine(MSG.done, 'ok')); justSetUp = false; }
    var ul = el('ul', 'bmpay-list');
    rows.forEach(function (r, i) { ul.appendChild(buildRow(r, i)); });
    body.appendChild(ul);
  }
  function buildRow(r, i) {
    var li = el('li', 'bmpay-row');
    li.setAttribute('data-i', String(i));
    var top = el('div', 'bmpay-top');
    var main = el('div', 'bmpay-main');
    var who = el('div', 'bmpay-who');
    who.appendChild(el('span', 'bmpay-name', r.name || 'Name not set'));
    if (r.instrument) who.appendChild(el('span', 'bmpay-inst', r.instrument));
    main.appendChild(who);
    top.appendChild(main);

    var pay = el('div', 'bmpay-pay');
    var label = r.method ? METHOD[r.method] : '';
    if (r.state === 'ok') {
      pay.appendChild(el('span', 'bmpay-pill', label || 'Payment'));
      pay.appendChild(el('span', 'bmpay-mask', r.mask));
      var show = button('Show', 'bmpay-show', 'fa-eye');
      show.setAttribute('aria-label', 'Show ' + possessive(r) + ' ' + what(r));
      show.addEventListener('click', function () { reveal(i); });
      top.appendChild(show);
    } else if (r.state === 'on_file_office') {
      if (label) pay.appendChild(el('span', 'bmpay-pill', label));
      pay.appendChild(flag('fa-building-columns', 'On file at the office', 'info'));
    } else if (r.state === 'needs_resave') {
      if (label) pay.appendChild(el('span', 'bmpay-pill', label));
      pay.appendChild(flag('fa-rotate', 'Needs to be entered again on their Band Page', 'warn'));
    } else if (r.state === 'unreadable') {
      if (label) pay.appendChild(el('span', 'bmpay-pill', label));
      pay.appendChild(flag('fa-triangle-exclamation', 'Can’t be read. Needs to be entered again on their Band Page', 'warn'));
    } else {
      pay.appendChild(flag('fa-circle-exclamation', 'Not set yet', 'warn'));
    }
    main.appendChild(pay);
    li.appendChild(top);
    li.appendChild(el('div', 'bmpay-reveal'));
    li.appendChild(msgLine(''));
    return li;
  }

  /* ── reading the roster ── */
  function setData(list) {
    clearHeld();
    rows = [];
    held = [];
    for (var i = 0; i < list.length; i++) {
      var x = list[i] || {};
      var method = (typeof x.method === 'string' && Object.prototype.hasOwnProperty.call(METHOD, x.method)) ? x.method : null;
      var state = (typeof x.state === 'string' && STATES.indexOf(x.state) !== -1) ? x.state : 'unreadable';
      var h = (state === 'ok' && typeof x.handle === 'string' && x.handle) ? x.handle : null;
      if (method === 'direct_deposit') { h = null; if (state === 'ok') state = 'on_file_office'; }
      if (state === 'ok' && !h) state = 'unreadable';
      rows.push({ name: str(x.display_name, 80), instrument: str(x.instrument, 60), method: method, state: state, mask: h ? maskOf(h) : '' });
      held.push(h);
      x.handle = null;
    }
    heldAt = Date.now();
    clearTimeout(capTimer);
    capTimer = setTimeout(clearHeld, CAP_MS);
  }
  function clearHeld() {
    if (openIdx !== -1) hideRow(openIdx, 'safety');
    for (var i = 0; i < held.length; i++) held[i] = null;
    held = [];
    heldAt = 0;
    clearTimeout(capTimer);
    capTimer = null;
  }
  function readProblem(status) {
    var text = (status === 429) ? MSG.limit : null;
    if (view === 'roster' && pending != null) {
      rowMsgAt(pending, text || MSG.rowFail, 'err');
      pending = null;
      return;
    }
    renderProblem(text || MSG.down);
  }
  function startRead(i) {
    if (!alive || busy) return;
    pending = (typeof i === 'number') ? i : null;
    pendingName = (pending != null && rows[pending]) ? rows[pending].name : null;
    busy = true;
    if (view === 'roster' && pending != null) rowMsgAt(pending, 'Opening…', '');
    aal().then(function (info) {
      if (!alive) return;
      busy = false;
      if (info.error === 'session') { renderSession(MSG.session); return; }
      if (info.error) { readProblem(0); return; }
      if (!info.hasFactor) { renderSetupIntro(); return; }
      if (info.level !== 'aal2') { renderStepUp(); return; }
      doRead();
    });
  }
  function doRead() {
    busy = true;
    if (view !== 'roster') renderLoading();
    call('read').then(function (r) {
      if (!alive) return;
      busy = false;
      if (r.status === 200 && Array.isArray(r.body)) {
        setData(r.body);
        r.body = null;
        renderRoster();
        afterRead();
        return;
      }
      if (r.status === 401 && r.body && r.body.step_up === true) { renderStepUp(); return; }
      if (r.status === 401) { renderSession(MSG.session); return; }
      if (r.status === 403) { destroy(); return; }
      readProblem(r.status);
    });
  }
  function afterRead() {
    if (pending == null) return;
    var i = pending;
    pending = null;
    var r = rows[i];
    if (r && r.state === 'ok' && r.name === pendingName) reveal(i);
  }

  /* ── show / copy / hide one row ── */
  function reveal(i) {
    if (!alive || busy) return;
    var r = rows[i];
    if (!r || r.state !== 'ok') return;
    if (heldAt && Date.now() - heldAt > CAP_MS) clearHeld();
    var v = held[i];
    if (typeof v !== 'string' || !v) { startRead(i); return; }
    if (openIdx !== -1 && openIdx !== i) hideRow(openIdx, '');
    var li = rowEl(i);
    if (!li) return;
    var panel = li.querySelector('.bmpay-reveal');
    var msg = li.querySelector('.bmpay-msg');
    setMsg(msg, '', '');
    panel.textContent = '';
    var h = el('div', 'bmpay-handle', v);
    panel.appendChild(h);
    panel.appendChild(el('p', 'bmpay-confirm', r.name ? 'Confirm the app shows ' + r.name : 'Confirm the name in the app before you send.'));
    var acts = el('div', 'bmpay-actions');
    var cp = button('Copy', 'bmpay-btn--primary', 'fa-copy');
    cp.setAttribute('aria-label', 'Copy ' + possessive(r) + ' ' + what(r));
    cp.addEventListener('click', function () { copyRow(i, h, msg); });
    var hd = button('Hide', '', 'fa-eye-slash');
    hd.setAttribute('aria-label', 'Hide ' + possessive(r) + ' ' + what(r));
    hd.addEventListener('click', function () {
      hideRow(i, '');
      var s = li.querySelector('.bmpay-show');
      try { if (s) s.focus({ preventScroll: true }); } catch (e) {}
    });
    acts.appendChild(cp);
    acts.appendChild(hd);
    panel.appendChild(acts);
    li.classList.add('is-open');
    openIdx = i;
    armIdle();
    try { acts.scrollIntoView({ block: 'nearest' }); } catch (e) {}
    try { cp.focus({ preventScroll: true }); } catch (e) {}
  }
  function hideRow(i, reason) {
    clearTimeout(idleTimer);
    idleTimer = null;
    if (openIdx === i) openIdx = -1;
    clearSelectionInCard();
    var li = rowEl(i);
    if (!li) return;
    var panel = li.querySelector('.bmpay-reveal');
    if (panel) panel.textContent = '';
    li.classList.remove('is-open');
    setMsg(li.querySelector('.bmpay-msg'), reason === 'safety' ? MSG.hiddenAgain : '', '');
  }
  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = null;
    if (openIdx === -1) return;
    idleTimer = setTimeout(function () { if (openIdx !== -1) hideRow(openIdx, 'safety'); }, IDLE_MS);
  }
  function copyRow(i, node, msg) {
    var v = held[i];
    if (typeof v !== 'string' || !v || openIdx !== i) { hideRow(i, ''); return; }
    var r = rows[i];
    copyText(v, node, function (ok) {
      if (!alive || openIdx !== i) return;
      if (ok) setMsg(msg, (r.method && r.method !== 'check') ? 'Copied. Paste it into ' + METHOD[r.method] + '.' : 'Copied.', 'ok');
      else setMsg(msg, MSG.pressHold, '');
    });
    armIdle();
  }
  /* Write straight away inside the tap (a fresh gesture, which iOS Safari requires).
     If that is refused, select the text so a long press offers Copy. */
  function copyText(text, node, done) {
    var p = null;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') p = navigator.clipboard.writeText(text);
    } catch (e) { p = null; }
    if (p && typeof p.then === 'function') {
      p.then(function () { done(true); }, function () { done(selectCopy(node)); });
      return;
    }
    done(selectCopy(node));
  }
  function selectCopy(node) {
    var ok = false;
    try {
      if (!node || !node.isConnected) return false;
      var range = document.createRange();
      range.selectNodeContents(node);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(range);
      ok = !!(document.execCommand && document.execCommand('copy'));
      if (ok) s.removeAllRanges();
    } catch (e) { ok = false; }
    return ok;
  }

  /* ── setting up the code lock ── */
  function startSetup(b) {
    if (busy) return;
    busy = true;
    if (b) setBtnBusy(b, 'Starting…');
    aal().then(function (info) {
      if (!alive) return null;
      if (info.error === 'session') { busy = false; renderSession(MSG.sessionSetup); return null; }
      if (info.error) { busy = false; renderSetupIntro(MSG.startFail); return null; }
      if (info.hasFactor) { busy = false; renderStepUp(); return null; }
      var restarted = info.stale.length > 0;
      return Promise.all(info.stale.map(function (fid) {
        return Promise.resolve().then(function () { return sb.auth.mfa.unenroll({ factorId: fid }); }).catch(function () { return null; });
      })).then(function () {
        return sb.auth.mfa.enroll({ factorType: 'totp', issuer: ISSUER });
      }).then(function (res) {
        if (!alive) return;
        busy = false;
        var t = res && res.data && res.data.totp;
        var key = (t && typeof t.secret === 'string') ? t.secret.replace(/[^A-Za-z2-7]/g, '').toUpperCase() : '';
        if (t) { t.secret = null; t.uri = null; t.qr_code = null; }
        if (!res || res.error || !res.data || !res.data.id || key.length < 16) {
          if (res && res.error && authErrKind(res.error) === 'session') { renderSession(MSG.sessionSetup); return; }
          renderSetupIntro(MSG.startFail);
          return;
        }
        var params = [['secret', key], ['issuer', ISSUER], ['algorithm', 'SHA1'], ['digits', '6'], ['period', '30']];
        setup = {
          id: res.data.id,
          key: key,
          uri: 'otpauth://totp/' + encodeURIComponent(ISSUER) + '?' +
               params.map(function (p) { return p[0] + '=' + encodeURIComponent(p[1]); }).join('&')
        };
        params = null;
        key = null;
        renderSetupSteps(restarted);
      });
    }).catch(function () {
      if (!alive) return;
      busy = false;
      renderSetupIntro(MSG.startFail);
    });
  }

  /* ── mount, Quick Actions tile, teardown ── */
  function addTile() {
    var grid = document.getElementById('bm-qa-grid');
    if (!grid) return;
    tile = el('button', 'quick-action-btn glass-card');
    tile.type = 'button';
    tile.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-xs);min-height:44px;width:100%;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);color:var(--color-text-secondary);text-align:center;font-family:inherit;font-size:var(--text-sm);cursor:pointer;';
    var ic = icon('fa-hand-holding-dollar');
    ic.style.cssText = 'font-size:var(--text-lg);color:var(--color-gold);';
    tile.appendChild(ic);
    tile.appendChild(el('span', null, 'Pay the band'));
    tile.addEventListener('click', function () {
      if (!isMounted()) return;
      var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      try { card.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' }); } catch (e) { card.scrollIntoView(); }
      try { head.focus({ preventScroll: true }); } catch (e) {}
    });
    grid.appendChild(tile);
  }
  function onTouch() { if (openIdx !== -1) armIdle(); }
  function mount() {
    card = el('section', 'card bmpay');
    card.setAttribute('aria-labelledby', 'bmpay-title');
    card.appendChild(el('style', null, CSS));
    head = el('h3', 'bmpay-title');
    head.id = 'bmpay-title';
    head.tabIndex = -1;
    head.appendChild(icon('fa-lock'));
    head.appendChild(el('span', null, 'Band payment info'));
    card.appendChild(head);
    card.appendChild(el('p', 'bmpay-sub', 'Only you can see this.'));
    sum = el('p', 'bmpay-sum');
    sum.setAttribute('aria-live', 'polite');
    card.appendChild(sum);
    body = el('div', 'bmpay-body');
    card.appendChild(body);
    var anchor = document.getElementById('bm-pending-agreements');
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(card, anchor);
    else page.appendChild(card);
    mounted = true;
    addTile();
    ['pointerdown', 'touchstart', 'keydown', 'focusin'].forEach(function (t) {
      card.addEventListener(t, onTouch, { passive: true });
    });
    renderChecking();
    aal().then(function (info) {
      if (!alive) return;
      if (info.error === 'session') { renderSession(MSG.session); return; }
      if (!info.error && !info.hasFactor) { renderSetupIntro(); return; }
      renderLocked();
    });
  }
  function destroy() {
    if (!alive) return;
    alive = false;
    clearTimeout(idleTimer);
    clearTimeout(capTimer);
    for (var i = 0; i < held.length; i++) held[i] = null;
    held = [];
    rows = [];
    heldAt = 0;
    openIdx = -1;
    wipeSetup();
    clearSelectionInCard();
    if (card && card.parentNode) card.parentNode.removeChild(card);
    if (tile && tile.parentNode) tile.parentNode.removeChild(tile);
    card = head = sum = body = tile = null;
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', onPageHide);
    document.removeEventListener('gbe:role-switched', destroy);
    if (observer) { try { observer.disconnect(); } catch (e) {} observer = null; }
    if (authSub) { try { authSub.unsubscribe(); } catch (e) {} authSub = null; }
    if (window.__bmPayCleanup === destroy) window.__bmPayCleanup = null;
  }
  function onVis() {
    if (!alive) return;
    if (mounted && !isMounted()) { destroy(); return; }
    if (document.visibilityState === 'hidden') {
      if (openIdx !== -1) hideRow(openIdx, 'safety');
    } else if (heldAt && Date.now() - heldAt > CAP_MS) {
      clearHeld();
    }
  }
  function onPageHide() {
    if (!alive) return;
    clearHeld();
    /* Opening the authenticator from "Add to authenticator" can count as leaving the
       page on some browsers; keep the setup on screen for that one moment only. */
    if (setup && Date.now() - launchAt > 3000) renderSetupIntro();
  }

  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', onPageHide);
  document.addEventListener('gbe:role-switched', destroy);
  try {
    observer = new MutationObserver(function () { if (!page.isConnected) destroy(); });
    observer.observe(page.parentNode, { childList: true });
  } catch (e) {}
  try {
    var sub = sb.auth.onAuthStateChange(function (evt) { if (evt === 'SIGNED_OUT') destroy(); });
    authSub = sub && sub.data && sub.data.subscription;
  } catch (e) {}
  window.__bmPayCleanup = destroy;

  call('probe').then(function (r) {
    if (!alive) return;
    if (r.status !== 204 || !page.isConnected) { destroy(); return; }
    mount();
  });
})();
</script>
