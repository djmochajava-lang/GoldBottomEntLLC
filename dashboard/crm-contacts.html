<!-- dashboard/crm-contacts.html — CRM Contacts -->
<div class="dashboard-page" id="dash-crm-contacts">
  <div class="dashboard-page-header">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-sm);">
      <div><h1>CRM Contacts</h1><p class="text-muted">Manage contacts, track personas, and view communication history.</p></div>
      <button class="btn btn-primary" id="add-contact-btn" style="display:inline-flex;align-items:center;gap:var(--space-xs);padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:var(--fw-semibold);color:var(--color-text-inverse);background:var(--color-gold);border-radius:var(--radius-sm);border:none;cursor:pointer;transition:background 150ms ease,transform 150ms ease;"><i class="fa-solid fa-plus"></i> Add Contact</button>
    </div>
  </div>

  <!-- Search Bar -->
  <div id="crm-search-bar" style="margin-top:var(--space-lg);">
    <input type="text" id="crm-search-input" placeholder="Search by name, email, or company..." style="width:100%;max-width:420px;padding:var(--space-sm) var(--space-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" />
  </div>

  <!-- Filter Bar -->
  <div id="crm-filters" style="display:flex;gap:var(--space-xs);margin-top:var(--space-md);flex-wrap:wrap;">
    <button class="filter-btn active" data-filter="all" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">All</button>
    <button class="filter-btn" data-filter="promoter" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Promoters</button>
    <button class="filter-btn" data-filter="musician" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Musicians</button>
    <button class="filter-btn" data-filter="fan" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Fans</button>
    <button class="filter-btn" data-filter="client" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Clients</button>
    <button class="filter-btn" data-filter="vendor" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Vendors</button>
  </div>

  <!-- Contacts Table -->
  <div class="card" id="crm-table-container" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-md);"></div>
</div>

<script>
(function(){
  var API_BASE = '/api/v1/contacts';

  var isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());

  var currentFilter = 'all';
  var searchQuery = '';
  var contactsCache = [];

  /* ---- Persona badge colors ---- */
  var personaBadge = {
    promoter: { label: 'Promoter', bg: 'rgba(212,160,23,0.15)', color: '#d4a017' },
    musician: { label: 'Musician', bg: 'rgba(163,113,247,0.15)', color: '#a371f7' },
    fan:      { label: 'Fan',      bg: 'rgba(63,185,80,0.15)',   color: '#3fb950' },
    client:   { label: 'Client',   bg: 'rgba(88,166,255,0.15)',  color: '#58a6ff' },
    vendor:   { label: 'Vendor',   bg: 'rgba(227,143,37,0.15)',  color: '#e38f25' }
  };

  /* ---- Status pill colors ---- */
  var statusPill = {
    active:   { label: 'Active',   bg: 'rgba(63,185,80,0.15)',   color: '#3fb950' },
    inactive: { label: 'Inactive', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' },
    lead:     { label: 'Lead',     bg: 'rgba(210,153,34,0.15)',  color: '#d29922' },
    archived: { label: 'Archived', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' }
  };

  /* ---- Fetch contacts from API ---- */
  function fetchContacts(cb) {
    var params = [];
    if (currentFilter !== 'all') params.push('persona=' + encodeURIComponent(currentFilter));
    if (searchQuery) params.push('q=' + encodeURIComponent(searchQuery));
    var url = API_BASE + (params.length ? '?' + params.join('&') : '');

    var headers = { 'Accept': 'application/json' };
    var token = localStorage.getItem('gbe-session-token');
    if (token) headers['X-GBE-Session'] = token;
    var apiKey = localStorage.getItem('gbe-api-key');
    if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

    fetch(url, { headers: headers })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        contactsCache = Array.isArray(data) ? data : (data.data || []);
        if (cb) cb(null, contactsCache);
      })
      .catch(function(err) {
        console.error('CRM fetch error:', err);
        if (cb) cb(err, []);
      });
  }

  /* ---- Render table ---- */
  function renderTable() {
    var c = document.getElementById('crm-table-container');
    if (!c) return;

    var data = contactsCache;

    if (!data.length) {
      var emptyMsg = currentFilter === 'all' && !searchQuery
        ? 'No contacts yet. Add your first contact.'
        : 'No contacts match the current filters.';
      c.innerHTML = '<div class="empty-state" style="text-align:center;padding:var(--space-3xl) var(--space-lg);">' +
        '<div class="empty-state-icon" style="font-size:var(--text-4xl);color:var(--color-text-muted);margin-bottom:var(--space-md);"><i class="fa-solid fa-address-book"></i></div>' +
        '<h3 class="empty-state-title" style="color:var(--color-text);margin-bottom:var(--space-sm);">No Contacts</h3>' +
        '<p class="empty-state-text" style="color:var(--color-text-secondary);font-size:var(--text-sm);">' + emptyMsg + '</p></div>';
      return;
    }

    var headers = ['Name', 'Email', 'Company', 'Persona', 'Source', 'Status', 'Messages', 'Last Updated'];
    if (isLocal) headers.push('Actions');

    var html = '<div style="overflow-x:auto;"><table class="data-table" style="width:100%;border-collapse:collapse;"><thead><tr style="text-align:left;border-bottom:2px solid var(--color-border);">';
    headers.forEach(function(h) {
      html += '<th style="padding:var(--space-sm);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);font-weight:var(--fw-semibold);white-space:nowrap;">' + h + '</th>';
    });
    html += '</tr></thead><tbody>';

    data.forEach(function(ct) {
      var esc = Utils.escapeHtml;
      var pb = personaBadge[ct.persona] || { label: ct.persona || 'Unknown', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' };
      var sp = statusPill[ct.status] || { label: ct.status || 'Unknown', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' };
      var updatedAt = ct.updatedAt ? Utils.formatDate(ct.updatedAt) : '\u2014';
      var msgCount = ct.messages != null ? ct.messages : 0;

      html += '<tr style="border-bottom:1px solid var(--color-border);">' +
        '<td data-label="Name" style="padding:var(--space-sm);font-size:var(--text-sm);"><strong>' + esc(ct.name || '') + '</strong></td>' +
        '<td data-label="Email" style="padding:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-secondary);">' + esc(ct.email || '\u2014') + '</td>' +
        '<td data-label="Company" style="padding:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-secondary);">' + esc(ct.company || '\u2014') + '</td>' +
        '<td data-label="Persona" style="padding:var(--space-sm);"><span style="display:inline-block;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:var(--fw-semibold);background:' + pb.bg + ';color:' + pb.color + ';">' + pb.label + '</span></td>' +
        '<td data-label="Source" style="padding:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-secondary);">' + esc(ct.source || '\u2014') + '</td>' +
        '<td data-label="Status" style="padding:var(--space-sm);"><span style="display:inline-block;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:var(--fw-semibold);background:' + sp.bg + ';color:' + sp.color + ';text-transform:capitalize;">' + sp.label + '</span></td>' +
        '<td data-label="Messages" style="padding:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-muted);text-align:center;">' + msgCount + '</td>' +
        '<td data-label="Last Updated" style="padding:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-secondary);">' + updatedAt + '</td>';

      if (isLocal) {
        html += '<td data-label="Actions" style="padding:var(--space-sm);"><div class="data-table-actions" style="display:flex;gap:var(--space-xs);">' +
          '<button class="btn btn-ghost btn-sm" onclick="crmEditContact(\'' + esc(ct.id) + '\')" style="padding:4px 8px;border-radius:var(--radius-sm);color:var(--color-text-secondary);background:none;border:none;cursor:pointer;" title="Edit"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="btn btn-ghost btn-sm text-danger" onclick="crmDeleteContact(\'' + esc(ct.id) + '\')" style="padding:4px 8px;border-radius:var(--radius-sm);color:var(--color-danger);background:none;border:none;cursor:pointer;" title="Delete"><i class="fa-solid fa-trash"></i></button>' +
          '</div></td>';
      }

      html += '</tr>';
    });

    html += '</tbody></table></div>';
    c.innerHTML = html;
  }

  /* ---- Filter buttons ---- */
  var filterBar = document.getElementById('crm-filters');
  if (filterBar) {
    filterBar.addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      currentFilter = btn.getAttribute('data-filter') || 'all';

      filterBar.querySelectorAll('.filter-btn').forEach(function(b) {
        var isActive = b === btn;
        b.classList.toggle('active', isActive);
        b.style.background = isActive ? 'var(--color-gold)' : 'none';
        b.style.color = isActive ? 'var(--color-text-inverse)' : 'var(--color-text-secondary)';
        b.style.borderColor = isActive ? 'var(--color-gold)' : 'var(--color-border)';
      });

      fetchContacts(function() { renderTable(); });
    });

    /* Set initial active styles */
    filterBar.querySelectorAll('.filter-btn').forEach(function(b) {
      var isActive = b.classList.contains('active');
      b.style.background = isActive ? 'var(--color-gold)' : 'none';
      b.style.color = isActive ? 'var(--color-text-inverse)' : 'var(--color-text-secondary)';
      b.style.borderColor = isActive ? 'var(--color-gold)' : 'var(--color-border)';
    });
  }

  /* ---- Search bar ---- */
  var searchInput = document.getElementById('crm-search-input');
  if (searchInput) {
    var _searchTimeout;
    searchInput.addEventListener('input', function() {
      clearTimeout(_searchTimeout);
      _searchTimeout = setTimeout(function() {
        searchQuery = searchInput.value.trim();
        fetchContacts(function() { renderTable(); });
      }, 300);
    });
  }

  /* ---- Modal form HTML ---- */
  function contactFormHTML(data) {
    var d = data || {};
    var esc = Utils.escapeHtml;
    return '<form id="modal-form">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Name *</label><input type="text" class="form-input" name="name" required placeholder="Full name" value="' + esc(d.name || '') + '" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" /></div>' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Email</label><input type="email" class="form-input" name="email" placeholder="email@example.com" value="' + esc(d.email || '') + '" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" /></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);margin-top:var(--space-md);">' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Phone</label><input type="tel" class="form-input" name="phone" placeholder="(555) 123-4567" value="' + esc(d.phone || '') + '" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" /></div>' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Company</label><input type="text" class="form-input" name="company" placeholder="Company or organization" value="' + esc(d.company || '') + '" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" /></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);margin-top:var(--space-md);">' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Source</label><input type="text" class="form-input" name="source" placeholder="e.g. Website, Referral, Event" value="' + esc(d.source || '') + '" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);" /></div>' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Persona *</label><select class="form-select" name="persona" required style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);">' +
          '<option value="promoter"' + (d.persona === 'promoter' ? ' selected' : '') + '>Promoter</option>' +
          '<option value="musician"' + (d.persona === 'musician' ? ' selected' : '') + '>Musician</option>' +
          '<option value="fan"' + (d.persona === 'fan' ? ' selected' : '') + '>Fan</option>' +
          '<option value="client"' + (!d.persona || d.persona === 'client' ? ' selected' : '') + '>Client</option>' +
          '<option value="vendor"' + (d.persona === 'vendor' ? ' selected' : '') + '>Vendor</option>' +
        '</select></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);margin-top:var(--space-md);">' +
        '<div class="form-group"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Status</label><select class="form-select" name="status" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);">' +
          '<option value="active"' + (d.status === 'active' ? ' selected' : '') + '>Active</option>' +
          '<option value="lead"' + (!d.status || d.status === 'lead' ? ' selected' : '') + '>Lead</option>' +
          '<option value="inactive"' + (d.status === 'inactive' ? ' selected' : '') + '>Inactive</option>' +
          '<option value="archived"' + (d.status === 'archived' ? ' selected' : '') + '>Archived</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="form-group" style="margin-top:var(--space-md);"><label class="form-label" style="display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--color-text-secondary);margin-bottom:var(--space-xs);">Notes</label><textarea class="form-textarea" name="notes" rows="3" placeholder="Internal notes about this contact" style="width:100%;padding:var(--space-sm);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:var(--text-sm);resize:vertical;">' + esc(d.notes || '') + '</textarea></div>' +
    '</form>';
  }

  /* ---- Collect form data ---- */
  function collectFormData() {
    var f = document.getElementById('modal-form');
    if (!f) return null;
    var d = {};
    new FormData(f).forEach(function(v, k) { d[k] = v; });
    return d;
  }

  /* ---- API helpers ---- */
  function apiHeaders() {
    var h = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    var token = localStorage.getItem('gbe-session-token');
    if (token) h['X-GBE-Session'] = token;
    var apiKey = localStorage.getItem('gbe-api-key');
    if (apiKey) h['Authorization'] = 'Bearer ' + apiKey;
    return h;
  }

  function apiPost(data, cb) {
    fetch(API_BASE, { method: 'POST', headers: apiHeaders(), body: JSON.stringify(data) })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(res) { cb(null, res); })
      .catch(function(err) { cb(err); });
  }

  function apiPut(id, data, cb) {
    fetch(API_BASE + '/' + encodeURIComponent(id), { method: 'PUT', headers: apiHeaders(), body: JSON.stringify(data) })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(res) { cb(null, res); })
      .catch(function(err) { cb(err); });
  }

  function apiDelete(id, cb) {
    fetch(API_BASE + '/' + encodeURIComponent(id), { method: 'DELETE', headers: apiHeaders() })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(res) { cb(null, res); })
      .catch(function(err) { cb(err); });
  }

  /* ---- Hide Add button if not local ---- */
  if (!isLocal) {
    var addBtn = document.getElementById('add-contact-btn');
    if (addBtn) addBtn.style.display = 'none';
  }

  /* ---- Add Contact ---- */
  var addContactBtn = document.getElementById('add-contact-btn');
  if (addContactBtn) {
    addContactBtn.addEventListener('click', function() {
      if (typeof Modal === 'undefined') return;
      Modal.open({
        title: 'Add Contact',
        size: 'lg',
        content: contactFormHTML({ status: 'lead', persona: 'client' }),
        saveText: 'Add Contact',
        onSave: function() {
          var d = collectFormData();
          if (!d || !d.name) { Toast.error('Name is required'); return; }
          apiPost(d, function(err) {
            if (err) { Toast.error('Failed to add contact'); return; }
            Modal.close();
            Toast.success('Added: ' + d.name);
            fetchContacts(function() { renderTable(); });
          });
        }
      });
    });
  }

  /* ---- Edit Contact ---- */
  window.crmEditContact = function(id) {
    var ct = contactsCache.find(function(c) { return c.id === id; });
    if (!ct || typeof Modal === 'undefined') return;
    Modal.open({
      title: 'Edit: ' + ct.name,
      size: 'lg',
      content: contactFormHTML(ct),
      saveText: 'Save',
      onSave: function() {
        var d = collectFormData();
        if (!d) return;
        apiPut(id, d, function(err) {
          if (err) { Toast.error('Failed to update contact'); return; }
          Modal.close();
          Toast.success('Updated: ' + (d.name || ct.name));
          fetchContacts(function() { renderTable(); });
        });
      }
    });
  };

  /* ---- Delete Contact (soft-delete) ---- */
  window.crmDeleteContact = function(id) {
    var ct = contactsCache.find(function(c) { return c.id === id; });
    if (!ct) return;
    Modal.confirm('Delete "' + ct.name + '" from CRM contacts?', function() {
      apiDelete(id, function(err) {
        if (err) { Toast.error('Failed to delete contact'); return; }
        Toast.success('Removed: ' + ct.name);
        fetchContacts(function() { renderTable(); });
      });
    });
  };

  /* ---- Initial load ---- */
  fetchContacts(function(err) {
    if (err) {
      /* Fallback: show empty state if API unavailable */
      contactsCache = [];
    }
    renderTable();
  });

})();
</script>
