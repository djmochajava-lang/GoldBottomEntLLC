<!-- dashboard/musicians-log.html — Musicians Log (Potential Musician Pipeline) -->
<div class="dashboard-page" id="dash-musicians-log">

  <!-- Page Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-sm);margin-bottom:var(--space-lg);">
    <div>
      <h1 style="display:flex;align-items:center;gap:var(--space-xs);flex-wrap:wrap;font-size:clamp(18px, 5vw, 24px);">
        <i class="fa-solid fa-address-book" style="color:var(--color-gold);"></i>
        Musicians Log
        <span id="ml-count-badge" style="background:var(--color-bg-tertiary);color:var(--color-text-muted);border-radius:var(--radius-full);padding:2px 10px;font-size:var(--text-sm);">0</span>
      </h1>
      <p class="text-muted" style="margin:0;font-size:var(--text-sm);">Track potential musicians from the field.</p>
    </div>
  </div>

  <!-- Offline Warning Banner -->
  <div id="ml-offline-banner" style="display:none;background:rgba(210,153,34,0.12);border:1px solid rgba(210,153,34,0.3);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-md);font-size:var(--text-sm);color:#d29922;">
    <i class="fa-solid fa-triangle-exclamation"></i> <strong>Encryption key unavailable.</strong> PII fields will be queued for encryption when the server is back online.
  </div>

  <!-- Status Filter Tabs -->
  <div id="ml-tabs" style="display:flex;gap:0;margin-bottom:var(--space-lg);border-bottom:2px solid var(--color-border);overflow-x:auto;-webkit-overflow-scrolling:touch;">
    <button class="ml-tab active" data-filter="all" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text);border-bottom:2px solid var(--color-gold);margin-bottom:-2px;white-space:nowrap;">
      All
    </button>
    <button class="ml-tab" data-filter="potential" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Potential
    </button>
    <button class="ml-tab" data-filter="contacted" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Contacted
    </button>
    <button class="ml-tab" data-filter="invite_sent" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Invite Sent
    </button>
    <button class="ml-tab" data-filter="onboarded" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Onboarded
    </button>
    <button class="ml-tab" data-filter="self_requested" style="padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);font-weight:600;border:none;background:none;cursor:pointer;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;">
      Self-Requested <span id="ml-self-requested-count" style="display:none;background:rgba(210,153,34,0.2);color:#d29922;border-radius:var(--radius-full);padding:1px 7px;font-size:11px;margin-left:4px;">0</span>
    </button>
  </div>

  <!-- Instrument Filter -->
  <div style="margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-sm);">
    <label style="font-size:var(--text-sm);color:var(--color-text-muted);white-space:nowrap;"><i class="fa-solid fa-guitar" style="margin-right:4px;"></i>Instrument</label>
    <select id="ml-instrument-filter"
      style="flex:1;max-width:240px;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px 12px;color:var(--color-text);font-size:14px;-webkit-appearance:none;appearance:none;">
      <option value="">All Instruments</option>
    </select>
  </div>

  <!-- Card Container -->
  <div id="ml-cards" style="display:grid;grid-template-columns:1fr;gap:var(--space-md);">
    <div style="text-align:center;padding:48px;color:var(--color-text-muted);">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading musicians...
    </div>
  </div>

  <!-- Floating Action Button — Add Contact -->
  <button id="ml-fab" style="position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--color-gold);color:#000;border:none;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:100;transition:transform 0.15s;">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Add/Edit Modal -->
  <div id="ml-modal" style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-xl);width:100%;max-width:460px;margin:var(--space-lg);max-height:90vh;overflow-y:auto;">
      <h2 id="ml-modal-title" style="margin:0 0 var(--space-lg);font-size:var(--text-lg);">Add Musician</h2>
      <div style="display:grid;gap:var(--space-md);">
        <div>
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Full Name *</label>
          <input id="ml-field-name" type="text" placeholder="First and Last Name"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;" />
        </div>
        <div>
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Email</label>
          <input id="ml-field-email" type="email" placeholder="musician@example.com"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;" />
        </div>
        <div>
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Phone</label>
          <input id="ml-field-phone" type="tel" placeholder="(555) 123-4567"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;" />
        </div>
        <div>
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Instrument *</label>
          <select id="ml-field-instrument"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;-webkit-appearance:none;">
            <option value="">Select instrument...</option>
            <option value="Vocals">Vocals</option>
            <option value="Guitar">Guitar</option>
            <option value="Bass">Bass</option>
            <option value="Drums">Drums</option>
            <option value="Keys">Keys</option>
            <option value="Saxophone">Saxophone</option>
            <option value="Trumpet">Trumpet</option>
            <option value="Trombone">Trombone</option>
            <option value="Violin">Violin</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div id="ml-field-status-group" style="display:none;">
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Status</label>
          <select id="ml-field-status"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;-webkit-appearance:none;">
            <option value="potential">Potential</option>
            <option value="contacted">Contacted</option>
            <option value="invite_sent">Invite Sent</option>
            <option value="onboarded">Onboarded</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-muted);margin-bottom:4px;">Notes</label>
          <textarea id="ml-field-notes" rows="3" placeholder="Where did you meet? What did they play?"
            style="width:100%;box-sizing:border-box;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--color-text);font-size:16px;resize:vertical;"></textarea>
          <p style="margin:4px 0 0;font-size:11px;color:#d29922;"><i class="fa-solid fa-shield-halved"></i> Do not include phone numbers or emails in notes</p>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-sm);justify-content:flex-end;margin-top:var(--space-lg);">
        <button id="ml-modal-cancel" style="background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 20px;cursor:pointer;color:var(--color-text-secondary);font-size:var(--text-sm);min-height:44px;">Cancel</button>
        <button id="ml-modal-save" style="background:var(--color-gold);color:#000;border:none;border-radius:var(--radius-md);padding:12px 20px;cursor:pointer;font-size:var(--text-sm);font-weight:var(--fw-semibold);min-height:44px;">Save</button>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  var fdb = null;
  var _musicians = [];
  var _filter = 'all';
  var _instrumentFilter = '';
  var _editId = null;
  var _encKey = null; // CryptoKey for AES-256-GCM
  var _pendingByEmail = {}; // lowercased email → { uid, displayName, registeredAt }
  var _pendingUnsub = null;

  var STATUS_LABELS = {
    potential: 'Potential',
    contacted: 'Contacted',
    invite_sent: 'Invite Sent',
    onboarded: 'Onboarded'
  };

  function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function initials(name) {
    if (!name) return '?';
    var p = String(name).trim().split(/\s+/);
    return (p.length >= 2 ? p[0][0] + p[p.length - 1][0] : (p[0][0] || '?')).toUpperCase();
  }

  // ═══ AES-256-GCM ENCRYPTION (Web Crypto API) ═══

  /**
   * Import a hex key string into a CryptoKey for AES-256-GCM.
   */
  async function importKey(hexKey) {
    var raw = new Uint8Array(hexKey.match(/.{1,2}/g).map(function(b) { return parseInt(b, 16); }));
    return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  /**
   * Encrypt a string. Returns "enc:v1:<iv_hex>:<authTag_hex>:<ciphertext_hex>"
   */
  async function encryptField(plaintext, key) {
    if (!plaintext || !key) return '';
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var encoded = new TextEncoder().encode(plaintext);
    var encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, encoded);
    // Last 16 bytes of the result are the auth tag
    var encBytes = new Uint8Array(encrypted);
    var ciphertext = encBytes.slice(0, encBytes.length - 16);
    var authTag = encBytes.slice(encBytes.length - 16);
    return 'enc:v1:' + toHex(iv) + ':' + toHex(authTag) + ':' + toHex(ciphertext);
  }

  /**
   * Decrypt a string in format "enc:v1:<iv_hex>:<authTag_hex>:<ciphertext_hex>"
   */
  async function decryptField(encStr, key) {
    if (!encStr || !key || encStr.indexOf('enc:v1:') !== 0) return encStr || '';
    try {
      var parts = encStr.split(':');
      if (parts.length < 5) return '[encrypted]';
      var iv = fromHex(parts[2]);
      var authTag = fromHex(parts[3]);
      var ciphertext = fromHex(parts[4]);
      // Reconstruct: ciphertext + authTag (Web Crypto expects them concatenated)
      var combined = new Uint8Array(ciphertext.length + authTag.length);
      combined.set(ciphertext, 0);
      combined.set(authTag, ciphertext.length);
      var decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, combined);
      return new TextDecoder().decode(decrypted);
    } catch (e) {
      console.warn('[Musicians Log] Decrypt failed:', e.message);
      return '[encrypted]';
    }
  }

  function toHex(arr) {
    return Array.from(arr).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function fromHex(hex) {
    return new Uint8Array(hex.match(/.{1,2}/g).map(function(b) { return parseInt(b, 16); }));
  }

  // ═══ ENCRYPTION KEY MANAGEMENT ═══

  async function fetchEncryptionKey() {
    // Strategy: server endpoint (if local) → Firestore config doc → sessionStorage cache
    try {
      var isLocal = typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard();

      // 1. Try server endpoint (HomeOffice only)
      if (isLocal) {
        try {
          var resp = await Utils.apiFetch('/api/v1/auth/encryption-key', { headers: { 'Content-Type': 'application/json' } });
          if (resp.ok) {
            var data = await resp.json();
            if (data.key) {
              _encKey = await importKey(data.key);
              sessionStorage.setItem('gbe-enc-key', data.key);
              return;
            }
          }
        } catch (e) { /* server unavailable or remote, fall through */ }
      }

      // 2. Try Firestore config doc (works from field — Firestore-first)
      if (fdb) {
        try {
          var configDoc = await fdb.collection('config').doc('encryption').get();
          if (configDoc.exists && configDoc.data().key) {
            _encKey = await importKey(configDoc.data().key);
            sessionStorage.setItem('gbe-enc-key', configDoc.data().key);
            return;
          }
        } catch (e) { /* Firestore config not available, fall through */ }
      }

      // 3. Try sessionStorage cache (offline fallback)
      var cached = sessionStorage.getItem('gbe-enc-key');
      if (cached) {
        _encKey = await importKey(cached);
        return;
      }

      // No key available — show offline banner
      document.getElementById('ml-offline-banner').style.display = 'block';
    } catch (e) {
      console.warn('[Musicians Log] Encryption key unavailable:', e.message);
      document.getElementById('ml-offline-banner').style.display = 'block';
    }
  }

  // ═══ FIRESTORE OPERATIONS ═══

  async function loadMusicians() {
    var container = document.getElementById('ml-cards');
    if (!fdb) {
      container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);"><i class="fa-solid fa-database" style="font-size:2rem;margin-bottom:12px;display:block;opacity:0.3;"></i>Firestore not available.</div>';
      return;
    }

    try {
      var snap = await fdb.collection('musicians-log').orderBy('created_at', 'desc').get();
      _musicians = [];
      var decryptPromises = [];

      snap.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        _musicians.push(d);
      });

      // Decrypt PII fields
      for (var i = 0; i < _musicians.length; i++) {
        var m = _musicians[i];
        if (_encKey) {
          m._fullName = await decryptField(m.full_name_enc, _encKey);
          m._email = await decryptField(m.email_enc, _encKey);
          m._phone = await decryptField(m.phone_enc, _encKey);
        } else {
          m._fullName = m.first_name || '[encrypted]';
          m._email = m.email_enc ? '[encrypted]' : '';
          m._phone = m.phone_enc ? '[encrypted]' : '';
        }
      }

      updateCountBadge();
      populateInstrumentFilter();
      renderCards();
    } catch (e) {
      console.error('[Musicians Log] Load failed:', e);
      container.innerHTML = '<div style="text-align:center;padding:48px;color:#f85149;"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load: ' + esc(e.message) + '</div>';
    }
  }

  function updateCountBadge() {
    var badge = document.getElementById('ml-count-badge');
    if (badge) badge.textContent = _musicians.length;
  }

  function populateInstrumentFilter() {
    var sel = document.getElementById('ml-instrument-filter');
    if (!sel) return;
    var instruments = {};
    _musicians.forEach(function(m) {
      var inst = (m.instrument || '').trim();
      if (inst) {
        var key = inst.toLowerCase();
        if (!instruments[key]) instruments[key] = { label: inst, count: 0 };
        instruments[key].count++;
      }
    });
    var sorted = Object.keys(instruments).sort(function(a, b) {
      return instruments[b].count - instruments[a].count;
    });
    var html = '<option value="">All Instruments</option>';
    sorted.forEach(function(key) {
      var i = instruments[key];
      html += '<option value="' + esc(i.label) + '">' + esc(i.label) + ' (' + i.count + ')</option>';
    });
    sel.innerHTML = html;
    sel.value = _instrumentFilter;
  }

  function getFiltered() {
    var list = _musicians;
    if (_filter !== 'all') {
      list = list.filter(function(m) { return m.status === _filter; });
    }
    if (_instrumentFilter) {
      list = list.filter(function(m) {
        return (m.instrument || '').toLowerCase() === _instrumentFilter.toLowerCase();
      });
    }
    return list;
  }

  function renderCards() {
    var container = document.getElementById('ml-cards');
    updateSelfRequestedCount();

    if (_filter === 'self_requested') {
      var pending = getUnmatchedPending();
      if (_instrumentFilter) {
        pending = pending.filter(function(p) {
          return (p.instrument || '').toLowerCase() === _instrumentFilter.toLowerCase();
        });
      }
      if (!pending.length) {
        container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);grid-column:1/-1;"><i class="fa-solid fa-user-clock" style="font-size:2.5rem;display:block;margin-bottom:var(--space-sm);opacity:0.2;"></i>No self-requested band members awaiting approval.</div>';
        return;
      }
      var phtml = '';
      pending.forEach(function(p) {
        var pts = p.registeredAt && p.registeredAt.toDate ? p.registeredAt.toDate() : null;
        var pdate = pts ? pts.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
        var rawInst = (p.instrument || '').trim();

  // ═══ PENDING ACCESS REQUESTS ═══

  function subscribePendingRequests() {
    if (!fdb) return;
    if (_pendingUnsub) { try { _pendingUnsub(); } catch (e) {} _pendingUnsub = null; }

    _pendingUnsub = fdb.collection('users')
      .where('status', '==', 'pending')
      .where('requestedRole', '==', 'band_member')
      .onSnapshot(function(snap) {
        _pendingByEmail = {};
        snap.forEach(function(doc) {
          var d = doc.data();
          if (d.email) {
            _pendingByEmail[d.email.toLowerCase().trim()] = {
              uid: doc.id,
              email: d.email,
              displayName: d.displayName || d.email,
              instrument: d.instrument || '',
              requestNote: d.requestNote || '',
              registeredAt: d.registeredAt
            };
          }
        });
        renderCards();
      }, function(err) {
        console.warn('[Musicians Log] Pending request listener error:', err.message);
      });
  }

  function getMusicianEmails() {
    var set = {};
    _musicians.forEach(function(m) {
      var e = (m._email && m._email !== '[encrypted]') ? m._email.toLowerCase().trim() : '';
      if (e) set[e] = true;
    });
    return set;
  }

  function getUnmatchedPending() {
    var matched = getMusicianEmails();
    var out = [];
    Object.keys(_pendingByEmail).forEach(function(em) {
      if (!matched[em]) out.push(_pendingByEmail[em]);
    });
    return out;
  }

  function updateSelfRequestedCount() {
    var n = getUnmatchedPending().length;
    var badge = document.getElementById('ml-self-requested-count');
    if (badge) {
      badge.textContent = n;
      badge.style.display = n > 0 ? 'inline-block' : 'none';
    }
  }

  window._mlApproveRequest = function(uid, logId) {
    if (!fdb) return;
    var logEntry = _musicians.find(function(x) { return x.id === logId; });
    var name = (logEntry && logEntry._fullName) || (logEntry && logEntry.first_name) || 'this musician';
    var msg = 'Approve <strong>' + esc(name) + '</strong> as a band member? They will be added to On Call (inactive) and receive a welcome email. Their log entry will be marked Onboarded.';

    var doApprove = async function() {
      try {
        await fdb.collection('users').doc(uid).update({
          status: 'approved',
          role: 'band_member',
          roster_tier: 'on_call',
          activity: 'inactive',
          needsWelcomeEmail: true,
          approvedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        if (logEntry && logEntry.status !== 'onboarded') {
          await fdb.collection('musicians-log').doc(logId).update({
            status: 'onboarded',
            onboarded_at: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        if (typeof Toast !== 'undefined') Toast.success(name + ' approved — welcome email queued.');
        await loadMusicians();
      } catch (e) {
        console.error('[Musicians Log] Approve failed:', e);
        if (typeof Toast !== 'undefined') Toast.error('Approve failed: ' + e.message);
      }
    };

    if (typeof Modal !== 'undefined' && Modal.confirm) {
      Modal.confirm(msg, doApprove);
    } else {
      doApprove();
    }
  };

  function _findPendingByUid(uid) {
    var found = null;
    Object.keys(_pendingByEmail).forEach(function(em) {
      if (_pendingByEmail[em].uid === uid) found = _pendingByEmail[em];
    });
    return found;
  }

  async function _mlConfirmBandPageSend(id, displayName, emailLower, m) {
    Modal.close();
    try {
      // Hash email if available; server will resolve from musiciansLogId if not
      var emailHash = null;
      if (emailLower) {
        var hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(emailLower));
        var hashArray = Array.from(new Uint8Array(hashBuf));
        emailHash = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
      }

      await fdb.collection('pending-invitations').add({
        musicianName: displayName,
        musicianEmail: emailLower || null,
        emailHash: emailHash,
        instrument: m.instrument || null,
        role: 'band_member',
        message: null,
        status: 'queued',
        musiciansLogId: id,
        createdBy: (typeof Auth !== 'undefined' && Auth._user) ? Auth._user.uid : 'unknown',
        createdByName: (typeof Auth !== 'undefined' && Auth._user) ? (Auth._user.displayName || Auth._user.email) : 'Band Manager',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await fdb.collection('musicians-log').doc(id).update({
        status: 'invite_sent',
        updated_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      m.status = 'invite_sent';
      renderCards();

      if (typeof Toast !== 'undefined') Toast.success('Band Page invitation sent to ' + displayName);
    } catch (e) {
      if (typeof Toast !== 'undefined') Toast.error('Failed to send invite: ' + e.message);
    }
  }

              '</div>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:var(--space-xs);max-height:300px;overflow-y:auto;">';

        snap.forEach(function(doc) {
          var s = doc.data();
          var sDate = s.date && s.date.toDate ? s.date.toDate() : (s.date ? new Date(s.date) : null);
          var dateStr = sDate ? sDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '—';
          var timeStr = s.time || '';
          var icon = typeIcons[s.session_type] || 'fa-calendar';
          var color = typeColors[s.session_type] || '#8b949e';
          var typeLabel = (s.session_type || 'session').charAt(0).toUpperCase() + (s.session_type || 'session').slice(1);

          sessionsHtml +=
            '<button class="inv-session-pick" data-session-id="' + doc.id + '" style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg);border:1px solid var(--color-border);cursor:pointer;text-align:left;color:var(--color-text);width:100%;transition:border-color 150ms;">' +
              '<div style="width:36px;height:36px;border-radius:var(--radius-sm);background:rgba(' + _hexRGB(color) + ',0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
                '<i class="fa-solid ' + icon + '" style="color:' + color + ';font-size:14px;"></i>' +
              '</div>' +
              '<div style="flex:1;min-width:0;">' +
                '<div style="font-weight:600;font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(s.title || typeLabel) + '</div>' +
                '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">' + dateStr + (timeStr ? ' · ' + esc(timeStr) : '') + (s.location ? ' · ' + esc(s.location) : '') + '</div>' +
              '</div>' +
              '<span style="font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:rgba(' + _hexRGB(color) + ',0.12);color:' + color + ';font-weight:600;white-space:nowrap;">' + esc(typeLabel) + '</span>' +
            '</button>';
        });

        sessionsHtml += '</div></div>';

        Modal.open({
          title: 'Pick a Session',
          content: sessionsHtml,
          size: 'md',
          cancelText: 'Back',
          showFooter: true,
          saveText: '',
          onCancel: function() { Modal.close(); window._mlSendInvite(id); }
        });

        // Wire up session pick buttons
        setTimeout(function() {
          document.querySelectorAll('.inv-session-pick').forEach(function(btn) {
            btn.addEventListener('click', function() {
              var sessionId = btn.dataset.sessionId;
              var sessionDoc = null;
              snap.forEach(function(d) { if (d.id === sessionId) sessionDoc = d; });
              if (sessionDoc) {
                Modal.close();
                _mlShowSessionPreview(id, m, displayName, emailLower, instrumentLabel, sessionDoc);
              }
            });
          });
        }, 100);
      })
      .catch(function(err) {
        Modal.open({
          title: 'Error',
          content: '<p style="color:var(--color-text-muted);">Could not load sessions: ' + esc(err.message) + '</p>',
          size: 'sm',
          saveText: 'OK',
          onSave: function() { Modal.close(); }
        });
      });
  }

  function _hexRGB(hex) {
    hex = hex.replace('#', '');
    return parseInt(hex.substring(0,2),16) + ',' + parseInt(hex.substring(2,4),16) + ',' + parseInt(hex.substring(4,6),16);
  }

  function _mlShowSessionPreview(id, m, displayName, emailLower, instrumentLabel, sessionDoc) {
    var s = sessionDoc.data();
    var sDate = s.date && s.date.toDate ? s.date.toDate() : (s.date ? new Date(s.date) : null);
    var dateStr = sDate ? sDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '—';
    var timeStr = s.time || '';
    var typeLabel = (s.session_type || 'session').charAt(0).toUpperCase() + (s.session_type || 'session').slice(1);
    var location = s.location || '[Location TBD]';

    var previewHtml =
      '<div style="margin-bottom:var(--space-lg);">' +
        '<div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md);">' +
          '<div style="width:40px;height:40px;border-radius:50%;background:rgba(88,166,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
            '<i class="fa-solid fa-calendar-check" style="color:#58a6ff;font-size:16px;"></i>' +
          '</div>' +
          '<div>' +
            '<div style="font-weight:600;color:var(--color-text);">' + esc(displayName) + '</div>' +
            '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">' + esc(emailDisplay) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-md);font-size:var(--text-sm);">' +
          '<div style="color:var(--color-text-muted);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:var(--space-sm);">Email Preview</div>' +
          '<div style="margin-bottom:var(--space-xs);"><strong style="color:var(--color-text-muted);">To:</strong> <span style="color:var(--color-text);">' + esc(emailDisplay) + '</span></div>' +
          '<div style="margin-bottom:var(--space-sm);"><strong style="color:var(--color-text-muted);">Subject:</strong> <span style="color:var(--color-text);">L.A. Young Soul Society — ' + esc(typeLabel) + ': ' + esc(s.title || typeLabel) + '</span></div>' +
          '<div style="border-top:1px solid var(--color-border);padding-top:var(--space-sm);color:var(--color-text-secondary);line-height:1.6;">' +
            'Hi ' + esc(displayName) + ',<br><br>' +
            'You\'re invited to an upcoming ' + esc(typeLabel.toLowerCase()) + ' with L.A. Young Soul Society.<br><br>' +
            '<strong>' + esc(s.title || typeLabel) + '</strong><br>' +
            '<i class="fa-solid fa-calendar" style="color:var(--color-text-muted);"></i> ' + esc(dateStr) + (timeStr ? ' at ' + esc(timeStr) : '') + '<br>' +
            '<i class="fa-solid fa-location-dot" style="color:var(--color-text-muted);"></i> ' + esc(location) + '<br><br>' +
            'Please reply to confirm your availability.<br><br>' +
            'Best,<br>Jeffery Ponder<br>Gold Bottom Ent. LLC' +
          '</div>' +
        '</div>' +
      '</div>';

    Modal.open({
      title: 'Confirm Session Invitation',
      content: previewHtml,
      size: 'md',
      saveText: 'Send Invitation',
      cancelText: 'Back',
      onSave: function() { _mlConfirmSessionSend(id, m, displayName, emailLower, sessionDoc); },
      onCancel: function() { Modal.close(); _mlShowSessionPicker(id, m, displayName, emailLower, instrumentLabel); }
    });
  }

  async function _mlConfirmSessionSend(id, m, displayName, emailLower, sessionDoc) {
    Modal.close();
    var s = sessionDoc.data();
    var sDate = s.date && s.date.toDate ? s.date.toDate() : (s.date ? new Date(s.date) : null);
    var dateStr = sDate ? sDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';
    var typeLabel = (s.session_type || 'session').charAt(0).toUpperCase() + (s.session_type || 'session').slice(1);

    var subject = 'L.A. Young Soul Society — ' + typeLabel + ': ' + (s.title || typeLabel);
    var bodyText = 'Hi ' + displayName + ',\n\n' +
      'You\'re invited to an upcoming ' + typeLabel.toLowerCase() + ' with L.A. Young Soul Society.\n\n' +
      (s.title || typeLabel) + '\n' +
      'Date: ' + dateStr + (s.time ? ' at ' + s.time : '') + '\n' +
      'Location: ' + (s.location || '[Location TBD]') + '\n\n' +
      'Please reply to confirm your availability.\n\n' +
      'Best,\nJeffery Ponder\nGold Bottom Ent. LLC';

    try {
      // Queue email via Firestore for server SMTP relay
      await fdb.collection('email-queue').add({
        to: emailLower,
        subject: subject,
        text: bodyText,
        account: 'band_manager',
        status: 'pending',
        session_id: sessionDoc.id,
        musician_log_id: id,
        queued_by: (typeof Auth !== 'undefined' && Auth._user) ? (Auth._user.displayName || Auth._user.email || 'unknown') : 'unknown',
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      });

      // Update musicians-log status
      await fdb.collection('musicians-log').doc(id).update({
        status: 'invite_sent',
        last_session_invite: sessionDoc.id,
        updated_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      m.status = 'invite_sent';
      renderCards();

      if (typeof Toast !== 'undefined') Toast.success(typeLabel + ' invitation sent to ' + displayName);
    } catch (e) {
      if (typeof Toast !== 'undefined') Toast.error('Failed to send invite: ' + e.message);
    }
  }

  // ═══ ADD / SAVE ═══

  async function saveMusician() {
    var fullName = document.getElementById('ml-field-name').value.trim();
    var email = document.getElementById('ml-field-email').value.trim();
    var phone = document.getElementById('ml-field-phone').value.trim();
    var instrument = document.getElementById('ml-field-instrument').value;
    var notes = document.getElementById('ml-field-notes').value.trim();
    var status = _editId ? document.getElementById('ml-field-status').value : 'potential';

    if (!fullName) { alert('Full Name is required.'); return; }
    if (!instrument) { alert('Instrument is required.'); return; }

    // Extract first name for plain text field
    var firstName = fullName.split(/\s+/)[0];

    // Encrypt PII fields
    var fullNameEnc = '';
    var emailEnc = '';
    var phoneEnc = '';

    if (_encKey) {
      fullNameEnc = await encryptField(fullName, _encKey);
      if (email) emailEnc = await encryptField(email, _encKey);
      if (phone) phoneEnc = await encryptField(phone, _encKey);
    } else {
      // Queue — store raw in sessionStorage temporarily, mark for later encryption
      fullNameEnc = 'pending:' + fullName;
      if (email) emailEnc = 'pending:' + email;
      if (phone) phoneEnc = 'pending:' + phone;
    }

    // Get current user for created_by
    var currentUser = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : null;
    var createdBy = currentUser ? (currentUser.displayName || currentUser.email || currentUser.uid) : 'unknown';

    var docData = {
      first_name: firstName,
      instrument: instrument,
      status: status,
      notes: notes,
      full_name_enc: fullNameEnc,
      email_enc: emailEnc,
      phone_enc: phoneEnc,
      updated_at: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      if (_editId) {
        await fdb.collection('musicians-log').doc(_editId).update(docData);
        if (typeof Toast !== 'undefined') Toast.success('Musician updated.');
      } else {
        docData.created_at = firebase.firestore.FieldValue.serverTimestamp();
        docData.created_by = createdBy;
        await fdb.collection('musicians-log').add(docData);
        if (typeof Toast !== 'undefined') Toast.success('Musician added.');
      }

      closeModal();
      await loadMusicians();
    } catch (e) {
      console.error('[Musicians Log] Save failed:', e);
      if (typeof Toast !== 'undefined') Toast.error('Save failed: ' + e.message);
    }
  }

  function closeModal() {
    document.getElementById('ml-modal').style.display = 'none';
    _editId = null;
    document.getElementById('ml-field-name').value = '';
    document.getElementById('ml-field-email').value = '';
    document.getElementById('ml-field-phone').value = '';
    document.getElementById('ml-field-instrument').value = '';
    document.getElementById('ml-field-notes').value = '';
    document.getElementById('ml-field-status').value = 'potential';
    document.getElementById('ml-field-status-group').style.display = 'none';
  }

  // ═══ TAB SWITCHING ═══

  var tabs = document.querySelectorAll('.ml-tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.classList.remove('active');
        t.style.color = 'var(--color-text-muted)';
        t.style.borderBottomColor = 'transparent';
      });
      this.classList.add('active');
      this.style.color = 'var(--color-text)';
      this.style.borderBottomColor = 'var(--color-gold)';
      _filter = this.getAttribute('data-filter');
      renderCards();
    });
  });

  // ═══ INSTRUMENT FILTER ═══

  document.getElementById('ml-instrument-filter').addEventListener('change', function() {
    _instrumentFilter = this.value;
    renderCards();
  });

  // ═══ MODAL EVENTS ═══

  document.getElementById('ml-fab').addEventListener('click', function() {
    _editId = null;
    document.getElementById('ml-modal-title').textContent = 'Add Musician';
    document.getElementById('ml-field-status-group').style.display = 'none';
    document.getElementById('ml-modal').style.display = 'flex';
    document.getElementById('ml-field-name').focus();
  });

  document.getElementById('ml-modal-cancel').addEventListener('click', closeModal);

  document.getElementById('ml-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('ml-modal-save').addEventListener('click', saveMusician);

  // ═══ INIT ═══

  async function init() {
    if (typeof Auth === 'undefined' || !Auth._db) {
      document.getElementById('ml-cards').innerHTML = '<div style="text-align:center;padding:48px;color:var(--color-text-muted);">Firestore not available.</div>';
      return;
    }
    fdb = Auth._db;

    await fetchEncryptionKey();
    await loadMusicians();
    subscribePendingRequests();
  }

  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { init(); });
  } else {
    init();
  }
})();
</script>
