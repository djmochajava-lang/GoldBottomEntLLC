<!-- dashboard/inbox.html — Contact Queue Inbox (CONV-EMAIL-001) -->
<div class="dashboard-page" id="dash-inbox">
  <div class="dashboard-page-header">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-sm);">
      <div><h1>Contact Queue</h1><p class="text-muted">Incoming leads from web forms and email — triage, assign, and resolve.</p></div>
      <button class="btn btn-primary" id="inbox-pull-btn"><i class="fa-solid fa-rotate"></i> Pull Now</button>
    </div>
  </div>

  <!-- Stats Bar -->
  <div id="inbox-stats-bar" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-md);margin-bottom:var(--space-lg);"></div>

  <!-- Filter Tabs -->
  <div id="inbox-filters" style="display:flex;gap:var(--space-xs);margin-bottom:var(--space-md);flex-wrap:wrap;">
    <button class="filter-btn active" data-filter="all" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">All</button>
    <button class="filter-btn" data-filter="new" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">New</button>
    <button class="filter-btn" data-filter="triaged" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Triaged</button>
    <button class="filter-btn" data-filter="in_progress" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">In Progress</button>
    <button class="filter-btn" data-filter="awaiting_reply" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Awaiting Reply</button>
    <button class="filter-btn" data-filter="resolved" style="padding:var(--space-xs) var(--space-md);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--fw-medium);border:1px solid var(--color-border);cursor:pointer;transition:all 150ms ease;">Resolved</button>
  </div>

  <!-- Secondary Filters -->
  <div style="display:flex;gap:var(--space-sm);margin-bottom:var(--space-md);flex-wrap:wrap;align-items:center;">
    <select id="inbox-owner-filter" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-size:var(--text-sm);">
      <option value="">All Owners</option>
      <option value="entertainment">Entertainment</option>
      <option value="enterprise">Enterprise</option>
      <option value="admin">Admin</option>
    </select>
    <select id="inbox-priority-filter" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-size:var(--text-sm);">
      <option value="">All Priorities</option>
      <option value="P1">P1 - Urgent</option>
      <option value="P2">P2 - High</option>
      <option value="P3">P3 - Normal</option>
      <option value="P4">P4 - Low</option>
      <option value="P5">P5 - Minimal</option>
    </select>
    <select id="inbox-source-filter" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-size:var(--text-sm);">
      <option value="">All Sources</option>
      <option value="la-young">LA Young</option>
      <option value="la-young-epk">LA Young EPK</option>
      <option value="gbe-public">GBE Public</option>
      <option value="direct-email">Direct Email</option>
    </select>
    <input type="text" id="inbox-search" placeholder="Search email, name, subject..." style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg-secondary);color:var(--color-text);font-size:var(--text-sm);min-width:200px;">
  </div>

  <!-- Data Table -->
  <div class="card" id="inbox-table-container" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);overflow-x:auto;"></div>

  <!-- Pagination -->
  <div id="inbox-pagination" style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-md);"></div>
</div>

<!-- Detail Modal -->
<div id="inbox-modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:flex-start;padding-top:5vh;overflow-y:auto;">
  <div id="inbox-modal" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);max-width:700px;width:95%;padding:var(--space-xl);position:relative;margin-bottom:5vh;">
    <button id="inbox-modal-close" style="position:absolute;top:var(--space-sm);right:var(--space-sm);background:none;border:none;color:var(--color-text-muted);font-size:1.5rem;cursor:pointer;padding:var(--space-xs);">&times;</button>
    <div id="inbox-modal-content"></div>
  </div>
</div>

<script>
(function(){
  // Only run on private server (local dashboard)
  var isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());
  if (!isLocal) {
    document.getElementById('inbox-table-container').innerHTML =
      '<p class="text-muted" style="text-align:center;padding:var(--space-xl);">' +
      '<i class="fa-solid fa-lock"></i> Contact queue is only available on the private server dashboard.</p>';
    return;
  }

  /* ---- Badge/Pill Styles ---- */
  var priorityPill = {
    P1: { label: 'P1', bg: 'rgba(248,81,73,0.15)', color: '#f85149' },
    P2: { label: 'P2', bg: 'rgba(210,153,34,0.15)', color: '#d29922' },
    P3: { label: 'P3', bg: 'rgba(88,166,255,0.15)', color: '#58a6ff' },
    P4: { label: 'P4', bg: 'rgba(139,148,158,0.15)', color: '#8b949e' },
    P5: { label: 'P5', bg: 'rgba(139,148,158,0.1)', color: '#6e7681' }
  };

  var statusPill = {
    'new':            { label: 'New',             bg: 'rgba(88,166,255,0.15)',  color: '#58a6ff' },
    'triaged':        { label: 'Triaged',         bg: 'rgba(188,140,255,0.15)', color: '#bc8cff' },
    'in_progress':    { label: 'In Progress',     bg: 'rgba(210,153,34,0.15)',  color: '#d29922' },
    'awaiting_reply': { label: 'Awaiting Reply',  bg: 'rgba(210,153,34,0.15)',  color: '#e3b341' },
    'resolved':       { label: 'Resolved',        bg: 'rgba(63,185,80,0.15)',   color: '#3fb950' },
    'archived':       { label: 'Archived',        bg: 'rgba(139,148,158,0.1)',  color: '#6e7681' }
  };

  var sourcePill = {
    'la-young':     { label: 'LA Young',     bg: 'rgba(184,134,11,0.12)', color: '#d4a017' },
    'la-young-epk': { label: 'EPK',          bg: 'rgba(184,134,11,0.2)',  color: '#d4a017' },
    'gbe-public':   { label: 'GBE',          bg: 'rgba(88,166,255,0.15)', color: '#58a6ff' },
    'direct-email': { label: 'Email',        bg: 'rgba(63,185,80,0.15)',  color: '#3fb950' }
  };

  var ownerPill = {
    'entertainment': { label: 'Ent.',       bg: 'rgba(184,134,11,0.12)', color: '#d4a017' },
    'enterprise':    { label: 'Enterprise', bg: 'rgba(88,166,255,0.15)', color: '#58a6ff' },
    'admin':         { label: 'Admin',      bg: 'rgba(139,148,158,0.15)', color: '#8b949e' }
  };

  function pill(map, key) {
    var p = map[key] || { label: key || '-', bg: 'rgba(139,148,158,0.1)', color: '#8b949e' };
    return '<span style="display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:0.75rem;font-weight:600;background:' +
      p.bg + ';color:' + p.color + ';">' + p.label + '</span>';
  }

  /* ---- State ---- */
  var currentFilter = 'all';
  var currentPage = 0;
  var pageSize = 25;
  var searchTimeout = null;

  /* ---- API Helper ---- */
  function apiUrl() {
    return window.location.origin + '/api/v1';
  }

  function apiHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (typeof Auth !== 'undefined' && Auth._apiKey) h['Authorization'] = 'Bearer ' + Auth._apiKey;
    return h;
  }

  async function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = apiHeaders();
    var resp = await fetch(apiUrl() + path, opts);
    if (!resp.ok) throw new Error('API error: ' + resp.status);
    return resp.json();
  }

  /* ---- Stats Bar ---- */
  async function loadStats() {
    try {
      var stats = await apiFetch('/queue/stats');
      var bar = document.getElementById('inbox-stats-bar');
      bar.innerHTML =
        statCard('Total', stats.total, '#8b949e') +
        statCard('New', stats.byStatus.new || 0, '#58a6ff') +
        statCard('In Progress', (stats.byStatus.in_progress || 0) + (stats.byStatus.awaiting_reply || 0), '#d29922') +
        statCard('Resolved', stats.byStatus.resolved || 0, '#3fb950') +
        statCard('Last 24h', stats.recent24h || 0, '#bc8cff');
    } catch (e) {
      console.error('[Inbox] Stats load error:', e);
    }
  }

  function statCard(label, value, color) {
    return '<div style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-md);text-align:center;">' +
      '<div style="font-size:1.5rem;font-weight:700;color:' + color + ';">' + value + '</div>' +
      '<div style="font-size:var(--text-sm);color:var(--color-text-muted);margin-top:4px;">' + label + '</div>' +
      '</div>';
  }

  /* ---- Table ---- */
  async function loadRecords() {
    try {
      var params = [];
      if (currentFilter !== 'all') params.push('status=' + currentFilter);

      var ownerVal = document.getElementById('inbox-owner-filter').value;
      if (ownerVal) params.push('owner=' + ownerVal);

      var prioVal = document.getElementById('inbox-priority-filter').value;
      if (prioVal) params.push('priority=' + prioVal);

      var srcVal = document.getElementById('inbox-source-filter').value;
      if (srcVal) params.push('source=' + srcVal);

      var searchVal = document.getElementById('inbox-search').value.trim();
      if (searchVal) params.push('search=' + encodeURIComponent(searchVal));

      params.push('limit=' + pageSize);
      params.push('offset=' + (currentPage * pageSize));
      params.push('sort=ingested_at&order=desc');

      var data = await apiFetch('/queue?' + params.join('&'));
      renderTable(data.records, data.total);
    } catch (e) {
      console.error('[Inbox] Load error:', e);
      document.getElementById('inbox-table-container').innerHTML =
        '<p style="text-align:center;color:var(--color-text-muted);padding:var(--space-xl);">Failed to load queue records. Is the server running?</p>';
    }
  }

  function renderTable(records, total) {
    if (!records || records.length === 0) {
      document.getElementById('inbox-table-container').innerHTML =
        '<p style="text-align:center;color:var(--color-text-muted);padding:var(--space-xl);">' +
        '<i class="fa-solid fa-inbox"></i> No records found.</p>';
      document.getElementById('inbox-pagination').innerHTML = '';
      return;
    }

    var html = '<table style="width:100%;border-collapse:collapse;font-size:var(--text-sm);">';
    html += '<thead><tr style="border-bottom:1px solid var(--color-border);text-align:left;">';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Priority</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Status</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Source</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">From</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Subject / Type</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Owner</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);">Received</th>';
    html += '<th style="padding:var(--space-xs) var(--space-sm);"></th>';
    html += '</tr></thead><tbody>';

    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      var fromDisplay = r.name ? (r.name + ' &lt;' + r.email + '&gt;') : r.email;
      var subjectDisplay = r.subject || r.form_type;
      var timeAgo = formatTimeAgo(r.submitted_at || r.ingested_at);

      html += '<tr style="border-bottom:1px solid var(--color-border);cursor:pointer;" data-id="' + r.id + '" class="inbox-row">';
      html += '<td style="padding:var(--space-xs) var(--space-sm);">' + pill(priorityPill, r.priority) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);">' + pill(statusPill, r.status) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);">' + pill(sourcePill, r.source) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(fromDisplay) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(subjectDisplay) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);">' + pill(ownerPill, r.owner) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);color:var(--color-text-muted);white-space:nowrap;">' + escHtml(timeAgo) + '</td>';
      html += '<td style="padding:var(--space-xs) var(--space-sm);"><button class="btn-view" data-id="' + r.id + '" style="background:none;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:2px 8px;cursor:pointer;color:var(--color-text-muted);font-size:var(--text-sm);">View</button></td>';
      html += '</tr>';
    }

    html += '</tbody></table>';
    document.getElementById('inbox-table-container').innerHTML = html;

    // Pagination
    var totalPages = Math.ceil(total / pageSize);
    var pagHtml = '<span style="color:var(--color-text-muted);font-size:var(--text-sm);">Showing ' +
      (currentPage * pageSize + 1) + '-' + Math.min((currentPage + 1) * pageSize, total) + ' of ' + total + '</span>';
    pagHtml += '<div style="display:flex;gap:var(--space-xs);">';
    if (currentPage > 0) pagHtml += '<button class="btn-page" data-page="' + (currentPage - 1) + '" style="padding:var(--space-xs) var(--space-sm);border:1px solid var(--color-border);border-radius:var(--radius-sm);cursor:pointer;background:var(--color-bg-secondary);color:var(--color-text);">Prev</button>';
    if (currentPage < totalPages - 1) pagHtml += '<button class="btn-page" data-page="' + (currentPage + 1) + '" style="padding:var(--space-xs) var(--space-sm);border:1px solid var(--color-border);border-radius:var(--radius-sm);cursor:pointer;background:var(--color-bg-secondary);color:var(--color-text);">Next</button>';
    pagHtml += '</div>';
    document.getElementById('inbox-pagination').innerHTML = pagHtml;

    // Row click handlers
    document.querySelectorAll('.inbox-row').forEach(function(row) {
      row.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-view')) return;
        openDetail(row.dataset.id);
      });
    });
    document.querySelectorAll('.btn-view').forEach(function(btn) {
      btn.addEventListener('click', function() { openDetail(btn.dataset.id); });
    });
    document.querySelectorAll('.btn-page').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentPage = parseInt(btn.dataset.page);
        loadRecords();
      });
    });
  }

  /* ---- Detail Modal ---- */
  async function openDetail(id) {
    try {
      var r = await apiFetch('/queue/' + id);
      var mc = document.getElementById('inbox-modal-content');

      var html = '<h2 style="margin-top:0;">' + escHtml(r.subject || r.form_type) + '</h2>';
      html += '<div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;margin-bottom:var(--space-md);">';
      html += pill(priorityPill, r.priority) + ' ' + pill(statusPill, r.status) + ' ' + pill(sourcePill, r.source) + ' ' + pill(ownerPill, r.owner);
      html += '</div>';

      // Info grid
      html += '<div style="display:grid;grid-template-columns:120px 1fr;gap:var(--space-xs) var(--space-sm);margin-bottom:var(--space-md);font-size:var(--text-sm);">';
      html += infoRow('From', r.name ? (r.name + ' <' + r.email + '>') : r.email);
      if (r.phone) html += infoRow('Phone', r.phone);
      if (r.company) html += infoRow('Company', r.company);
      if (r.inquiry_type) html += infoRow('Inquiry Type', r.inquiry_type);
      if (r.event_date) html += infoRow('Event Date', r.event_date);
      if (r.budget) html += infoRow('Budget', r.budget);
      if (r.timeline) html += infoRow('Timeline', r.timeline);
      html += infoRow('Received', new Date(r.submitted_at).toLocaleString());
      html += infoRow('Ingested', new Date(r.ingested_at).toLocaleString());
      if (r.triaged_at) html += infoRow('Triaged', new Date(r.triaged_at).toLocaleString());
      if (r.resolved_at) html += infoRow('Resolved', new Date(r.resolved_at).toLocaleString());
      html += '</div>';

      // Message
      if (r.message) {
        html += '<div style="margin-bottom:var(--space-md);">';
        html += '<strong style="font-size:var(--text-sm);">Message:</strong>';
        html += '<div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-sm);margin-top:var(--space-xs);white-space:pre-wrap;font-size:var(--text-sm);max-height:300px;overflow-y:auto;">' + escHtml(r.message) + '</div>';
        html += '</div>';
      }

      // Actions
      html += '<div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;padding-top:var(--space-md);border-top:1px solid var(--color-border);">';
      html += '<select id="modal-status" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);font-size:var(--text-sm);">';
      ['new', 'triaged', 'in_progress', 'awaiting_reply', 'resolved', 'archived'].forEach(function(s) {
        html += '<option value="' + s + '"' + (r.status === s ? ' selected' : '') + '>' + (statusPill[s] ? statusPill[s].label : s) + '</option>';
      });
      html += '</select>';

      html += '<select id="modal-owner" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);font-size:var(--text-sm);">';
      ['entertainment', 'enterprise', 'admin'].forEach(function(o) {
        html += '<option value="' + o + '"' + (r.owner === o ? ' selected' : '') + '>' + (ownerPill[o] ? ownerPill[o].label : o) + '</option>';
      });
      html += '</select>';

      html += '<select id="modal-priority" style="padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);font-size:var(--text-sm);">';
      ['P1', 'P2', 'P3', 'P4', 'P5'].forEach(function(p) {
        html += '<option value="' + p + '"' + (r.priority === p ? ' selected' : '') + '>' + p + '</option>';
      });
      html += '</select>';

      html += '<button id="modal-save" data-id="' + r.id + '" class="btn btn-primary" style="margin-left:auto;">Save Changes</button>';
      html += '</div>';

      mc.innerHTML = html;

      // Show modal
      var overlay = document.getElementById('inbox-modal-overlay');
      overlay.style.display = 'flex';

      // Save handler
      document.getElementById('modal-save').addEventListener('click', async function() {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          await apiFetch('/queue/' + btn.dataset.id, {
            method: 'PUT',
            body: JSON.stringify({
              status: document.getElementById('modal-status').value,
              owner: document.getElementById('modal-owner').value,
              priority: document.getElementById('modal-priority').value
            })
          });
          closeModal();
          loadRecords();
          loadStats();
        } catch (e) {
          alert('Failed to save: ' + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Save Changes';
        }
      });
    } catch (e) {
      console.error('[Inbox] Detail load error:', e);
    }
  }

  function infoRow(label, value) {
    return '<div style="color:var(--color-text-muted);font-weight:600;">' + label + '</div>' +
           '<div>' + escHtml(value || '-') + '</div>';
  }

  function closeModal() {
    document.getElementById('inbox-modal-overlay').style.display = 'none';
  }

  /* ---- Utilities ---- */
  function escHtml(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatTimeAgo(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    var now = new Date();
    var diff = Math.floor((now - d) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString();
  }

  /* ---- Event Listeners ---- */

  // Filter tabs
  document.getElementById('inbox-filters').addEventListener('click', function(e) {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('#inbox-filters .filter-btn').forEach(function(b) { b.classList.remove('active'); });
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    currentPage = 0;
    loadRecords();
  });

  // Secondary filters
  ['inbox-owner-filter', 'inbox-priority-filter', 'inbox-source-filter'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
      currentPage = 0;
      loadRecords();
    });
  });

  // Search (debounced)
  document.getElementById('inbox-search').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      currentPage = 0;
      loadRecords();
    }, 300);
  });

  // Pull Now button
  document.getElementById('inbox-pull-btn').addEventListener('click', async function() {
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Pulling...';
    try {
      var result = await apiFetch('/queue/pull', { method: 'POST' });
      var s = result.summary;
      var msg = 'Pulled: Firestore=' + (s.firestorePulled || 0) + ', IMAP=' + (s.imapPulled || 0) + ', Processed=' + (s.processed || 0);
      console.log('[Inbox]', msg);
      loadStats();
      loadRecords();
    } catch (e) {
      console.error('[Inbox] Pull error:', e);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Pull Now';
    }
  });

  // Modal close
  document.getElementById('inbox-modal-close').addEventListener('click', closeModal);
  document.getElementById('inbox-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  /* ---- Initial Load ---- */
  loadStats();
  loadRecords();

  // Auto-refresh every 60 seconds
  setInterval(function() {
    loadStats();
    loadRecords();
  }, 60000);
})();
</script>
