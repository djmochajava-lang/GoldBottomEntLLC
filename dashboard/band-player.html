<!-- ============================================================
     dashboard/band-player.html — Soul Society Music Player
     Spotify-style artist page layout matching LA Young player.
     Firebase-backed: Firestore metadata, Storage audio/charts.
     ============================================================ -->

<div class="dashboard-page" id="dash-band-player" style="padding:0;max-width:900px;margin:0 auto;">

  <!-- ── Hero Header (like Spotify artist page) ───────── -->
  <div id="bp-hero" style="padding:40px 24px 20px;background:linear-gradient(180deg,rgba(212,160,23,0.15) 0%,rgba(0,0,0,0) 100%);">
    <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.5);margin-bottom:6px;">
      <i class="fa-solid fa-headphones" style="margin-right:4px;"></i> GBE Music Player
    </div>
    <h1 id="bp-hero-title" style="font-size:2rem;font-weight:900;margin:0;line-height:1.1;">
      <span style="background:linear-gradient(90deg,#fff,#f5d670,#fff,#f5d670);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:bp-shimmer 3s ease-in-out infinite;">LA Young</span>
      <span style="color:rgba(255,255,255,0.4);font-weight:400;"> </span>
      <span style="color:#d4a017;">Soul Society</span>
    </h1>
    <style>@keyframes bp-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
    <p style="font-size:14px;color:rgba(255,255,255,0.45);margin:6px 0 0;">Playlist</p>
  </div>

  <!-- ── Playlist Selector + Manager Actions ──────────── -->
  <div style="padding:0 24px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <select id="bp-playlist-select" onchange="BandPlayer.selectPlaylist(this.value)"
            style="flex:1;min-width:160px;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
                   background:rgba(255,255,255,0.04);color:#e6edf3;font-size:14px;font-weight:600;
                   font-family:inherit;cursor:pointer;appearance:auto;">
      <option value="">Loading playlists...</option>
    </select>
    <div id="bp-mgr-actions" style="display:none;gap:6px;flex-wrap:wrap;">
      <button onclick="BandPlayer.showCreatePlaylist()" title="New Playlist"
              style="width:36px;height:36px;border-radius:8px;border:1px solid rgba(88,166,255,0.2);background:rgba(88,166,255,0.1);color:#58a6ff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button onclick="BandPlayer.showUploadSong()" title="Upload Song"
              style="width:36px;height:36px;border-radius:8px;border:1px solid rgba(212,160,23,0.2);background:rgba(212,160,23,0.1);color:#d4a017;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-upload"></i>
      </button>
      <button onclick="BandPlayer.showAddFromInventory()" title="Add from Inventory"
              style="width:36px;height:36px;border-radius:8px;border:1px solid rgba(63,185,80,0.2);background:rgba(63,185,80,0.1);color:#3fb950;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-folder-plus"></i>
      </button>
      <button onclick="BandPlayer.showInventory()" title="Song Inventory"
              style="width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-box-archive"></i>
      </button>
      <button id="bp-edit-toggle" onclick="BandPlayer.toggleEditMode()" title="Edit Playlist"
              style="width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-pen"></i>
      </button>
    </div>
  </div>

  <!-- ── Action Bar (sticky controls) ─────────────────── -->
  <div id="bp-action-bar" style="position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;
       gap:16px;padding:12px 24px;background:rgba(0,0,0,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
       border-top:1px solid rgba(255,255,255,0.04);border-bottom:1px solid rgba(212,160,23,0.08);">

    <button onclick="BandPlayer.prev()" title="Previous"
            style="background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;font-size:20px;padding:8px;">
      <i class="fa-solid fa-backward-step"></i>
    </button>

    <button onclick="BandPlayer.togglePlay()" title="Play/Pause" id="bp-play-btn"
            style="width:48px;height:48px;border-radius:50%;border:none;
                   background:linear-gradient(135deg,#d4a017,#b8860b);color:#0d1117;
                   cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
                   box-shadow:0 4px 16px rgba(212,160,23,0.3);">
      <i id="bp-play-icon" class="fa-solid fa-play"></i>
    </button>

    <button onclick="BandPlayer.next()" title="Next"
            style="background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;font-size:20px;padding:8px;">
      <i class="fa-solid fa-forward-step"></i>
    </button>

    <button id="bp-repeat-btn" onclick="BandPlayer.toggleRepeat()" title="Repeat"
            style="background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;font-size:15px;padding:8px;position:relative;">
      <i class="fa-solid fa-repeat"></i>
      <span id="bp-repeat-badge" style="display:none;position:absolute;top:3px;right:1px;font-size:8px;font-weight:700;color:#d4a017;">1</span>
    </button>

    <div style="display:flex;align-items:center;gap:5px;margin-left:auto;">
      <i id="bp-vol-icon" class="fa-solid fa-volume-high" onclick="BandPlayer.toggleMute()"
         style="font-size:13px;color:rgba(255,255,255,0.35);cursor:pointer;"></i>
      <input type="range" min="0" max="100" value="80" id="bp-vol-slider"
             oninput="BandPlayer.setVolume(this.value/100)"
             style="width:55px;accent-color:#d4a017;cursor:pointer;">
    </div>
  </div>

  <!-- ── Track List ───────────────────────────────────── -->
  <div id="bp-tracklist" style="padding:8px 0;">
    <div style="padding:40px 24px;text-align:center;color:rgba(255,255,255,0.3);">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;"></i>
    </div>
  </div>

</div>

<!-- ── Inline Styles ──────────────────────────────────── -->
<style>
  /* Track rows */
  .bp-track {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 24px; cursor: pointer;
    transition: background 120ms; border-radius: 0;
  }
  .bp-track:hover { background: rgba(255,255,255,0.05); }
  .bp-track-active { background: rgba(212,160,23,0.06) !important; }
  .bp-track-num {
    width: 22px; text-align: center; font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.4); flex-shrink: 0;
  }
  .bp-track-active .bp-track-num { color: #d4a017; }
  .bp-track-info { flex: 1; min-width: 0; }
  .bp-track-title {
    font-size: 15px; font-weight: 500; color: #e6edf3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bp-track-active .bp-track-title { color: #d4a017; }
  .bp-track-artist { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 1px; }
  .bp-track-duration {
    font-size: 13px; font-family: monospace; color: rgba(255,255,255,0.35);
    flex-shrink: 0; min-width: 36px; text-align: right;
  }
  .bp-track-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .bp-action-btn {
    width: 32px; height: 32px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.06); background: transparent;
    color: rgba(255,255,255,0.4); cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms, color 120ms;
  }
  .bp-action-btn:hover, .bp-action-btn:active { background: rgba(212,160,23,0.1); color: #d4a017; }

  /* EQ bars — 4 bars like LA Young */
  .bp-eq {
    display: flex; align-items: flex-end; gap: 2px;
    height: 16px; width: 22px; justify-content: center;
  }
  .bp-eq span { width: 3px; background: #d4a017; border-radius: 1px; }
  .bp-eq span:nth-child(1) { height: 60%; animation: bp-eq 0.6s ease infinite 0s; }
  .bp-eq span:nth-child(2) { height: 100%; animation: bp-eq 0.6s ease infinite 0.15s; }
  .bp-eq span:nth-child(3) { height: 40%; animation: bp-eq 0.6s ease infinite 0.3s; }
  .bp-eq span:nth-child(4) { height: 80%; animation: bp-eq 0.6s ease infinite 0.1s; }
  @keyframes bp-eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

  /* Inline progress bar (inserted after active track) */
  .bp-progress-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 24px 12px; font-size: 11px; font-family: monospace;
    color: rgba(255,255,255,0.4);
  }
  .bp-progress-row .bp-prog-bar {
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.1); cursor: pointer; overflow: hidden;
  }
  .bp-progress-row .bp-prog-fill {
    height: 100%; width: 0%; background: #d4a017; border-radius: 2px;
    transition: width 100ms linear;
  }

  /* Edit mode */
  .bp-edit-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.5); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .bp-edit-btn:hover { background: rgba(88,166,255,0.12); color: #58a6ff; }
  .bp-edit-btn-danger:hover { background: rgba(248,81,73,0.12); color: #f85149; }
  .bp-track-edit-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .bp-edit-banner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px; background: rgba(88,166,255,0.06);
    border-bottom: 1px solid rgba(88,166,255,0.15);
    font-size: 13px; font-weight: 600; color: #58a6ff;
  }
  /* Lyrics paper styles */
  .bp-lyric-line {
    font-family: 'Times New Roman', Georgia, 'Palatino Linotype', serif;
    font-size: 13pt; line-height: 2.2; color: #2a2a2a;
    margin: 0; padding: 0; font-style: italic;
  }
  .bp-lyric-line.bp-chorus { color: #8b6914; font-weight: 600; }
  .bp-lyric-line.bp-verse-gap { line-height: 1.2; }
  .bp-lyric-line.bp-section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 2px; color: #aaa; font-style: normal;
    margin-top: 8px;
  }
  @media (max-width: 768px) {
    .bp-lyric-line { font-size: 11pt; }
  }
</style>

<!-- ── Page Script ─────────────────────────────────────── -->
<script>
(function() {
  'use strict';

  function updateManagerButtons() {
    var role = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'member';
    var mgrActions = document.getElementById('bp-mgr-actions');
    if (mgrActions) {
      mgrActions.style.display = (role === 'admin' || role === 'band_manager') ? 'flex' : 'none';
    }
  }
  updateManagerButtons();

  document.addEventListener('gbe:role-switched', function() {
    updateManagerButtons();
    if (BandPlayer.initialized) BandPlayer.renderTrackList();
  });

  // Init — wait for Auth/Firestore
  function tryInit(attempts) {
    if (typeof BandPlayer === 'undefined') return;
    var hasDb = (typeof Auth !== 'undefined') && Auth._db;
    if (hasDb) {
      BandPlayer.init();
      updateManagerButtons();
    } else if (attempts < 20) {
      setTimeout(function() { tryInit(attempts + 1); }, 500);
    } else {
      var el = document.getElementById('bp-tracklist');
      if (el) el.innerHTML = '<div style="padding:40px 24px;text-align:center;color:rgba(248,81,73,0.7);font-size:14px;">' +
        '<i class="fa-solid fa-exclamation-triangle" style="font-size:24px;display:block;margin-bottom:10px;"></i>' +
        'Could not connect. Try refreshing.</div>';
    }
  }
  tryInit(0);
})();
</script>
