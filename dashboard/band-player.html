<!-- ============================================================
     dashboard/band-player.html — Band Member Music Player
     Firebase-backed: Firestore metadata, Storage audio/charts.
     Roles: admin, band_manager, artist, band_member
     ============================================================ -->

<div class="dashboard-page" id="dash-band-player">

  <!-- ── Page Header ──────────────────────────────────── -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
    <div>
      <h1 style="font-size:22px;font-weight:700;color:#e6edf3;margin:0;">
        <i class="fa-solid fa-headphones" style="color:#d4a017;margin-right:8px;"></i>Band Player
      </h1>
      <p style="font-size:14px;color:rgba(255,255,255,0.45);margin:4px 0 0;">Rehearsal tracks, lyrics &amp; charts</p>
    </div>
    <div id="bp-mgr-actions" style="display:none;gap:8px;flex-wrap:wrap;">
      <button onclick="BandPlayer.showCreatePlaylist()" class="btn btn-sm"
              style="background:rgba(88,166,255,0.12);color:#58a6ff;border:1px solid rgba(88,166,255,0.2);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> New Playlist
      </button>
      <button onclick="BandPlayer.showUploadSong()" class="btn btn-sm"
              style="background:rgba(212,160,23,0.12);color:#d4a017;border:1px solid rgba(212,160,23,0.2);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-upload" style="margin-right:4px;"></i> Upload Song
      </button>
      <button onclick="BandPlayer.showAddFromInventory()" class="btn btn-sm"
              style="background:rgba(63,185,80,0.12);color:#3fb950;border:1px solid rgba(63,185,80,0.2);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> Add to Playlist
      </button>
      <button onclick="BandPlayer.showInventory()" class="btn btn-sm"
              style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-box-archive" style="margin-right:4px;"></i> Inventory
      </button>
      <button id="bp-edit-toggle" onclick="BandPlayer.toggleEditMode()" class="btn btn-sm"
              style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;">
        <i class="fa-solid fa-pen" style="margin-right:4px;"></i> Edit
      </button>
    </div>
  </div>

  <!-- ── Playlist Selector ────────────────────────────── -->
  <div style="margin-bottom:16px;">
    <select id="bp-playlist-select" onchange="BandPlayer.selectPlaylist(this.value)"
            style="width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);
                   background:rgba(255,255,255,0.04);color:#e6edf3;font-size:15px;font-weight:600;
                   font-family:inherit;cursor:pointer;appearance:auto;">
      <option value="">Loading playlists...</option>
    </select>
  </div>

  <!-- ── Now Playing Bar ──────────────────────────────── -->
  <div id="bp-now-playing" style="display:none;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
       border-radius:14px;padding:18px;margin-bottom:16px;">
    <!-- Song info -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      <div style="width:50px;height:50px;border-radius:10px;background:rgba(212,160,23,0.12);
                  display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fa-solid fa-music" style="color:#d4a017;font-size:20px;"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div id="bp-now-title" style="font-size:17px;font-weight:700;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
        <div id="bp-now-artist" style="font-size:14px;color:rgba(255,255,255,0.45);margin-top:2px;"></div>
      </div>
    </div>

    <!-- Progress bar -->
    <div style="margin-bottom:12px;">
      <div id="bp-progress-bar" onclick="BandPlayer.seek(event.offsetX / this.offsetWidth)"
           style="height:6px;border-radius:3px;background:rgba(255,255,255,0.08);cursor:pointer;position:relative;overflow:hidden;">
        <div id="bp-progress-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#d4a017,#e8b82a);border-radius:3px;transition:width 100ms linear;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:12px;color:rgba(255,255,255,0.35);">
        <span id="bp-time-current">0:00</span>
        <span id="bp-time-duration">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;">
      <button onclick="BandPlayer.prev()" title="Previous"
              style="background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;font-size:18px;padding:8px;">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button onclick="BandPlayer.togglePlay()" title="Play/Pause"
              style="width:52px;height:52px;border-radius:50%;border:none;
                     background:linear-gradient(135deg,#d4a017,#b8860b);color:#0d1117;
                     cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;
                     box-shadow:0 2px 12px rgba(212,160,23,0.3);">
        <i id="bp-play-icon" class="fa-solid fa-play"></i>
      </button>
      <button onclick="BandPlayer.next()" title="Next"
              style="background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;font-size:18px;padding:8px;">
        <i class="fa-solid fa-forward-step"></i>
      </button>
      <div style="display:flex;align-items:center;gap:6px;margin-left:12px;">
        <i class="fa-solid fa-volume-high" style="font-size:13px;color:rgba(255,255,255,0.35);"></i>
        <input type="range" min="0" max="100" value="80"
               oninput="BandPlayer.setVolume(this.value/100)"
               style="width:70px;accent-color:#d4a017;">
        <span id="bp-volume-val" style="font-size:12px;color:rgba(255,255,255,0.35);min-width:30px;">80%</span>
      </div>
    </div>

    <!-- Now-playing song actions -->
    <div id="bp-now-actions" style="display:flex;justify-content:center;gap:10px;margin-top:14px;border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;">
    </div>
  </div>

  <!-- ── Track List ───────────────────────────────────── -->
  <div id="bp-tracklist" style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;overflow:hidden;">
    <div style="padding:30px;text-align:center;color:rgba(255,255,255,0.3);">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;"></i>
    </div>
  </div>

</div>

<!-- ── Inline Styles ──────────────────────────────────── -->
<style>
  .bp-track {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 120ms ease;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .bp-track:last-child { border-bottom: none; }
  .bp-track:hover { background: rgba(255,255,255,0.04); }
  .bp-track-active { background: rgba(212,160,23,0.06); }
  .bp-track-active:hover { background: rgba(212,160,23,0.10); }
  .bp-track-num {
    width: 28px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    flex-shrink: 0;
  }
  .bp-track-active .bp-track-num { color: #d4a017; }
  .bp-track-info { flex: 1; min-width: 0; }
  .bp-track-title {
    font-size: 15px;
    font-weight: 600;
    color: #e6edf3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bp-track-active .bp-track-title { color: #d4a017; }
  .bp-track-artist {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }
  .bp-track-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .bp-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 120ms, color 120ms;
  }
  .bp-action-btn:hover {
    background: rgba(212,160,23,0.12);
    color: #d4a017;
  }
  /* EQ bars animation for active track */
  .bp-eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
    justify-content: center;
  }
  .bp-eq span {
    width: 3px;
    background: #d4a017;
    border-radius: 1px;
    animation: bp-eq-bar 0.8s ease infinite;
  }
  .bp-eq span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .bp-eq span:nth-child(2) { height: 12px; animation-delay: 0.2s; }
  .bp-eq span:nth-child(3) { height: 8px; animation-delay: 0.4s; }
  @keyframes bp-eq-bar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }
  /* Edit mode styles */
  .bp-edit-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 120ms, color 120ms;
  }
  .bp-edit-btn:hover {
    background: rgba(88,166,255,0.12);
    color: #58a6ff;
  }
  .bp-edit-btn:active {
    background: rgba(88,166,255,0.2);
  }
  .bp-edit-btn-danger:hover {
    background: rgba(248,81,73,0.12);
    color: #f85149;
  }
  .bp-track-edit-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .bp-edit-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(88,166,255,0.08);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 600;
    color: #58a6ff;
  }
</style>

<!-- ── Page Script ─────────────────────────────────────── -->
<script>
(function() {
  'use strict';

  // Show manager actions for admin/band_manager
  var role = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'member';
  var mgrActions = document.getElementById('bp-mgr-actions');
  if (mgrActions) {
    mgrActions.style.display = (role === 'admin' || role === 'band_manager') ? 'flex' : 'none';
  }

  // Update now-playing actions when song changes
  function updateNowActions() {
    var el = document.getElementById('bp-now-actions');
    if (!el || !BandPlayer._songs || BandPlayer._currentIndex < 0) return;
    var song = BandPlayer._songs[BandPlayer._currentIndex];
    if (!song) return;

    var html = '';
    if (song.lyrics) {
      html += '<button onclick="BandPlayer.showLyrics(\'' + song.id + '\')" ' +
        'style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);' +
        'background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;">' +
        '<i class="fa-solid fa-align-left"></i> Lyrics</button>';
    }
    if (song.charts && Object.keys(song.charts).length > 0) {
      html += '<button onclick="BandPlayer.showChart(\'' + song.id + '\')" ' +
        'style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);' +
        'background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;">' +
        '<i class="fa-solid fa-file-pdf"></i> Chart</button>';
    }
    el.innerHTML = html || '<span style="font-size:12px;color:rgba(255,255,255,0.25);">No lyrics or charts for this track</span>';
  }

  // Monkey-patch updateNowPlaying to also update actions
  var origUpdate = BandPlayer.updateNowPlaying.bind(BandPlayer);
  BandPlayer.updateNowPlaying = function() {
    origUpdate();
    updateNowActions();
  };

  // Init the player
  if (typeof BandPlayer !== 'undefined') {
    BandPlayer.init();
  }
})();
</script>
