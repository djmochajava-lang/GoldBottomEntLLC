<!-- dashboard/deals.html — Deals & Agreements Tracker (STORY-009) -->
<div class="dashboard-page" id="dash-deals">

  <div class="dashboard-page-header">
    <div>
      <h1>Deals &amp; Agreements</h1>
      <p class="text-muted">Track the status of all active deals and agreements in flight.</p>
    </div>
  </div>

  <div id="deals-list">
    <div style="text-align:center;padding:var(--space-lg);color:var(--color-text-muted);">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading deals...
    </div>
  </div>

</div>

<style>
  .deal-card-wrapper { margin-bottom:var(--space-sm); }
  .deal-card { display:flex; justify-content:space-between; align-items:flex-start; padding:var(--space-md) var(--space-lg); background:var(--color-bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-md); border-left:4px solid transparent; cursor:pointer; user-select:none; }
  .deal-card:hover { border-color:var(--color-gold); }
  .deal-card.needs-attention { border-left-color:#f0883e; background:rgba(240,136,62,0.05); }
  .deal-card-info h3 { margin:0; font-size:var(--text-base); font-weight:var(--fw-semibold); }
  .deal-card-info p { margin:3px 0 0; font-size:var(--text-sm); color:var(--color-text-muted); }
  .deal-card-meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:140px; }
  .deal-attention-flag { font-size:var(--text-xs); color:#f0883e; font-weight:var(--fw-semibold); }
  .deal-updated { font-size:var(--text-xs); color:var(--color-text-muted); }
  .stage-badge { padding:2px 10px; border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:var(--fw-semibold); }
  .stage-lead, .stage-closed { background:rgba(120,120,120,0.2); color:#888; }
  .stage-negotiating { background:rgba(210,153,34,0.2); color:#d29922; }
  .stage-sent_for_signature { background:rgba(240,136,62,0.2); color:#f0883e; }
  .stage-signed { background:rgba(63,185,80,0.2); color:#3fb950; }
  .stage-active { background:rgba(88,166,255,0.2); color:#58a6ff; }
  .deal-chevron { font-size:var(--text-xs); color:var(--color-text-muted); margin-left:8px; transition:transform 0.2s; display:inline-block; }
  .deal-card.expanded .deal-chevron { transform:rotate(180deg); }
  .deal-history { display:none; background:var(--color-bg-tertiary,var(--color-bg-secondary)); border:1px solid var(--color-border); border-top:none; border-radius:0 0 var(--radius-md) var(--radius-md); padding:var(--space-md) var(--space-lg); }
  .deal-history.open { display:block; }
  .deal-history-title { font-size:var(--text-xs); font-weight:var(--fw-semibold); color:var(--color-text-muted); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 var(--space-sm); }
  .deal-stage-timeline { list-style:none; margin:0; padding:0; }
  .deal-stage-timeline li { display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px solid var(--color-border); font-size:var(--text-sm); }
  .deal-stage-timeline li:last-child { border-bottom:none; }
  .deal-stage-dot { width:8px; height:8px; border-radius:50%; background:var(--color-gold); flex-shrink:0; margin-top:5px; }
  .deal-stage-dot.current { background:var(--color-gold); box-shadow:0 0 0 2px rgba(212,160,23,0.3); }
  .deal-stage-label { font-weight:var(--fw-medium); }
  .deal-stage-date { color:var(--color-text-muted); font-size:var(--text-xs); margin-top:2px; }
  .deal-no-history { font-size:var(--text-sm); color:var(--color-text-muted); font-style:italic; margin:0; }
  @media (max-width:480px) {
    .deal-card { flex-direction:column; gap:var(--space-sm); }
    .deal-card-meta { align-items:flex-start; flex-direction:row; flex-wrap:wrap; }
  }
</style>

<script>
(function() {
  'use strict';

  var STAGE_LABELS = {
    lead: 'Lead',
    negotiating: 'Negotiating',
    sent_for_signature: 'Sent for Signature',
    signed: 'Signed',
    active: 'Active',
    closed: 'Closed'
  };

  function formatDate(val) {
    if (!val) return '';
    try { return new Date(val).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
    catch(e) { return val; }
  }

  function renderDeals(deals) {
    var el = document.getElementById('deals-list');
    if (!el) return;
    if (!deals || deals.length === 0) {
      el.innerHTML = '<div style="text-align:center;padding:var(--space-2xl);color:var(--color-text-muted);">'
        + '<i class="fa-solid fa-handshake-slash" style="font-size:2rem;margin-bottom:var(--space-sm);display:block;"></i>'
        + '<p>No deals in pipeline.</p>'
        + '<p style="font-size:var(--text-sm);">Deals and agreements will appear here once added.</p>'
        + '</div>';
      return;
    }
    // Sort: owner_action_required first, then by updated_at desc
    deals.sort(function(a, b) {
      var aFlag = (a.owner_action_required === 1 || a.owner_action_required === true) ? 1 : 0;
      var bFlag = (b.owner_action_required === 1 || b.owner_action_required === true) ? 1 : 0;
      if (bFlag !== aFlag) return bFlag - aFlag;
      return (b.updated_at || '').localeCompare(a.updated_at || '');
    });
    el.innerHTML = '';
    deals.forEach(function(d) {
      var needsAttn = (d.owner_action_required === 1 || d.owner_action_required === true);
      var stage = d.stage || 'lead';
      var stageLabel = STAGE_LABELS[stage] || stage;
      var safeName = d.name ? d.name.replace(/</g,'&lt;').replace(/>/g,'&gt;') : 'Untitled Deal';

      // Build wrapper
      var wrapper = document.createElement('div');
      wrapper.className = 'deal-card-wrapper';

      // Build card row
      var card = document.createElement('div');
      card.className = 'deal-card' + (needsAttn ? ' needs-attention' : '');
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-expanded', 'false');
      card.innerHTML = '<div class="deal-card-info">'
        + '<h3>' + safeName + ' <i class="fa-solid fa-chevron-down deal-chevron"></i></h3>'
        + '<p>' + (d.counterparty ? d.counterparty.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '') + '</p>'
        + '</div>'
        + '<div class="deal-card-meta">'
        + '<span class="stage-badge stage-' + stage + '">' + stageLabel + '</span>'
        + (needsAttn ? '<span class="deal-attention-flag"><i class="fa-solid fa-circle-exclamation"></i> Needs your attention</span>' : '')
        + '<span class="deal-updated">Updated ' + formatDate(d.updated_at) + '</span>'
        + '</div>';

      // Build history panel (safe fields only: name already on card, stage timeline, timestamps)
      var panel = document.createElement('div');
      panel.className = 'deal-history';
      var historyHTML = '<p class="deal-history-title">Stage History</p>';
      if (d.stage_history && Array.isArray(d.stage_history) && d.stage_history.length > 0) {
        historyHTML += '<ul class="deal-stage-timeline">';
        d.stage_history.forEach(function(entry, idx) {
          var entryStage = entry.stage || '';
          var entryLabel = STAGE_LABELS[entryStage] || entryStage;
          var isCurrent = (idx === d.stage_history.length - 1);
          historyHTML += '<li>'
            + '<span class="deal-stage-dot' + (isCurrent ? ' current' : '') + '"></span>'
            + '<div><div class="deal-stage-label">' + entryLabel.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>'
            + '<div class="deal-stage-date">' + formatDate(entry.changed_at || entry.timestamp || '') + '</div></div>'
            + '</li>';
        });
        historyHTML += '</ul>';
      } else {
        // No history array — show current stage + updated_at
        historyHTML += '<ul class="deal-stage-timeline">'
          + '<li><span class="deal-stage-dot current"></span>'
          + '<div><div class="deal-stage-label">' + stageLabel + '</div>'
          + '<div class="deal-stage-date">' + formatDate(d.updated_at) + '</div></div></li>'
          + '</ul>'
          + '<p class="deal-no-history">No prior stages recorded.</p>';
      }
      panel.innerHTML = historyHTML;

      // Toggle handler
      function toggleHistory(e) {
        e.stopPropagation();
        var isOpen = panel.classList.contains('open');
        if (isOpen) {
          panel.classList.remove('open');
          card.classList.remove('expanded');
          card.setAttribute('aria-expanded', 'false');
        } else {
          panel.classList.add('open');
          card.classList.add('expanded');
          card.setAttribute('aria-expanded', 'true');
        }
      }
      card.addEventListener('click', toggleHistory);
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleHistory(e); }
      });

      wrapper.appendChild(card);
      wrapper.appendChild(panel);
      el.appendChild(wrapper);
    });
  }

  function showError(msg) {
    var el = document.getElementById('deals-list');
    if (el) el.innerHTML = '<div style="text-align:center;padding:var(--space-lg);color:var(--color-danger);">'
      + '<i class="fa-solid fa-triangle-exclamation"></i> ' + msg + '</div>';
  }

  function loadDeals() {
    var role = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : null;
    if (role === 'band_member' || role === 'artist' || role === 'musician') {
      document.getElementById('deals-list').innerHTML =
        '<div style="text-align:center;padding:var(--space-2xl);color:var(--color-text-muted);">'
        + '<i class="fa-solid fa-lock" style="font-size:2rem;margin-bottom:var(--space-sm);display:block;"></i>'
        + '<p>Access denied. This page is for band managers only.</p>'
        + '</div>';
      return;
    }

    // Try LAN API first, fall back to Firestore
    Utils.apiFetch('/api/v1/deal-pipeline')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        console.log('[perf] deals loaded from API (' + (data.deals ? data.deals.length : 0) + ' records)');
        renderDeals(data.deals || []);
      })
      .catch(function() {
        // Firestore fallback (public site, HomeOffice offline)
        var db = (typeof firebase !== 'undefined') ? firebase.firestore() : null;
        if (!db) { showError('Unable to load deals. Please try again.'); return; }
        db.collection('deal_pipeline')
          .orderBy('owner_action_required', 'desc')
          .orderBy('updated_at', 'desc')
          .get()
          .then(function(snap) {
            var deals = [];
            snap.forEach(function(doc) { deals.push(doc.data()); });
            console.log('[perf] deals loaded from Firestore (' + deals.length + ' records)');
            renderDeals(deals);
          })
          .catch(function(err) {
            console.error('[Deals] Firestore fallback failed:', err.message);
            showError('Unable to load deals. Please try again.');
          });
      });
  }

  // Wait for auth + Firestore to be ready
  document.addEventListener('gbe:auth-ready', function() {
    loadDeals();
  });

  // Also init if auth already done
  if (typeof Auth !== 'undefined' && Auth.initialized && !Auth._initializing) {
    loadDeals();
  }
})();
</script>
