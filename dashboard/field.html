<!-- ============================================================
     dashboard/field.html — Band Manager Field View
     Mobile-optimized dashboard for on-the-road management.
     Covers the 26 "field" tasks from the Band Manager Duty Matrix.
     ============================================================ -->

<div id="field-view" style="max-width:600px;margin:0 auto;padding:0 0 80px;">

  <!-- ── Role Theme Banner (injected by JS) ───────────────────── -->
  <div id="field-theme-banner" style="display:none;padding:14px 16px;margin:0 -2px 8px;border-radius:0 0 14px 14px;
       text-align:center;font-size:14px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
       position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);"></div>

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 4px 16px;">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span id="field-view-badge" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
                     padding:4px 12px;border-radius:20px;
                     background:rgba(63,185,80,0.15);color:#3fb950;">
          <i class="fa-solid fa-signal" style="margin-right:4px;"></i>Field View
        </span>
        <span id="field-env-badge" style="font-size:13px;font-weight:700;text-transform:uppercase;
                     letter-spacing:0.08em;padding:4px 12px;border-radius:20px;"></span>
      </div>
      <div id="field-date" style="font-size:20px;font-weight:700;color:#e6edf3;"></div>
      <div id="field-role-label" style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:2px;">
        <i class="fa-solid fa-briefcase" style="margin-right:4px;color:#d4a017;"></i>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <!-- Role Switcher (only visible when user has 2+ roles) -->
      <div id="field-role-switcher" style="display:none;position:relative;">
        <button id="field-role-btn"
                style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
                       border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);
                       color:rgba(255,255,255,0.8);cursor:pointer;font-size:12px;font-weight:600;">
          <i id="field-role-icon" class="fa-solid fa-briefcase" style="font-size:11px;"></i>
          <span id="field-role-text">Role</span>
          <i class="fa-solid fa-chevron-down" style="font-size:8px;color:rgba(255,255,255,0.4);margin-left:2px;"></i>
        </button>
        <div id="field-role-dropdown"
             style="display:none;position:absolute;top:calc(100% + 6px);right:0;
                    background:#161b22;border:1px solid rgba(255,255,255,0.1);
                    border-radius:10px;padding:6px;min-width:190px;z-index:10000;
                    box-shadow:0 4px 20px rgba(0,0,0,0.6);">
          <div style="padding:4px 12px 6px;font-size:10px;color:rgba(255,255,255,0.35);
                      font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
                      border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:4px;">Switch Role</div>
          <div id="field-role-options"></div>
        </div>
      </div>
      <button id="field-refresh-btn" onclick="fieldRefresh()"
              style="padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);
                     background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);
                     cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;">
        <i class="fa-solid fa-rotate-right" id="field-refresh-icon"></i> Refresh
      </button>
    </div>
  </div>

  <!-- ── THIS WEEK ─────────────────────────────────────────── -->
  <div id="field-week-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-calendar-week" style="color:#58a6ff;"></i>
      <span>This Week</span>
      <span id="field-week-badge" style="display:none;margin-left:6px;font-size:11px;
             font-weight:700;background:rgba(88,166,255,0.15);color:#58a6ff;
             border-radius:10px;padding:1px 8px;"></span>
      <a href="#dashboard-calendar" style="margin-left:auto;font-size:11px;color:#58a6ff;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        Calendar <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-week-body">
      <div class="field-skeleton"></div>
    </div>
  </div>

  <!-- ── TODAY ──────────────────────────────────────────────── -->
  <div id="field-today-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-calendar-day" style="color:#d4a017;"></i>
      <span>Today</span>
      <span id="field-today-date" style="margin-left:auto;font-size:11px;color:rgba(255,255,255,0.35);font-weight:500;text-transform:none;letter-spacing:0;"></span>
    </div>
    <div id="field-today-body">
      <div class="field-skeleton"></div>
    </div>
  </div>

  <!-- ── INBOX ──────────────────────────────────────────────── -->
  <div id="field-inbox-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-inbox" style="color:#58a6ff;"></i>
      <span>Inbox</span>
      <span id="field-inbox-badge" style="display:none;margin-left:6px;background:#d4a017;color:#0d1117;
             border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700;"></span>
      <a href="#dashboard-inbox" style="margin-left:auto;font-size:11px;color:#58a6ff;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        View All <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-inbox-body">
      <div class="field-skeleton"></div>
    </div>
  </div>

  <!-- ── PIPELINE — NEEDS ACTION ────────────────────────────── -->
  <div id="field-pipeline-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-filter" style="color:#f0883e;"></i>
      <span>Pipeline</span>
      <span id="field-pipeline-badge" style="display:none;margin-left:6px;font-size:11px;
             font-weight:700;background:rgba(240,136,62,0.18);color:#f0883e;
             border-radius:10px;padding:1px 8px;"></span>
      <a href="#dashboard-booking" style="margin-left:auto;font-size:11px;color:#f0883e;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        Full Pipeline <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-pipeline-body">
      <div class="field-skeleton"></div>
    </div>
  </div>

  <!-- ── CONTRACTS (outstanding signatures) ────────────────── -->
  <div id="field-contracts-card" class="field-card" style="display:none;">
    <div class="field-card-header">
      <i class="fa-solid fa-file-signature" style="color:#3fb950;"></i>
      <span>Contracts</span>
      <span id="field-contracts-badge" style="margin-left:6px;font-size:13px;font-weight:700;
             background:rgba(63,185,80,0.15);color:#3fb950;border-radius:10px;padding:1px 8px;"></span>
      <a href="#dashboard-contracts" style="margin-left:auto;font-size:11px;color:#3fb950;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        All Contracts <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-contracts-body"></div>
  </div>

  <!-- ── INVOICES (outstanding / unpaid) ────────────────────── -->
  <div id="field-invoices-card" class="field-card" style="display:none;">
    <div class="field-card-header">
      <i class="fa-solid fa-file-invoice-dollar" style="color:#f0883e;"></i>
      <span>Invoices</span>
      <span id="field-invoices-badge" style="margin-left:6px;font-size:13px;font-weight:700;
             background:rgba(240,136,62,0.15);color:#f0883e;border-radius:10px;padding:1px 8px;"></span>
      <a href="#dashboard-finances" style="margin-left:auto;font-size:11px;color:#f0883e;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        All Invoices <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-invoices-body"></div>
  </div>

  <!-- ── FOLLOW-UPS ─────────────────────────────────────────── -->
  <div id="field-followups-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-clock-rotate-left" style="color:#c778d9;"></i>
      <span>Follow-Ups</span>
      <span id="field-followup-badge" style="display:none;margin-left:6px;font-size:11px;
             font-weight:700;background:rgba(199,120,217,0.18);color:#c778d9;
             border-radius:10px;padding:1px 8px;"></span>
      <a href="#dashboard-leads" style="margin-left:auto;font-size:11px;color:#c778d9;
         font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;">
        All Leads <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i>
      </a>
    </div>
    <div id="field-followup-body">
      <div class="field-skeleton"></div>
    </div>
  </div>

  <!-- ── PENDING APPROVALS (shown only when count > 0) ──────── -->
  <div id="field-approvals-card" class="field-card" style="display:none;">
    <div class="field-card-header">
      <i class="fa-solid fa-user-clock" style="color:#d29922;"></i>
      <span>Pending Approvals</span>
      <span id="field-approvals-badge" style="margin-left:6px;font-size:13px;font-weight:700;
             background:rgba(210,153,34,0.18);color:#d29922;border-radius:10px;padding:1px 8px;"></span>
    </div>
    <div id="field-approvals-body"></div>
  </div>

  <!-- ── QUICK ACTIONS ──────────────────────────────────────── -->
  <div id="field-quickactions-card" class="field-card">
    <div class="field-card-header">
      <i class="fa-solid fa-bolt" style="color:#d4a017;"></i>
      <span>Quick Actions</span>
    </div>
    <div id="field-quickactions-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
  </div>

</div><!-- /field-view -->

<!-- ── Page Script ───────────────────────────────────────────── -->
<script>
(function() {

  /* ── Helpers ─────────────────────────────────────────────── */

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function timeAgo(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var m = Math.floor(diff / 60000);
    if (m < 1)  return 'Just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function daysSince(iso) {
    if (!iso) return 0;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  var _fieldIsLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());

  function fieldFetch(url) {
    // On remote (iPhone/public site), LAN API is unreachable — reject immediately
    if (!_fieldIsLocal) return Promise.reject(new Error('remote'));
    var token = localStorage.getItem('gbe-session-token') || '';
    var headers = {};
    if (token) headers['X-GBE-Session'] = token;
    // 3-second timeout so LAN hiccups don't block the UI
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, 3000);
    return fetch(url, { headers: headers, signal: controller.signal })
      .finally(function() { clearTimeout(timer); });
  }

  function stageLabel(stage) {
    var map = {
      lead: 'New Lead', qualified: 'Qualified', proposed: 'Proposed',
      negotiating: 'Negotiating', confirmed: 'Confirmed',
      contracted: 'Contracted', completed: 'Completed', closed: 'Closed'
    };
    return map[stage] || stage || '—';
  }

  function stageColor(stage) {
    var map = {
      lead:        '#8b949e',
      qualified:   '#58a6ff',
      proposed:    '#d4a017',
      negotiating: '#f0883e',
      confirmed:   '#3fb950',
      contracted:  '#3fb950',
      completed:   '#3fb950',
      closed:      '#f85149'
    };
    return map[stage] || '#8b949e';
  }

  /* ── TODAY section ───────────────────────────────────────── */

  function renderToday() {
    var el = document.getElementById('field-today-body');
    var dateEl = document.getElementById('field-today-date');
    var today = new Date();
    var todayStr = today.toISOString().slice(0, 10);

    // Set date sub-label
    if (dateEl) {
      dateEl.textContent = today.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      });
    }

    if (!el) return;

    var events   = (typeof DataStore !== 'undefined') ? DataStore.getEvents()   : [];
    var bookings = (typeof DataStore !== 'undefined') ? DataStore.getBookings() : [];

    // Filter to today
    var todayEvents = events.filter(function(e) {
      return (e.date || '').slice(0, 10) === todayStr;
    });
    var todayBookings = bookings.filter(function(b) {
      var d = (b.eventDate || b.date || '').slice(0, 10);
      return d === todayStr && (b.stage === 'contracted' || b.stage === 'confirmed');
    });

    var allToday = todayBookings.concat(todayEvents);

    if (allToday.length === 0) {
      // Find next upcoming
      var upcoming = bookings
        .filter(function(b) {
          var d = (b.eventDate || b.date || '');
          return d > todayStr && (b.stage === 'contracted' || b.stage === 'confirmed');
        })
        .sort(function(a, b) {
          return (a.eventDate || a.date || '') > (b.eventDate || b.date || '') ? 1 : -1;
        })[0];

      var upcomingEvent = events
        .filter(function(e) { return (e.date || '') > todayStr; })
        .sort(function(a, b) { return a.date > b.date ? 1 : -1; })[0];

      var next = upcoming || upcomingEvent;

      el.innerHTML =
        '<div class="field-empty">' +
          '<i class="fa-regular fa-calendar-check" style="color:rgba(63,185,80,0.4);"></i>' +
          'No gigs today — you\'re free' +
        '</div>' +
        (next
          ? '<div class="field-item" onclick="Router.navigateTo(\'dashboard-booking\')" style="border-left:3px solid #58a6ff;">' +
              '<div class="field-item-icon" style="background:rgba(88,166,255,0.12);">' +
                '<i class="fa-solid fa-forward" style="color:#58a6ff;"></i>' +
              '</div>' +
              '<div class="field-item-body">' +
                '<div class="field-item-title">Next: ' + escHtml(next.name || next.title || next.venue || 'Upcoming Gig') + '</div>' +
                '<div class="field-item-sub">' + fmtDate(next.eventDate || next.date) + (next.venue ? ' · ' + escHtml(next.venue) : '') + '</div>' +
              '</div>' +
            '</div>'
          : ''
        );
      return;
    }

    el.innerHTML = allToday.map(function(item) {
      var isBooking = !!item.stage;
      var title   = item.name || item.title || item.venue || 'Gig';
      var venue   = item.venue || item.location || '';
      var time    = item.time || item.eventTime || fmtTime(item.eventDate) || '';
      var loadIn  = item.loadInTime || item.loadIn || '';

      return '<div class="field-item" onclick="Router.navigateTo(\'' + (isBooking ? 'dashboard-booking' : 'dashboard-calendar') + '\')" style="border-left:3px solid #3fb950;">' +
        '<div class="field-item-icon" style="background:rgba(63,185,80,0.12);">' +
          '<i class="fa-solid fa-music" style="color:#3fb950;"></i>' +
        '</div>' +
        '<div class="field-item-body">' +
          '<div class="field-item-title">' + escHtml(title) + '</div>' +

  /* ── PIPELINE section ────────────────────────────────────── */

  function renderPipeline() {
    var el    = document.getElementById('field-pipeline-body');
    var badge = document.getElementById('field-pipeline-badge');
    if (!el) return;

    var bookings = (typeof DataStore !== 'undefined') ? DataStore.getBookings() : [];

    // Action-needed stages: proposed, negotiating, confirmed (awaiting contract)
    var actionStages = ['proposed', 'negotiating', 'confirmed'];
    var actionItems = bookings.filter(function(b) {
      return actionStages.indexOf(b.stage) !== -1;
    }).sort(function(a, b) {
      // Priority: negotiating first, then proposed, then confirmed
      var priority = { negotiating: 0, proposed: 1, confirmed: 2 };
      return (priority[a.stage] || 9) - (priority[b.stage] || 9);
    });

    if (badge) {
      if (actionItems.length > 0) {
        badge.textContent = actionItems.length + ' need action';
        badge.style.display = '';
      }
    }

    if (actionItems.length === 0) {
      el.innerHTML = '<div class="field-empty"><i class="fa-solid fa-check-circle" style="color:rgba(63,185,80,0.3);"></i>Pipeline is clear</div>';
      return;
    }

    el.innerHTML = actionItems.slice(0, 4).map(function(b) {
      var client  = b.clientName || b.name || b.venue || 'Unknown Client';
      var evDate  = fmtDate(b.eventDate || b.date);
      var value   = b.totalValue || b.value || b.budget || 0;
      var color   = stageColor(b.stage);

      return '<div class="field-item" onclick="Router.navigateTo(\'dashboard-booking\')" ' +
             'style="border-left:3px solid ' + color + ';">' +
        '<div class="field-item-icon" style="background:rgba(255,255,255,0.05);">' +
          '<i class="fa-solid fa-ticket" style="color:' + color + ';font-size:12px;"></i>' +
        '</div>' +
        '<div class="field-item-body">' +
          '<div class="field-item-title">' + escHtml(client) + '</div>' +
          '<div class="field-item-sub">' + (evDate || 'No date set') + (value ? ' · $' + Number(value).toLocaleString() : '') + '</div>' +
        '</div>' +
        '<div class="field-item-meta">' +
          '<span class="field-badge" style="background:rgba(' + hexToRgb(color) + ',0.15);color:' + color + ';">' + stageLabel(b.stage) + '</span>' +
        '</div>' +
      '</div>';

    (actionItems.length > 4
      ? '<div style="text-align:center;padding:8px 0 0;font-size:12px;color:rgba(255,255,255,0.35);">+' + (actionItems.length - 4) + ' more</div>'
      : '');

  /* ── FOLLOW-UPS section ──────────────────────────────────── */

  function renderFollowups() {
    var el    = document.getElementById('field-followup-body');
    var badge = document.getElementById('field-followup-badge');
    if (!el) return;

    // Try server follow-up queue first, fall back to DataStore
    fieldFetch('/api/v1/followups/queued')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var items = Array.isArray(data) ? data : (data.followups || []);
        renderFollowupItems(el, badge, items, 'server');
      })
      .catch(function() {
        // Fall back: DataStore bookings in 'proposed' stage older than 3 days
        var bookings = (typeof DataStore !== 'undefined') ? DataStore.getBookings() : [];
        var stale = bookings.filter(function(b) {
          return b.stage === 'proposed' && daysSince(b.updatedAt || b.createdAt) >= 3;
        });
        renderFollowupItems(el, badge, stale, 'local');
      });
  }

  function renderFollowupItems(el, badge, items, source) {
    if (badge) {
      if (items.length > 0) {
        badge.textContent = items.length + ' due';
        badge.style.display = '';
      }
    }

    if (items.length === 0) {
      el.innerHTML = '<div class="field-empty"><i class="fa-solid fa-circle-check" style="color:rgba(199,120,217,0.3);"></i>No follow-ups pending</div>';
      return;
    }

    el.innerHTML = items.slice(0, 4).map(function(item) {
      var isServer = source === 'server';
      var client   = isServer
        ? (item.recipient_name || 'Client')
        : (item.clientName || item.name || 'Client');
      var subj     = isServer
        ? (item.subject || 'Follow-up')
        : ('Quote · ' + stageLabel(item.stage));
      var attempt  = isServer
        ? (item.attempt_number ? 'Attempt ' + item.attempt_number + ' of 3' : '')
        : ('Proposed · ' + daysSince(item.updatedAt || item.createdAt) + ' days since update');
      var since    = isServer
        ? fmtDate(item.scheduled_for || item.created_at)
        : fmtDate(item.updatedAt || item.createdAt);

      return '<div class="field-item" onclick="Router.navigateTo(\'' + (isServer ? 'dashboard-leads' : 'dashboard-booking') + '\')" style="border-left:3px solid #c778d9;">' +
        '<div class="field-item-icon" style="background:rgba(199,120,217,0.12);">' +
          '<i class="fa-solid fa-clock-rotate-left" style="color:#c778d9;font-size:12px;"></i>' +
        '</div>' +
        '<div class="field-item-body">' +
          '<div class="field-item-title">' + escHtml(client) + '</div>' +
          '<div class="field-item-sub">' + escHtml(subj) + (attempt ? ' · ' + attempt : '') + '</div>' +
        '</div>' +
        '<div class="field-item-meta">' + since + '</div>' +
      '</div>';
    }).join('') +
    (items.length > 4
      ? '<div style="text-align:center;padding:8px 0 0;font-size:12px;color:rgba(255,255,255,0.35);">+' + (items.length - 4) + ' more</div>'
      : '');
  }

  function renderPendingApprovals() {
    var card  = document.getElementById('field-approvals-card');
    var body  = document.getElementById('field-approvals-body');
    var badge = document.getElementById('field-approvals-badge');
    var approveLbl = document.getElementById('field-approve-label');

    var _approvalRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : '';
    var _canSwitchToAdmin = (typeof Auth !== 'undefined' && Auth.getLinkedRoles)
      ? Auth.getLinkedRoles().indexOf('admin') !== -1 : false;

    // Only show for admin role, or as a nudge for dual-role users who can switch to admin
    if (_approvalRole !== 'admin' && !_canSwitchToAdmin) { card.style.display = 'none'; return; }

    var db = (typeof Auth !== 'undefined' && Auth._db) ? Auth._db : null;
    if (!db) return;

    db.collection('users').where('status', '==', 'pending').get()
      .then(function(snap) {
        var count = snap.size;
        if (count === 0) {
          card.style.display = 'none';
          return;
        }

        card.style.display = '';
        if (badge) badge.textContent = count + ' pending';

        // Band manager sees a nudge to switch roles at HomeOffice — not the full list
        if (_approvalRole !== 'admin') {
          if (approveLbl) approveLbl.textContent = 'Pending (' + count + ')';
          body.innerHTML =
            '<div style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;' +

              '<i class="fa-solid fa-user-clock" style="color:#d29922;font-size:18px;"></i>' +
              '<div>' +
                '<div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.85);">' + count + ' user' + (count > 1 ? 's' : '') + ' awaiting approval</div>' +
                '<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">Switch to Admin at HomeOffice to approve</div>' +
              '</div>' +
            '</div>';
          return;
        }

        if (approveLbl) approveLbl.textContent = 'Approve (' + count + ')';

        var users = [];

              '<i class="fa-solid fa-user-clock" style="color:#d29922;font-size:12px;"></i>' +
            '</div>' +
            '<div class="field-item-body">' +
              '<div class="field-item-title">' + escHtml(u.name) + '</div>' +
              '<div class="field-item-sub">Wants: ' + escHtml(u.role) + (u.note ? ' · "' + escHtml(u.note) + '"' : '') + '</div>' +
            '</div>' +
            '<div class="field-item-meta"><i class="fa-solid fa-chevron-right" style="font-size:10px;color:rgba(255,255,255,0.3);"></i></div>' +
          '</div>';
        }).join('');
      })
      .catch(function() {
        card.style.display = 'none';
      });

  /* ── THIS WEEK section ───────────────────────────────────── */

  function renderThisWeek() {
    var el    = document.getElementById('field-week-body');
    var badge = document.getElementById('field-week-badge');
    if (!el) return;

    var today = new Date();
    var todayStr = today.toISOString().slice(0, 10);
    var weekOut  = new Date(today.getTime() + 7 * 86400000).toISOString().slice(0, 10);

    var bookings = (typeof DataStore !== 'undefined') ? DataStore.getBookings() : [];
    var events   = (typeof DataStore !== 'undefined') ? DataStore.getEvents()   : [];

    var weekBookings = bookings.filter(function(b) {
      var d = (b.eventDate || b.date || '').slice(0, 10);
      return d > todayStr && d <= weekOut &&
             (b.stage === 'confirmed' || b.stage === 'contracted');
    }).sort(function(a, b) {
      return (a.eventDate || a.date || '') > (b.eventDate || b.date || '') ? 1 : -1;
    });

    var weekEvents = events.filter(function(e) {
      var d = (e.date || '').slice(0, 10);
      return d > todayStr && d <= weekOut;
    }).sort(function(a, b) { return a.date > b.date ? 1 : -1; });

    var allWeek = weekBookings.concat(weekEvents);

    if (badge && allWeek.length > 0) {
      badge.textContent = allWeek.length + ' gig' + (allWeek.length > 1 ? 's' : '');
      badge.style.display = '';
    }

    if (allWeek.length === 0) {
      el.innerHTML = '<div class="field-empty"><i class="fa-solid fa-calendar" style="color:rgba(88,166,255,0.3);"></i>No gigs this week</div>';
      return;
    }

    el.innerHTML = allWeek.slice(0, 5).map(function(item) {
      var isBooking = !!item.stage;
      var title  = item.name || item.title || item.venue || 'Gig';
      var venue  = item.venue || item.location || '';
      var date   = fmtDate(item.eventDate || item.date);
      var color  = isBooking ? stageColor(item.stage) : '#58a6ff';

      return '<div class="field-item" onclick="Router.navigateTo(\'' + (isBooking ? 'dashboard-booking' : 'dashboard-calendar') + '\')" ' +
             'style="border-left:3px solid ' + color + ';">' +
        '<div class="field-item-icon" style="background:rgba(88,166,255,0.10);">' +
          '<i class="fa-solid fa-' + (isBooking ? 'music' : 'calendar-day') + '" style="color:' + color + ';font-size:12px;"></i>' +
        '</div>' +
        '<div class="field-item-body">' +
          '<div class="field-item-title">' + escHtml(title) + '</div>' +
          '<div class="field-item-sub">' + date + (venue ? ' · ' + escHtml(venue) : '') + '</div>' +
        '</div>' +
        (isBooking
          ? '<div class="field-item-meta"><span class="field-badge" style="background:rgba(' + hexToRgb(color) + ',0.15);color:' + color + ';">' + stageLabel(item.stage) + '</span></div>'
          : ''
        ) +
      '</div>';
    }).join('');
  }

  /* ── INVOICES section ────────────────────────────────────── */

  function renderInvoices() {
    var card  = document.getElementById('field-invoices-card');
    var body  = document.getElementById('field-invoices-body');
    var badge = document.getElementById('field-invoices-badge');
    if (!card || !body) return;

    var invoices = (typeof DataStore !== 'undefined' && DataStore.getInvoices) ? DataStore.getInvoices() : [];
    var outstanding = invoices.filter(function(inv) {
      var s = (inv.status || '').toLowerCase();
      return s === 'sent' || s === 'overdue' || s === 'pending' || s === 'unpaid';
    }).sort(function(a, b) {
      // Overdue first
      var aOver = (a.status || '').toLowerCase() === 'overdue';

      return bOver - aOver;
    });

    if (outstanding.length === 0) { card.style.display = 'none'; return; }

    card.style.display = '';
    var total = outstanding.reduce(function(sum, inv) { return sum + (parseFloat(inv.amount) || 0); }, 0);
    if (badge) {
      badge.textContent = outstanding.length + ' · $' + total.toLocaleString('en-US', { minimumFractionDigits: 0 });
    }

    var _invLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());
    body.innerHTML = outstanding.slice(0, 3).map(function(inv) {
      var client  = inv.clientName || inv.client || inv.name || 'Client';
      var amount  = '$' + (parseFloat(inv.amount) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var due     = inv.dueDate || inv.date || '';
      var isOver  = (inv.status || '').toLowerCase() === 'overdue';

        '</div>' +
        '<div class="field-item-body">' +
          '<div class="field-item-title">' + escHtml(client) + '</div>' +

        '</div>' +
        '<div class="field-item-meta"><span class="field-badge" style="background:rgba(' + hexToRgb(color) + ',0.15);color:' + color + ';">' + escHtml(inv.status || 'Pending') + '</span></div>' +
      '</div>';
    }).join('') +
    (outstanding.length > 3
      ? '<div style="text-align:center;padding:8px 0 0;font-size:12px;color:rgba(255,255,255,0.35);">+' + (outstanding.length - 3) + ' more</div>'
      : '');
  }

  /* ── Hex to RGB helper for badge colors ──────────────────── */

  function hexToRgb(hex) {
    var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return r ? parseInt(r[1],16) + ',' + parseInt(r[2],16) + ',' + parseInt(r[3],16) : '255,255,255';
  }

  /* ── Quick Action Modals ─────────────────────────────────── */

  window.fieldAddContact = function() {
    if (typeof Modal === 'undefined') { Router.navigateTo('dashboard-contacts'); return; }
    Modal.open({
      title: 'Add Contact',
      size: 'sm',
      content:
        '<div style="display:flex;flex-direction:column;gap:12px;">' +
          '<div><label class="form-label">Name *</label><input id="fc-name" class="form-input" placeholder="Full name" /></div>' +
          '<div><label class="form-label">Email</label><input id="fc-email" type="email" class="form-input" placeholder="email@example.com" /></div>' +
          '<div><label class="form-label">Phone</label><input id="fc-phone" class="form-input" placeholder="(555) 000-0000" /></div>' +
          '<div><label class="form-label">Company / Venue</label><input id="fc-company" class="form-input" placeholder="Venue or company name" /></div>' +
          '<div><label class="form-label">Note</label><textarea id="fc-note" class="form-input" rows="2" placeholder="How you met, context..."></textarea></div>' +
        '</div>',
      confirmText: 'Add Contact',
      onConfirm: function() {
        var name    = (document.getElementById('fc-name')    || {}).value || '';
        var email   = (document.getElementById('fc-email')   || {}).value || '';
        var phone   = (document.getElementById('fc-phone')   || {}).value || '';
        var company = (document.getElementById('fc-company') || {}).value || '';
        var note    = (document.getElementById('fc-note')    || {}).value || '';
        if (!name.trim()) { Toast.error('Name is required'); return; }

        var token = localStorage.getItem('gbe-session-token') || '';
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['X-GBE-Session'] = token;

        fetch('/api/v1/contacts', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ name: name, email: email, phone: phone, company: company, notes: note, source: 'field-view' })
        })
        .then(function(r) { return r.json(); })
        .then(function() {
          Modal.close();
          if (typeof Toast !== 'undefined') Toast.success('Contact added');
        })
        .catch(function() {
          Modal.close();
          if (typeof Toast !== 'undefined') Toast.error('Could not save — check network connection');
        });
      }
    });
    setTimeout(function() {
      var el = document.getElementById('fc-name');
      if (el) el.focus();
    }, 100);
  };

    if (typeof Modal === 'undefined') { Router.navigateTo('dashboard-calendar'); return; }
    var todayIso = new Date().toISOString().slice(0, 10);
    Modal.open({
      title: 'Block a Date',

  window.fieldInit = function() {
    // Environment badge — INTRANET (gold) vs REMOTE (blue)
    var envBadge = document.getElementById('field-env-badge');
    var _isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());
    if (envBadge) {
      if (_isLocal) {
        envBadge.textContent = 'Intranet';
        envBadge.style.background = 'rgba(212,160,23,0.18)';
        envBadge.style.color = '#d4a017';
      } else {
        envBadge.textContent = 'Remote';
        envBadge.style.background = 'rgba(88,166,255,0.15)';
        envBadge.style.color = '#58a6ff';
      }
    }

    // Hide links to local-only routes when on remote
    if (!_isLocal) {
      // Inbox "View All" link → hide (inbox requires LAN server)
      var inboxLink = document.querySelector('#field-inbox-card .field-card-header a[href="#dashboard-inbox"]');
      if (inboxLink) inboxLink.style.display = 'none';
      // Invoices "All Invoices" link → hide (finances is local-only)
      var invoicesLink = document.querySelector('#field-invoices-card .field-card-header a[href="#dashboard-finances"]');
      if (invoicesLink) invoicesLink.style.display = 'none';
    }

    // Role label — dynamic from Auth
    var roleLabel = document.getElementById('field-role-label');
    var roleRegistry = (typeof SiteConfig !== 'undefined' && SiteConfig.roles) || {};
    var activeRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'band_manager';
    var roleInfo = roleRegistry[activeRole] || { label: activeRole.replace(/_/g, ' '), icon: 'fa-user', color: '#8b949e' };
    if (roleLabel) {
      roleLabel.innerHTML = '<i class="fa-solid ' + (roleInfo.icon || 'fa-user') + '" style="margin-right:5px;color:' + (roleInfo.color || '#8b949e') + ';"></i>' +
        roleInfo.label.charAt(0).toUpperCase() + roleInfo.label.slice(1);
    }

    // ── Apply role theme ──────────────────────────────────────
    var fieldViewEl = document.getElementById('field-view');
    var themeBanner = document.getElementById('field-theme-banner');
    var viewBadge   = document.getElementById('field-view-badge');
    if (fieldViewEl) {
      // Clear previous theme classes
      fieldViewEl.className = fieldViewEl.className.replace(/field-theme-\S+/g, '').trim();
      // Apply current role theme
      fieldViewEl.classList.add('field-theme-' + activeRole);
    }
    if (themeBanner) {
      if (activeRole === 'admin') {
        themeBanner.style.display = '';
        themeBanner.style.background = 'linear-gradient(90deg, rgba(88,166,255,0.25), rgba(88,166,255,0.10))';
        themeBanner.style.color = '#79bbff';
        themeBanner.style.borderBottom = '2px solid rgba(88,166,255,0.35)';
        themeBanner.style.textShadow = '0 0 12px rgba(88,166,255,0.4)';
        themeBanner.innerHTML = '<i class="fa-solid fa-shield-halved" style="margin-right:8px;font-size:15px;"></i>Admin Control Mode';
      } else if (activeRole === 'band_manager') {
        themeBanner.style.display = '';
        themeBanner.style.background = 'linear-gradient(90deg, rgba(212,160,23,0.25), rgba(199,120,217,0.12))';
        themeBanner.style.color = '#e8b82a';
        themeBanner.style.borderBottom = '2px solid rgba(212,160,23,0.35)';
        themeBanner.style.textShadow = '0 0 12px rgba(212,160,23,0.4)';
        themeBanner.innerHTML = '<i class="fa-solid fa-music" style="margin-right:8px;font-size:15px;"></i>Band Manager Mode';
      } else {
        themeBanner.style.display = 'none';
      }
    }
    // Tint the "Field View" badge to match role theme
    if (viewBadge) {
      if (activeRole === 'admin') {
        viewBadge.style.background = 'rgba(88,166,255,0.15)';
        viewBadge.style.color = '#58a6ff';
      } else if (activeRole === 'band_manager') {
        viewBadge.style.background = 'rgba(212,160,23,0.15)';
        viewBadge.style.color = '#d4a017';
      } else {
        viewBadge.style.background = 'rgba(63,185,80,0.15)';
        viewBadge.style.color = '#3fb950';
      }
    }

    // Page header date
    var dateEl = document.getElementById('field-date');
    if (dateEl) {
      dateEl.textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    // ── Field View Role Switcher ──────────────────────────────
    (function setupFieldRoleSwitcher() {
      var switcher = document.getElementById('field-role-switcher');
      var btn      = document.getElementById('field-role-btn');
      var dropdown = document.getElementById('field-role-dropdown');
      var options  = document.getElementById('field-role-options');
      var iconEl   = document.getElementById('field-role-icon');
      var textEl   = document.getElementById('field-role-text');
      if (!switcher || !btn || !dropdown || !options) return;

      var roleRegistry = (typeof SiteConfig !== 'undefined' && SiteConfig.roles) || {};
      var linked = (typeof Auth !== 'undefined' && Auth.getLinkedRoles) ? Auth.getLinkedRoles() : [];
      var validRoles = linked.filter(function(r) { return !!roleRegistry[r]; });

      if (validRoles.length < 2) { switcher.style.display = 'none'; return; }

      var active = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'member';
      var activeInfo = roleRegistry[active] || { label: active, icon: 'fa-user', color: '#8b949e' };

      // Update button appearance
      switcher.style.display = '';
      if (iconEl) { iconEl.className = 'fa-solid ' + activeInfo.icon; iconEl.style.color = activeInfo.color; }
      if (textEl) { textEl.textContent = activeInfo.label; textEl.style.color = activeInfo.color; }
      btn.style.borderColor = activeInfo.color.replace(')', ',0.3)').replace('rgb', 'rgba');

      // Build options
      options.innerHTML = validRoles.map(function(role) {
        var info = roleRegistry[role];
        var isCurrent = (role === active);
        return '<button data-role="' + role + '" style="' +
          'display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;' +
          'background:' + (isCurrent ? 'rgba(255,255,255,0.06)' : 'transparent') + ';' +
          'border:none;color:' + (isCurrent ? info.color : 'rgba(255,255,255,0.8)') + ';' +
          'cursor:pointer;font-size:13px;font-weight:' + (isCurrent ? '700' : '500') + ';' +
          'border-radius:6px;text-align:left;font-family:inherit;">' +
          '<i class="fa-solid ' + info.icon + '" style="color:' + info.color + ';width:16px;"></i>' +
          '<span>' + info.label + '</span>' +
          (isCurrent ? '<i class="fa-solid fa-check" style="margin-left:auto;font-size:10px;"></i>' : '') +
          '</button>';
      }).join('');

      // Toggle dropdown
      btn.onclick = function(e) {
        e.stopPropagation();
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
      };

      // Role option clicks
      options.querySelectorAll('button[data-role]').forEach(function(optBtn) {
        optBtn.onclick = function(e) {
          e.stopPropagation();
          dropdown.style.display = 'none';
          if (typeof Auth !== 'undefined' && Auth.switchRole) {
            Auth.switchRole(optBtn.getAttribute('data-role'));
          }
        };
      });

      // Close on outside tap
      document.addEventListener('click', function _closeFieldRole(e) {
        if (dropdown && !switcher.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    })();

    renderThisWeek();
    renderToday();
    renderInbox();
    renderPipeline();
    renderContracts();
    renderInvoices();
    renderFollowups();
    renderPendingApprovals();

    // ── Strict role separation — no overlap unless duty is shared ──
    var _fRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'band_manager';
    var _isAdmin = (_fRole === 'admin');

    // Admin-only cards (hidden for band_manager)
    var adminOnlyCards = ['field-approvals-card'];
    // Band-manager-only cards (hidden for admin)
    var bmOnlyCards = ['field-week-card','field-today-card','field-inbox-card',
                       'field-pipeline-card','field-followups-card',
                       'field-contracts-card','field-invoices-card'];

    adminOnlyCards.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = _isAdmin ? '' : 'none';
    });
    bmOnlyCards.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = _isAdmin ? 'none' : '';
    });

    // Quick actions — strictly role-owned, zero crossover
    // On remote, swap local-only actions with accessible alternatives
    var qaGrid = document.getElementById('field-quickactions-grid');
    if (qaGrid) {
      function _fBtn(icon, color, label, action) {
        return '<button class="field-action-btn" onclick="' + action + '">' +
          '<i class="fa-solid ' + icon + '" style="font-size:20px;color:' + color + ';margin-bottom:6px;"></i>' +
          label + '</button>';
      }
      if (_isAdmin && _isLocal) {
        // Admin on LAN: system controls
        qaGrid.innerHTML =
          _fBtn('fa-users-gear',     '#d29922', 'Team Mgmt',    "Router.navigateTo('dashboard-team')") +
          _fBtn('fa-gear',           '#8b949e', 'Settings',     "Router.navigateTo('dashboard-settings')") +
          _fBtn('fa-folder-open',    '#d4a017', 'Documents',    "Router.navigateTo('dashboard-documents')") +
          _fBtn('fa-plug',           '#58a6ff', 'Integrations', "Router.navigateTo('dashboard-integrations')") +
          _fBtn('fa-diagram-project','#c778d9', 'Architecture', "Router.navigateTo('dashboard-architecture')") +
          _fBtn('fa-server',         '#3fb950', 'Servers',      "Router.navigateTo('dashboard-servers')");
      } else if (_isAdmin && !_isLocal) {
        // Admin on remote: accessible pages only
        qaGrid.innerHTML =
          _fBtn('fa-users',            '#d29922', 'Roster',      "Router.navigateTo('dashboard-roster')") +
          _fBtn('fa-calendar',         '#58a6ff', 'Calendar',    "Router.navigateTo('dashboard-calendar')") +
          _fBtn('fa-file-signature',   '#3fb950', 'Contracts',   "Router.navigateTo('dashboard-contracts')") +
          _fBtn('fa-ticket',           '#f0883e', 'Bookings',    "Router.navigateTo('dashboard-booking')") +
          _fBtn('fa-shield-halved',    '#c778d9', 'IP & Rights', "Router.navigateTo('dashboard-ip')") +
          _fBtn('fa-compact-disc',     '#d4a017', 'Distribution', "Router.navigateTo('dashboard-distribution')");
      } else if (!_isAdmin && _isLocal) {
        // Band Manager on LAN: full ops actions
        qaGrid.innerHTML =
          _fBtn('fa-building',         '#d29922', 'Add Venue',    'fieldAddVenue()') +
          _fBtn('fa-drum',             '#c778d9', 'Rehearsal',    'fieldScheduleRehearsal()') +
          _fBtn('fa-microphone-lines', '#f0883e', 'New Inquiry',  'fieldNewInquiry()') +
          _fBtn('fa-user-plus',        '#3fb950', 'Add Contact',  'fieldAddContact()') +
          _fBtn('fa-receipt',          '#58a6ff', 'Log Expense',  'fieldLogExpense()') +
          _fBtn('fa-calendar-xmark',   '#8b949e', 'Block Date',   'fieldBlockDate()');
      } else {
        // Band Manager on remote: ops actions that work without LAN server
        qaGrid.innerHTML =
          _fBtn('fa-building',         '#d29922', 'Add Venue',    'fieldAddVenue()') +
          _fBtn('fa-drum',             '#c778d9', 'Rehearsal',    'fieldScheduleRehearsal()') +
          _fBtn('fa-microphone-lines', '#f0883e', 'New Inquiry',  'fieldNewInquiry()') +
          _fBtn('fa-calendar-xmark',   '#58a6ff', 'Block Date',   'fieldBlockDate()') +
          _fBtn('fa-ticket',           '#d4a017', 'Bookings',     "Router.navigateTo('dashboard-booking')") +
          _fBtn('fa-calendar',         '#3fb950', 'Calendar',     "Router.navigateTo('dashboard-calendar')");
      }
    }
  };

  // Add spin keyframe if needed
  if (!document.getElementById('field-spin-style')) {
    var s = document.createElement('style');
    s.id = 'field-spin-style';
    s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(s);
  }

  // Init on load
  fieldInit();

  // Re-render when user switches roles (role label + any role-gated content)
  var _fieldLastRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : null;
  if (typeof Auth !== 'undefined' && Auth.onAuthStateChanged) {
    Auth.onAuthStateChanged(function() {
      var newRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : null;
      if (newRole !== _fieldLastRole) {
        _fieldLastRole = newRole;
        fieldInit();
      }
    });
  }

})();
</script>
