<!-- dashboard/home.html — Dashboard Overview -->
<div class="dashboard-page" id="dash-home">

  <div class="dashboard-page-header">
    <div>
      <h1>Dashboard</h1>
      <p class="text-muted" id="dash-home-subtitle">Welcome back. Here's your overview.</p>
    </div>
  </div>

  <!-- Role-specific content rendered by JS below -->
  <div id="dash-home-main"></div>

</div>

<script>
(function(){
  if(typeof DataStore==='undefined')return;

  var isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());
  var role = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'member';

  /* -------- Role-specific rendering -------- */
  var main = document.getElementById('dash-home-main');
  if (!main) return;

  if (role === 'admin' || role === 'band_manager') {
    renderOperationsDash();
  } else if (role === 'artist') {
    renderArtistDash();
  } else if (role === 'band_member') {
    renderBandMemberDash();
  } else if (role === 'venue_owner' || role === 'promoter') {
    renderClientPortal(role);
  } else {
    renderPendingDash();
  }

  /* ===== ADMIN / BAND MANAGER ===== */
  function renderOperationsDash() {
    function hexToRGB(hex){hex=hex.replace('#','');var r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16);return r+','+g+','+b;}

    main.innerHTML =
      '<div class="metrics-grid" id="metrics-container" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-lg);"></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);margin-top:var(--space-lg);">'+
        '<div class="card" id="activity-container" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);"></div>'+
        '<div class="card" id="quick-actions-container" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
          '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt text-gold"></i> Quick Actions</h3>'+
          '<div id="qa-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-sm);"></div>'+
        '</div>'+
      '</div>'+
      '<div class="card" id="upcoming-events-container" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);"></div>';

    var m = DataStore.getMetrics();
    var cards = [
      {label:'Roster',              value:m.totalRoster,                              icon:'fa-users',              color:'#d4a017', sensitive:false},
      {label:'Active Contracts',    value:m.activeContracts,                          icon:'fa-file-signature',     color:'#58a6ff', sensitive:false},
      {label:'Revenue YTD',         value:Utils.formatCurrency(m.revenueYTD),         icon:'fa-chart-line',         color:'#3fb950', sensitive:true},
      {label:'Upcoming Events',     value:m.upcomingEvents,                           icon:'fa-calendar-days',      color:'#d29922', sensitive:false},
      {label:'Merch Sales',         value:Utils.formatCurrency(m.merchSales),         icon:'fa-bag-shopping',       color:'#d4a017', sensitive:true},
      {label:'Outstanding Invoices',value:Utils.formatCurrency(m.outstandingInvoices),icon:'fa-file-invoice-dollar',color:'#f85149', sensitive:true}
    ];
    var mc = document.getElementById('metrics-container');
    var mHtml = '';
    cards.forEach(function(card){
      if(card.sensitive && !isLocal) return;
      mHtml += '<div class="metric-card glass-card" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-lg);background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);">'+
        '<div style="width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-xl);flex-shrink:0;background:rgba('+hexToRGB(card.color)+',0.15);color:'+card.color+';">'+
        '<i class="fa-solid '+card.icon+'"></i></div>'+
        '<div><div style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:var(--color-text);">'+card.value+'</div>'+
        '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+card.label+'</div></div></div>';
    });
    if(mc) mc.innerHTML = mHtml;

    if(typeof DashboardWidgets!=='undefined'){
      DashboardWidgets.renderActivityFeed('activity-container');
    }

    var qaItems = [
      {href:'#dashboard-roster',   icon:'fa-user-plus',          color:'#d4a017', label:'Add Talent'},
      {href:'#dashboard-contracts',icon:'fa-file-signature',      color:'#58a6ff', label:'New Contract'},
      {href:'#dashboard-booking',  icon:'fa-ticket',              color:'#d4a017', label:'New Booking'},
      {href:'#dashboard-calendar', icon:'fa-calendar-plus',       color:'#d29922', label:'Add Event'},
    ];
    if(isLocal){
      qaItems.push({href:'#dashboard-finances',icon:'fa-dollar-sign',color:'#3fb950',label:'Log Revenue'});
      qaItems.push({href:'#dashboard-ip',      icon:'fa-copyright',  color:'#58a6ff',label:'Register IP'});
    }
    var qaGrid = document.getElementById('qa-grid');
    if(qaGrid){
      var qaHtml = '';
      qaItems.forEach(function(a){
        qaHtml += '<a href="'+a.href+'" class="quick-action-btn glass-card" style="display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid '+a.icon+'" style="font-size:var(--text-lg);color:'+a.color+';"></i><span>'+a.label+'</span></a>';
      });
      qaGrid.innerHTML = qaHtml;
    }

    var uec = document.getElementById('upcoming-events-container');
    if(uec){
      var events = DataStore.getEvents ? DataStore.getEvents() : [];
      var now = new Date();
      var upcoming = events.filter(function(e){return new Date(e.date)>=now;}).slice(0,5);
      var evHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days text-gold"></i> Upcoming Events</h3>';
      if(!upcoming.length){ evHtml += '<p class="text-muted">No upcoming events.</p>'; }
      else {
        evHtml += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
        upcoming.forEach(function(e){
          evHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
            '<div><div style="font-weight:var(--fw-semibold);">'+Utils.escapeHtml(e.title||e.name||'Event')+'</div>'+
            '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+Utils.formatDate(e.date)+(e.venue?' · '+Utils.escapeHtml(e.venue):'')+'</div></div>'+
            '<span style="font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);background:rgba(212,160,23,0.15);color:#d4a017;font-weight:600;">'+Utils.escapeHtml(e.type||'Event')+'</span></div>';
        });
        evHtml += '</div>';
      }
      uec.innerHTML = evHtml;
    }

    /* Inbox widget (local-only) */
    if(isLocal){
      var mc2 = document.getElementById('metrics-container');
      if(mc2){
        var placeholder='<div id="inbox-metric-card" class="metric-card glass-card" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-lg);background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);cursor:pointer;" onclick="if(typeof Router!==\'undefined\')Router.navigateTo(\'dashboard-inbox\');">'+
          '<div style="width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-xl);flex-shrink:0;background:rgba(212,160,23,0.15);color:#d4a017;"><i class="fa-solid fa-envelope"></i></div>'+
          '<div><span id="inbox-metric-count" style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:var(--color-text);">—</span>'+
          '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);">Unread Inquiries</div></div></div>';
        mc2.insertAdjacentHTML('beforeend', placeholder);
        var sess=localStorage.getItem('gbe-session-token');
        var h={'Content-Type':'application/json'};
        if(sess) h['X-GBE-Session']=sess;
        if(typeof SiteConfig!=='undefined'&&SiteConfig.server&&SiteConfig.server.apiKey) h['Authorization']='Bearer '+SiteConfig.server.apiKey;
        fetch('/api/v1/inbox/stats',{headers:h})
          .then(function(r){ return r.ok?r.json():null; })
          .then(function(s){ var el=document.getElementById('inbox-metric-count'); if(el&&s) el.textContent=s.unread; })
          .catch(function(){ var el=document.getElementById('inbox-metric-count'); if(el) el.textContent='—'; });
      }
    }

    document.addEventListener('gbe:data-updated', renderOperationsDash);
  }

  /* ===== ARTIST ===== */
  function renderArtistDash() {
    var events = DataStore.getEvents ? DataStore.getEvents() : [];
    var now = new Date();
    var upcoming = events.filter(function(e){return new Date(e.date)>=now;}).slice(0,5);
    var contracts = DataStore.getContracts ? DataStore.getContracts().filter(function(c){return c.status==='active';}) : [];

    var html =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);">'+

      /* My Schedule */
      '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
        '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days" style="color:#d4a017;"></i> My Schedule</h3>';
    if(!upcoming.length){ html += '<p class="text-muted">No upcoming shows scheduled.</p>'; }
    else {
      html += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
      upcoming.forEach(function(e){
        html += '<div style="padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
          '<div style="font-weight:600;">'+Utils.escapeHtml(e.title||e.name||'Show')+'</div>'+
          '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+Utils.formatDate(e.date)+(e.venue?' · '+Utils.escapeHtml(e.venue):'')+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>'+

    /* My Contracts */
    '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
      '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-file-signature" style="color:#58a6ff;"></i> My Contracts</h3>';
    if(!contracts.length){ html += '<p class="text-muted">No active contracts.</p>'; }
    else {
      html += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
      contracts.slice(0,4).forEach(function(c){
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
          '<div style="font-weight:600;">'+Utils.escapeHtml(c.title||c.artist||'Contract')+'</div>'+
          '<span style="font-size:var(--text-xs);padding:3px 8px;border-radius:var(--radius-full);background:rgba(63,185,80,0.15);color:#3fb950;font-weight:600;">Active</span></div>';
      });
      html += '</div>';
    }
    html += '</div></div>'+

    /* Quick Links row */
    '<div style="margin-top:var(--space-lg);">'+
      '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt" style="color:#d4a017;"></i> Quick Links</h3>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-sm);">'+
        '<a href="#dashboard-calendar" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-calendar-days" style="font-size:20px;color:#d29922;"></i><span>Calendar</span></a>'+
        '<a href="#dashboard-distribution" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-tower-broadcast" style="font-size:20px;color:#58a6ff;"></i><span>Distribution</span></a>'+
        '<a href="#dashboard-ip" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-copyright" style="font-size:20px;color:#c778d9;"></i><span>IP &amp; Rights</span></a>'+
        '<a href="#dashboard-merch" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-bag-shopping" style="font-size:20px;color:#d4a017;"></i><span>Merch</span></a>'+
        '<a href="#dashboard-travel" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-plane" style="font-size:20px;color:#3fb950;"></i><span>Travel</span></a>'+
      '</div>'+
    '</div>';

    main.innerHTML = html;
  }

  /* ===== BAND MEMBER ===== */
  function renderBandMemberDash() {
    var events = DataStore.getEvents ? DataStore.getEvents() : [];
    var now = new Date();
    var upcoming = events.filter(function(e){return new Date(e.date)>=now;}).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var nextGig = upcoming[0] || null;

    var html =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);">'+

      /* Next Gig */
      '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
        '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-music" style="color:#3fb950;"></i> Next Gig</h3>';
    if(!nextGig){
      html += '<p class="text-muted">No upcoming gigs scheduled.</p>';
    } else {
      var gigDate = new Date(nextGig.date);
      var daysUntil = Math.ceil((gigDate-now)/(1000*60*60*24));
      html +=
        '<div style="font-size:var(--text-2xl);font-weight:700;color:#3fb950;margin-bottom:4px;">'+daysUntil+' days away</div>'+
        '<div style="font-weight:600;font-size:var(--text-lg);margin-bottom:4px;">'+Utils.escapeHtml(nextGig.title||nextGig.name||'Show')+'</div>'+
        '<div style="color:var(--color-text-muted);font-size:var(--text-sm);">'+Utils.formatDate(nextGig.date)+(nextGig.venue?' · '+Utils.escapeHtml(nextGig.venue):'')+'</div>';
    }
    html += '</div>'+

    /* Schedule */
    '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
      '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days" style="color:#d4a017;"></i> Upcoming Schedule</h3>';
    if(!upcoming.length){ html += '<p class="text-muted">Nothing scheduled yet.</p>'; }
    else {
      html += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
      upcoming.slice(0,4).forEach(function(e){
        html += '<div style="padding:10px 12px;border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
          '<div style="font-weight:600;font-size:var(--text-sm);">'+Utils.escapeHtml(e.title||e.name||'Event')+'</div>'+
          '<div style="font-size:var(--text-xs);color:var(--color-text-muted);">'+Utils.formatDate(e.date)+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div></div>'+

    /* Quick Links */
    '<div style="margin-top:var(--space-lg);">'+
      '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt" style="color:#d4a017;"></i> Quick Links</h3>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-sm);">'+
        '<a href="#dashboard-calendar" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-calendar-days" style="font-size:20px;color:#d29922;"></i><span>Calendar</span></a>'+
        '<a href="#dashboard-travel" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid fa-plane" style="font-size:20px;color:#3fb950;"></i><span>Travel</span></a>'+
      '</div>'+
    '</div>';

    main.innerHTML = html;
  }

  /* ===== VENUE OWNER / PROMOTER ===== */
  function renderClientPortal(role) {
    var roleLabel = role === 'venue_owner' ? 'Venue Owner' : 'Promoter';
    var icon = role === 'venue_owner' ? 'fa-building' : 'fa-bullhorn';
    var color = role === 'venue_owner' ? '#d29922' : '#f0883e';
    main.innerHTML =
      '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-xl);max-width:600px;">'+
        '<div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-lg);">'+
          '<div style="width:56px;height:56px;border-radius:var(--radius-md);background:rgba(212,160,23,0.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:'+color+';">'+
            '<i class="fa-solid '+icon+'"></i></div>'+
          '<div><div style="font-size:var(--text-lg);font-weight:700;">Welcome, '+roleLabel+'</div>'+
            '<div style="color:var(--color-text-muted);font-size:var(--text-sm);">Gold Bottom Entertainment Client Portal</div></div></div>'+
        '<p style="color:var(--color-text-secondary);margin-bottom:var(--space-md);">Your booking details and contract documents are managed by your Gold Bottom Entertainment contact.</p>'+
        '<div style="padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">'+
          '<div style="font-weight:600;margin-bottom:4px;"><i class="fa-solid fa-envelope" style="color:#d4a017;margin-right:8px;"></i>Contact Your Rep</div>'+
          '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">info@goldbottom-ent.com</div></div>'+
        '<div style="margin-top:var(--space-md);">'+
          '<a href="#dashboard-contracts" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-md);background:#d4a017;color:#0d1117;font-weight:700;font-size:var(--text-sm);text-decoration:none;">'+
            '<i class="fa-solid fa-file-signature"></i> View My Contract</a></div>'+
      '</div>';
  }

  /* ===== MEMBER / PENDING ===== */
  function renderPendingDash() {
    main.innerHTML =
      '<div class="card" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-xl);max-width:560px;">'+
        '<div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-lg);">'+
          '<div style="width:56px;height:56px;border-radius:50%;background:rgba(139,148,158,0.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:#8b949e;">'+
            '<i class="fa-solid fa-user-clock"></i></div>'+
          '<div><div style="font-size:var(--text-lg);font-weight:700;">Account Active</div>'+
            '<div style="color:var(--color-text-muted);font-size:var(--text-sm);">Awaiting role assignment</div></div></div>'+
        '<p style="color:var(--color-text-secondary);">Your account is set up but a specific role hasn\'t been assigned yet. An admin will assign your role shortly — you\'ll see your personalized dashboard once that\'s done.</p>'+
        '<div style="margin-top:var(--space-lg);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);font-size:var(--text-sm);color:var(--color-text-muted);">'+
          '<i class="fa-solid fa-circle-info" style="color:#58a6ff;margin-right:8px;"></i>Contact <strong style="color:var(--color-text);">info@goldbottom-ent.com</strong> if you need access sooner.</div>'+
      '</div>';
  }
})();
</script>
