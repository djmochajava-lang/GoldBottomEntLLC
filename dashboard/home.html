<!-- dashboard/home.html — Dashboard Overview -->
<div class="dashboard-page" id="dash-home">

  <div class="dashboard-page-header">
    <div>
      <h1>Dashboard</h1>
      <p class="text-muted" id="dash-home-subtitle">Welcome back. Here's your overview.</p>
    </div>
  </div>

  <!-- Role-specific content rendered by JS below -->
  <div id="dash-home-main"></div>

</div>

<script>
(function(){
  if(typeof DataStore==='undefined')return;

  var isLocal = (typeof Auth !== 'undefined' && Auth.isLocalDashboard && Auth.isLocalDashboard());

  /* -------- Role-specific rendering -------- */
  var main = document.getElementById('dash-home-main');
  if (!main) return;

  var _lastRole = null;
  function renderDash() {
    var role = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : 'member';
    if (role === _lastRole) return; // no change — skip re-render
    _lastRole = role;
    if (role === 'admin') {
      renderAdminDash();
    } else if (role === 'band_manager') {
      renderBandManagerDash();
    } else if (role === 'artist') {
      renderArtistDash();
    } else if (role === 'band_member') {
      renderBandMemberDash();
    } else if (role === 'venue_owner' || role === 'promoter') {
      renderClientPortal(role);
    } else {
      renderPendingDash();
    }
  }

  /* ===== HELPER ===== */
  function hexToRGB(hex){hex=hex.replace('#','');var r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16);return r+','+g+','+b;}
  function _isZeroValue(v){
    if(v===0||v==='0') return true;
    if(typeof v==='string'&&/^\$?0(\.00)?$/.test(v.trim())) return true;
    return false;
  }
  function metricCard(icon,color,value,label,onclick){
    var emptyHint = _isZeroValue(value) ? '<div style="font-size:var(--text-xs);color:var(--color-text-muted);opacity:0.7;margin-top:2px;font-style:italic;">No data yet</div>' : '';
    return '<div class="metric-card glass-card" style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-lg);background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);'+(onclick?'cursor:pointer;':'')+'" '+(onclick?'onclick="'+onclick+'"':'')+'>'+
      '<div style="width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-xl);flex-shrink:0;background:rgba('+hexToRGB(color)+',0.15);color:'+color+';">'+
      '<i class="fa-solid '+icon+'"></i></div>'+
      '<div><div style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:var(--color-text);">'+value+'</div>'+
      '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+label+'</div>'+emptyHint+'</div></div>';
  }
  function qaBtn(href,icon,color,label){
    return '<a href="'+href+'" class="quick-action-btn glass-card" style="display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);"><i class="fa-solid '+icon+'" style="font-size:var(--text-lg);color:'+color+';"></i><span>'+label+'</span></a>';
  }

  /* ===== ADMIN — System Control Panel ===== */
  function renderAdminDash() {
    var subtitle = document.getElementById('dash-home-subtitle');
    if(subtitle) subtitle.textContent = 'Administrator · Full System Access';

    var m = DataStore.getMetrics();
    var db = (typeof Auth !== 'undefined' && Auth._db) ? Auth._db : null;

    main.innerHTML =
      /* Metrics row — all metrics including sensitive */
      '<div id="admin-metrics" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-lg);"></div>'+

      /* System status + User approvals */
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));gap:var(--space-lg);margin-top:var(--space-lg);">'+
        '<div class="card" id="admin-activity" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);"></div>'+
        '<div class="card" id="admin-system" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
          '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-shield-halved" style="color:#58a6ff;"></i> System Controls</h3>'+
          '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));gap:var(--space-sm);" id="admin-sys-grid"></div>'+
        '</div>'+
      '</div>'+

      /* Pending approvals */
      '<div class="card" id="admin-approvals" style="display:none;background:var(--color-bg-secondary);border:1px solid rgba(210,153,34,0.35);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);"></div>';

    /* Metrics */
    var mHtml =
      metricCard('fa-users',              '#d4a017', m.totalRoster,                              'Roster') +
      metricCard('fa-file-signature',     '#58a6ff', m.activeContracts,                          'Active Contracts') +
      metricCard('fa-calendar-days',      '#d29922', m.upcomingEvents,                           'Upcoming Events');
    if(isLocal){
      mHtml +=
        metricCard('fa-chart-line',         '#3fb950', Utils.formatCurrency(m.revenueYTD),         'Revenue YTD') +
        metricCard('fa-file-invoice-dollar','#f85149', Utils.formatCurrency(m.outstandingInvoices),'Outstanding Invoices') +
        metricCard('fa-bag-shopping',       '#d4a017', Utils.formatCurrency(m.merchSales),         'Merch Sales');
      /* Inbox count */
      mHtml += metricCard('fa-envelope','#d4a017','—','Unread Inquiries','if(typeof Router!==\'undefined\')Router.navigateTo(\'dashboard-inbox\')');
      Utils.apiFetch('/api/v1/inbox/stats')
        .then(function(r){return r.ok?r.json():null;})
        .then(function(s){var el=document.getElementById('inbox-metric-count');if(el&&s)el.textContent=s.unread;})
        .catch(function(){});
    }
    var am = document.getElementById('admin-metrics');
    if(am) am.innerHTML = mHtml;

    /* Activity feed */
    if(typeof DashboardWidgets!=='undefined') DashboardWidgets.renderActivityFeed('admin-activity');

    /* System controls */
    var sysGrid = document.getElementById('admin-sys-grid');
    if(sysGrid){
      var sysItems = [
        {href:'#dashboard-team',         icon:'fa-users-gear',   color:'#d29922', label:'Team Mgmt'},
        {href:'#dashboard-settings',     icon:'fa-gear',         color:'#8b949e', label:'Settings'},
        {href:'#dashboard-integrations', icon:'fa-plug',         color:'#58a6ff', label:'Integrations'},
        {href:'#dashboard-documents',    icon:'fa-folder-open',  color:'#d4a017', label:'Documents'},
      ];
      if(isLocal){
        sysItems.push({href:'#dashboard-architecture',icon:'fa-diagram-project',color:'#c778d9',label:'Architecture'});
        sysItems.push({href:'#dashboard-credentials', icon:'fa-key',            color:'#f0883e', label:'Credentials'});
        sysItems.push({href:'#dashboard-servers',     icon:'fa-server',         color:'#3fb950', label:'Servers'});
        sysItems.push({href:'#dashboard-finances',    icon:'fa-dollar-sign',    color:'#3fb950', label:'Finances'});
      }
      sysGrid.innerHTML = sysItems.map(function(a){return qaBtn(a.href,a.icon,a.color,a.label);}).join('');
    }

    /* Pending approvals widget */
    if(db){
      db.collection('users').where('status','==','pending').get()
        .then(function(snap){
          var _currentRole = (typeof Auth !== 'undefined' && Auth.getRole) ? Auth.getRole() : '';
          if (_currentRole !== 'admin' && _currentRole !== 'band_manager') return;
          var card = document.getElementById('admin-approvals');
          if(!card||snap.size===0) return;
          card.style.display='';
          var html='<h3 style="margin-bottom:var(--space-md);color:#d29922;"><i class="fa-solid fa-user-clock"></i> '+snap.size+' Pending Approval'+(snap.size>1?'s':'')+'</h3>'+
            '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
          snap.forEach(function(doc){
            var d=doc.data();
            html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid rgba(210,153,34,0.2);">'+
              '<div><div style="font-weight:600;">'+Utils.escapeHtml(d.displayName||'Unknown')+'</div>'+
              '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+Utils.escapeHtml(d.email||'')+'</div></div>'+
              '<a href="#dashboard-team" style="padding:6px 14px;border-radius:var(--radius-md);background:#d29922;color:#0d1117;font-size:var(--text-sm);font-weight:700;text-decoration:none;">Review</a></div>';
          });
          html+='</div>';
          card.innerHTML=html;
        }).catch(function(){});
    }

    document.addEventListener('gbe:data-updated', renderAdminDash);
  }

  /* ===== BAND MANAGER — Operations Dashboard ===== */
  function renderBandManagerDash() {
    var subtitle = document.getElementById('dash-home-subtitle');
    if(subtitle) subtitle.textContent = 'Band Manager · Day-to-Day Operations';

    var m        = DataStore.getMetrics();
    var bookings = DataStore.getBookings ? DataStore.getBookings() : [];
    var contracts= DataStore.getContracts ? DataStore.getContracts() : [];
    var now      = new Date();
    var todayStr = now.toISOString().slice(0,10);

    /* Pipeline action items */
    var actionStages = ['proposed','negotiating','confirmed'];
    var pipelineItems = bookings.filter(function(b){return actionStages.indexOf(b.stage)!==-1;})
      .sort(function(a,b){var p={negotiating:0,proposed:1,confirmed:2};return(p[a.stage]||9)-(p[b.stage]||9);});

    /* Contracts needing action */
    var pendingContracts = contracts.filter(function(c){
      var s=(c.status||'').toLowerCase();
      return s==='pending'||s==='pending-signature'||s==='sent'||s==='draft';
    });

    /* Follow-ups: proposed bookings stale 3+ days */
    var staleFollowups = bookings.filter(function(b){
      if(b.stage!=='proposed') return false;
      var diff=(Date.now()-new Date(b.updatedAt||b.createdAt||0).getTime())/86400000;
      return diff>=3;
    });

    main.innerHTML =
      /* Ops metrics */
      '<div id="bm-metrics" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-lg);"></div>'+

      /* Pipeline + Quick Actions */
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));gap:var(--space-lg);margin-top:var(--space-lg);">'+
        '<div class="card" id="bm-pipeline" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);"></div>'+
        '<div class="card" id="bm-qa-wrap" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);">'+
          '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt text-gold"></i> Quick Actions</h3>'+
          '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 90px), 1fr));gap:var(--space-sm);" id="bm-qa-grid"></div>'+
        '</div>'+
      '</div>'+

      /* Pending Agreements */
      '<div class="card" id="bm-pending-agreements" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);"></div>'+

      /* Upcoming shows */
      '<div class="card" id="bm-upcoming" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);"></div>'+

      /* Band Readiness (Firestore-backed) */
      '<div class="card" id="bm-band-readiness" style="background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-top:var(--space-lg);"></div>';

    /* Ops metrics */
    var bmHtml =
      metricCard('fa-filter',          '#f0883e', pipelineItems.length,    'Pipeline Actions') +
      metricCard('fa-file-signature',  '#3fb950', m.activeContracts,       'Active Contracts') +
      metricCard('fa-pen-nib',         '#d29922', pendingContracts.length,  'Pending Signatures') +
      metricCard('fa-calendar-days',   '#d29922', m.upcomingEvents,        'Upcoming Shows') +
      metricCard('fa-clock-rotate-left','#c778d9', staleFollowups.length,  'Follow-ups Due') +
      metricCard('fa-users',           '#d4a017', m.totalRoster,           'Roster');
    if(isLocal){
      bmHtml += metricCard('fa-chart-line','#3fb950',Utils.formatCurrency(m.revenueYTD),'Revenue YTD');
    }
    var bmm = document.getElementById('bm-metrics');
    if(bmm) bmm.innerHTML = bmHtml;

    /* Pipeline card */
    var bmp = document.getElementById('bm-pipeline');
    if(bmp){
      var pHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-filter" style="color:#f0883e;"></i> Pipeline — Needs Action</h3>';
      if(!pipelineItems.length){
        pHtml += '<p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check-circle" style="color:#3fb950;"></i>Pipeline is clear</p>';
      } else {
        var stageColors={lead:'#8b949e',qualified:'#58a6ff',proposed:'#d4a017',negotiating:'#f0883e',confirmed:'#3fb950',contracted:'#3fb950',completed:'#3fb950',closed:'#f85149'};
        var stageLabels={lead:'New Lead',qualified:'Qualified',proposed:'Proposed',negotiating:'Negotiating',confirmed:'Confirmed',contracted:'Contracted',completed:'Completed',closed:'Closed'};
        pHtml += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
        pipelineItems.slice(0,5).forEach(function(b){
          var color = stageColors[b.stage]||'#8b949e';
          pHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid '+color+';">'+
            '<div><div style="font-weight:600;">'+Utils.escapeHtml(b.clientName||b.venue||'Client')+'</div>'+
            '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+(b.eventDate?Utils.formatDate(b.eventDate):'')+' '+Utils.escapeHtml(b.venue||'')+'</div></div>'+
            '<span style="font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);background:rgba('+hexToRGB(color)+',0.15);color:'+color+';font-weight:600;white-space:nowrap;">'+stageLabels[b.stage]+'</span></div>';
        });
        pHtml += '</div>';
        if(pipelineItems.length>5) pHtml += '<p style="margin-top:var(--space-sm);font-size:var(--text-sm);color:var(--color-text-muted);">+' + (pipelineItems.length-5) + ' more</p>';
      }
      pHtml += '<a href="#dashboard-booking" style="display:inline-flex;align-items:center;gap:6px;margin-top:var(--space-md);font-size:var(--text-sm);color:#f0883e;text-decoration:none;font-weight:600;">Full Pipeline <i class="fa-solid fa-arrow-right"></i></a>';
      bmp.innerHTML = pHtml;
    }

    /* Quick actions — booking operations only */
    var qaGrid = document.getElementById('bm-qa-grid');
    if(qaGrid){
      var qaItems = [
        {href:'#dashboard-booking',  icon:'fa-ticket',         color:'#f0883e', label:'New Booking'},
        {href:'#dashboard-contracts',icon:'fa-file-signature', color:'#3fb950', label:'Contracts'},
        {href:'#dashboard-roster',   icon:'fa-users',          color:'#d4a017', label:'Roster'},
        {href:'#dashboard-calendar', icon:'fa-calendar-plus',  color:'#d29922', label:'Calendar'},
        {href:'#dashboard-leads',    icon:'fa-binoculars',     color:'#c778d9', label:'Leads'},
        {href:'#dashboard-contacts', icon:'fa-address-book',   color:'#58a6ff', label:'Contacts'},
      ];
      if(isLocal) qaItems.push({href:'#dashboard-finances',icon:'fa-dollar-sign',color:'#3fb950',label:'Finances'});
      qaGrid.innerHTML = qaItems.map(function(a){return qaBtn(a.href,a.icon,a.color,a.label);}).join('');
    }

    /* Pending Agreements — from Firestore */
    var pendAgEl = document.getElementById('bm-pending-agreements');
    if (pendAgEl && typeof Auth !== 'undefined' && Auth._db) {
      Auth._db.collection('agreements')
        .where('status', 'in', ['sent', 'pending'])
        .orderBy('sentAt', 'desc')
        .limit(10)
        .get()
        .then(function(snap) {
          var paHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-file-signature" style="color:#d29922;"></i> Pending Agreements</h3>';
          if (snap.empty) {
            paHtml += '<p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check-circle" style="color:#3fb950;"></i> All agreements signed</p>';
          } else {
            paHtml += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
            snap.forEach(function(doc) {
              var a = doc.data();
              var sentDate = a.sentAt && a.sentAt.toDate ? a.sentAt.toDate().toLocaleDateString() : '';
              var statusColor = a.status === 'sent' ? '#d29922' : '#f0883e';
              paHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid ' + statusColor + ';">'
                + '<div><div style="font-weight:600;">' + Utils.escapeHtml(a.title || a.templateTitle || 'Agreement') + '</div>'
                + '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">' + Utils.escapeHtml(a.musicianName || 'Unknown') + (sentDate ? ' · Sent ' + sentDate : '') + '</div></div>'
                + '<span style="font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);background:rgba(' + hexToRGB(statusColor) + ',0.15);color:' + statusColor + ';font-weight:600;">' + Utils.escapeHtml(a.status) + '</span>'
                + '</div>';
            });
            paHtml += '</div>';
            paHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-md);">'
              + '<span style="font-size:var(--text-sm);color:var(--color-text-muted);">' + snap.size + ' awaiting signature</span>'
              + '<a href="#dashboard-contracts" style="font-size:var(--text-sm);color:#d29922;text-decoration:none;font-weight:600;">View All <i class="fa-solid fa-arrow-right"></i></a></div>';
          }
          pendAgEl.innerHTML = paHtml;
        })
        .catch(function(err) {
          pendAgEl.innerHTML = '<h3><i class="fa-solid fa-file-signature" style="color:#d29922;"></i> Pending Agreements</h3><p class="text-muted">Could not load: ' + err.message + '</p>';
        });
    } else if (pendAgEl) {
      // Fallback to DataStore contracts
      var paHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-file-signature" style="color:#d29922;"></i> Pending Agreements</h3>';
      if (!pendingContracts.length) {
        paHtml += '<p class="text-muted" style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check-circle" style="color:#3fb950;"></i> All agreements signed</p>';
      } else {
        paHtml += '<div style="display:flex;flex-direction:column;gap:var(--space-sm);">';
        pendingContracts.slice(0, 5).forEach(function(c) {
          paHtml += '<div style="padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid #d29922;">'
            + '<div style="font-weight:600;">' + Utils.escapeHtml(c.title || c.name || 'Contract') + '</div>'
            + '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">' + Utils.escapeHtml(c.party || '') + '</div></div>';
        });
        paHtml += '</div>';
        paHtml += '<a href="#dashboard-contracts" style="display:inline-flex;align-items:center;gap:6px;margin-top:var(--space-md);font-size:var(--text-sm);color:#d29922;text-decoration:none;font-weight:600;">View All <i class="fa-solid fa-arrow-right"></i></a>';
      }
      pendAgEl.innerHTML = paHtml;
    }

    /* Upcoming shows */
    var upc = document.getElementById('bm-upcoming');
    if(upc){
      var events   = DataStore.getEvents ? DataStore.getEvents() : [];
      var upcoming = events.filter(function(e){return new Date(e.date)>=now;}).slice(0,5);
      var confirmedShows = bookings.filter(function(b){
        return (b.stage==='confirmed'||b.stage==='contracted')&&(b.eventDate||b.date)>=todayStr;
      }).sort(function(a,b){return(a.eventDate||a.date)>(b.eventDate||b.date)?1:-1;}).slice(0,5);

      var uHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days text-gold"></i> Upcoming Shows & Events</h3>';
      var allUp = confirmedShows.concat(upcoming).slice(0,6);
      if(!allUp.length){ uHtml += '<p class="text-muted">No upcoming shows scheduled.</p>'; }
      else {
        uHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 260px), 1fr));gap:var(--space-sm);">';
        allUp.forEach(function(item){
          var isBooking = !!item.stage;
          var title  = item.clientName||item.name||item.title||'Event';
          var venue  = item.venue||item.location||'';
          var date   = Utils.formatDate(item.eventDate||item.date);
          var color  = isBooking ? '#3fb950' : '#d4a017';
          uHtml += '<div style="padding:var(--space-sm) var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-left:3px solid '+color+';">'+
            '<div style="font-weight:600;">'+Utils.escapeHtml(title)+'</div>'+
            '<div style="font-size:var(--text-sm);color:var(--color-text-muted);">'+date+(venue?' · '+Utils.escapeHtml(venue):'')+'</div>'+
            (isBooking?'<span style="font-size:var(--text-xs);padding:2px 8px;border-radius:var(--radius-full);background:rgba(63,185,80,0.12);color:#3fb950;font-weight:600;">'+Utils.escapeHtml(item.stage)+'</span>':'')+'</div>';
        });
        uHtml += '</div>';
      }
      upc.innerHTML = uHtml;
    }

    /* Band Readiness — Firestore-backed practice + checkpoint monitoring */
    var readinessEl = document.getElementById('bm-band-readiness');
    if (readinessEl && typeof Auth !== 'undefined' && Auth._db) {
      var fdb = Auth._db;
      fdb.collection('gigs').where('status', '==', 'upcoming').orderBy('date', 'asc').limit(5).get()
        .then(function(gigsSnap) {
          if (gigsSnap.empty) {
            readinessEl.innerHTML = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-users-viewfinder" style="color:#3fb950;"></i> Band Readiness</h3><p class="text-muted">No upcoming gigs published to Firestore.</p>';
            return;
          }

          var gigIds = [];
          var gigsMap = {};
          gigsSnap.forEach(function(doc) { var d = doc.data(); d._id = doc.id; gigsMap[doc.id] = d; gigIds.push(doc.id); });

          // Load checkpoints and playback events
          Promise.all([
            fdb.collection('rehearsal-checkpoints').get(),
            fdb.collection('playback-events').where('eventType', '==', 'complete').get(),
            fdb.collection('track-notes').where('flagged', '==', true).get()
          ]).then(function(results) {
            var checkpoints = {};
            results[0].forEach(function(doc) { var d = doc.data(); if (!checkpoints[d.gigId]) checkpoints[d.gigId] = []; checkpoints[d.gigId].push(d); });

            var practiceByUser = {};
            results[1].forEach(function(doc) { var d = doc.data(); if (!practiceByUser[d.userId]) practiceByUser[d.userId] = new Set(); practiceByUser[d.userId].add(d.trackId); });

            var flaggedNotes = [];
            results[2].forEach(function(doc) { flaggedNotes.push(doc.data()); });

            var rHtml = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-users-viewfinder" style="color:#3fb950;"></i> Band Readiness</h3>';

            gigIds.forEach(function(gigId) {
              var gig = gigsMap[gigId];
              var gigDate = gig.date && gig.date.toDate ? gig.date.toDate() : new Date(gig.date);
              var gCps = checkpoints[gigId] || [];
              var musicians = gig.assignedMusicians || [];

              rHtml += '<div style="margin-bottom:var(--space-md);padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-tertiary);border:1px solid var(--color-border);">';
              rHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-sm);">';
              rHtml += '<strong>' + (gig.title||'Gig') + '</strong>';
              rHtml += '<span style="font-size:var(--text-xs);color:var(--color-text-muted);">' + gigDate.toLocaleDateString() + '</span></div>';

              if (musicians.length === 0) {
                rHtml += '<p style="font-size:var(--text-sm);color:var(--color-text-muted);">No musicians assigned.</p>';
              } else {
                rHtml += '<div style="display:flex;flex-direction:column;gap:4px;">';
                musicians.forEach(function(uid) {
                  var cp = gCps.find(function(c) { return c.musicianId === uid; });
                  var tracksPlayed = practiceByUser[uid] ? practiceByUser[uid].size : 0;
                  var cpDone = cp ? (cp.setlistReady && cp.gearReady && cp.travelReady) : false;

                  rHtml += '<div style="display:flex;align-items:center;gap:var(--space-sm);font-size:var(--text-sm);">';
                  rHtml += '<i class="fa-solid ' + (cpDone ? 'fa-circle-check' : 'fa-circle') + '" style="color:' + (cpDone ? '#3fb950' : '#8b949e') + ';"></i>';
                  rHtml += '<span style="flex:1;">' + uid.slice(0, 8) + '...</span>';
                  rHtml += '<span style="color:var(--color-text-muted);">' + tracksPlayed + ' tracks</span>';
                  if (cp) rHtml += '<span style="color:#d4a017;font-size:11px;">' + (cp.selfRating||'?') + '/5</span>';
                  rHtml += '</div>';
                });
                rHtml += '</div>';
              }
              rHtml += '</div>';
            });

            // Flagged notes
            if (flaggedNotes.length > 0) {
              rHtml += '<div style="margin-top:var(--space-md);padding:var(--space-md);border-radius:var(--radius-md);background:rgba(210,153,34,0.08);border:1px solid rgba(210,153,34,0.2);">';
              rHtml += '<h4 style="margin:0 0 var(--space-sm);font-size:var(--text-sm);color:#d29922;"><i class="fa-solid fa-flag"></i> Flagged Notes (' + flaggedNotes.length + ')</h4>';
              flaggedNotes.slice(0, 5).forEach(function(n) {
                rHtml += '<div style="font-size:var(--text-sm);padding:3px 0;border-bottom:1px solid var(--color-border);">';
                rHtml += '<strong>' + (n.songTitle||'Track') + '</strong> — ' + (n.userName||'Musician');
                if (n.notes) rHtml += '<div style="color:var(--color-text-muted);font-style:italic;">"' + n.notes.slice(0, 100) + '"</div>';
                rHtml += '</div>';
              });
              rHtml += '</div>';
            }

            readinessEl.innerHTML = rHtml;
          });
        })
        .catch(function(err) {
          readinessEl.innerHTML = '<h3><i class="fa-solid fa-users-viewfinder" style="color:#3fb950;"></i> Band Readiness</h3><p class="text-muted">Could not load: ' + err.message + '</p>';
        });
    }

    document.addEventListener('gbe:data-updated', renderBandManagerDash);
  }

  /* ===== BAND MEMBER ===== */
  function renderBandMemberDash() {
    var db = (typeof Auth !== 'undefined' && Auth._db) ? Auth._db : null;
    var uid = (typeof Auth !== 'undefined' && Auth._currentUser) ? Auth._currentUser.uid : null;
    var subtitle = document.getElementById('dash-home-subtitle');

    var cardStyle = 'background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-lg);';
    var qlStyle = 'display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-md);border-radius:var(--radius-md);background:var(--color-bg-secondary);border:1px solid var(--color-border);text-decoration:none;color:var(--color-text-secondary);text-align:center;font-size:var(--text-sm);';

    main.innerHTML =
      /* Agreement alert slot — filled async */
      '<div id="bm-agreement-alert" style="margin-bottom:var(--space-lg);"></div>'+

      /* 2-col info grid */
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));gap:var(--space-lg);" id="bm-info-grid">'+
        '<div class="card" style="'+cardStyle+'" id="bm-next-show">'+
          '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days" style="color:#3fb950;"></i> Next Show</h3>'+
          '<p class="text-muted">Loading...</p>'+
        '</div>'+
        '<div class="card" style="'+cardStyle+'" id="bm-playlist">'+
          '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-music" style="color:#d4a017;"></i> Rehearsal Playlist</h3>'+
          '<p class="text-muted">Loading...</p>'+
        '</div>'+
      '</div>'+

      /* Quick Links */
      '<div style="margin-top:var(--space-lg);">'+
        '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-bolt" style="color:#d4a017;"></i> Quick Links</h3>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-sm);">'+
          '<a href="#dashboard-calendar" style="'+qlStyle+'"><i class="fa-solid fa-calendar-days" style="font-size:20px;color:#d29922;"></i><span>Calendar</span></a>'+
          '<a href="#dashboard-travel" style="'+qlStyle+'"><i class="fa-solid fa-plane" style="font-size:20px;color:#3fb950;"></i><span>Travel</span></a>'+
          '<a href="#dashboard-agreements" style="'+qlStyle+'"><i class="fa-solid fa-file-signature" style="font-size:20px;color:#d4a017;"></i><span>Agreements</span></a>'+

        '</div>'+
      '</div>';

    /* ---- TASK-001: Pending agreements (Firestore) ---- */
    if (db && uid) {
      db.collection('agreements')
        .where('musicianId', '==', uid)
        .get()
        .catch(function() { return { docs: [], forEach: function(){}, empty: true, size: 0 }; })
        .then(function(snap) {
          var pending = [];
          snap.forEach(function(doc) {
            var d = doc.data ? doc.data() : doc;
            var s = (d.status || '').toLowerCase();
            if (s === 'awaiting_signature' || s === 'pending_signature' || s === 'sent' || s === 'pending') {
              pending.push(d);
            }
          });
          var alertEl = document.getElementById('bm-agreement-alert');
          if (!alertEl || !pending.length) return;
          var n = pending.length;
          alertEl.innerHTML =
            '<div style="background:rgba(212,160,23,0.12);border:1px solid rgba(212,160,23,0.4);border-radius:var(--radius-lg);padding:var(--space-lg);display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap;">'+
              '<i class="fa-solid fa-file-signature" style="font-size:28px;color:#d4a017;flex-shrink:0;"></i>'+
              '<div style="flex:1;min-width:0;">'+
                '<div style="font-weight:var(--fw-semibold);font-size:var(--text-base);margin-bottom:4px;">You have '+n+' agreement'+(n>1?'s':'')+' awaiting your signature.</div>'+
                '<a href="#dashboard-agreements" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 var(--space-lg);border-radius:var(--radius-md);background:#d4a017;color:#0d1117;font-weight:var(--fw-bold);font-size:var(--text-sm);text-decoration:none;">Tap to review &#8594;</a>'+
              '</div>'+
            '</div>';
        });

      /* ---- TASK-002 / P5-d: Next Show (show_readmodel via collection('band-sessions')) ---- */
      var today = new Date().toISOString().split('T')[0];
      db.collection('band-sessions')
        .where('date', '>=', today)
        .orderBy('date', 'asc')
        .limit(5)
        .get()
        .catch(function() { return { docs: [], forEach: function(){} }; })
        .then(function(snap) {
          var sessions = [];
          snap.forEach(function(doc) {
            var d = doc.data ? doc.data() : {};
            if ((d.status || '').toLowerCase() === 'confirmed') sessions.push(d);
          });
          var next = sessions[0] || null;
          var el = document.getElementById('bm-next-show');
          if (!el) return;
          var inner = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days" style="color:#3fb950;"></i> Next Show</h3>';
          if (!next) {
            inner += '<p class="text-muted">No upcoming shows scheduled.</p>';
          } else {
            var sType = (next.session_type || next.type || '').toLowerCase();
            var isGig = sType === 'gig' || sType === 'show' || sType === 'performance';
            var badgeColor = isGig ? '#3fb950' : '#d4a017';
            var badgeLabel = isGig ? 'Gig' : (sType || 'Rehearsal');
            var now2 = new Date();
            var showDate = new Date(next.date);
            var daysAway = Math.ceil((showDate - now2) / (1000 * 60 * 60 * 24));
            inner +=
              '<div style="margin-bottom:var(--space-sm);">'+
                '<span style="display:inline-block;padding:2px 10px;border-radius:var(--radius-full);background:'+badgeColor+';color:#0d1117;font-size:var(--text-xs);font-weight:var(--fw-bold);">'+Utils.escapeHtml(badgeLabel)+'</span>'+
              '</div>'+
              '<div style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:'+badgeColor+';margin-bottom:4px;">'+
                (isGig ? daysAway+' days away' : 'Rehearsal')+
              '</div>'+
              '<div style="font-weight:var(--fw-semibold);font-size:var(--text-lg);margin-bottom:4px;">'+Utils.escapeHtml(next.title || next.name || 'Session')+'</div>'+
              '<div style="color:var(--color-text-muted);font-size:var(--text-sm);">'+Utils.formatDate(next.date)+(next.time ? ' · '+Utils.escapeHtml(next.time) : '')+(next.venue ? ' · '+Utils.escapeHtml(next.venue) : '')+'</div>';
          }
          el.innerHTML = inner;
        });
    } else {
      /* db not ready — static fallback */
      var showEl = document.getElementById('bm-next-show');
      if (showEl) showEl.innerHTML = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-calendar-days" style="color:#3fb950;"></i> Next Show</h3><p class="text-muted">No upcoming shows scheduled.</p>';
    }

    /* ---- TASK-003: Rehearsal Playlist (API) ---- */
    if (typeof Utils !== 'undefined' && Utils.apiFetch) {
      Utils.apiFetch('/api/v1/portal/my-playlists')
        .then(function(r) { return r.ok ? r.json() : { playlists: [] }; })
        .then(function(data) {
          var playlists = (data && data.playlists) ? data.playlists : [];
          var pl = playlists[0] || null;
          var el = document.getElementById('bm-playlist');
          if (!el) return;
          var inner = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-music" style="color:#d4a017;"></i> Rehearsal Playlist</h3>';
          if (!pl) {
            inner += '<p class="text-muted">No rehearsal playlist assigned.</p>';
          } else {
            var tc = pl.trackCount || (pl.playlist_tracks ? pl.playlist_tracks.length : null);
            inner +=
              '<div style="font-weight:var(--fw-semibold);font-size:var(--text-lg);margin-bottom:4px;">'+Utils.escapeHtml(pl.name || 'Playlist')+'</div>'+
              (tc ? '<div style="color:var(--color-text-muted);font-size:var(--text-sm);margin-bottom:var(--space-md);">'+tc+' track'+(tc!==1?'s':'')+'</div>' : '<div style="margin-bottom:var(--space-md);"></div>')+
              '<a href="#dashboard-band-player" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);background:#d4a017;color:#0d1117;font-weight:var(--fw-bold);font-size:var(--text-sm);text-decoration:none;">Open Player &#8594;</a>';
          }
          el.innerHTML = inner;
        })
        .catch(function() {
          var el = document.getElementById('bm-playlist');
          if (el) el.innerHTML = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-music" style="color:#d4a017;"></i> Rehearsal Playlist</h3><p class="text-muted">No rehearsal playlist assigned.</p>';
        });
    } else {
      var plEl = document.getElementById('bm-playlist');
      if (plEl) plEl.innerHTML = '<h3 style="margin-bottom:var(--space-md);"><i class="fa-solid fa-music" style="color:#d4a017;"></i> Rehearsal Playlist</h3><p class="text-muted">No rehearsal playlist assigned.</p>';
    }
  }

    }
  }

  // Wait for Firestore to be ready (band_manager/band_member dashboards need _db)
  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { startDash(); });
  } else {
    startDash();
  }

})();
</script>
