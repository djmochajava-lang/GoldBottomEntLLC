<!-- dashboard/my-portal.html — Musician's Hub (non-music interactions) -->
<div class="dashboard-page" id="dash-my-portal">

  <!-- Page Header — story-member-portal-is-dashboard: this IS the band member's
       dashboard landing (personalized greeting), not a secondary page. -->
  <div style="margin-bottom:var(--space-lg);">
    <h1 style="display:flex;align-items:center;gap:var(--space-sm);">
      <i class="fa-solid fa-id-badge" style="color:var(--color-gold);"></i>
      <span id="portal-welcome">My Portal</span>
    </h1>
    <p class="text-muted" style="margin:0;font-size:var(--text-sm);">Your hub for gig invites, your bio, the Band Player, and account settings.</p>
  </div>

  <!-- Pending Section -->
  <div id="portal-pending" style="margin-bottom:var(--space-lg);">
    <h2 style="font-size:var(--text-base);font-weight:var(--fw-semibold);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-xs);">
      <i class="fa-solid fa-bell" style="color:#d29922;"></i> Pending
      <span id="portal-pending-count" style="background:rgba(248,81,73,0.15);color:#f85149;border-radius:var(--radius-full);padding:2px 8px;font-size:12px;font-weight:700;"></span>
    </h2>
    <div id="portal-pending-list" style="display:grid;gap:var(--space-sm);">
      <div style="text-align:center;padding:var(--space-lg);color:var(--color-text-muted);font-size:var(--text-sm);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
      </div>
    </div>
  </div>

  <!-- My Bio Section (story-bio-b-collect Flow A — member self-serve submission) -->
  <div id="portal-mybio" style="margin-bottom:var(--space-lg);">
    <h2 style="font-size:var(--text-base);font-weight:var(--fw-semibold);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-xs);">
      <i class="fa-solid fa-address-card" style="color:var(--color-gold);"></i> My Bio
    </h2>
    <div id="mybio-root">
      <div style="text-align:center;padding:var(--space-lg);color:var(--color-text-muted);font-size:var(--text-sm);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading...
      </div>
    </div>
  </div>

  <!-- Upcoming Sessions -->
  <div id="portal-upcoming" style="margin-bottom:var(--space-lg);">
    <h2 style="font-size:var(--text-base);font-weight:var(--fw-semibold);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-xs);">
      <i class="fa-solid fa-calendar" style="color:var(--color-gold);"></i> Upcoming Sessions
    </h2>
    <div id="portal-upcoming-list" style="display:grid;gap:var(--space-sm);"></div>
  </div>

  <!-- Quick Links -->
  <div id="portal-links">
    <h2 style="font-size:var(--text-base);font-weight:var(--fw-semibold);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-xs);">
      <i class="fa-solid fa-link" style="color:var(--color-gold);"></i> Quick Links
    </h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:var(--space-sm);">
      <a href="#dashboard-payment-settings" class="portal-link-card"><i class="fa-solid fa-credit-card"></i> Payment Settings</a>
      <a href="#dashboard-band-player" class="portal-link-card"><i class="fa-solid fa-music"></i> Band Player</a>
      <a href="#dashboard-agreements" class="portal-link-card"><i class="fa-solid fa-file-signature"></i> Agreements</a>
      <a href="#dashboard-calendar" class="portal-link-card"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
    </div>
  </div>

</div>

  .mybio-terms { background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-md);font-size:13px;line-height:1.55;color:var(--color-text-secondary);max-height:240px;overflow-y:auto;white-space:pre-wrap;margin-bottom:var(--space-md); }
  .mybio-preview-card { background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-md);margin-top:var(--space-sm); }

  .mybio-resume { display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;justify-content:space-between;background:rgba(212,160,23,0.08);border:1px solid rgba(212,160,23,0.25);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-md);font-size:13px;line-height:1.4; }

  @keyframes mybioIndeterminate { 0%{ margin-left:-45%; } 100%{ margin-left:105%; } }
  @media (prefers-reduced-motion:reduce){ .mybio-progress-bar { animation:none;width:100%; } }

</style>

<script>
(function() {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════════
     Portal loader — story-p0-musician-journey (experience-audit 3.4 CRITICAL fix).
     REPOINTED from the dead legacy `session-assignments` Firestore-compat path
     (Supabase `session_assignments` — 4 unmatchable Firestore-era rows, no live
     writer) to the LIVE read-models, via the member's own PKCE session (Auth._sb
     — the same direct-Supabase pattern the My Bio section below uses; the legacy
     Firestore-compat adapter is deliberately NOT extended):
       • session_assignment_readmodel — own-row RLS (musician_uid = auth.uid);
         published by the server (booking-publish.js publishAssignmentsOnce) from
         the SoR. 9-col whitelist: id/booking_id/session_id/musician_uid/status/
         invited_at/responded_at/origin/updated_at. pay_amount, notes, dress/
         load-in are STRUCTURALLY excluded from the cache (InfoSec whitelist) —
         pay is intentionally NOT rendered here (member pay visibility is the N2
         gig_payout pending_actions surface on musician-home).
       • show_readmodel — role-gated band read; title/date/venue/session_type/
         out_of_town for the invite card.
       • session_assignment_responses — the member-writable RESPOND leg (own-row
         INSERT/UPDATE, bio_submissions pattern). Accept/Decline UPSERTs here;
         the server-side reconciler (SESSION_RESPONSES_SYNC_ENABLED) pulls the
         response into the SoR session_assignments, and the publisher then
         republishes the readmodel. Until that round-trip completes we OVERLAY
         the response on the readmodel status (read-your-writes), with a small
         "syncing" chip. Responses are NEVER written to the readmodel directly —
         the publisher upserts all readmodel columns from the SoR every pass and
         would clobber them (and the readmodel's co-signed RLS has no client
         write policy, by design).
     The legacy `notifications` items read was REMOVED: notifications_items has
     NO writer anywhere (audit 3.4) and the un-caught Promise.all could hang this
     panel on "Loading..." forever. The loader is now fully try/caught with a
     friendly retry state.
     ═══════════════════════════════════════════════════════════════════════════ */

  var _uid = null;

  function esc(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function getSb() { return (typeof Auth !== 'undefined' && Auth._sb) ? Auth._sb : null; }

  async function currentUid() {
    var sb = getSb(); if (!sb) return null;
    try {
      var r = await sb.auth.getSession();
      if (r && r.data && r.data.session && r.data.session.user) return r.data.session.user.id;
    } catch (e) { /* fall through */ }
    return (typeof Auth !== 'undefined' && Auth._user && Auth._user.uid) ? Auth._user.uid : null;
  }

  function fmtDate(d) {
    if (!d) return '';
    try {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    } catch (e) { return String(d); }
  }

  // Payment-setup nudge — reads the member's OWN user row over the existing
  // remote-safe adapter surface (the same own-row read musician-home uses).
  // NON-FATAL by design: any failure returns true (never nag on error, and a
  // users-read blip must never take down the invites panel).
  async function hasPaymentSetup() {
    try {
      if (typeof Auth === 'undefined' || !Auth._db || !_uid) return true;
      var doc = await Auth._db.collection('users').doc(_uid).get();
      var d = (doc && doc.exists) ? doc.data() : {};
      return !!(d.paymentSetupAt || d.payment_method_enc);
    } catch (e) { return true; }
  }

  function showLoading() {
    document.getElementById('portal-pending-list').innerHTML =
      '<div style="text-align:center;padding:var(--space-lg);color:var(--color-text-muted);font-size:var(--text-sm);"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
  }

  // Friendly, recoverable error state (audit 3.4: the old loader could hang on
  // "Loading..." forever with no way out).
  function showError() {
    var list = document.getElementById('portal-pending-list');
    if (list) {
      list.innerHTML =
        '<div class="portal-invite-card" id="portal-error-card">' +
          '<div style="display:flex;align-items:flex-start;gap:var(--space-sm);margin-bottom:var(--space-sm);">' +
            '<i class="fa-solid fa-triangle-exclamation" style="color:#d29922;font-size:18px;margin-top:2px;flex-shrink:0;"></i>' +
            '<div style="font-size:var(--text-sm);color:var(--color-text-secondary);line-height:1.5;">We couldn\'t load your invites. Check your connection and try again.</div>' +
          '</div>' +
          '<button class="portal-accept-btn" id="portal-retry" style="width:100%;">Try again</button>' +
        '</div>';
      var rb = document.getElementById('portal-retry');
      if (rb) rb.addEventListener('click', function() { showLoading(); loadPortal(); });
    }
    var up = document.getElementById('portal-upcoming-list');
    if (up) up.innerHTML = '<div style="padding:var(--space-md);color:var(--color-text-muted);font-size:var(--text-sm);">—</div>';
    var countEl = document.getElementById('portal-pending-count');
    if (countEl) { countEl.textContent = ''; countEl.style.display = 'none'; }
  }

  // Effective status = the member's own response overlaid on the published
  // readmodel status. A just-written response wins until the SoR round-trip
  // republishes the readmodel (read-your-writes; `syncing` marks that window).
  function effectiveOf(a, responses) {
    var r = responses[a.id];
    if (r && (r.response === 'accepted' || r.response === 'declined')) {
      return { status: r.response, syncing: r.response !== a.status };
    }
    return { status: a.status, syncing: false };
  }

  function detailLinesHtml(s) {
    var h = '';
    var dateStr = fmtDate(s.date);
    if (dateStr) h += '<div><i class="fa-solid fa-calendar" style="width:16px;"></i> ' + esc(dateStr) + '</div>';
    if (s.venue) h += '<div><i class="fa-solid fa-location-dot" style="width:16px;"></i> ' + esc(s.venue) + '</div>';
    if (s.out_of_town) h += '<div><i class="fa-solid fa-route" style="width:16px;"></i> Out-of-town date</div>';
    if (!h) h = '<div>Details coming soon — your manager is finalizing this show.</div>';
    return h;
  }

  function typeChipHtml(s) {
    if (!s.session_type) return '';
    return '<span style="flex-shrink:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--color-gold);background:rgba(212,160,23,0.12);border-radius:var(--radius-full);padding:3px 10px;">' + esc(s.session_type) + '</span>';
  }

  function inviteCardHtml(a, show) {
    var s = show || {};
    var h = '<div class="portal-invite-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-sm);margin-bottom:4px;">';
    h += '<div style="font-weight:var(--fw-semibold);min-width:0;overflow-wrap:anywhere;">' + esc(s.title || 'Show invite') + '</div>';
    h += typeChipHtml(s);
    h += '</div>';
    h += '<div style="font-size:13px;color:var(--color-text-muted);margin-bottom:var(--space-sm);">' + detailLinesHtml(s) + '</div>';
    h += '<div style="display:flex;gap:var(--space-xs);">';
    h += '<button class="portal-accept-btn portal-respond" data-aid="' + esc(a.id) + '" data-resp="accepted" style="flex:1;">Accept</button>';
    h += '<button class="portal-decline-btn portal-respond" data-aid="' + esc(a.id) + '" data-resp="declined" style="flex:1;">Decline</button>';
    h += '</div></div>';
    return h;
  }

  function upcomingCardHtml(a, show, syncing) {
    var s = show || {};
    var h = '<div class="portal-upcoming-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-sm);">';
    h += '<div style="min-width:0;">';
    h += '<div style="font-weight:var(--fw-semibold);margin-bottom:4px;overflow-wrap:anywhere;">' + esc(s.title || 'Show') + '</div>';
    h += '<div style="font-size:13px;color:var(--color-text-muted);">' + detailLinesHtml(s) + '</div>';
    h += '</div>';
    h += typeChipHtml(s);
    h += '</div>';
    // NOTE: no pay_amount here — it is structurally excluded from the public
    // cache (InfoSec whitelist, RULE-S07). Pay visibility = N2 pending_actions.
    if (syncing) {
      h += '<div style="margin-top:8px;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-full);background:rgba(63,185,80,0.12);color:#3fb950;"><i class="fa-solid fa-check"></i> Accepted — syncing with your manager</span></div>';
    }
    h += '</div>';
    return h;
  }

  async function loadPortal() {
    var sb = getSb();
    if (!sb || !_uid) { showError(); return; }
    try {
      // (1) own assignments from the LIVE readmodel (own-row RLS scopes the
      // result — no client-side uid filter can widen it) + (2) own responses
      // (read-your-writes overlay) + (3) payment nudge — in parallel.
      var results = await Promise.all([
        sb.from('session_assignment_readmodel')
          .select('id,session_id,status,invited_at,responded_at'),
        sb.from('session_assignment_responses')
          .select('assignment_id,response,responded_at'),
        hasPaymentSetup()
      ]);
      var aRes = results[0], rRes = results[1], hasPayment = results[2];
      if (aRes && aRes.error) throw new Error(aRes.error.message || 'assignments read failed');
      var assignments = (aRes && aRes.data) || [];

      // The responses table read is NON-FATAL (it may be newly provisioned):
      // on error we simply fall back to the published readmodel status.
      var responses = {};
      if (rRes && !rRes.error && rRes.data) {
        rRes.data.forEach(function(r) { if (r && r.assignment_id) responses[r.assignment_id] = r; });
      }

      // (4) show details for the cards (title/date/venue/type) — NON-FATAL;
      // a missing show row degrades the card to "details coming soon".
      var sessionIds = [];
      assignments.forEach(function(a) {
        if (a && a.session_id && sessionIds.indexOf(a.session_id) === -1) sessionIds.push(a.session_id);
      });
      var shows = {};
      if (sessionIds.length) {
        try {
          var sRes = await sb.from('show_readmodel')
            .select('id,title,date,venue,session_type,status,out_of_town')
            .in('id', sessionIds);
          if (sRes && !sRes.error && sRes.data) {
            sRes.data.forEach(function(s) { if (s && s.id) shows[s.id] = s; });
          }
        } catch (e) { /* degrade gracefully */ }
      }

      render(assignments, responses, shows, hasPayment);
    } catch (e) {
      showError();
    }
  }

  function render(assignments, responses, shows, hasPayment) {
    var pendingHtml = '';
    var pendingCount = 0;

    // Payment setup prompt (parity with the original portal).
    if (!hasPayment) {
      pendingCount++;
      pendingHtml += '<div class="portal-invite-card">';
      pendingHtml += '<div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-sm);">';
      pendingHtml += '<div><div style="font-weight:var(--fw-semibold);margin-bottom:4px;">Set Up Payment Info</div>';
      pendingHtml += '<div style="font-size:13px;color:var(--color-text-muted);">Set up how you\'d like to get paid so we can pay you on time.</div></div>';
      pendingHtml += '<a href="#dashboard-payment-settings" class="portal-accept-btn" style="text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;">Set Up</a>';
      pendingHtml += '</div></div>';
    }

    // Sort by show date ascending (undated last) — soonest decision first.
    var sorted = assignments.slice().sort(function(x, y) {
      var dx = (x && shows[x.session_id] && shows[x.session_id].date) || '9999-12-31';
      var dy = (y && shows[y.session_id] && shows[y.session_id].date) || '9999-12-31';
      return dx < dy ? -1 : (dx > dy ? 1 : 0);
    });

    var today = new Date().toISOString().split('T')[0];
    var upcomingHtml = '';

    sorted.forEach(function(a) {
      if (!a || !a.id) return;
      var eff = effectiveOf(a, responses);
      var show = shows[a.session_id] || null;
      if (eff.status === 'invited' || eff.status === 'tentative') {
        pendingCount++;
        pendingHtml += inviteCardHtml(a, show);
      } else if (eff.status === 'accepted') {
        var s = show || {};
        if (s.date && s.date < today) return;                                   // past show
        if (s.status === 'completed' || s.status === 'cancelled') return;        // terminal show
        upcomingHtml += upcomingCardHtml(a, show, eff.syncing);
      }
      // declined → not listed (parity with the original portal)
    });

    if (!pendingHtml) pendingHtml = '<div style="padding:var(--space-md);color:var(--color-text-muted);font-size:var(--text-sm);">No pending items. You\'re all set!</div>';
    var list = document.getElementById('portal-pending-list');
    list.innerHTML = pendingHtml;

    // Bind Accept/Decline via listeners (no inline JS — defense-in-depth on
    // top of esc(); ids never travel through an executable attribute).
    list.querySelectorAll('.portal-respond').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var aid = btn.getAttribute('data-aid');
        var resp = btn.getAttribute('data-resp');
        if (resp === 'declined') window._portalDecline(aid);
        else window._portalAccept(aid);
      });
    });

    var countEl = document.getElementById('portal-pending-count');
    countEl.textContent = pendingCount || '';
    countEl.style.display = pendingCount ? 'inline' : 'none';
    _updateSidebarBadge(pendingCount);

    if (!upcomingHtml) upcomingHtml = '<div style="padding:var(--space-md);color:var(--color-text-muted);font-size:var(--text-sm);">No upcoming sessions.</div>';
    document.getElementById('portal-upcoming-list').innerHTML = upcomingHtml;
  }

  // ═══ ACCEPT / DECLINE — the respond leg ═══
  // UPSERT the member's own row in session_assignment_responses (own-row RLS;
  // musician_uid/responded_at are set server-side by defaults/trigger — the
  // client sends ONLY assignment_id + response). The env-gated server
  // reconciler pulls it into the SoR; the publisher republishes the readmodel.

  var _responding = false;

  async function respond(assignmentId, response, okMsg, okKind) {
    if (_responding) return;
    var sb = getSb();
    if (!sb || !assignmentId) {
      if (typeof Toast !== 'undefined') Toast.error('Not connected — try again.');
      return;
    }
    _responding = true;
    try {
      var res = await sb.from('session_assignment_responses').upsert(
        { assignment_id: String(assignmentId), response: response },
        { onConflict: 'assignment_id' }
      );
      if (res && res.error) throw new Error(res.error.message || 'write failed');
      if (typeof Toast !== 'undefined') {
        if (okKind === 'success') Toast.success(okMsg); else Toast.info(okMsg);
      }
      await loadPortal();
    } catch (e) {
      if (typeof Toast !== 'undefined') {
        Toast.error((response === 'accepted' ? 'Accept' : 'Decline') + ' failed: ' + ((e && e.message) || 'try again'));
      }
    } finally {
      _responding = false;
    }
  }

  window._portalAccept = function(assignmentId) {
    return respond(assignmentId, 'accepted', "You're booked!", 'success');
  };

  window._portalDecline = function(assignmentId) {
    var run = function() { respond(assignmentId, 'declined', 'Declined — your manager will be notified.', 'info'); };
    // Confirm before declining (390px one-handed: a mis-tap must not silently
    // turn down a gig). Falls back to immediate decline if Modal is absent.
    if (typeof Modal !== 'undefined' && Modal.confirm) {
      Modal.confirm('Decline this show? Your manager will be notified so they can re-staff it.', run);
    } else { run(); }
  };

  // ═══ SIDEBAR BADGE ═══
  // Targets the "My Portal" sidebar item added by this story
  // (index.html data-page="dashboard-my-portal") — previously matched nothing.

  function _updateSidebarBadge(count) {
    var link = document.querySelector('[data-page="dashboard-my-portal"]');
    if (!link) return;
    var existing = link.querySelector('.portal-badge');
    if (existing) existing.remove();
    if (count > 0) {
      var badge = document.createElement('span');
      badge.className = 'portal-badge';
      badge.style.cssText = 'background:#f85149;color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:auto;';
      badge.textContent = count;
      link.appendChild(badge);
    }
  }

  // ═══ INIT (fully guarded — audit 3.4: the old init had no catch) ═══

  // Personalize the header greeting (degrades to "My Portal" on any miss).
  function setWelcome() {
    try {
      var el = document.getElementById('portal-welcome');
      if (!el) return;
      var u = (typeof Auth !== 'undefined' && Auth.getCurrentUser) ? Auth.getCurrentUser() : null;
      var name = u && (u.displayName || u.email);
      if (name) el.textContent = 'Welcome, ' + String(name).split(/[ @]/)[0];
    } catch (e) { /* keep default */ }
  }

  async function init() {
    try {
      setWelcome();
      _uid = await currentUid();
      var sb = getSb();
      if (!sb || !_uid) {
        document.getElementById('portal-pending-list').innerHTML =
          '<div style="padding:var(--space-md);color:var(--color-text-muted);">Sign in to view your portal.</div>';
        return;
      }
      showLoading();
      await loadPortal();
    } catch (e) {
      showError();
    }
  }

  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function') {
    Auth.whenReady(function() { init(); });
  } else {
    init();
  }
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   My Bio — story-bio-b-collect Flow A (member self-serve submission)
   REMOTE path: the member writes their OWN Supabase `bio_submissions` row via
   the existing authenticated PKCE client (Auth._sb) and stages photos to
   Storage band-media/bio-staging/<auth.uid()>/…. This is SUBMISSION of source
   material (D-49), NOT self-publish — end state is "shared with your manager".
   Contract: BIO_B_SERVER_REPORT.md §7. Design/ACs: DESIGN_bio-b-experience.md.
   Does NOT use Utils.apiFetch (that LAN path rejects remote by design).
   ═══════════════════════════════════════════════════════════════════════════ */
(function() {
  'use strict';

  // ── Consent copy MIRRORED from server/src/config/bio-consent-disclosure.js ──
  // §7c. Legal-finalized v1_1 (L-1 withdrawal scope + L-2 no-guarantee, 2026-07-13).
  // MUST stay byte-identical to the server disclosure text; the version string
  // below MUST equal the server's accepted version or submissions can't publish.
  var CONSENT_VERSION = 'bio-consent-v1_1-2026-07';
  var CONSENT_TEXT = [
    'Sharing your bio and photos with Gold Bottom Entertainment',

    'withdraw, we keep a private copy of what you submitted so your manager has a ' +

  ].join('\n');
  // Informational elements the member acknowledges by tapping the share button.
  var ACK_INFO = [
    { id: 'store',            text: 'GBE stores the bio and photos I provide as source material.' },
    { id: 'use_adapt',        text: 'GBE may use or ADAPT this material in the band’s marketing and EPK (wording may be reworked).' },
    { id: 'not_self_publish', text: 'Sharing here is a submission to my manager, not a live self-publish.' },
    { id: 'publish_is_gbe',   text: 'Whether and when anything is published is GBE’s separate later decision, gated on this consent. Sharing my information does not guarantee it will be used.' }
  ];

  // Fields in plain-language order (AC-E1). Caps = server FIELD_LIMITS / §7a.
  var FIELDS = [
    { key:'stage_name',  label:'Stage name',        max:40,   ph:'e.g. L.A. Young',            helper:'The name fans should see.' },
    { key:'role_line',   label:'Your role',         max:30,   ph:'e.g. Background vocalist',   helper:'What you do in the band.' },
    { key:'credit_line', label:'Notable credits',   max:80,   ph:'e.g. Toured with …',    helper:'Notable work — we confirm it before anything is published.' },
    { key:'short_bio',   label:'Short bio',         max:280,  ph:'One or two sentences fans will read first.', helper:'The one that matters most.', multiline:true, required:true },
    { key:'long_bio',    label:'Longer bio',        max:1200, ph:'The fuller story …',    helper:'Optional — share more if you like.', multiline:true, optional:true }
  ];

  var IMG_TYPES = ['image/jpeg','image/png','image/webp'];
  var MAX_BYTES = 8 * 1024 * 1024;

  // Document intake (§3): allow .txt/.docx/.pdf, ≤10MB. .doc rejected client-side.
  var DOC_MAX_BYTES = 10 * 1024 * 1024;
  var ALLOWED_DOC_EXT = ['txt','docx','pdf'];
  var DOC_ACCEPT = '.txt,.docx,.pdf';

  // ── State ──
  var _view = 'loading';
  var _uid = null;
  var _existing = null;              // loaded bio_submissions row (or null)
  var _errMsg = '';
  var _data = { stage_name:'', role_line:'', credit_line:'', short_bio:'', long_bio:'' };
  var _photos = { headshot:{ key:null, url:null, uploading:false }, promo:{ key:null, url:null, uploading:false } };
  var _consent = { legalName:'', age:false, accuracy:false, photo:false };
  var _showLongBio = false;
  var _showTerms = false;
  var _showPreview = false;
  var _submitting = false;
  var _saveTimer = null;
  // Staged bio document (source material — landed as rawSubmission by the reconciler, §4)
  var _doc = { key:null, filename:'', ext:'', size:0, uploading:false, error:'' };
  var _consentBackView = 'edit';   // where the consent "Back" button returns (edit | upload)

  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function root(){ return document.getElementById('mybio-root'); }
  function getSb(){ return (typeof Auth !== 'undefined' && Auth._sb) ? Auth._sb : null; }
  function toastErr(m){ if (typeof Toast !== 'undefined') Toast.error(m); }
  function toastOk(m){ if (typeof Toast !== 'undefined') Toast.success(m); }
  function hasPhoto(){ return !!(_photos.headshot.key || _photos.promo.key); }
  function hasDoc(){ return !!_doc.key; }
  function parseExt(name){ var m = /\.([A-Za-z0-9]+)$/.exec(name||''); return m ? m[1].toLowerCase() : ''; }

  function uuid(){
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
    var b = null; try { b = crypto.getRandomValues(new Uint8Array(16)); } catch(e){}
    if (b){ b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80; var h=[]; for(var i=0;i<16;i++)h.push((b[i]+0x100).toString(16).slice(1));
      return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10,16).join(''); }
    return 'x'+Date.now().toString(16)+Math.floor(Math.random()*1e8).toString(16);
  }

  // ── Local draft autosave (AC-E2) ──
  function draftKey(){ return 'gbe-bio-draft-' + (_uid || 'anon'); }
  function saveDraft(){
    try { localStorage.setItem(draftKey(), JSON.stringify({ data:_data, photos:{ headshot:_photos.headshot.key, promo:_photos.promo.key }, doc:{ key:_doc.key, filename:_doc.filename, ext:_doc.ext } })); } catch(e){}
  }
  function saveDraftSoon(){ clearTimeout(_saveTimer); _saveTimer = setTimeout(saveDraft, 400); }
  function loadDraft(){
    try {
      var r = JSON.parse(localStorage.getItem(draftKey()) || 'null');
      if (r && r.data){
        _data = { stage_name:r.data.stage_name||'', role_line:r.data.role_line||'', credit_line:r.data.credit_line||'', short_bio:r.data.short_bio||'', long_bio:r.data.long_bio||'' };
        if (r.photos){ _photos.headshot.key = r.photos.headshot || null; _photos.promo.key = r.photos.promo || null; }
        if (r.doc){ _doc.key = r.doc.key || null; _doc.filename = r.doc.filename || ''; _doc.ext = r.doc.ext || ''; }
        if (_data.long_bio) _showLongBio = true;
      }
    } catch(e){}
  }
  function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch(e){} }
  function hasLocalDraft(){
    try {
      var r = JSON.parse(localStorage.getItem(draftKey()) || 'null');
      if (!r) return false;
      var d = r.data || {};
      if (d.stage_name || d.role_line || d.credit_line || d.short_bio || d.long_bio) return true;
      if (r.photos && (r.photos.headshot || r.photos.promo)) return true;
      if (r.doc && r.doc.key) return true;
      return false;
    } catch(e){ return false; }
  }

  function hydrateFrom(row){
    var p = (row && row.payload) || {};
    _data = { stage_name:p.stage_name||'', role_line:p.role_line||'', credit_line:p.credit_line||'', short_bio:p.short_bio||'', long_bio:p.long_bio||'' };
    var imgs = p.images || {};
    // preserve any in-memory preview URL when the key still matches
    _photos.headshot.key = imgs.headshot_staging_key || null;
    _photos.promo.key = imgs.promo_staging_key || null;
    // Document source material (may already be extracted+removed server-side; meta persists)
    _doc.key = p.document_staging_key || null;
    _doc.filename = (p.document_meta && p.document_meta.filename) || '';
    _doc.ext = (p.document_meta && p.document_meta.ext) || '';
    _doc.uploading = false; _doc.error = '';
    if (_data.long_bio) _showLongBio = true;
    if (row && row.consent && row.consent.legalName) _consent.legalName = row.consent.legalName;
  }

  // ── Load: read own submission (RLS returns only the caller's row) ──
  async function currentUid(){
    var sb = getSb(); if (!sb) return null;
    try {
      var r = await sb.auth.getSession();
      if (r && r.data && r.data.session && r.data.session.user) return r.data.session.user.id;
    } catch(e){}
    return (typeof Auth !== 'undefined' && Auth._user && Auth._user.uid) ? Auth._user.uid : null;
  }

  async function load(){
    var sb = getSb();
    _uid = await currentUid();
    if (!sb || !_uid){ _view = 'signedout'; render(); return; }
    try {
      var res = await sb.from('bio_submissions').select('*').maybeSingle();
      if (res && res.error){ _view = 'error'; _errMsg = res.error.message || 'Could not load your bio.'; render(); return; }
      _existing = (res && res.data) ? res.data : null;
      if (!_existing){
        loadDraft();
        if (_data.short_bio || _data.stage_name || hasPhoto()) _view = 'edit';
        else if (hasDoc()) _view = 'upload';
        else _view = 'empty';
      } else if (_existing.status === 'withdrawn'){
        hydrateFrom(_existing); _view = 'withdrawn';
      } else {
        hydrateFrom(_existing); _view = 'submitted';
      }
    } catch(e){ _view = 'error'; _errMsg = (e && e.message) || 'Could not load your bio.'; }
    render();
  }

  // ── Render dispatch ──
  function render(){
    var el = root(); if (!el) return;
    if (_view === 'loading'){ el.innerHTML = '<div style="text-align:center;padding:var(--space-lg);color:var(--color-text-muted);font-size:var(--text-sm);"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>'; return; }
    if (_view === 'signedout'){ el.innerHTML = '<div class="mybio-card" style="color:var(--color-text-muted);font-size:var(--text-sm);">Sign in on the band site to add your bio.</div>'; return; }

      el.innerHTML = '<div class="mybio-card"><div style="color:#f85149;font-size:var(--text-sm);margin-bottom:var(--space-sm);"><i class="fa-solid fa-triangle-exclamation"></i> ' + esc(_errMsg) + '</div><button class="mybio-btn-secondary" id="mybio-retry">Try again</button></div>';
      var rb = document.getElementById('mybio-retry'); if (rb) rb.addEventListener('click', function(){ _view='loading'; render(); load(); });
      return;
    }
    if (_view === 'empty') return renderFork(el);
    if (_view === 'edit') return renderEdit(el);
    if (_view === 'upload') return renderUpload(el);
    if (_view === 'consent') return renderConsent(el);
    if (_view === 'submitted') return renderSubmitted(el);
    if (_view === 'withdrawn') return renderWithdrawn(el);
  }

  // ── State: fork / first-visit (AC-A1 inviting; AC-A4 two equal intake paths) ──
  function renderFork(el){
    var resume = hasLocalDraft()
      ? '<div class="mybio-resume"><span><i class="fa-solid fa-clock-rotate-left" style="color:var(--color-gold);"></i> You have a saved draft — only you &amp; your manager can see it.</span>' +
        '<button class="mybio-btn-secondary" id="mybio-resume">Continue your draft</button></div>'
      : '';
    el.innerHTML =
      '<div class="mybio-card">' +
        '<div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:6px;">' +
          '<i class="fa-solid fa-microphone-lines" style="color:var(--color-gold);font-size:18px;"></i>' +
          '<div style="font-weight:var(--fw-semibold);font-size:15px;">Share your bio &amp; photos so we can feature you</div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--color-text-muted);margin-bottom:var(--space-md);line-height:1.5;">Tell fans who you are. Your manager may use this on the band page and press kit — you can edit or take it back anytime. Pick whichever is easiest:</div>' +
        resume +
        '<div class="mybio-fork">' +
          '<div class="mybio-fork-option">' +
            '<div class="mybio-fork-icon"><i class="fa-solid fa-pen"></i></div>' +
            '<div class="mybio-fork-title">Build your bio</div>' +
            '<div class="mybio-fork-desc">Fill out a short guided form — your role, notable credits, and a sentence or two.</div>' +
            '<button class="mybio-fork-btn" id="mybio-fork-build"><i class="fa-solid fa-pen"></i> Build your bio</button>' +
          '</div>' +
          '<div class="mybio-fork-or">or</div>' +
          '<div class="mybio-fork-option">' +
            '<div class="mybio-fork-icon"><i class="fa-solid fa-file-arrow-up"></i></div>' +
            '<div class="mybio-fork-title">Upload your existing bio</div>' +
            '<div class="mybio-fork-desc">Already have one written? Upload a Word, PDF, or text file — we’ll take it from there.</div>' +
            '<button class="mybio-fork-btn" id="mybio-fork-upload"><i class="fa-solid fa-file-arrow-up"></i> Upload a file</button>' +
          '</div>' +

  function onPickPhoto(slotKey, input){
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (IMG_TYPES.indexOf(file.type) === -1){ toastErr('Use a JPG, PNG, or WebP image.'); return; }
    if (file.size > MAX_BYTES){ toastErr('Image must be under 8 MB.'); return; }
    var sb = getSb(); if (!sb || !sb.storage){ toastErr('Not connected — try again.'); return; }
    var st = _photos[slotKey];
    if (st.url){ try { URL.revokeObjectURL(st.url); } catch(e){} }
    st.url = URL.createObjectURL(file);
    st.uploading = true; st.key = null;
    renderPhotosBlock(); updateReviewBtn();
    var ext = file.type === 'image/png' ? 'png' : (file.type === 'image/webp' ? 'webp' : 'jpg');
    var key = 'bio-staging/' + _uid + '/' + slotKey + '-' + uuid() + '.' + ext;
    sb.storage.from('band-media').upload(key, file, { contentType: file.type, upsert: false }).then(function(res){
      st.uploading = false;
      if (res && res.error){ toastErr('Photo upload failed — try again.'); st.key = null; if (st.url){ try{URL.revokeObjectURL(st.url);}catch(e){} st.url=null; } }
      else { st.key = key; saveDraft(); toastOk('Photo added.'); }
      renderPhotosBlock(); updateReviewBtn();
    }).catch(function(){
      st.uploading = false; st.key = null;
      toastErr('Photo upload failed — try again.');
      renderPhotosBlock(); updateReviewBtn();
    });
  }

  function anyOverCap(){
    for (var i=0;i<FIELDS.length;i++){ var f=FIELDS[i]; if ((_data[f.key]||'').length > f.max) return true; }
    return false;
  }
  // Ready to proceed to consent: a short bio OR an uploaded document (AC-C5 no-form path),
  // nothing over cap, nothing still uploading.
  function reviewReady(){
    var hasContent = (_data.short_bio||'').trim().length > 0 || hasDoc();
    return hasContent && !anyOverCap() && !_photos.headshot.uploading && !_photos.promo.uploading && !_doc.uploading;
  }
  function updateReviewBtn(){

  // ── State: upload existing bio document (AC-E6 progress + "we'll pull your bio";

          '<label class="mybio-btn-primary" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;padding-left:22px;padding-right:22px;cursor:pointer;"><i class="fa-solid fa-folder-open"></i> Choose a file<input type="file" accept="' + DOC_ACCEPT + '" id="mybio-doc-input" style="display:none;" /></label>' +

      ? '<div class="mybio-switch">You’ve also started the Bio Builder. <button class="mybio-link" id="mybio-goto-edit" style="padding:0;">Edit those details</button></div>'
      : '<div class="mybio-switch">Prefer to type it out? <button class="mybio-link" id="mybio-goto-edit" style="padding:0;">Fill out the Bio Builder instead</button></div>';

    if (rem) rem.addEventListener('click', function(){ _doc.key=null; _doc.filename=''; _doc.ext=''; _doc.error=''; saveDraft(); render(); });

    if (back) back.addEventListener('click', function(){ _view = _existing ? (_existing.status==='withdrawn'?'withdrawn':'submitted') : 'empty'; render(); });

  // Validate client-side then stage the raw file to Supabase Storage band-media at
  // bio-staging/<auth.uid()>/doc-<uuid>.<ext> using the member's PKCE session (§3a).
  function onPickDoc(input){
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    _doc.error = '';
    var ext = parseExt(file.name);
    if (ext === 'doc'){ _doc.error = 'Word 97–2003 (.doc) files aren’t supported. Please save your file as .docx or PDF and upload again.'; render(); return; }
    if (ALLOWED_DOC_EXT.indexOf(ext) === -1){ _doc.error = 'Please upload a Word (.docx), PDF, or text (.txt) file.'; render(); return; }
    if (file.size > DOC_MAX_BYTES){ _doc.error = 'Your file is too large. Please upload a file under 10 MB.'; render(); return; }
    var sb = getSb(); if (!sb || !sb.storage){ _doc.error = 'Not connected — please try again.'; render(); return; }
    var key = 'bio-staging/' + _uid + '/doc-' + uuid() + '.' + ext;
    _doc.uploading = true; _doc.key = null; _doc.filename = file.name; _doc.ext = ext; _doc.size = file.size; _doc.error = '';
    render();
    sb.storage.from('band-media').upload(key, file, { contentType: file.type, upsert: false }).then(function(res){
      _doc.uploading = false;
      if (res && res.error){ _doc.key = null; _doc.error = 'Upload failed — please try again.'; toastErr('Document upload failed — try again.'); }
      else { _doc.key = key; saveDraft(); toastOk('Document uploaded.'); }
      render();
    }).catch(function(){
      _doc.uploading = false; _doc.key = null; _doc.error = 'Upload failed — please try again.';
      toastErr('Document upload failed — try again.');
      render();
    });
  }

  // ── State: consent (AC-E3 distinct step, informed, one deliberate tap) ──
  function renderConsent(el){
    var photo = hasPhoto();
    var terms = _showTerms
      ? '<div class="mybio-terms">' + esc(CONSENT_TEXT) + '</div>'
      : '';
    var ackList = ACK_INFO.map(function(e){ return '<li>' + esc(e.text) + '</li>'; }).join('');
    var swornPhoto = photo
      ? '<label class="mybio-consent-el"><input type="checkbox" id="mybio-c-photo"' + (_consent.photo?' checked':'') + ' /><span>I have the right to share any photo I added (I took it, or I hold a license from the photographer).</span></label>'
      : '';
    el.innerHTML =
      '<div class="mybio-card">' +
        '<button class="mybio-link" id="mybio-back" style="padding-left:0;"><i class="fa-solid fa-arrow-left"></i> ' + (_consentBackView==='upload'?'Back to upload':'Back to editing') + '</button>' +
        '<div style="font-weight:var(--fw-semibold);font-size:16px;margin:6px 0 var(--space-sm);">One more step — share with your manager</div>' +
        '<div style="font-size:13px;color:var(--color-text-secondary);line-height:1.55;margin-bottom:var(--space-md);">You’re about to <strong>share</strong> your bio and photos with your manager at Gold Bottom Ent. They’ll store it and may <strong>use or adapt</strong> it in the band’s marketing and press kit. This isn’t publishing it live — that’s a separate decision your manager makes later.</div>' +
        '<button class="mybio-link" id="mybio-terms-toggle" style="padding-left:0;margin-bottom:var(--space-sm);">' + (_showTerms?'Hide full terms':'Read the full terms') + '</button>' +
        terms +
        '<div style="font-size:12px;font-weight:var(--fw-semibold);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;">By sharing, you acknowledge:</div>' +
        '<ul class="mybio-ack">' + ackList + '</ul>' +
        '<div class="mybio-field">' +
          '<div class="mybio-flabel"><span>Your legal name <span style="color:var(--color-gold);">•</span></span></div>' +
          '<input type="text" class="mybio-input" id="mybio-c-name" placeholder="First and last name" value="' + esc(_consent.legalName) + '" />' +
          '<div class="mybio-helper">Confirms this consent is yours. Not shown publicly.</div>' +
        '</div>' +
        swornPhoto +
        '<label class="mybio-consent-el"><input type="checkbox" id="mybio-c-accuracy"' + (_consent.accuracy?' checked':'') + ' /><span>The information I’m sharing is accurate.</span></label>' +
        '<label class="mybio-consent-el" style="border-bottom:1px solid var(--color-border);"><input type="checkbox" id="mybio-c-age"' + (_consent.age?' checked':'') + ' /><span>I am 18 or older.</span></label>' +
        '<button class="mybio-btn-primary" id="mybio-submit" style="margin-top:var(--space-md);"><i class="fa-solid fa-paper-plane"></i> I understand — share with my manager</button>' +
      '</div>';

    document.getElementById('mybio-back').addEventListener('click', function(){ _view = _consentBackView || 'edit'; render(); });
    document.getElementById('mybio-terms-toggle').addEventListener('click', function(){ _showTerms=!_showTerms; render(); });
    var nameEl = document.getElementById('mybio-c-name');
    nameEl.addEventListener('input', function(){ _consent.legalName = nameEl.value; updateSubmitBtn(); });
    var ageEl = document.getElementById('mybio-c-age');
    ageEl.addEventListener('change', function(){ _consent.age = ageEl.checked; updateSubmitBtn(); });
    var accEl = document.getElementById('mybio-c-accuracy');
    accEl.addEventListener('change', function(){ _consent.accuracy = accEl.checked; updateSubmitBtn(); });
    var photoEl = document.getElementById('mybio-c-photo');
    if (photoEl) photoEl.addEventListener('change', function(){ _consent.photo = photoEl.checked; updateSubmitBtn(); });
    var sub = document.getElementById('mybio-submit');
    sub.addEventListener('click', doSubmit);
    updateSubmitBtn();
  }

  function consentReady(){
    var photo = hasPhoto();
    return _consent.legalName.trim().length > 0 && _consent.age && _consent.accuracy && (!photo || _consent.photo);
  }
  function updateSubmitBtn(){
    var b = document.getElementById('mybio-submit'); if (!b) return;
    b.disabled = !consentReady() || _submitting;
  }

  function doSubmit(){
    if (!consentReady() || _submitting) return;
    var sb = getSb(); if (!sb){ toastErr('Not connected.'); return; }
    _submitting = true;
    var btn = document.getElementById('mybio-submit');
    if (btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sharing…'; }
    var photo = hasPhoto();
    var ack = ['store','use_adapt','not_self_publish','publish_is_gbe','withdrawable'];
    if (_consent.accuracy) ack.push('accuracy');
    if (_consent.age) ack.push('age_18_plus');
    if (photo && _consent.photo) ack.push('photo_rights');
    if ((_data.credit_line||'').trim()) ack.push('credits_verified');
    var payload = {
      stage_name: _data.stage_name || '', role_line: _data.role_line || '', credit_line: _data.credit_line || '',
      short_bio: _data.short_bio || '', long_bio: _data.long_bio || '',
      images: { headshot_staging_key: _photos.headshot.key || null, promo_staging_key: _photos.promo.key || null }
    };
    // Additive document keys (§3b) — the reconciler extracts text → rawSubmission, then removes the staged object.
    if (hasDoc()){
      payload.document_staging_key = _doc.key;
      payload.document_meta = { filename: _doc.filename || '', ext: _doc.ext || '' };
    }
    var consent = {
      version: CONSENT_VERSION, agreedAt: new Date().toISOString(), legalName: _consent.legalName.trim(),
      ageAttestation18Plus: !!_consent.age, accuracyAttestation: !!_consent.accuracy,
      photoRightsWarranty: photo ? !!_consent.photo : false,
      elementsAcknowledged: ack
    };
    sb.from('bio_submissions').upsert({ payload: payload, consent: consent, status: 'submitted' }, { onConflict: 'user_id' }).then(function(res){
      _submitting = false;
      if (res && res.error){ toastErr('Could not share: ' + (res.error.message||'try again')); updateSubmitBtn(); if (btn) btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> I understand — share with my manager'; return; }
      clearDraft();
      toastOk('Shared with your manager.');
      _showPreview = false;
      load();
    }).catch(function(e){
      _submitting = false;
      toastErr('Could not share: ' + ((e&&e.message)||'try again'));
      updateSubmitBtn(); if (btn) btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> I understand — share with my manager';
    });
  }

  // ── Rendered bio card (AC-A2 preview "see what fans see") ──
  function bioCardHtml(){
    var headImg = _photos.headshot.url ? '<img class="mybio-preview-avatar" src="' + esc(_photos.headshot.url) + '" alt="" />'
      : (_photos.headshot.key ? '<div class="mybio-preview-avatar"><i class="fa-solid fa-user"></i></div>'
      : '<div class="mybio-preview-avatar">' + esc((_data.stage_name||'?').charAt(0).toUpperCase()) + '</div>');
    var promo = _photos.promo.url ? '<img class="mybio-preview-promo" src="' + esc(_photos.promo.url) + '" alt="" />'
      : (_photos.promo.key ? '<div style="margin-top:var(--space-sm);"><span class="mybio-chip mybio-chip-shared"><i class="fa-solid fa-image"></i> Promo photo shared</span></div>' : '');
    var credit = (_data.credit_line||'').trim() ? '<div style="font-size:12px;color:var(--color-gold);margin-top:4px;"><i class="fa-solid fa-star" style="font-size:10px;"></i> ' + esc(_data.credit_line) + '</div>' : '';
    var longb = (_data.long_bio||'').trim() ? '<div style="font-size:13px;color:var(--color-text-secondary);line-height:1.55;margin-top:var(--space-sm);">' + esc(_data.long_bio) + '</div>' : '';
    return '<div class="mybio-preview-card">' +
      '<div class="mybio-preview-head">' + headImg +
        '<div><div style="font-weight:var(--fw-bold);font-size:16px;">' + esc(_data.stage_name||'Your name') + '</div>' +
        '<div style="font-size:13px;color:var(--color-text-muted);">' + esc(_data.role_line||'') + '</div>' + credit + '</div>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--color-text);line-height:1.55;">' + esc(_data.short_bio||'') + '</div>' +
      longb + promo +
    '</div>';
  }

  // ── State: submitted (D-49: "shared", never "live") ──
  function renderSubmitted(el){
    el.innerHTML =
      '<div class="mybio-card">' +
        '<div style="display:flex;align-items:flex-start;gap:var(--space-sm);margin-bottom:var(--space-sm);">' +
          '<i class="fa-solid fa-circle-check" style="color:#3fb950;font-size:20px;margin-top:2px;"></i>' +
          '<div><div style="font-weight:var(--fw-semibold);">Thanks — shared with your manager</div>' +
          '<div style="font-size:13px;color:var(--color-text-muted);line-height:1.5;margin-top:2px;">They’ll review it and may use this in promotional materials. It isn’t live yet — publishing is their separate decision.</div></div>' +
        '</div>' +
        '<div style="margin-bottom:var(--space-md);"><span class="mybio-chip mybio-chip-shared"><i class="fa-solid fa-share-nodes" style="font-size:11px;"></i> Shared — only you &amp; your manager can see this</span></div>' +
        (hasDoc() ? '<div style="margin-bottom:var(--space-md);"><span class="mybio-chip mybio-chip-shared"><i class="fa-solid fa-file-lines" style="font-size:11px;"></i> Document shared: ' + esc(_doc.filename||'your file') + '</span></div>' : '') +
        (_showPreview ? bioCardHtml() : '') +
        '<div style="display:flex;flex-wrap:wrap;gap:var(--space-sm);margin-top:var(--space-md);">' +
          '<button class="mybio-btn-secondary" id="mybio-preview-toggle"><i class="fa-solid fa-eye"></i> ' + (_showPreview?'Hide preview':'Preview what you shared') + '</button>' +
          '<button class="mybio-btn-secondary" id="mybio-edit"><i class="fa-solid fa-pen"></i> Edit</button>' +
          '<button class="mybio-btn-danger" id="mybio-withdraw"><i class="fa-solid fa-rotate-left"></i> Take back my submission</button>' +
        '</div>' +
      '</div>';
    document.getElementById('mybio-preview-toggle').addEventListener('click', function(){ _showPreview=!_showPreview; render(); });
    document.getElementById('mybio-edit').addEventListener('click', function(){ _view='edit'; render(); });
    document.getElementById('mybio-withdraw').addEventListener('click', doWithdraw);
  }

  function doWithdraw(){
    var run = function(){
      var sb = getSb(); if (!sb || !_existing){ return; }
      var q = sb.from('bio_submissions').update({ status: 'withdrawn' });
      q = _existing.id ? q.eq('id', _existing.id) : q.eq('user_id', _uid);
      q.then(function(res){
        if (res && res.error){ toastErr('Could not withdraw: ' + (res.error.message||'try again')); return; }
        toastOk('Submission taken back — it’s a private draft now.');
        load();
      }).catch(function(e){ toastErr('Could not withdraw: ' + ((e&&e.message)||'try again')); });
    };
    if (typeof Modal !== 'undefined' && Modal.confirm){
      Modal.confirm('Take back your submission? It returns to a private draft only you and your manager can see. You can share it again anytime.', run);
    } else { run(); }
  }

  // ── State: withdrawn ──
  function renderWithdrawn(el){
    el.innerHTML =
      '<div class="mybio-card">' +
        '<div style="display:flex;align-items:flex-start;gap:var(--space-sm);margin-bottom:var(--space-md);">' +
          '<i class="fa-solid fa-rotate-left" style="color:#d29922;font-size:18px;margin-top:2px;"></i>' +
          '<div><div style="font-weight:var(--fw-semibold);">Submission taken back</div>' +
          '<div style="font-size:13px;color:var(--color-text-muted);line-height:1.5;margin-top:2px;">It’s a private draft again — only you and your manager can see it. Share it again whenever you’re ready.</div></div>' +
        '</div>' +
        '<button class="mybio-btn-primary" id="mybio-reshare"><i class="fa-solid fa-share-nodes"></i> Share again</button>' +
      '</div>';
    document.getElementById('mybio-reshare').addEventListener('click', function(){ _view='edit'; render(); });
  }

  // ── Init ──
  function boot(){ _view='loading'; render(); load(); }
  if (typeof Auth !== 'undefined' && typeof Auth.whenReady === 'function'){
    Auth.whenReady(function(){ boot(); });
  } else { boot(); }
})();
</script>
