<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="8" fill="#111111"/>
  <!-- GBE large centered -->
  <text x="100" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="900" letter-spacing="-2">
    <tspan fill="#ffffff">G</tspan><tspan fill="#c9a227">B</tspan><tspan fill="#ffffff">E</tspan>
  </text>
  <!-- Gold underline -->
  <rect x="24" y="142" width="56" height="4" rx="2" fill="#c9a227"/>
  <!-- Subtle company name -->
  <text x="100" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="3">GOLD BOTTOM</text>
</svg>
