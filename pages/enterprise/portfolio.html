<!-- pages/enterprise/portfolio.html — Enterprise Portfolio / Case Studies -->

<section class="page-section" id="page-biz-portfolio">
  <div class="container">
    <h1 class="page-title reveal">Our Work</h1>
    <p class="page-subtitle reveal">Selected projects and case studies showcasing our technical expertise.</p>

    <!-- Filter Tabs -->
    <div class="tabs portfolio-filters reveal">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="web">Web</button>
      <button class="tab" data-filter="app">Applications</button>
      <button class="tab" data-filter="consulting">Consulting</button>
    </div>

    <!-- Portfolio Grid -->
    <div class="grid grid-2 stagger-grid" id="biz-portfolio-grid">
      <!-- Rendered by script -->
    </div>

    <!-- CTA -->
    <div class="text-center" style="margin-top: var(--space-3xl);">
      <div class="glass-card cta-premium reveal">
        <h2>Want to Be Our Next Success Story?</h2>
        <p class="text-muted">
          Let's discuss your project and see how we can help you achieve your goals.
        </p>
        <div class="cta-actions">
          <a href="#biz-contact" class="btn btn-primary btn-lg shimmer-sweep">
            <i class="fa-solid fa-rocket"></i> Start a Project
          </a>
          <a href="#biz-services" class="btn btn-secondary btn-lg">
            Our Services <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  .portfolio-client-type {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--color-accent, #58a6ff);
    background: rgba(88, 166, 255, 0.1);
    border: 1px solid rgba(88, 166, 255, 0.2);
    border-radius: var(--radius-sm, 4px);
    padding: 2px 10px;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
</style>

<script>
(function() {
  var grid = document.getElementById('biz-portfolio-grid');
  if (!grid) return;

  var projects = [
    {
      title: 'GBE Corporate Portal',
      category: 'web',
      clientType: 'Internal Project',
      tags: ['HTML/CSS/JS', 'SPA', 'Firebase', 'Node.js'],
      description: 'A dual-layout single-page application serving as both a public-facing corporate website and an internal management dashboard. Features hash-based routing across 28+ routes, dual authentication (Firebase + PIN), role-based access control, and a two-tier dashboard with full CRUD operations for 16+ entity types.',
      outcomes: [
        { value: '28+', label: 'Routes' },
        { value: '16+', label: 'Entity Types' },
        { value: '99.9%', label: 'Uptime' }
      ],
      status: 'live',
      statusLabel: 'Live'
    },
    {
      title: 'Fleet Management Mobile App',
      category: 'app',
      clientType: 'Regional Logistics Company',
      tags: ['React Native', 'Node.js', 'PostgreSQL', 'MapBox', 'Push Notifications'],
      description: 'A cross-platform mobile application for a mid-size logistics firm to track fleet vehicles in real time, manage driver assignments, and automate maintenance scheduling. Integrated GPS telemetry with geofencing alerts and a driver-facing interface for route optimization and delivery confirmations.',
      outcomes: [
        { value: '40%', label: 'Fuel Savings' },
        { value: '120+', label: 'Vehicles Tracked' },
        { value: '2.5x', label: 'Dispatch Speed' }
      ],
      status: 'completed',
      statusLabel: 'Completed'
    },
    {
      title: 'Sales Pipeline Analytics Platform',
      category: 'app',
      clientType: 'B2B SaaS Startup',
      tags: ['JavaScript', 'Chart.js', 'Python', 'REST API', 'PostgreSQL'],
      description: 'A custom analytics dashboard consolidating sales data from multiple CRM sources into a unified pipeline view. Built ETL pipelines to normalize data from Salesforce, HubSpot, and spreadsheet imports, with real-time KPI tracking, cohort analysis, and automated weekly executive summary reports.',
      outcomes: [
        { value: '3', label: 'CRM Sources Unified' },
        { value: '60%', label: 'Reporting Time Saved' },
        { value: '$850K', label: 'Pipeline Visibility' }
      ],
      status: 'completed',
      statusLabel: 'Completed'
    },
    {
      title: 'GBE Home Server Infrastructure',
      category: 'consulting',
      clientType: 'Internal Project',
      tags: ['Node.js', 'Express', 'SQLite', 'PM2', 'REST API', 'Linux'],
      description: 'A self-hosted Express.js server running on portable SSD hardware, providing a RESTful API with 17+ endpoints, automated database backups with 30-day retention, session-based authentication, and a LAN-accessible management dashboard. Designed as a cost-effective alternative to cloud hosting with full data sovereignty.',
      outcomes: [
        { value: '$0/mo', label: 'Hosting Cost' },
        { value: '17+', label: 'API Endpoints' },
        { value: '30-Day', label: 'Backup Retention' }
      ],
      status: 'live',
      statusLabel: 'Live'
    },
    {
      title: 'IT Infrastructure Modernization',
      category: 'consulting',
      clientType: 'Growing Retail Business (15 Employees)',
      tags: ['Strategy', 'Cloud Migration', 'Security Audit', 'Google Workspace'],
      description: 'A comprehensive technology audit and digital transformation engagement for a retail business transitioning from paper-based operations. Assessed existing infrastructure, migrated email and file storage to Google Workspace, implemented POS system integration, established backup procedures, and created a 12-month technology roadmap.',
      outcomes: [
        { value: '75%', label: 'Manual Tasks Eliminated' },
        { value: '12-Mo', label: 'Tech Roadmap' },
        { value: '4 hrs/wk', label: 'Time Saved' }
      ],
      status: 'completed',
      statusLabel: 'Completed'
    },
    {
      title: 'Nonprofit Website Redesign',
      category: 'web',
      clientType: 'DC-Area Nonprofit Organization',
      tags: ['WordPress', 'PHP', 'SEO', 'WCAG Accessibility', 'Stripe'],
      description: 'A complete website redesign for a DC-area nonprofit, focusing on WCAG AA accessibility compliance, search engine optimization, and donor conversion. Rebuilt the donation flow with Stripe integration, added event registration, and implemented a content management workflow for non-technical staff.',
      outcomes: [
        { value: '200%', label: 'Traffic Increase' },
        { value: 'AA', label: 'WCAG Compliance' },
        { value: '3x', label: 'Donor Conversions' }
      ],
      status: 'completed',
      statusLabel: 'Completed'
    }
  ];

  function renderProjects(filter) {
    var filtered = filter === 'all' ? projects : projects.filter(function(p) { return p.category === filter; });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fa-solid fa-folder-open"></i></div><h3 class="empty-state-title">No projects in this category yet</h3></div>';
      return;
    }

    grid.innerHTML = filtered.map(function(p) {
      var tags = p.tags.map(function(t) {
        return '<span class="portfolio-card-tag">' + t + '</span>';
      }).join('');

      var outcomes = p.outcomes.map(function(o) {
        return '<div class="portfolio-outcome">' +
          '<span class="portfolio-outcome-value">' + o.value + '</span>' +
          '<span class="portfolio-outcome-label">' + o.label + '</span>' +
        '</div>';
      }).join('');

      return '<div class="portfolio-card-premium" data-category="' + p.category + '">' +
        '<div class="portfolio-screenshot"><i class="fa-solid fa-laptop-code"></i></div>' +
        '<div class="portfolio-card-body">' +
          '<h3>' + p.title + '</h3>' +
          (p.clientType ? '<span class="portfolio-client-type">' + p.clientType + '</span>' : '') +
          '<p>' + p.description + '</p>' +
          '<div class="portfolio-outcomes">' + outcomes + '</div>' +
          '<div class="portfolio-tech">' + tags + '</div>' +
          '<div class="portfolio-card-footer">' +
            '<span class="portfolio-status ' + p.status + '">' +
              '<span class="status-dot ' + p.status + '"></span> ' + p.statusLabel +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  renderProjects('all');

  document.querySelectorAll('.portfolio-filters .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.portfolio-filters .tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      renderProjects(tab.getAttribute('data-filter'));
    });
  });
})();
</script>
